<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">From a human spatial request to a safe UE-MCP component nudge</title>
  <desc id="desc">A flow from natural language through six normalized fields into level.nudge_component, followed by before and after verification and exact rollback data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#10243d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="80" y="82" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">Human request → normalized spatial contract → safe transform</text>
  <text x="80" y="124" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="22">UE-MCP resolves intent before changing an attached component</text>

  <g filter="url(#shadow)">
    <rect x="80" y="180" width="410" height="260" rx="22" fill="#14283f" stroke="#38bdf8" stroke-width="2"/>
    <text x="112" y="225" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">1 · HUMAN VISUAL CUE</text>
    <text x="112" y="270" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600">“Looking down on the character,</text>
    <text x="112" y="305" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600">turn the leather hood 15°</text>
    <text x="112" y="340" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600">clockwise. Keep its position</text>
    <text x="112" y="375" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600">and size.”</text>
    <text x="112" y="412" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="17">Viewpoint removes ambiguity.</text>
  </g>

  <line x1="510" y1="295" x2="585" y2="295" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="610" y="180" width="400" height="360" rx="22" fill="#14283f" stroke="#34d399" stroke-width="2"/>
    <text x="642" y="225" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">2 · NORMALIZE SIX FIELDS</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="22">
      <text x="642" y="274" fill="#94a3b8">Target</text><text x="790" y="274" fill="#f8fafc" font-weight="600">Player / HeadMesh</text>
      <text x="642" y="318" fill="#94a3b8">Frame</text><text x="790" y="318" fill="#f8fafc" font-weight="600">actor</text>
      <text x="642" y="362" fill="#94a3b8">Viewpoint</text><text x="790" y="362" fill="#f8fafc" font-weight="600">top-down</text>
      <text x="642" y="406" fill="#94a3b8">Operation</text><text x="790" y="406" fill="#f8fafc" font-weight="600">rotate about up</text>
      <text x="642" y="450" fill="#94a3b8">Amount</text><text x="790" y="450" fill="#f8fafc" font-weight="600">+15 degrees</text>
      <text x="642" y="494" fill="#94a3b8">Constraints</text><text x="790" y="494" fill="#f8fafc" font-weight="600">preserve location + scale</text>
    </g>
  </g>

  <line x1="1030" y1="295" x2="1095" y2="295" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1120" y="180" width="400" height="360" rx="22" fill="#0b1a2c" stroke="#fbbf24" stroke-width="2"/>
    <text x="1152" y="225" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">3 · CALL THE NATIVE ACTION</text>
    <g fill="#dbeafe" font-family="Cascadia Mono, Consolas, monospace" font-size="18">
      <text x="1152" y="278">level(action="nudge_component",</text>
      <text x="1180" y="316">actorLabel="Player",</text>
      <text x="1180" y="354">componentName="HeadMesh",</text>
      <text x="1180" y="392">frame="actor",</text>
      <text x="1180" y="430">axisRotation={</text>
      <text x="1210" y="468">axis:"up", degrees:15</text>
      <text x="1180" y="506">})</text>
    </g>
  </g>

  <line x1="1320" y1="560" x2="1320" y2="620" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="300" y="645" width="1000" height="165" rx="22" fill="#14283f" stroke="#38bdf8" stroke-width="2"/>
    <text x="338" y="690" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">4 · VERIFY AND KEEP A WAY BACK</text>
    <g font-family="Segoe UI, Arial, sans-serif">
      <text x="338" y="738" fill="#f8fafc" font-size="23" font-weight="600">Before + after</text>
      <text x="338" y="772" fill="#94a3b8" font-size="18">relative and world transforms</text>
      <text x="650" y="738" fill="#f8fafc" font-size="23" font-weight="600">Resolved delta</text>
      <text x="650" y="772" fill="#94a3b8" font-size="18">actual world axis and movement</text>
      <text x="962" y="738" fill="#f8fafc" font-size="23" font-weight="600">Exact rollback</text>
      <text x="962" y="772" fill="#94a3b8" font-size="18">restore the previous relative transform</text>
    </g>
  </g>
  <text x="800" y="862" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="18">Small explicit deltas · unspecified transform fields stay unchanged · editor and PIE worlds supported</text>
</svg>
