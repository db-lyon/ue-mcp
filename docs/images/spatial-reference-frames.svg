<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Choosing the coordinate frame for a spatial adjustment</title>
  <desc id="desc">Four panels compare world, actor, parent, and component coordinate frames for an attached component.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#10243d"/></linearGradient>
    <marker id="redArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#fb7185"/></marker>
    <marker id="greenArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#34d399"/></marker>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#38bdf8"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.25"/></filter>
  </defs>
  <rect width="1600" height="980" rx="28" fill="url(#bg)"/>
  <text x="80" y="82" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">Same words, different frame</text>
  <text x="80" y="124" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="22">“Move forward” means the +X direction of the selected coordinate frame</text>

  <g transform="translate(80 175)" filter="url(#shadow)">
    <rect width="700" height="320" rx="22" fill="#14283f" stroke="#334155" stroke-width="2"/>
    <text x="30" y="46" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">WORLD</text>
    <text x="30" y="78" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="18">Fixed to the level; never follows the character.</text>
    <g transform="translate(190 205)">
      <circle r="10" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="140" y2="0" stroke="#fb7185" stroke-width="6" marker-end="url(#redArrow)"/>
      <line x1="0" y1="0" x2="0" y2="-115" stroke="#34d399" stroke-width="6" marker-end="url(#greenArrow)"/>
      <line x1="0" y1="0" x2="-70" y2="70" stroke="#38bdf8" stroke-width="6" marker-end="url(#blueArrow)"/>
      <text x="150" y="7" fill="#fb7185" font-family="Segoe UI, Arial" font-size="18">forward +X</text>
      <text x="12" y="-118" fill="#34d399" font-family="Segoe UI, Arial" font-size="18">right +Y</text>
      <text x="-130" y="94" fill="#38bdf8" font-family="Segoe UI, Arial" font-size="18">up +Z</text>
    </g>
    <g transform="translate(500 190) rotate(-35)">
      <rect x="-42" y="-70" width="84" height="140" rx="35" fill="#475569"/>
      <path d="M0,-94 L-18,-62 L18,-62 Z" fill="#fbbf24"/>
      <circle cy="-52" r="17" fill="#cbd5e1"/>
    </g>
    <text x="440" y="286" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="17">Useful for level-aligned moves</text>
  </g>

  <g transform="translate(820 175)" filter="url(#shadow)">
    <rect width="700" height="320" rx="22" fill="#14283f" stroke="#334155" stroke-width="2"/>
    <text x="30" y="46" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">ACTOR</text>
    <text x="30" y="78" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="18">Follows the character; best for character left/right/forward.</text>
    <g transform="translate(280 195) rotate(-35)">
      <rect x="-42" y="-70" width="84" height="140" rx="35" fill="#475569"/>
      <path d="M0,-94 L-18,-62 L18,-62 Z" fill="#fbbf24"/>
      <circle cy="-52" r="17" fill="#cbd5e1"/>
      <circle r="8" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="125" y2="0" stroke="#fb7185" stroke-width="6" marker-end="url(#redArrow)"/>
      <line x1="0" y1="0" x2="0" y2="-105" stroke="#34d399" stroke-width="6" marker-end="url(#greenArrow)"/>
      <text x="130" y="7" fill="#fb7185" font-family="Segoe UI, Arial" font-size="18">forward</text>
      <text x="12" y="-108" fill="#34d399" font-family="Segoe UI, Arial" font-size="18">right</text>
    </g>
    <text x="450" y="262" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="17">“Character right”</text>
    <text x="450" y="287" fill="#f8fafc" font-family="Cascadia Mono, Consolas" font-size="16">frame="actor"</text>
  </g>

  <g transform="translate(80 535)" filter="url(#shadow)">
    <rect width="700" height="320" rx="22" fill="#14283f" stroke="#334155" stroke-width="2"/>
    <text x="30" y="46" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">PARENT</text>
    <text x="30" y="78" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="18">Follows the attachment parent component.</text>
    <g transform="translate(235 205) rotate(25)">
      <rect x="-105" y="-38" width="210" height="76" rx="18" fill="#475569" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="86" cy="0" r="11" fill="#fbbf24"/>
      <line x1="86" y1="0" x2="205" y2="0" stroke="#fb7185" stroke-width="6" marker-end="url(#redArrow)"/>
      <line x1="86" y1="0" x2="86" y2="-98" stroke="#34d399" stroke-width="6" marker-end="url(#greenArrow)"/>
    </g>
    <path d="M475,134 C520,116 565,142 590,185 C612,225 586,267 540,272 C494,277 458,240 463,198 Z" fill="#7c3aed" stroke="#c4b5fd" stroke-width="2"/>
    <text x="444" y="302" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="17">Parent-aligned adjustment</text>
  </g>

  <g transform="translate(820 535)" filter="url(#shadow)">
    <rect width="700" height="320" rx="22" fill="#14283f" stroke="#334155" stroke-width="2"/>
    <text x="30" y="46" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700">COMPONENT</text>
    <text x="30" y="78" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="18">Follows the child mesh's current orientation.</text>
    <g transform="translate(290 205) rotate(-55)">
      <path d="M-110,-42 L85,-42 Q120,-42 120,0 Q120,42 85,42 L-110,42 Z" fill="#7c3aed" stroke="#c4b5fd" stroke-width="2"/>
      <circle r="9" fill="#f8fafc"/>
      <line x1="0" y1="0" x2="140" y2="0" stroke="#fb7185" stroke-width="6" marker-end="url(#redArrow)"/>
      <line x1="0" y1="0" x2="0" y2="-105" stroke="#34d399" stroke-width="6" marker-end="url(#greenArrow)"/>
    </g>
    <text x="465" y="255" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="17">Useful for “along the mesh”</text>
    <text x="465" y="284" fill="#f8fafc" font-family="Cascadia Mono, Consolas" font-size="16">frame="component"</text>
  </g>

  <text x="800" y="925" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Choose the frame first. Then forward / right / up and axis rotation become unambiguous.</text>
  <text x="800" y="953" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="17">Red = +forward · Green = +right · Blue = +up</text>
</svg>
