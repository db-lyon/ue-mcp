<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Clockwise and counterclockwise require a stated viewpoint</title>
  <desc id="desc">A top-down character diagram shows a 15 to 20 degree clockwise rotation around actor up while preserving location and scale.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#10243d"/></linearGradient>
    <radialGradient id="floor"><stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#0b1728"/></radialGradient>
    <marker id="yellowArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#fbbf24"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#38bdf8"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="80" y="82" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">Clockwise is incomplete until the viewpoint is named</text>
  <text x="80" y="124" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="22">Example: “Looking down on the character, rotate the hood 15–20° clockwise.”</text>

  <g transform="translate(90 175)" filter="url(#shadow)">
    <rect width="850" height="620" rx="28" fill="url(#floor)" stroke="#334155" stroke-width="2"/>
    <text x="425" y="58" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI, Arial" font-size="22" font-weight="700">TOP-DOWN CAMERA VIEW</text>
    <circle cx="425" cy="340" r="224" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 10"/>
    <text x="425" y="102" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="18">12</text>
    <text x="670" y="347" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="18">3</text>
    <text x="425" y="592" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="18">6</text>
    <text x="180" y="347" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="18">9</text>

    <g transform="translate(425 350)">
      <ellipse rx="94" ry="148" fill="#475569" stroke="#cbd5e1" stroke-width="3"/>
      <circle cy="-110" r="58" fill="#cbd5e1" stroke="#f8fafc" stroke-width="3"/>
      <path d="M0,-190 L-28,-138 L28,-138 Z" fill="#38bdf8"/>
      <text x="0" y="32" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial" font-size="18" font-weight="600">CHARACTER</text>
      <line x1="0" y1="-190" x2="0" y2="-245" stroke="#38bdf8" stroke-width="5" marker-end="url(#blueArrow)"/>
      <text x="15" y="-235" fill="#38bdf8" font-family="Segoe UI, Arial" font-size="17">actor forward</text>
      <path d="M-78,-126 C-68,-190 68,-190 78,-126 L58,-88 C36,-118 -36,-118 -58,-88 Z" fill="#a16207" stroke="#fde68a" stroke-width="4" opacity="0.55"/>
      <g transform="rotate(18)">
        <path d="M-78,-126 C-68,-190 68,-190 78,-126 L58,-88 C36,-118 -36,-118 -58,-88 Z" fill="#d97706" stroke="#fbbf24" stroke-width="4"/>
        <path d="M-48,-118 C-28,-147 28,-147 48,-118" fill="none" stroke="#1f2937" stroke-width="14" stroke-linecap="round"/>
      </g>
      <path d="M38,-254 A150,150 0 0 1 94,-222" fill="none" stroke="#fbbf24" stroke-width="8" marker-end="url(#yellowArrow)"/>
      <text x="105" y="-253" fill="#fbbf24" font-family="Segoe UI, Arial" font-size="22" font-weight="700">15–20° clockwise</text>
      <circle r="8" fill="#34d399"/>
      <text x="14" y="-6" fill="#34d399" font-family="Segoe UI, Arial" font-size="16">location preserved</text>
    </g>
  </g>

  <g transform="translate(990 175)" filter="url(#shadow)">
    <rect width="520" height="620" rx="28" fill="#14283f" stroke="#334155" stroke-width="2"/>
    <text x="34" y="56" fill="#fbbf24" font-family="Segoe UI, Arial" font-size="24" font-weight="700">NORMALIZED INTERPRETATION</text>
    <g font-family="Segoe UI, Arial" font-size="21">
      <text x="34" y="112" fill="#94a3b8">Viewpoint</text><text x="210" y="112" fill="#f8fafc" font-weight="600">looking down</text>
      <text x="34" y="156" fill="#94a3b8">Frame</text><text x="210" y="156" fill="#f8fafc" font-weight="600">actor</text>
      <text x="34" y="200" fill="#94a3b8">Axis</text><text x="210" y="200" fill="#f8fafc" font-weight="600">up</text>
      <text x="34" y="244" fill="#94a3b8">Rotation</text><text x="210" y="244" fill="#f8fafc" font-weight="600">+15° first probe</text>
      <text x="34" y="288" fill="#94a3b8">Preserve</text><text x="210" y="288" fill="#f8fafc" font-weight="600">location + scale</text>
    </g>
    <rect x="34" y="330" width="452" height="136" rx="16" fill="#0b1a2c" stroke="#475569"/>
    <text x="58" y="368" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="18">Tool arguments</text>
    <text x="58" y="398" fill="#dbeafe" font-family="Cascadia Mono, Consolas" font-size="17">frame: "actor"</text>
    <text x="58" y="424" fill="#dbeafe" font-family="Cascadia Mono, Consolas" font-size="17">viewRotation: { viewFrom: "above",</text>
    <text x="78" y="450" fill="#dbeafe" font-family="Cascadia Mono, Consolas" font-size="17">direction: "clockwise", degrees: 15 }</text>
    <text x="34" y="518" fill="#fb7185" font-family="Segoe UI, Arial" font-size="20" font-weight="700">Without “looking down”:</text>
    <text x="34" y="552" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="18">clockwise could reverse from underneath,</text>
    <text x="34" y="580" fill="#cbd5e1" font-family="Segoe UI, Arial" font-size="18">or mean a different camera-facing plane.</text>
  </g>

  <text x="800" y="855" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial" font-size="18">Echo the interpretation before applying · use a small first delta · recapture the same view for comparison</text>
</svg>
