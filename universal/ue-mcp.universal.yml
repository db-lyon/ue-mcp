  landscape.get_info:
    class_path: ue-mcp.builtin/landscape.get_info
    group: landscape
    description: 'Get landscape setup. Params: none'
  landscape.list_layers:
    class_path: ue-mcp.builtin/landscape.list_layers
    group: landscape
    description: 'List paint layers. Params: none'
  landscape.sample:
    class_path: ue-mcp.builtin/landscape.sample
    group: landscape
    description: >-
      Read the surface height AND every paint-layer weight at one world XY.
      Height and weights come from the landscape's own height and weight data
      (the merged result of every edit layer), the same data
      landscape(paint_layer) writes, so they are exact and do not depend on
      built collision. Layers come back with weight (0..1), weight255 (the
      weightmap byte the editor shows), the LayerInfo path and its physical
      material, plus dominantLayer and totalWeight - which is what makes reading
      a paint weight one call instead of rendering the weightmap to a render
      target and reading that back. Also returns quad, quadExtent and inBounds,
      so a zero weight OFF the landscape reads as out of bounds rather than as a
      measured zero, and traceHeight/normal from a confirmation collision trace
      (absent when collision is unbuilt or the proxy is streamed out). Position
      accepts x + y, point {x, y}, or worldX + worldY (#939). Params: x?, y?,
      point?, worldX?, worldY?, actorLabel?, actorPath?, layerName?,
      includeLayers?
  landscape.sculpt:
    class_path: ue-mcp.builtin/landscape.sculpt
    group: landscape
    description: >-
      Raise, lower or flatten terrain with a circular brush.
      mode=raise|lower|flatten; amount is world centimetres at full strength
      (raise/lower), and flatten pulls toward the height under the brush centre.
      falloff (0..1) is the smoothstepped soft edge. Runs in one transaction and
      leaves the level dirty and unsaved. Writes into an edit layer (editLayer
      by name, else editLayerIndex, default 0) - required on UE 5.8, where a
      write without one is regenerated away by the layer system. Idempotent: a
      brush that rounds to the height already there reports unchanged=true and
      updated=false rather than claiming it moved ground. The rollback record
      carries the exact previous heights over the brush rectangle and replays
      through set_height_region; above rollbackMaxVertices the response says
      rollbackOmitted with the reason instead of a record that would restore
      part of the footprint (#742). Params: center, radius?, mode?, amount?,
      falloff?, actorLabel?, actorPath?, editLayer?, editLayerIndex?,
      maxVertices?, rollbackMaxVertices?
  landscape.paint_layer:
    class_path: ue-mcp.builtin/landscape.paint_layer
    group: landscape
    description: >-
      Paint a weight layer with a circular brush. The layer must already have a
      LayerInfo on this landscape (see add_layer_info) - an unregistered name
      errors and lists the layers that ARE registered instead of silently
      painting nothing. Weights are written as given - the engine no longer
      renormalises other layers for you, so set them explicitly if they must sum
      to 1. Writes into an edit layer (editLayer by name, else editLayerIndex,
      default 0). Idempotent: a brush that changes no weight reports
      unchanged=true. The rollback record carries the exact previous weights
      over the brush rectangle and replays through set_layer_weight_region, with
      the same rollbackOmitted cap as the region writes (#742). Params:
      layerName, center, radius?, strength?, falloff?, actorLabel?, actorPath?,
      editLayer?, editLayerIndex?, maxVertices?, rollbackMaxVertices?
  landscape.list_edit_layers:
    class_path: ue-mcp.builtin/landscape.list_edit_layers
    group: landscape
    description: >-
      List the landscape's edit layers by name, in stack order, with guid,
      visible, locked, heightmapAlpha and weightmapAlpha. These names are what
      sculpt, paint_layer and the region writes take as editLayer (#1156).
      Params: actorLabel?, actorPath?
  landscape.merge_edit_layers:
    class_path: ue-mcp.builtin/landscape.merge_edit_layers
    group: landscape
    description: >-
      Re-merge every edit layer into the landscape's final height and weight
      maps (ALandscape::ForceLayersFullUpdate), then run the update immediately
      unless updateNow=false. Use after edits that leave the merged result
      stale. Changes no authored value, so there is no rollback (#1156). Params:
      actorLabel?, actorPath?, updateNow?
  landscape.list_splines:
    class_path: ue-mcp.builtin/landscape.list_splines
    group: landscape
    description: 'Read landscape splines. Params: none'
  landscape.get_component:
    class_path: ue-mcp.builtin/landscape.get_component
    group: landscape
    description: 'Inspect component. Params: componentIndex?'
  landscape.set_material:
    class_path: ue-mcp.builtin/landscape.set_material
    group: landscape
    description: >-
      Set landscape material. Params: materialPath (or path, or assetPath),
      landscapeName?
  landscape.add_layer_info:
    class_path: ue-mcp.builtin/landscape.add_layer_info
    group: landscape
    description: >-
      Register paint layer (creates LayerInfo asset + binds to active
      landscape). Idempotent: a layer already registered reports existed and
      emits no record, so a replay cannot delete a layer it did not create.
      Rolls back through remove_layer on the parent Landscape actor, which
      un-registers the layer; marked lossy when the LayerInfo ASSET was created
      here, because remove_layer deliberately leaves it on disk. Params:
      layerName, landscapeName?, packagePath?
  landscape.create_layer_info:
    class_path: ue-mcp.builtin/landscape.create_layer_info
    group: landscape
    description: >-
      Standalone LayerInfo asset creation - no landscape required (#251).
      Params: layerName, name?, packagePath?, onConflict?, physMaterial?,
      hardness?
  landscape.create:
    class_path: ue-mcp.builtin/landscape.create
    group: landscape
    description: >-
      Spawn a new ALandscape with a flat heightmap. Defaults match the Editor's
      Landscape Mode 'create new' (8x8 components, 63 quads/subsection, 2
      subsections/component = 1016x1016 quads) (#303). Params: location?,
      scale?, componentCountX?, componentCountY?, subsectionSizeQuads?,
      numSubsections?, heightOffset?, label?
  landscape.get_material_usage_summary:
    class_path: ue-mcp.builtin/landscape.get_material_usage_summary
    group: landscape
    description: >-
      Per-proxy summary: landscape/hole material paths + component/grass/nanite
      counts (#150). Params: none
  landscape.list_proxies:
    class_path: ue-mcp.builtin/landscape.list_proxies
    group: landscape
    description: >-
      Enumerate loaded World Partition LandscapeStreamingProxy actors with
      per-proxy objectPath and worldBounds (origin/extent), sorted by object
      path, plus loadedProxies + parentLandscapes counts. Unloaded proxies are
      not spawned as actors, so only loaded ones appear - use this to confirm a
      proxy is streamed in before trusting a layer/height readback (#733).
      Params: cursor?, limit?
  landscape.find_proxy_at:
    class_path: ue-mcp.builtin/landscape.find_proxy_at
    group: landscape
    description: >-
      Resolve which loaded LandscapeStreamingProxy covers a world X/Y. Returns
      found/loaded + label, or loaded:false when the covering proxy is streamed
      out (so a 0-weight readback there is ambiguous, not real) (#733). Params:
      worldX, worldY
  landscape.get_height_region:
    class_path: ue-mcp.builtin/landscape.get_height_region
    group: landscape
    description: >-
      Read the raw uint16 heights over a rectangle of landscape vertices, with
      min/max/mean reported in raw units AND in world Z so the numbers mean
      something without a second call. Heights come back as a plain array below
      arrayEncodingLimit and as a little-endian base64 blob above it, and that
      blob feeds straight back into set_height_region, so a read-modify-write
      round trip needs no reformatting. Reports hasUnloadedComponentsInRegion,
      because on a World Partition map an unloaded component reads as absent
      rather than as flat ground. Reads the merged surface unless editLayer or
      editLayerIndex names one, in which case it reads that layer's own
      contribution. Params: actorLabel?, actorPath?, region?, space?, center?,
      radius?, maxVertices?, editLayer?, editLayerIndex?, includeHeights?,
      encoding?, arrayEncodingLimit?
  landscape.set_height_region:
    class_path: ue-mcp.builtin/landscape.set_height_region
    group: landscape
    description: >-
      Write heights over a rectangle of landscape vertices. Accepts
      heightsBase64 (the blob get_height_region hands back), heights as one
      number per vertex row-major from (minX,minY), or height / rawHeight to
      fill the whole rectangle with one value; heightSpace picks whether the
      numbers are raw uint16 (32768 = the actor's own Z) or world centimetres.
      Idempotent: a write that changes nothing reports unchanged true and
      updated false rather than claiming an edit. The rollback record carries
      the exact previous heights, and when the rectangle is above
      rollbackMaxVertices the response says rollbackOmitted with the reason
      instead of emitting a record that would restore only part of it. Requires
      an edit layer, since a write with none is regenerated away by the layer
      system. Params: actorLabel?, actorPath?, region?, space?, center?,
      radius?, maxVertices?, heightsBase64?, heights?, height?, rawHeight?,
      heightSpace?, editLayer?, editLayerIndex?, rollbackMaxVertices?
  landscape.get_height_at_point:
    class_path: ue-mcp.builtin/landscape.get_height_at_point
    group: landscape
    description: >-
      Surface height under one world XY, as both the raw uint16 and the world Z,
      plus the landscape vertex it was read at. Reads the nearest vertex rather
      than interpolating, so it can differ from a physics trace by up to half a
      quad of slope, and it says so. Position accepts x + y, point {x, y}, or
      worldX + worldY. Params: x?, y?, point?, worldX?, worldY?, actorLabel?,
      actorPath?, editLayer?, editLayerIndex?
  landscape.get_normal_at_point:
    class_path: ue-mcp.builtin/landscape.get_normal_at_point
    group: landscape
    description: >-
      World-space surface normal under one world XY, computed by central
      difference over the neighbouring vertices in world centimetres and rotated
      into world space, so a non-uniform landscape scale is accounted for.
      Returns the normal, the slope in degrees and the vertex it was read at.
      Params: x?, y?, point?, worldX?, worldY?, actorLabel?, actorPath?
  landscape.get_slope_at_point:
    class_path: ue-mcp.builtin/landscape.get_slope_at_point
    group: landscape
    description: >-
      Slope under one world XY in degrees from horizontal, in radians, and as a
      grade percentage, plus the downhill direction as a unit vector. The
      downhill direction is what routes a road or a river; a slope number alone
      never is. Params: x?, y?, point?, worldX?, worldY?, actorLabel?,
      actorPath?
  landscape.get_slope_map:
    class_path: ue-mcp.builtin/landscape.get_slope_map
    group: landscape
    description: >-
      Per-vertex slope in degrees over a rectangle, plus min/max/mean and a
      fixed nine-bucket ten-degree histogram. The buckets are fixed on purpose:
      they are what a caller reasons about (anything under 15 degrees is
      buildable) and a configurable bin count would make two runs incomparable.
      The per-vertex array is returned below arrayEncodingLimit and omitted with
      a reason above it. Params: actorLabel?, actorPath?, region?, space?,
      center?, radius?, maxVertices?, includeSlopes?, arrayEncodingLimit?
  landscape.sculpt_region:
    class_path: ue-mcp.builtin/landscape.sculpt_region
    group: landscape
    description: >-
      Apply one shaping operator over a rectangle: raise, lower, flatten,
      smooth, mountain, valley, ridge, plateau, crater or terrace. One action
      rather than ten, because the region resolution, falloff, strength blend,
      previous-height capture and rollback record are identical for every shape
      and only the per-vertex kernel differs. amount is world centimetres at
      full strength, shape picks a radial (ellipse) or edge-relative (rect)
      falloff, and sharpness controls how peaked the dome operators are. flatten
      and plateau take targetHeight in world Z, or flattenTo as mean / center /
      min / max; smooth takes iterations; terrace takes steps; ridge takes
      ridgeAngle in degrees; crater takes rimPosition and rimRatio. Reports
      verticesClampedToHeightRange when the shape ran past the uint16 range,
      since that is a flat-topped mountain rather than a failure. Params:
      operator, actorLabel?, actorPath?, region?, space?, center?, radius?,
      maxVertices?, amount?, strength?, falloff?, sharpness?, shape?,
      targetHeight?, flattenTo?, iterations?, steps?, ridgeAngle?, rimPosition?,
      rimRatio?, editLayer?, editLayerIndex?, rollbackMaxVertices?
  landscape.apply_erosion:
    class_path: ue-mcp.builtin/landscape.apply_erosion
    group: landscape
    description: >-
      Run hydraulic or thermal erosion over a rectangle. Hydraulic rains on
      every vertex, routes water to lower four-neighbours, carries sediment to
      capacity and deposits the rest, then re-deposits whatever is still
      suspended so the pass does not quietly remove material every run; thermal
      slumps anything steeper than talusAngle toward it. This is a CPU grid
      model over the region on the game thread, not the Landscape Mode erosion
      tool, and the response says so. Cost is vertices times iterations and is
      refused above maxWork rather than blocking the editor for an unbounded
      time. Params: actorLabel?, actorPath?, erosionType?, region?, space?,
      center?, radius?, maxVertices?, iterations?, maxWork?, talusAngle?,
      strength?, rainAmount?, evaporation?, sedimentCapacity?, erosionRate?,
      depositionRate?, editLayer?, editLayerIndex?, rollbackMaxVertices?
  landscape.import_heightmap:
    class_path: ue-mcp.builtin/landscape.import_heightmap
    group: landscape
    description: >-
      Write a 16-bit heightmap file into a region of the landscape. format is
      png16 (16-bit greyscale PNG) or raw16 (headerless little-endian uint16),
      inferred from the extension when omitted; an 8-bit image is refused with
      its real format rather than stretched, because a 256-step heightmap
      terraces visibly. A raw16 file carries no dimensions, so width and height
      are required for it. When the image and the region disagree the call
      refuses and prints the region that WOULD fit, unless resample is true,
      which bilinearly fits it and says detail was averaged away. minHeight and
      maxHeight remap the image's 0 and 65535 onto a world Z band, which is the
      control a heightmap authored elsewhere actually needs. A relative filePath
      resolves under the project's Saved directory. Params: filePath (or
      sourcePath), actorLabel?, actorPath?, format?, region?, space?, center?,
      radius?, maxVertices?, width?, height?, resample?, minHeight?, maxHeight?,
      editLayer?, editLayerIndex?, rollbackMaxVertices?
  landscape.export_heightmap:
    class_path: ue-mcp.builtin/landscape.export_heightmap
    group: landscape
    description: >-
      Write a region's heights out as a 16-bit greyscale PNG or a headerless
      little-endian uint16 file, for inspection or for a round trip through an
      external terrain tool. Reports the exact byte count, the region and the
      height range in raw units and world Z, so the file can be re-imported at
      the right scale. Exports the merged surface unless editLayer or
      editLayerIndex names one. No inverse is emitted: the bridge has no
      delete-file method, and overwriting a file whose previous contents were
      never read is not undoable, so the response says rollbackOmitted with
      which of the two cases applied. Params: filePath (or outputPath),
      actorLabel?, actorPath?, format?, region?, space?, center?, radius?,
      maxVertices?, editLayer?, editLayerIndex?, overwrite?
  landscape.analyze_terrain:
    class_path: ue-mcp.builtin/landscape.analyze_terrain
    group: landscape
    description: >-
      Height and slope distribution over a region, plus largestFlatArea: the
      biggest axis-aligned rectangle whose every vertex is within
      slopeThresholdDegrees, in quad indices AND world coordinates with its mean
      Z. That last part is the answer to where a building fits, which a
      flat-vertex COUNT never is - ten thousand scattered flat vertices and one
      flat plateau report the same number. The height histogram takes
      histogramBins; the slope histogram is fixed at nine ten-degree bands so
      two runs stay comparable. Params: actorLabel?, actorPath?, region?,
      space?, center?, radius?, maxVertices?, histogramBins?,
      slopeThresholdDegrees?
  landscape.get_layer_weight_region:
    class_path: ue-mcp.builtin/landscape.get_layer_weight_region
    group: landscape
    description: >-
      Read one paint layer's 0..255 weights over a rectangle, with min/max/mean
      and the painted vertex count and fraction. An unregistered layerName is
      refused with the layers that ARE registered, so a typo and a landscape
      whose material never declared the layer read differently. Weights come
      back as an array below arrayEncodingLimit and as base64 above it, in the
      exact form set_layer_weight_region takes back. Params: layerName,
      actorLabel?, actorPath?, region?, space?, center?, radius?, maxVertices?,
      editLayer?, editLayerIndex?, includeWeights?, encoding?,
      arrayEncodingLimit?
  landscape.set_layer_weight_region:
    class_path: ue-mcp.builtin/landscape.set_layer_weight_region
    group: landscape
    description: >-
      Write one paint layer's weights over a rectangle. Accepts weightsBase64
      (one uint8 per vertex, the form the getter returns), weights as one number
      per vertex, or weight / strength as a single 0..1 fraction to fill the
      rectangle. Idempotent, with the same unchanged/updated reporting as
      set_height_region, and the rollback record carries the exact previous
      weights up to rollbackMaxVertices. Weights are written as given: the
      engine no longer renormalises the other layers for you, so set them
      explicitly if they must sum to 1. Params: layerName, actorLabel?,
      actorPath?, region?, space?, center?, radius?, maxVertices?,
      weightsBase64?, weights?, weight?, strength?, editLayer?, editLayerIndex?,
      rollbackMaxVertices?
  landscape.layer_exists:
    class_path: ue-mcp.builtin/landscape.layer_exists
    group: landscape
    description: >-
      Is this paint layer registered on the landscape, and does it have a
      LayerInfo asset to store weights in? Returns exists, hasLayerInfo, its
      layerInfoPath, and the full layer list. The two flags are separate because
      a material can declare a layer that has no LayerInfo assigned, which looks
      present and fails every paint. Params: layerName, actorLabel?, actorPath?
  landscape.add_layer:
    class_path: ue-mcp.builtin/landscape.add_layer
    group: landscape
    description: >-
      Register a paint layer on the landscape, creating the
      ULandscapeLayerInfoObject asset that its weight data needs and binding it.
      The counterpart to remove_layer, and the same handler add_layer_info
      calls. Idempotent: a layer already registered is reported with its
      existing asset path rather than duplicated. Params: layerName,
      landscapeName?, packagePath?
  landscape.remove_layer:
    class_path: ue-mcp.builtin/landscape.remove_layer
    group: landscape
    description: >-
      Unregister a paint layer and drop its weight data across every component
      of the landscape. Idempotent: removing a layer that is not there reports
      alreadyAbsent with the layers that are, rather than failing. NOT undoable
      through the bridge - the weights are destroyed without being read back
      first, and the response says so with the reason, so export them with
      get_layer_weight_region first if they matter. The
      ULandscapeLayerInfoObject asset itself is left on disk, so add_layer
      brings the layer back empty. Params: layerName, actorLabel?, actorPath?
  landscape.get_holes:
    class_path: ue-mcp.builtin/landscape.get_holes
    group: landscape
    description: >-
      Read the landscape visibility mask over a rectangle or at a single world
      XY, as booleans plus the hole vertex count and fraction. A vertex counts
      as a hole once its visibility weight passes the engine's own two-thirds
      threshold, so this action and the renderer agree about what a hole is. A
      hole only renders, and only stops collision, if the landscape material
      routes a Landscape Visibility Mask node into opacity mask. Params:
      actorLabel?, actorPath?, region?, space?, center?, radius?, x?, y?,
      point?, worldX?, worldY?, maxVertices?, includeMask?, arrayEncodingLimit?
  landscape.set_holes:
    class_path: ue-mcp.builtin/landscape.set_holes
    group: landscape
    description: >-
      Punch or fill the landscape visibility mask over a rectangle or at a
      single world XY. Accepts hole as a single boolean for the whole target,
      holes as one boolean per vertex, or weightsBase64 to restore exact
      previous visibility weights (which is the form its own rollback record
      carries). Unlike every other region action this one does NOT default to
      the whole landscape when no target is given: that would punch the entire
      terrain into a hole on a call that forgot a parameter, so it refuses
      instead. Params: actorLabel?, actorPath?, region?, space?, center?,
      radius?, x?, y?, point?, worldX?, worldY?, maxVertices?, hole?, holes?,
      weightsBase64?, editLayer?, editLayerIndex?, rollbackMaxVertices?
  landscape.plan_real_world:
    class_path: ue-mcp.builtin/landscape.plan_real_world
    group: landscape
    description: >-
      Turn a real-world extent plus a heightmap file into the exact
      landscape(create) and landscape(import_heightmap) parameters that
      reproduce it in engine at true scale. Creates nothing: it is arithmetic
      against engine invariants a caller cannot restate correctly by hand,
      namely that a landscape's vertex count is componentCount x
      subsectionSizeQuads x numSubsections + 1 with subsectionSizeQuads
      restricted to 7/15/31/63/127/255, and that its uint16 heights only mean
      metres through the actor's Z scale. Size the tile with realWorldSizeMeters
      {x,y}, or with boundsLatLon {minLat,minLon,maxLat,maxLon} which is
      projected on a local tangent plane at the box centre latitude (an
      approximation, not a datum reprojection, and the response says so).
      minElevationMeters and maxElevationMeters state what the image's value
      range means; elevationEncoding full spans 0..65535 across that band, data
      measures the image's own range and needs sourcePath. Returns the chosen
      resolution, every legal alternative with its error, the resulting metres
      per quad, the vertical precision in centimetres, and warnings for
      resampling, anisotropy, quantisation and exaggeration. Fetching DEM tiles
      over the network is deliberately NOT part of this: provider APIs, keys and
      licences change independently of the engine, so that half belongs in a
      plugin. Params: minElevationMeters, maxElevationMeters,
      realWorldSizeMeters?, boundsLatLon?, sourcePath? (or filePath), format?,
      width?, height?, metersPerQuad?, elevationEncoding?,
      verticalExaggeration?, maxComponents?, location?
  landscape.project_geo_coordinates:
    class_path: ue-mcp.builtin/landscape.project_geo_coordinates
    group: landscape
    description: >-
      Convert between latitude/longitude and a landscape's world space, in both
      directions, against the same boundsLatLon the landscape was planned for.
      Each entry in points is either {lat, lon}, answered with the world X/Y and
      the sampled surface Z so the point lands ON the terrain, or {x, y},
      answered with the geographic coordinate that world position corresponds to
      - which is what turns analyze_terrain's largestFlatArea back into a real
      place. northAt says which end of the landscape's Y axis is north,
      defaulting to minY because a DEM raster's first row is its northern edge
      and that is how import_heightmap lays one down; getting it wrong mirrors
      every placement about the middle of the map and nothing about the result
      looks wrong. Params: boundsLatLon, points, actorLabel?, actorPath?,
      northAt?, sampleHeight?
  landscape.refresh_physical_material_collision:
    class_path: ue-mcp.builtin/landscape.refresh_physical_material_collision
    group: landscape
    description: >-
      UE 5.8+: safely refresh physical-material collision data in memory on
      loaded World Partition LandscapeStreamingProxy actors after a LayerInfo
      PhysMaterial change. Requires complete registered collision coverage and
      no pending landscape edit-layer work. Preserves and verifies every raw,
      complex-live, and simple-live height sample, builds material data before
      one collision recreation, and fails the whole matched batch on any unsafe
      result. Filters combine: actorLabels[], guids[], and bounds {min,max};
      omitting them targets every loaded proxy up to maxActors (default 256,
      hard max 1024). Unloaded proxies are untouched; pin them first with
      level(load_actor_descs). Refuses PIE/SIE and non-World-Partition maps.
      Persistence is deliberately unsupported because Landscape PreSave can
      mutate edit-layer collision data; this action never saves packages, and
      save accepts only false. No inverse: this recomputes derived collision and
      physical-material data from weightmaps it never writes, so nothing
      restores the previous build and the response says rollbackPossible=false.
      Returns loaded/matched/refreshed/failed counts and exact affected package
      paths. Params: actorLabels?, guids?, bounds?, maxActors?, save?
  pcg.list_graphs:
    class_path: ue-mcp.builtin/pcg.list_graphs
    group: pcg
    description: >-
      List PCG graphs, sorted by object path. Lists the whole project; page
      through it with cursor/limit. Params: cursor?, limit?
  pcg.read_graph:
    class_path: ue-mcp.builtin/pcg.read_graph
    group: pcg
    description: 'Read graph structure. Params: assetPath (or path)'
  pcg.read_node_settings:
    class_path: ue-mcp.builtin/pcg.read_node_settings
    group: pcg
    description: 'Read node settings. Params: assetPath (or path), nodeName'
  pcg.get_components:
    class_path: ue-mcp.builtin/pcg.get_components
    group: pcg
    description: 'List PCG components in level. Params: none'
  pcg.get_component_details:
    class_path: ue-mcp.builtin/pcg.get_component_details
    group: pcg
    description: 'Inspect PCG component (#983). Params: actorLabel OR actorPath'
  pcg.create_graph:
    class_path: ue-mcp.builtin/pcg.create_graph
    group: pcg
    description: >-
      Create graph. Idempotent by path: an existing graph is reported rather
      than replaced. Params: name, packagePath?, onConflict?
  pcg.add_node:
    class_path: ue-mcp.builtin/pcg.add_node
    group: pcg
    description: >-
      Add node. nodeName is a RESULT, not an input: the engine assigns the name
      and this action reports it back for connect_nodes and remove_node. Params:
      assetPath (or path), nodeType, posX?, posY?
  pcg.connect_nodes:
    class_path: ue-mcp.builtin/pcg.connect_nodes
    group: pcg
    description: >-
      Wire nodes. Returns edgeVerified=true after confirming the UPCGEdge
      persisted; surfaces an error if AddEdge succeeded but no edge object was
      instantiated (#304). Params: assetPath (or path), sourceNode (or
      sourceNodeName), sourcePin? (or sourcePinLabel), targetNode (or
      targetNodeName), targetPin? (or targetPinLabel)
  pcg.disconnect_nodes:
    class_path: ue-mcp.builtin/pcg.disconnect_nodes
    group: pcg
    description: >-
      Remove a wired edge between two PCG nodes. Omitted pins match any pin.
      Returns removedEdges count (#346). Params: assetPath (or path), sourceNode
      (or sourceNodeName), targetNode (or targetNodeName), sourcePin? (or
      sourcePinLabel), targetPin? (or targetPinLabel)
  pcg.set_node_settings:
    class_path: ue-mcp.builtin/pcg.set_node_settings
    group: pcg
    description: >-
      Set node params. Pass a settings object of {propertyPath: value} (dotted
      paths and nested structs supported), or propertyName + propertyValue for a
      single write. Reports previousProperties and rolls back to them. Params:
      assetPath (or path), nodeName, settings OR propertyName + propertyValue
  pcg.set_static_mesh_spawner_meshes:
    class_path: ue-mcp.builtin/pcg.set_static_mesh_spawner_meshes
    group: pcg
    description: >-
      Populate weighted MeshEntries on a PCGStaticMeshSpawner node (#145).
      entries=[{mesh, weight?}]; replace defaults to true. Params: assetPath (or
      path), nodeName, entries, replace?
  pcg.remove_node:
    class_path: ue-mcp.builtin/pcg.remove_node
    group: pcg
    description: 'Remove node. Params: assetPath (or path), nodeName'
  pcg.unwrap_instance_nodes:
    class_path: ue-mcp.builtin/pcg.unwrap_instance_nodes
    group: pcg
    description: >-
      Give instance nodes (UPCGSettingsInstance wrappers, read-only in the PCG
      editor's details panel) their own settings object, keeping every value and
      edge. Settings from a shared asset are copied into the node. Nodes that
      already own their settings are left alone. Omit nodeName for every node in
      the graph (#1087). Params: assetPath (or path), nodeName?
  pcg.execute:
    class_path: ue-mcp.builtin/pcg.execute
    group: pcg
    description: >-
      Regenerate PCG. A seed is written to the component before generating, and
      the old one reported back as previousSeed (#983). Params: actorLabel OR
      actorPath, seed?
  pcg.force_regenerate:
    class_path: ue-mcp.builtin/pcg.force_regenerate
    group: pcg
    description: >-
      Force a stuck PCG component to regenerate (clears graph ref, re-sets,
      cleanup+generate) (#146/#983). Params: actorLabel OR actorPath
  pcg.cleanup:
    class_path: ue-mcp.builtin/pcg.cleanup
    group: pcg
    description: >-
      Cleanup a PCG component (remove spawned content) (#146). Params:
      actorLabel OR actorPath, removeComponents?
  pcg.toggle_graph:
    class_path: ue-mcp.builtin/pcg.toggle_graph
    group: pcg
    description: >-
      Toggle a PCG component's graph assignment to force reinit (no generate)
      (#146). Params: actorLabel OR actorPath, graphPath?
  pcg.add_volume:
    class_path: ue-mcp.builtin/pcg.add_volume
    group: pcg
    description: >-
      Place PCG volume. Idempotent by editor label when one is given. Params:
      graphPath?, location?, extent?, label?, onConflict?
  pcg.import_graph:
    class_path: ue-mcp.builtin/pcg.import_graph
    group: pcg
    description: >-
      Bulk-author a PCG graph from JSON:
      nodes=[{name,class,posX?,posY?,settings?}],
      connections=[{from,fromPin?,to,toPin?}], replace defaults to false. One
      call replaces N add_node + M connect_nodes + K set_node_settings (#213).
      Params: assetPath (or path), nodes, connections?, replace?
  pcg.export_graph:
    class_path: ue-mcp.builtin/pcg.export_graph
    group: pcg
    description: >-
      Export a PCG graph as JSON; includeSettings defaults to true. Round-trip
      safe with import_graph (#213). Params: assetPath (or path),
      includeSettings?
  pcg.epic_add_comment_box:
    class_path: ue-mcp.builtin/pcg.epic_add_comment_box
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Adds a comment box around the given nodes.
      Params: graph, nodes, comment?, color?
  pcg.epic_add_node:
    class_path: ue-mcp.builtin/pcg.epic_add_node
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Adds a native node to the graph. Params:
      graph, nativeNodeType, nodeName, jsonParams, nodeTitle, nodeComment,
      xPositionIdx?, yPositionIdx?
  pcg.epic_add_subgraph_node:
    class_path: ue-mcp.builtin/pcg.epic_add_subgraph_node
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Adds a subgraph node to the graph. Params:
      graph, subGraphForNode, nodeName, jsonParams, nodeTitle, nodeComment,
      xPositionIdx?, yPositionIdx?
  pcg.epic_connect_node_pins:
    class_path: ue-mcp.builtin/pcg.epic_connect_node_pins
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Add an edge between two nodes connected to
      the specified pins. Params: fromNode, fromPinLabel, toNode, toPinLabel
  pcg.epic_create_graph:
    class_path: ue-mcp.builtin/pcg.epic_create_graph
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Creates a new saved PCG graph asset. Params:
      name, path?
  pcg.epic_disconnect_node_pins:
    class_path: ue-mcp.builtin/pcg.epic_disconnect_node_pins
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Removes the edge between two nodes connected
      to the specified pins. Params: fromNode, fromPinLabel, toNode, toPinLabel
  pcg.epic_draw_spline:
    class_path: ue-mcp.builtin/pcg.epic_draw_spline
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Triggers the user to draw a spline in the
      viewport to be used later in the world building. Waits for the user to be
      done. Params: actorLabel, actorTag, bRedraw, bClosedSpline
  pcg.epic_execute_graph_instance:
    class_path: ue-mcp.builtin/pcg.epic_execute_graph_instance
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Executes the graph instance and returns any
      issues encountered during execution. Params: pCGVolume
  pcg.epic_get_graph_description:
    class_path: ue-mcp.builtin/pcg.epic_get_graph_description
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Returns the description of a PCG graph.
      Params: graph
  pcg.epic_get_graph_instance_params:
    class_path: ue-mcp.builtin/pcg.epic_get_graph_instance_params
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Gets the graph instance params of a specific
      actor, actor MUST have a graph instance Params: pCGVolume
  pcg.epic_get_graph_schema:
    class_path: ue-mcp.builtin/pcg.epic_get_graph_schema
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Returns the schema for a PCG Graph's graph
      parameters Params: graph
  pcg.epic_get_graph_structure:
    class_path: ue-mcp.builtin/pcg.epic_get_graph_structure
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Returns the complete structure of a PCG graph
      including all nodes, connections, exposed parameters, and comment boxes.
      Params: graph
  pcg.epic_get_native_node_schema:
    class_path: ue-mcp.builtin/pcg.epic_get_native_node_schema
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Returns the schema for a PCG node type
      including input/output pins, parameters, and their types. Params: nodeName
  pcg.epic_get_node_data_view:
    class_path: ue-mcp.builtin/pcg.epic_get_node_data_view
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Returns a JSON Data View of a specific node's
      output data from the last graph execution. On first call, enables
      inspection so future ExecuteGraphInstance calls store per-node data. If no
      inspection data exists, returns an error prompting re-execution.
      IMPORTANT: Inspection state is shared at the graph asset level. If
      multiple actors use the same graph, you MUST call this tool (and
      ExecuteGraphInstance) on only one actor at a time. Wait for each call to
      fully complete before calling on the next actor. Concurrent calls on
      actors sharing the same graph will cause a freeze. Params: pCGVolume,
      node, pinLabel?, attributeName, startIndex?, endIndex?
  pcg.epic_get_node_info:
    class_path: ue-mcp.builtin/pcg.epic_get_node_info
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Returns node details including name,
      position, and all parameter values. Params: node
  pcg.epic_list_available_subgraphs:
    class_path: ue-mcp.builtin/pcg.epic_list_available_subgraphs
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Lists the PCG graphs that can be used with
      the Subgraph native node. Only these graphs should be used with the
      Subgraph native node. Params: none
  pcg.epic_list_graph_instances:
    class_path: ue-mcp.builtin/pcg.epic_list_graph_instances
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Gets all actors with a PCG graph instance in
      the scene. Params: none
  pcg.epic_list_native_nodes:
    class_path: ue-mcp.builtin/pcg.epic_list_native_nodes
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Returns a list of available native PCG node
      type names. Params: bCommonOnly?
  pcg.epic_remove_comment_box:
    class_path: ue-mcp.builtin/pcg.epic_remove_comment_box
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Removes a comment box from the graph. Does
      not affect the nodes it contains. Params: graph, commentId
  pcg.epic_remove_graph_params:
    class_path: ue-mcp.builtin/pcg.epic_remove_graph_params
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Removes graph parameters to a specific PCG
      graph, such that they are not overridable anymore. Params: graph,
      paramNames
  pcg.epic_remove_node:
    class_path: ue-mcp.builtin/pcg.epic_remove_node
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Removes the node from the graph, will also
      remove edges connected to the node. Params: graph, node
  pcg.epic_reposition_node:
    class_path: ue-mcp.builtin/pcg.epic_reposition_node
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Change the position of node. Params: node,
      xPositionIdx, yPositionIdx
  pcg.epic_reset_graph_instance_params:
    class_path: ue-mcp.builtin/pcg.epic_reset_graph_instance_params
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Resets the given graph instance params back
      to the graph's default values. Actor MUST have a graph instance. Params:
      pCGVolume, paramNames
  pcg.epic_run_pcginstant_graph:
    class_path: ue-mcp.builtin/pcg.epic_run_pcginstant_graph
    group: pcg
    description: >-
      [Epic PCGToolset.PCGSpatialToolset] Runs an instant PCG graph with the
      specified parameters in fire-and-forget mode (Should be called directly:
      Not callable in a python context execution context) Params: graph, params
  pcg.epic_set_graph_description:
    class_path: ue-mcp.builtin/pcg.epic_set_graph_description
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Set the description of a PCGGraph Params:
      graph, description
  pcg.epic_set_graph_instance_params:
    class_path: ue-mcp.builtin/pcg.epic_set_graph_instance_params
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Sets the graph instance params of a specific
      actor, actor MUST have a graph instance Params: pCGVolume, jsonParams
  pcg.epic_set_graph_params:
    class_path: ue-mcp.builtin/pcg.epic_set_graph_params
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Adds one or more graph user parameters to a
      specific PCG graph, such that they will be overridable in per graph
      instance. Params: graph, params
  pcg.epic_set_node_comment:
    class_path: ue-mcp.builtin/pcg.epic_set_node_comment
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Change the comment on the specified node.
      Params: node, nodeComment
  pcg.epic_spawn_graph_instance:
    class_path: ue-mcp.builtin/pcg.epic_spawn_graph_instance
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Spawns a PCG Volume with associated Graph
      Instance into the scene, optionally with Graph Param overrides. Params:
      graph, name, transform, jsonParams
  pcg.epic_update_comment_box:
    class_path: ue-mcp.builtin/pcg.epic_update_comment_box
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Updates an existing comment box with new
      nodes and value. Params: graph, commentId, nodes, comment?, color?
  pcg.epic_update_node:
    class_path: ue-mcp.builtin/pcg.epic_update_node
    group: pcg
    description: >-
      [Epic PCGToolset.PCGToolset] Updates a node by changing its params and/or
      title. Params: node, jsonParams, nodeTitle
  foliage.list_types:
    class_path: ue-mcp.builtin/foliage.list_types
    group: foliage
    description: >-
      List foliage types in the level, one row per type per
      InstancedFoliageActor (foliageActorPath says which), sorted by that pair.
      Params: cursor?, limit?
  foliage.get_settings:
    class_path: ue-mcp.builtin/foliage.get_settings
    group: foliage
    description: 'Read foliage type settings. Params: foliageTypePath (or foliageTypeName)'
  foliage.sample:
    class_path: ue-mcp.builtin/foliage.sample
    group: foliage
    description: 'Count instances per foliage type inside a sphere. Params: center, radius?'
  foliage.create_type:
    class_path: ue-mcp.builtin/foliage.create_type
    group: foliage
    description: >-
      Create foliage type from mesh. Params: meshPath, name?, packagePath?,
      onConflict?, settings?
  foliage.set_settings:
    class_path: ue-mcp.builtin/foliage.set_settings
    group: foliage
    description: >-
      Modify ONE foliage type's settings. For the same edit across every type
      matching a condition, use batch_set_settings_where instead of calling this
      in a loop. Params: foliageTypePath (or foliageTypeName), settings
  foliage.batch_set_settings_where:
    class_path: ue-mcp.builtin/foliage.batch_set_settings_where
    group: foliage
    description: >-
      Write settings to every FoliageType whose CURRENT property values match a
      predicate, with the predicate evaluated in the editor. set_settings is one
      asset per call and cannot express a condition at all, so
      'include_in_hlod=false on every type whose cull distance is set' meant
      reading 201 assets out, computing the 36 matches client-side, and writing
      them back one at a time. Candidates come from foliageTypePaths[]
      (explicit), directory (scan FoliageType assets) or fromLevel=true (types
      placed in the open level). Predicate fields read the asset's own
      properties by dotted path, so CullDistance.Max works and a bare name is
      treated the same as props.<name>; operators are the same vocabulary as
      level(query_components). dryRun DEFAULTS TO TRUE because this writes to
      many assets at once, and the preview still resolves every setting path so
      an unwritable property is reported before the commit. Written values are
      read back rather than echoed, so a value the property coerced is visible.
      The inverse is asset(bulk_set_properties) carrying the previous value of
      every property on every type written, which is the only action that takes
      DIFFERENT values per asset - two matched types can have had different
      previous values for the same setting. It is marked lossy when a matched
      FoliageType lives inside a level rather than as an asset (no assetPath
      addresses it), and omitted entirely above that action's 500-item batch
      limit, with the reason stated rather than a record that would restore part
      of the write. Pass one of foliageTypePaths, directory or fromLevel (#988).
      Params: settings, where, whereMode?, foliageTypePaths?, directory?,
      recursive?, fromLevel?, propertyNames?, dryRun?, save?, maxTypes?
  foliage.add_instances:
    class_path: ue-mcp.builtin/foliage.add_instances
    group: foliage
    description: >-
      PAINT foliage into the open level. Nothing else on this surface could
      place a single instance, so create_type produced an asset that never
      appeared anywhere. Two modes: transforms[] places each entry exactly,
      center+radius+count scatters uniformly over a disc. Each candidate is
      traced onto the geometry beneath it (projectToGround, default true) and
      then run through the FoliageType's OWN placement rules (applyTypeRules,
      default true) so the random scale between ScaleX/Y/Z, the random yaw and
      pitch, align-to-normal within AlignMaxAngle, the Z offset and the
      CollisionWithWorld test all apply - which is what makes a painted instance
      behave like one painted by hand. A candidate that hits nothing, or that
      the type's ground-slope or height range rejects, is reported in
      skippedCandidates with the reason rather than silently dropped. The type
      is added to the level's palette if it is not there already. Returns the
      InstancedFoliageActor it wrote to, and rolls back by removing exactly the
      transforms it placed. Each transforms entry is {location, rotation?,
      scale?}. Params: foliageTypePath, transforms?, center?, radius?, count?,
      seed?, projectToGround?, traceUp?, traceDown?, applyTypeRules?,
      skipCollision?
  foliage.remove_instances:
    class_path: ue-mcp.builtin/foliage.remove_instances
    group: foliage
    description: >-
      Remove foliage instances by index, by exact transform, inside a sphere, or
      all of a type. The rollback captures each removed instance's world
      transform and replays it as an add, so this is recoverable up to 2000
      instances; the base component an instance was painted onto is not
      restored. dryRun reports what would go without touching anything. Scope to
      one InstancedFoliageActor with actorPath when a World Partition map holds
      the same type on several. Params: foliageTypePath, instanceIndices?,
      transforms?, center?, radius?, all?, matchTolerance?, actorPath?, dryRun?
  foliage.get_instances:
    class_path: ue-mcp.builtin/foliage.get_instances
    group: foliage
    description: >-
      Read placed foliage instances with their world transforms, paged. sample
      only ever returned counts, so there was no way to verify a paint or find
      what to remove. Filter by type and/or by a sphere; index is the position
      inside the named actor's info for that type, which is exactly what
      remove_instances takes. Params: foliageTypePath?, center?, radius?,
      limit?, startIndex?, includeTransforms?
  foliage.add_type_to_level:
    class_path: ue-mcp.builtin/foliage.add_type_to_level
    group: foliage
    description: >-
      Put a FoliageType asset into the open level's palette, allocating the
      instanced component that holds its instances. create_type only makes the
      asset; until this runs the type is invisible to the level and to the
      foliage editor. Idempotent: a type already in the level reports existed
      and allocates nothing. Params: foliageTypePath
  foliage.remove_type_from_level:
    class_path: ue-mcp.builtin/foliage.remove_type_from_level
    group: foliage
    description: >-
      Take a FoliageType out of the open level's palette. REFUSES while the type
      still has instances unless force=true, because removing it destroys them
      and their transforms are not captured - remove them first with
      remove_instances, whose rollback does capture them. The FoliageType asset
      itself is untouched; asset(delete) deletes it. Params: foliageTypePath,
      force?
  foliage.read_spawner:
    class_path: ue-mcp.builtin/foliage.read_spawner
    group: foliage
    description: >-
      Read a ProceduralFoliageSpawner: its tile settings, the foliage types it
      will spawn resolved to real asset paths, and every volume in the open
      level bound to it with its bounds and whether it has produced anything.
      The volume half is the part nobody can read off the asset and the usual
      reason a simulation appears to do nothing. Returns objectPath for the
      scalar tunables, which are plain properties. Params: spawnerPath
  foliage.set_spawner_types:
    class_path: ue-mcp.builtin/foliage.set_spawner_types
    group: foliage
    description: >-
      Set which foliage types a ProceduralFoliageSpawner spawns. This needs an
      action rather than a property write: FoliageTypes is a private array whose
      element object pointer is private too, and every write has to be followed
      by RefreshInstance or the cached type the simulation actually reads stays
      stale. Validates every path before writing anything, reports unchanged
      when the list already matched, reads the result back rather than echoing
      it, and rolls back to the previous list. Params: spawnerPath,
      foliageTypePaths, mode?, save?
  foliage.simulate_procedural:
    class_path: ue-mcp.builtin/foliage.simulate_procedural
    group: foliage
    description: >-
      Run the procedural foliage simulation and place what it generates. Address
      one volume with actorLabel or actorPath, or every volume in the open level
      bound to one spawner with spawnerPath. Validates every target first
      (spawner set, type list non-empty, volume bounds non-zero) so a
      half-simulated set of volumes is not possible, then generates desired
      instances and traces and places each one under the same type rules as
      add_instances. Reports generated, placed and skipped per volume. Place the
      volume itself with level(spawn_volume,
      volumeType="ProceduralFoliageVolume"), which builds the cube brush a bare
      spawn leaves empty. Params: actorLabel?, actorPath?, spawnerPath?,
      clearExisting?, skipCollision?
  foliage.clear_procedural:
    class_path: ue-mcp.builtin/foliage.clear_procedural
    group: foliage
    description: >-
      Remove every instance a procedural foliage component spawned, matched on
      the component's own procedural GUID so hand-painted instances of the same
      type are left alone. Pass one of actorLabel, actorPath or spawnerPath.
      Reports alreadyRemoved when the component had produced nothing. The
      inverse re-runs the simulation, which reproduces the cleared content only
      while the spawner's seed, tile settings and type list are unchanged.
      Params: actorLabel?, actorPath?, spawnerPath?
  niagara.list:
    class_path: ue-mcp.builtin/niagara.list
    group: niagara
    description: >-
      List Niagara assets: every NiagaraSystem and NiagaraEmitter as one row
      tagged with its `type`, sorted by object path within each type, plus
      systemCount/emitterCount for the whole listing. Lists the whole project;
      page through it with cursor/limit. Params: cursor?, limit?
  niagara.get_info:
    class_path: ue-mcp.builtin/niagara.get_info
    group: niagara
    description: 'Inspect system. Params: assetPath (or path)'
  niagara.list_dynamic_inputs:
    class_path: ue-mcp.builtin/niagara.list_dynamic_inputs
    group: niagara
    description: >-
      Report the authored override map per module: which inputs carry a plain
      value, which are wired to a dynamic-input script, and which hold an inline
      HLSL expression, with nested dynamic inputs one level down under
      nestedOverrides. This is a graph walk, so no property read produces it.
      Pair with list_module_inputs, which shows the inputs that have no override
      at all. Params: systemPath, emitterName?, emitterIndex?, stackContext?,
      moduleName?
  niagara.set_dynamic_input:
    class_path: ue-mcp.builtin/niagara.set_dynamic_input
    group: niagara
    description: >-
      Wire a dynamic-input NiagaraScript into a module input's override pin,
      creating the pin if needed and replacing whatever was there. A dynamic
      input is a graph node, not a property, so set_property cannot do this.
      Returns dynamicInputName, which is the module name to pass to
      set_module_input when setting the dynamic input's OWN inputs. Errors list
      the module's real input names and the modules present. Params: systemPath,
      stackContext, moduleName, inputName, dynamicInputScript, emitterName?,
      emitterIndex?
  niagara.remove_dynamic_input:
    class_path: ue-mcp.builtin/niagara.remove_dynamic_input
    group: niagara
    description: >-
      Unwire a dynamic input, delete the nodes that fed only it, and drop the
      override pin so the module's own default comes back. An input with no
      dynamic input returns alreadyRemoved rather than an error, so a rollback
      replays safely. Params: systemPath, stackContext, moduleName, inputName,
      emitterName?, emitterIndex?
  niagara.add_simulation_stage:
    class_path: ue-mcp.builtin/niagara.add_simulation_stage
    group: niagara
    description: >-
      Create a simulation stage on an emitter: the stage object AND the backing
      NiagaraScript, its output node with a fresh usage id, and a parameter-map
      input node, so the stage actually compiles. set_property cannot create a
      graph, which is why this is a handler. Returns simulationStageObjectPath;
      set IterationSource, NumIterations, ExecuteBehavior and the ElementCount
      bindings on it with asset(set_property). Params: systemPath, stageName,
      emitterName?, emitterIndex?, enabled?
  niagara.remove_simulation_stage:
    class_path: ue-mcp.builtin/niagara.remove_simulation_stage
    group: niagara
    description: >-
      Remove a simulation stage, its script, and the graph nodes that fed only
      its output node, leaving nodes shared with another stack alone. A missing
      stage returns alreadyRemoved with the stages that do exist. Reports
      removedModules, which the rollback cannot restore, rather than pretending
      the undo is complete. Params: systemPath, stageName, emitterName?,
      emitterIndex?
  niagara.add_event_handler:
    class_path: ue-mcp.builtin/niagara.add_event_handler
    group: niagara
    description: >-
      Create an event handler on an emitter, with its event script, output node
      and usage id, so the handler's struct fields point at something real.
      Returns eventHandlerPropertyPath; set ExecutionMode, SpawnNumber and
      MaxEventsPerFrame through asset(set_property) on emitterObjectPath with
      that prefix. Params: systemPath, eventName, emitterName?, emitterIndex?,
      sourceEmitterId?
  niagara.remove_event_handler:
    class_path: ue-mcp.builtin/niagara.remove_event_handler
    group: niagara
    description: >-
      Remove an event handler by its script's usage id and delete the graph
      chain that fed only it. A missing handler returns alreadyRemoved listing
      the handlers present. Echoes the ExecutionMode and SpawnNumber the
      rollback will not restore. Params: systemPath, eventName, emitterName?,
      emitterIndex?
  niagara.get_custom_hlsl:
    class_path: ue-mcp.builtin/niagara.get_custom_hlsl
    group: niagara
    description: >-
      Read every CustomHLSL node in a graph: the source body, and the pins
      Niagara parsed out of it. Omit nodeIndex to list them all. This is what
      makes HLSL iterable rather than write-once, since nothing else can read
      the body back. stackContext and the emitter apply when addressing a
      system. Params: scriptPath OR systemPath, stackContext?, emitterName?,
      emitterIndex?, nodeIndex?
  niagara.set_custom_hlsl:
    class_path: ue-mcp.builtin/niagara.set_custom_hlsl
    group: niagara
    description: >-
      Overwrite a CustomHLSL node's body and reconstruct the node, so the
      returned pins are the ones the new source actually declares. A bare
      property write would leave stale pins and an uncompiled script, which is
      why this is a handler. A body identical to the current one returns
      alreadySet and skips the recompile. stackContext and the emitter apply
      when addressing a system. Params: hlsl, scriptPath OR systemPath,
      stackContext?, emitterName?, emitterIndex?, nodeIndex?
  niagara.remove_module:
    class_path: ue-mcp.builtin/niagara.remove_module
    group: niagara
    description: >-
      Remove a module from an emitter stack: unwire its node group, close the
      parameter-map chain over the gap, and delete the module with its override
      node and dynamic inputs. add_module had no inverse below UE 5.8, where
      only the Epic toolset covers this. Returns remainingModules in stack order
      and echoes the removedOverrides the rollback will not restore. Params:
      systemPath, stackContext, moduleName, emitterName?, emitterIndex?
  niagara.set_module_enabled:
    class_path: ue-mcp.builtin/niagara.set_module_enabled
    group: niagara
    description: >-
      Enable or disable a module in place. A disabled module keeps its node, its
      inputs and its stack position and is skipped at compile time, which makes
      this the reversible way to test whether a module is causing a behaviour.
      Already in that state returns alreadySet. Params: systemPath,
      stackContext, moduleName, enabled, emitterName?, emitterIndex?
  niagara.compile:
    class_path: ue-mcp.builtin/niagara.compile
    group: niagara
    description: >-
      Force a real compile of a system and report what the translator said, per
      script: scriptName, usage, status (NCS_UpToDate | NCS_UpToDateWithWarnings
      | NCS_Error | ...), errorMsg and every compile event with its severity and
      the node and pin guid that produced it, plus a top-level compiled boolean
      and a flat errors[]. This is the assertion a graph edit has to survive.
      validate answers whether the system EMITS, which a malformed script can
      still pass, and get_compiled_hlsl returns success without compiling
      anything at all on a CPU-sim emitter. The call blocks until the compile
      settles, because an asynchronous one hands back the previous compile's
      status. force (default true) recompiles even when nothing looks dirty,
      which is the case a graph edit that left change tracking untouched
      produces. Params: systemPath, force?, includeGpuShaders?
  niagara.validate:
    class_path: ue-mcp.builtin/niagara.validate
    group: niagara
    description: >-
      Verify gate: does this system actually emit? Reports per emitter whether
      it is enabled and has a spawn module + an enabled renderer. valid=false
      means empty shell. Params: systemPath
  niagara.spawn:
    class_path: ue-mcp.builtin/niagara.spawn
    group: niagara
    description: >-
      Spawn VFX as a transient component (GC's before offscreen capture). For a
      findable preview use spawn_actor. Scale is three separate keys,
      scaleX/scaleY/scaleZ, not a vector object; autoDestroy defaults to false.
      Params: systemPath, location?, rotation?, label?, scaleX?, scaleY?,
      scaleZ?, autoDestroy?
  niagara.spawn_actor:
    class_path: ue-mcp.builtin/niagara.spawn_actor
    group: niagara
    description: >-
      Spawn a PERSISTENT, labeled NiagaraActor in the editor world (findable,
      re-activatable, survives capture - unlike spawn). Assigns the system and
      activates unless activate=false (#537). Params: systemPath, location?,
      rotation?, label?, activate?
  niagara.reactivate:
    class_path: ue-mcp.builtin/niagara.reactivate
    group: niagara
    description: >-
      Reset + reactivate the NiagaraComponent on a placed actor (replay a burst
      before capturing) (#537/#983). Params: actorLabel OR actorPath
  niagara.set_parameter:
    class_path: ue-mcp.builtin/niagara.set_parameter
    group: niagara
    description: >-
      Set a user parameter on the NiagaraComponent of a placed actor.
      parameterType selects how the value is read: float, int and bool take
      `value`; vector takes valueX/valueY/valueZ, which are separate keys rather
      than a `value` object because that is what the handler reads. Reports
      previousValue and rolls back to it. Params: actorLabel OR actorPath,
      parameterName, parameterType?, value OR valueX + valueY + valueZ
  niagara.create:
    class_path: ue-mcp.builtin/niagara.create
    group: niagara
    description: >-
      Create system. Idempotent by path: an existing system is reported rather
      than replaced. Params: name, packagePath?, onConflict?
  niagara.create_emitter:
    class_path: ue-mcp.builtin/niagara.create_emitter
    group: niagara
    description: >-
      Create a Niagara emitter asset. templatePath copies an existing emitter as
      the starting point (the content browser's create-from-template path); omit
      it for the default empty emitter with the standard modules and a sprite
      renderer. inherit=true makes it a child that tracks the template instead,
      which then refuses local edits to inherited modules. Params: name,
      packagePath?, onConflict?, templatePath?, inherit?
  niagara.add_emitter:
    class_path: ue-mcp.builtin/niagara.add_emitter
    group: niagara
    description: 'Add emitter to system. Params: systemPath, emitterPath'
  niagara.remove_emitter:
    class_path: ue-mcp.builtin/niagara.remove_emitter
    group: niagara
    description: >-
      Remove an emitter from a system (CRUD delete), addressed by emitterName or
      emitterIndex. Params: systemPath, emitterName?, emitterIndex?
  niagara.list_emitters:
    class_path: ue-mcp.builtin/niagara.list_emitters
    group: niagara
    description: 'List emitters in system. Params: systemPath'
  niagara.set_emitter_property:
    class_path: ue-mcp.builtin/niagara.set_emitter_property
    group: niagara
    description: >-
      Set emitter property. Params: systemPath (or assetPath), emitterName?,
      propertyName, value
  niagara.list_modules:
    class_path: ue-mcp.builtin/niagara.list_modules
    group: niagara
    description: >-
      List Niagara module scripts, sorted by object path. pathFilter narrows the
      whole set rather than only the first page, which is what it always claimed
      to do. Params: pathFilter?, cursor?, limit?
  niagara.get_emitter_info:
    class_path: ue-mcp.builtin/niagara.get_emitter_info
    group: niagara
    description: 'Inspect emitter. Params: assetPath'
  niagara.list_renderers:
    class_path: ue-mcp.builtin/niagara.list_renderers
    group: niagara
    description: >-
      List renderers on an emitter. Params: systemPath, emitterName?,
      emitterIndex?
  niagara.add_renderer:
    class_path: ue-mcp.builtin/niagara.add_renderer
    group: niagara
    description: >-
      Add renderer (sprite/mesh/ribbon or full class). Params: systemPath,
      rendererType, emitterName?, emitterIndex?
  niagara.remove_renderer:
    class_path: ue-mcp.builtin/niagara.remove_renderer
    group: niagara
    description: >-
      Remove renderer by index. Params: systemPath, rendererIndex, emitterName?,
      emitterIndex?
  niagara.set_renderer_property:
    class_path: ue-mcp.builtin/niagara.set_renderer_property
    group: niagara
    description: >-
      Set any renderer property. Bools, numbers and strings are taken directly;
      object properties (a sprite/mesh renderer's Material, the mesh on a mesh
      renderer) take an asset path and are class-checked; structs, enums, names
      and arrays go through the shared JSON property setter, so there is no
      longer a type whitelist to fall off (#783). Params: systemPath,
      rendererIndex?, propertyName, value, emitterName?, emitterIndex?
  niagara.inspect_data_interfaces:
    class_path: ue-mcp.builtin/niagara.inspect_data_interfaces
    group: niagara
    description: 'List user-scope data interfaces. Params: systemPath'
  niagara.create_system_from_spec:
    class_path: ue-mcp.builtin/niagara.create_system_from_spec
    group: niagara
    description: >-
      Declaratively create a system + emitters: emitters=[{path}]. Params: name,
      packagePath?, onConflict?, emitters?
  niagara.get_compiled_hlsl:
    class_path: ue-mcp.builtin/niagara.get_compiled_hlsl
    group: niagara
    description: >-
      Read GPU compute script info for an emitter. Params: systemPath,
      emitterName?, emitterIndex?
  niagara.list_system_parameters:
    class_path: ue-mcp.builtin/niagara.list_system_parameters
    group: niagara
    description: 'List user-exposed system parameters. Params: systemPath'
  niagara.list_module_inputs:
    class_path: ue-mcp.builtin/niagara.list_module_inputs
    group: niagara
    description: >-
      List an emitter's modules with the inputs you can actually SET - Spawn
      Rate, Lifetime, Colour, Sprite Size - each with its name, qualifiedName,
      type and a settable flag. Current values are NOT returned: the binder's
      value reader is not exported from NiagaraEditor, so the names and types
      are readable but the live value is not. Compile-time switches and enums
      are reported separately under switchPins; note that 'inputs' now means
      override-map inputs, NOT the function-call node pins it meant before
      (those are switchPins) (#784). Params: systemPath, emitterName?,
      emitterIndex?, stackContext?, moduleName?
  niagara.set_module_input:
    class_path: ue-mcp.builtin/niagara.set_module_input
    group: niagara
    description: >-
      Set a module input value. Override-map-bound inputs (the numeric/colour
      values that matter) are written through the stack override map, the same
      path the Niagara stack editor uses; others fall back to the pin default.
      Reports writePath ('overrideMap'|'pinDefault'). On the overrideMap path
      previousValue cannot be read back (NiagaraEditor does not export the
      binder's reader), so it reports '(unread: override map)' and NO rollback
      is offered - re-set the value explicitly instead. The pinDefault path
      reports a real previousValue and is rollback-safe (#769). value accepts a
      scalar, [x,y,z], {x,y,z[,w]} or {r,g,b[,a]} (alpha defaults to 1);
      anything the input's type cannot parse is REJECTED rather than written,
      including gapped component objects and non-finite numbers. Params:
      systemPath, moduleName, inputName, value, emitterName?, emitterIndex?,
      stackContext?
  niagara.add_module:
    class_path: ue-mcp.builtin/niagara.add_module
    group: niagara
    description: >-
      Add a stock /Niagara/Modules script to an emitter stack (the modules that
      make an emitter actually do anything). Then set_module_input to tune it.
      Params: systemPath, moduleScript, stackContext, emitterName?,
      emitterIndex?, targetIndex?
  niagara.list_static_switches:
    class_path: ue-mcp.builtin/niagara.list_static_switches
    group: niagara
    description: >-
      List static switch inputs on a module. Params: systemPath, moduleName?,
      emitterName?, emitterIndex?, stackContext?
  niagara.set_static_switch:
    class_path: ue-mcp.builtin/niagara.set_static_switch
    group: niagara
    description: >-
      Set static switch value on a module's function call node. Params:
      systemPath, moduleName, switchName, value, emitterName?, emitterIndex?,
      stackContext?
  niagara.create_module_from_hlsl:
    class_path: ue-mcp.builtin/niagara.create_module_from_hlsl
    group: niagara
    description: >-
      Create a NiagaraScript module backed by a custom HLSL node. inputs/outputs
      are [{name,type}]. Params: name, hlsl, packagePath?, onConflict?, inputs?,
      outputs?
  niagara.create_scratch_module:
    class_path: ue-mcp.builtin/niagara.create_scratch_module
    group: niagara
    description: >-
      Create empty Niagara scratch module. inputs/outputs are [{name,type}]
      (#185). Params: name, packagePath?, onConflict?, inputs?, outputs?
  niagara.batch:
    class_path: ue-mcp.builtin/niagara.batch
    group: niagara
    description: >-
      Run a sequence of niagara operations against the bridge in order. Fails
      fast on the first error (returns results up to that point + error).
      Params: ops:[{action, params}] where action is any niagara subaction
      listed above.
  niagara.epic_add_emitter:
    class_path: ue-mcp.builtin/niagara.epic_add_emitter
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Adds an emitter to a Niagara
      System. The new emitter will be based on the template emitter, inheriting
      its configuration and modules. Returns the full emitter topology (no input
      values - call GetEmitterInputValues for values). Params: system,
      templateEmitter, emitterName
  niagara.epic_add_module:
    class_path: ue-mcp.builtin/niagara.epic_add_module
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Adds a module to a script
      stack. The module will be inserted into the specified script's execution
      stack. Returns the module topology with all inputs walked (no input values
      - call GetModuleInputValues for values). Params: moduleLocationRef,
      moduleAsset
  niagara.epic_add_renderer:
    class_path: ue-mcp.builtin/niagara.epic_add_renderer
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Adds a renderer to an
      emitter. Creates a new renderer of the specified type and adds it to the
      emitter's renderer list. Returns an FNiagaraExt_RendererRef with the new
      renderer's Index and RendererClass, usable directly with SetRendererData /
      GetRendererData without a follow-up topology call. Params:
      newRendererLocation, rendererClass
  niagara.epic_add_set_parameter_entry:
    class_path: ue-mcp.builtin/niagara.epic_add_set_parameter_entry
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Adds a single parameter to an
      existing SetParameters module. The module referenced by ModuleRef must be
      a SetParameters (UNiagaraNodeAssignment) module. Use
      bIsSetParametersModule in the module topology to confirm before calling.
      Params: moduleRef, entry
  niagara.epic_add_set_parameters_module:
    class_path: ue-mcp.builtin/niagara.epic_add_set_parameters_module
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Adds a SetParameters module
      to a script stack. Unlike AddModule which requires a script asset, a
      SetParameters module dynamically assigns values to named parameters and
      generates its own internal script. Use this when you need to set one or
      more particle/emitter/system parameters directly in the stack. Params:
      moduleLocationRef, parameters
  niagara.epic_add_user_variables:
    class_path: ue-mcp.builtin/niagara.epic_add_user_variables
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Adds or updates user
      variables on a system. If a variable with the same name already exists, it
      will be replaced with the new definition. Params: system, variablesToAdd
  niagara.epic_apply_stack_issue_fix:
    class_path: ue-mcp.builtin/niagara.epic_apply_stack_issue_fix
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Applies a Fix-style stack
      issue fix identified by IssueId and FixId. Link-style fixes are rejected.
      The fix is undoable via the editor undo stack. Applying a fix may trigger
      a recompile; the result waits for that compile to complete so post-fix
      state is valid. Params: system, issueId, fixId
  niagara.epic_construct_niagara_bpwrapper_from_component:
    class_path: ue-mcp.builtin/niagara.epic_construct_niagara_bpwrapper_from_component
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_Blueprint] Creates a Blueprint actor
      wrapper from a Niagara Component. This generates a new Blueprint actor and
      preserves all component property values and user variable overrides.
      Naming convention: NS_MyEffect -> B_MyEffect Params: newAssetPath,
      component, parentClass
  niagara.epic_construct_niagara_bpwrapper_from_system:
    class_path: ue-mcp.builtin/niagara.epic_construct_niagara_bpwrapper_from_system
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_Blueprint] Creates a Blueprint actor
      wrapper around a Niagara System. This generates a new Blueprint actor with
      a Niagara component configured to use the specified system. Naming
      convention: NS_MyEffect -> B_MyEffect Params: newAssetPath, system,
      parentClass
  niagara.epic_create_niagara_system:
    class_path: ue-mcp.builtin/niagara.epic_create_niagara_system
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Creates a new Niagara System
      asset. The new system will be based on the template system, inheriting its
      configuration and emitters. Params: assetName, assetPath, templateSystem
  niagara.epic_find_niagara_scripts:
    class_path: ue-mcp.builtin/niagara.epic_find_niagara_scripts
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_Assets] Searches for UNiagaraScript
      assets matching the given filters. Reads filterable metadata from asset
      registry tags only - no LoadObject required. Tags reflect the exposed
      (published) version of versioned scripts; this function does not need a
      version filter and there is no way to discover non-exposed versions
      through the asset registry. Params: folderPath, name, usages,
      visibilities, moduleUsageBitmask, bRecursive, bIncludeDeprecated
  niagara.epic_get_asset_discovery_info:
    class_path: ue-mcp.builtin/niagara.epic_get_asset_discovery_info
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_Assets] Returns the project's
      configured asset discovery groups. Each group describes a content
      directory's purpose and paths. Params: none
  niagara.epic_get_available_dynamic_inputs:
    class_path: ue-mcp.builtin/niagara.epic_get_available_dynamic_inputs
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns all available Dynamic
      Input Module assets compatible with the given type. Dynamic inputs provide
      procedural value generation for module parameters. Params: type
  niagara.epic_get_data_interface_schema:
    class_path: ue-mcp.builtin/niagara.epic_get_data_interface_schema
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns property schema for a
      specific Data Interface class. Describes all available properties and
      their types for the given data interface type. Params: dataInterfaceClass
  niagara.epic_get_dynamic_input_chain:
    class_path: ue-mcp.builtin/niagara.epic_get_dynamic_input_chain
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns the full recursive
      chain for a dynamic input: topology metadata and resolved values at every
      level. The starting input must have value mode Dynamic; an error is
      surfaced otherwise. The schema expands one full level and emits a typed
      recursion stub at deeper levels; the wire format recurses to arbitrary
      depth matching the underlying chain. Params: stackInputRef
  niagara.epic_get_dynamic_input_schema:
    class_path: ue-mcp.builtin/niagara.epic_get_dynamic_input_schema
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns schema for a dynamic
      input module in the stack. Describes the inputs and configuration for a
      procedural value generator. Params: dynamicInputReference
  niagara.epic_get_dynamic_input_schema_from_asset:
    class_path: ue-mcp.builtin/niagara.epic_get_dynamic_input_schema_from_asset
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns schema for a dynamic
      input asset. Standalone function that doesn't require a system context -
      useful for browsing available dynamic inputs. Params: dynamicInputAsset
  niagara.epic_get_emitter_data:
    class_path: ue-mcp.builtin/niagara.epic_get_emitter_data
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns emitter property
      values as a single JSON-string blob in PropertyValues. The blob contains
      the full FVersionedNiagaraEmitterData (SimTarget, bLocalSpace, RandomSeed,
      FixedBounds, etc.) - fields use C++ PascalCase, must be parsed to read
      individual values. For typed access to common metadata (SimTarget,
      EmitterName, bEnabled, RendererClasses) prefer GetEmitterSummary - it
      returns those as named fields directly and avoids a JSON parse step. Use
      this endpoint when you need the full property set or a less-common field.
      Params: emitterRef
  niagara.epic_get_emitter_input_values:
    class_path: ue-mcp.builtin/niagara.epic_get_emitter_input_values
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns all resolved input
      values for every module across all four emitter script stacks. One
      FNiagaraExt_ModuleInputValues entry per module, each carrying all its
      resolved input values. Call this in parallel with GetEmitterTopology to
      get both structure and values in two passes. Params: emitterRef
  niagara.epic_get_emitter_schema:
    class_path: ue-mcp.builtin/niagara.epic_get_emitter_schema
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns property schema for
      Niagara Emitter. Describes all available properties and their types that
      can be set on a Niagara Emitter. Params: none
  niagara.epic_get_emitter_summary:
    class_path: ue-mcp.builtin/niagara.epic_get_emitter_summary
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns lightweight emitter
      metadata: name, enabled state, sim target, renderer classes. Use this when
      you only need to check metadata without walking the full emitter
      structure. Params: emitterRef
  niagara.epic_get_emitter_topology:
    class_path: ue-mcp.builtin/niagara.epic_get_emitter_topology
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns full emitter
      topology: four script stacks with all modules and inputs, renderer
      references. All fields always populated. The returned topology carries no
      input values; call GetEmitterInputValues in parallel. Params: emitterRef
  niagara.epic_get_module_input_values:
    class_path: ue-mcp.builtin/niagara.epic_get_module_input_values
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns resolved input values
      for a single module. Use when you need values for one specific module
      without walking the whole emitter. Params: moduleRef
  niagara.epic_get_module_schema:
    class_path: ue-mcp.builtin/niagara.epic_get_module_schema
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns schema for a module
      and all its inputs. Call this after seeing a module in topology to
      understand what inputs it exposes. Params: moduleReference
  niagara.epic_get_module_schema_from_asset:
    class_path: ue-mcp.builtin/niagara.epic_get_module_schema_from_asset
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns schema for a module
      asset. Standalone function that doesn't require a system context - useful
      for browsing available modules. Params: moduleAsset
  niagara.epic_get_module_topology:
    class_path: ue-mcp.builtin/niagara.epic_get_module_topology
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns module topology:
      metadata and all inputs (name/type/visibility only, no values). All fields
      always populated. Params: moduleRef
  niagara.epic_get_niagara_script_digest:
    class_path: ue-mcp.builtin/niagara.epic_get_niagara_script_digest
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_Assets] Returns the decoded
      asset-registry tag metadata for a Niagara script asset. Looks up the asset
      by object path in the asset registry and reads its tags; no LoadObject is
      performed. Returned fields reflect the exposed (published) version when
      the script uses FVersionedNiagaraScriptData versioning - the registry
      never carries non-exposed-version metadata. Params: objectPath
  niagara.epic_get_renderer_data:
    class_path: ue-mcp.builtin/niagara.epic_get_renderer_data
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns renderer property
      values. Retrieves the current values of all configurable renderer
      properties. Params: rendererRef
  niagara.epic_get_renderer_schema:
    class_path: ue-mcp.builtin/niagara.epic_get_renderer_schema
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns property schema for a
      specific Renderer class. Describes all available properties and their
      types for the given renderer type. Params: rendererClass
  niagara.epic_get_script_stack_input_values:
    class_path: ue-mcp.builtin/niagara.epic_get_script_stack_input_values
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns all resolved input
      values for every module in the given script stack. One
      FNiagaraExt_ModuleInputValues entry per module. Params: scriptRef
  niagara.epic_get_script_stack_topology:
    class_path: ue-mcp.builtin/niagara.epic_get_script_stack_topology
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns script stack
      topology: all modules and their inputs in execution order. All fields
      always populated. Params: scriptRef
  niagara.epic_get_stack_input_data:
    class_path: ue-mcp.builtin/niagara.epic_get_stack_input_data
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns the value of a stack
      module input. Retrieves the current value and configuration for a specific
      module input parameter. Params: stackInputRef
  niagara.epic_get_stack_input_schema:
    class_path: ue-mcp.builtin/niagara.epic_get_stack_input_schema
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns schema for a single
      module input in the stack. Describes the type, metadata, and configuration
      options for a specific input parameter. Params: inputReference
  niagara.epic_get_stack_input_topology:
    class_path: ue-mcp.builtin/niagara.epic_get_stack_input_topology
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns stack input topology:
      name, type, visibility, editability. No value payload. For the resolved
      value call GetStackInputData. For a dynamic-input chain call
      GetDynamicInputChain. Params: stackInputRef
  niagara.epic_get_stack_issues:
    class_path: ue-mcp.builtin/niagara.epic_get_stack_issues
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns all stack issues
      (errors, warnings, info) from the Niagara module stack, including
      dismissed ones. Waits for any in-flight compile to complete before
      collecting. Params: system
  niagara.epic_get_system_compile_state:
    class_path: ue-mcp.builtin/niagara.epic_get_system_compile_state
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns the current compile
      state of a Niagara System: aggregate status, per-script compile events,
      and summary flags. Waits for any in-flight compile to complete before
      collecting. Params: system
  niagara.epic_get_system_data:
    class_path: ue-mcp.builtin/niagara.epic_get_system_data
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns system property
      values. Retrieves the current values of all configurable system-level
      properties. Params: system
  niagara.epic_get_system_dependencies:
    class_path: ue-mcp.builtin/niagara.epic_get_system_dependencies
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns the four Used* sets
      (renderers, data interfaces, modules, dynamic inputs) gathered across all
      emitters and system scripts. These sets are not included in topology
      structs; call this endpoint separately when needed. Params: system
  niagara.epic_get_system_schema:
    class_path: ue-mcp.builtin/niagara.epic_get_system_schema
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns property schema for
      Niagara System. Describes all available properties and their types that
      can be set on a Niagara System. Params: none
  niagara.epic_get_system_summary:
    class_path: ue-mcp.builtin/niagara.epic_get_system_summary
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns lightweight system
      metadata: name, user variables, and one summary entry per emitter. Use
      this for first contact with an unfamiliar system. For full structural
      detail call GetEmitterTopology per emitter. Params: system
  niagara.epic_get_user_variables:
    class_path: ue-mcp.builtin/niagara.epic_get_user_variables
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_Component] Returns all user variable
      values currently set on the component. This retrieves the current values
      of all user-exposed parameters that can be overridden at the component
      level. Params: component
  niagara.epic_get_user_variables__niagara_toolset_system:
    class_path: ue-mcp.builtin/niagara.epic_get_user_variables__niagara_toolset_system
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Returns all user variables
      defined on the system. User variables are parameters exposed for external
      control and can be overridden per component instance. Params: system
  niagara.epic_get_variable:
    class_path: ue-mcp.builtin/niagara.epic_get_variable
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_Component] Gets the current value of
      a specific user variable on the component. This retrieves the current
      value of a user-exposed parameter, including any component-level
      overrides. Params: component, var
  niagara.epic_remove_emitter:
    class_path: ue-mcp.builtin/niagara.epic_remove_emitter
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Removes an emitter from a
      system. Deletes the specified emitter and all its associated scripts,
      modules, and renderers. Params: emitterToRemove
  niagara.epic_remove_module:
    class_path: ue-mcp.builtin/niagara.epic_remove_module
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Removes a module from a
      script stack. Deletes the specified module and all its inputs from the
      script's execution stack. Params: moduleToRemove
  niagara.epic_remove_renderer:
    class_path: ue-mcp.builtin/niagara.epic_remove_renderer
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Removes a renderer from an
      emitter. Deletes the specified renderer from the emitter's renderer list.
      Params: rendererToRemove
  niagara.epic_remove_set_parameter_entry:
    class_path: ue-mcp.builtin/niagara.epic_remove_set_parameter_entry
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Removes a parameter from an
      existing SetParameters module by name. The module referenced by ModuleRef
      must be a SetParameters (UNiagaraNodeAssignment) module. Use
      bIsSetParametersModule in the module topology to confirm before calling.
      Params: moduleRef, parameterName
  niagara.epic_remove_user_variables:
    class_path: ue-mcp.builtin/niagara.epic_remove_user_variables
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Removes user variables from a
      system. Deletes the specified user variables from the system's user
      parameter collection. Params: system, variablesToRemove
  niagara.epic_set_emitter_data:
    class_path: ue-mcp.builtin/niagara.epic_set_emitter_data
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Sets property values on a
      Niagara Emitter. Applies new values to emitter-level properties based on
      the provided data structure. Params: emitter, emitterData
  niagara.epic_set_module_enabled:
    class_path: ue-mcp.builtin/niagara.epic_set_module_enabled
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Sets whether a module is
      enabled. Disabled modules remain in the stack but don't execute. Current
      state is visible in module topology. Params: moduleRef, bEnabled
  niagara.epic_set_renderer_data:
    class_path: ue-mcp.builtin/niagara.epic_set_renderer_data
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Sets property values on a
      Niagara Renderer. Applies new values to renderer properties based on the
      provided data structure. Payload shape varies with the concrete renderer
      class; call GetRendererSchema for the renderer's class to inspect valid
      properties before writing. Params: renderer, rendererData
  niagara.epic_set_stack_input_data:
    class_path: ue-mcp.builtin/niagara.epic_set_stack_input_data
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Sets the value of a stack
      module input and returns the resulting stored value. Updates the value and
      configuration for a specific module input parameter. Params:
      stackInputRef, inputData
  niagara.epic_set_system:
    class_path: ue-mcp.builtin/niagara.epic_set_system
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_Component] Sets the Niagara System
      for a component. Use this instead of setting the Asset property directly
      to ensure proper initialization. Params: niagaraComponent, system,
      bResetExistingOverrideParameters
  niagara.epic_set_system_data:
    class_path: ue-mcp.builtin/niagara.epic_set_system_data
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_System] Sets property values on a
      Niagara System. Applies new values to system-level properties based on the
      provided data structure. Params: system, systemData
  niagara.epic_set_variable:
    class_path: ue-mcp.builtin/niagara.epic_set_variable
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_Component] Sets the value of a user
      variable on the component. This overrides the default value of a
      user-exposed parameter on a specific component instance. Params:
      component, variable
  niagara.epic_uenum_info:
    class_path: ue-mcp.builtin/niagara.epic_uenum_info
    group: niagara
    description: >-
      [Epic NiagaraToolsets.NiagaraToolset_Info] Returns information about a
      UEnum and all its values. ALWAYS call this when working with a UEnum type
      to see valid values. Params: enum
  audio.list:
    class_path: ue-mcp.builtin/audio.list
    group: audio
    description: >-
      List sound assets (SoundWave, SoundCue, MetaSoundSource) under a
      directory, cursor-paginated (#730). Every page carries count, total,
      hasMore and a nextCursor to pass back. The row offset this used to page
      with is refused, because a row number cannot report that the library
      changed underneath it. maxResults is a deprecated spelling of limit and
      sizes the page when limit is omitted. Params: directory?, recursive?,
      offset?, cursor?, limit? (or maxResults)
  audio.extract_pcm:
    class_path: ue-mcp.builtin/audio.extract_pcm
    group: audio
    description: >-
      Decode a USoundWave's imported audio to in-memory PCM (no intermediate
      file, no reliance on the original source path) for semantic sound search /
      analysis (#729). Returns sampleRate, numChannels, numFrames,
      durationSeconds, and 16-bit PCM samples base64-encoded (interleaved).
      Params: soundPath (or assetPath), maxSeconds?, downmixMono?
  audio.import_audio:
    class_path: ue-mcp.builtin/audio.import_audio
    group: audio
    description: >-
      Import a WAV/OGG/FLAC file as a USoundWave. Returns durationSeconds,
      numChannels, looping. Params: filePath (or filename), name? (or
      assetName), packagePath? (or destinationPath), looping?, replaceExisting?
  audio.play_at_location:
    class_path: ue-mcp.builtin/audio.play_at_location
    group: audio
    description: >-
      Play a sound in the editor world. Params: soundPath (or assetPath, or
      path), location?, volumeMultiplier? (or volume), pitchMultiplier? (or
      pitch)
  audio.spawn_ambient:
    class_path: ue-mcp.builtin/audio.spawn_ambient
    group: audio
    description: >-
      Place an AmbientSound actor playing a sound. A sound that does not load is
      refused rather than placing a silent actor. Params: soundPath (or
      assetPath, or path), location?, label?, onConflict?, volumeMultiplier? (or
      volume)
  audio.metasound_author:
    class_path: ue-mcp.builtin/audio.metasound_author
    group: audio
    description: >-
      PREFERRED: stamp a whole MetaSound graph in ONE call from a declarative
      spec (avoids dozens of add_node/connect round-trips). Creates the asset
      through UMetaSoundSourceFactory, which is the only route that produces a
      document with interfaces and a graph page, then writes every element
      straight into that asset's own document and saves at the end. Each element
      reports its own ok/error. Read the result back with
      metasound_read_document. Params: name, packagePath?, onConflict?, format?,
      oneShot?, inputs?, outputs?, nodes?, connections?
  audio.create_metasound:
    class_path: ue-mcp.builtin/audio.create_metasound
    group: audio
    description: >-
      Create a MetaSoundSource through its own asset factory (which installs the
      UE.Source, one-shot and output-format interfaces and mints the default
      graph page) ready for INCREMENTAL authoring with add_node/connect/... For
      a whole graph at once prefer metasound_author. The incremental actions do
      NOT depend on this call: they attach a builder to whatever asset they are
      pointed at, so a MetaSound already on disk, or one from an earlier editor
      run, is editable without it. Returns the asset path. Params: name,
      packagePath?, onConflict?, format?, oneShot?
  audio.metasound_list_node_classes:
    class_path: ue-mcp.builtin/audio.metasound_list_node_classes
    group: audio
    description: >-
      List common MetaSound node classes to add (name, namespace, variant,
      notes). Params: filter?
  audio.metasound_get_graph:
    class_path: ue-mcp.builtin/audio.metasound_get_graph
    group: audio
    description: >-
      SUPERSEDED for graph contents by metasound_read_document; kept for the one
      fact it still answers plainly: whether a builder is attached to this
      asset's document right now (hasActiveBuilder), plus audioOutputs and
      oneShot when this editor run has created or written to the asset. An
      attached builder does not mean unsaved work: the write actions edit the
      asset's own document and save it, and they attach a builder on demand, so
      this reports whether one is open rather than whether anything is pending.
      Asks only, and never attaches one itself. For nodes, pins, connections,
      variables, defaults and problems use metasound_read_document /
      metasound_list_connections / metasound_inspect_node /
      metasound_list_node_pins / metasound_search_nodes /
      metasound_list_variables / metasound_validate. Errors when assetPath names
      nothing, or names something that is not a MetaSoundSource. Params:
      assetPath (or metasoundPath)
  audio.metasound_add_node:
    class_path: ue-mcp.builtin/audio.metasound_add_node
    group: audio
    description: >-
      Add a node to a MetaSound graph by registered class name. Works on any
      MetaSound asset on disk: a builder is attached to the asset's own document
      on demand, so create_metasound is not a prerequisite and an asset from an
      earlier editor run is editable. Returns nodeId (+ input/output counts).
      Params: assetPath (or metasoundPath), nodeClassName, nodeNamespace?,
      nodeVariant?, majorVersion?
  audio.metasound_add_input:
    class_path: ue-mcp.builtin/audio.metasound_add_input
    group: audio
    description: >-
      Add a graph input to a MetaSound. Params: assetPath (or metasoundPath),
      name, dataType, defaultValue?
  audio.metasound_add_output:
    class_path: ue-mcp.builtin/audio.metasound_add_output
    group: audio
    description: >-
      Add a graph output to a MetaSound. Params: assetPath (or metasoundPath),
      name, dataType
  audio.metasound_connect:
    class_path: ue-mcp.builtin/audio.metasound_connect
    group: audio
    description: >-
      Connect one node's output vertex to another node's input vertex. Params:
      assetPath (or metasoundPath), fromNodeId, fromOutput, toNodeId, toInput
  audio.metasound_connect_input:
    class_path: ue-mcp.builtin/audio.metasound_connect_input
    group: audio
    description: >-
      Connect a graph input to a node input vertex. Params: assetPath (or
      metasoundPath), graphInput, toNodeId, toInput
  audio.metasound_connect_output:
    class_path: ue-mcp.builtin/audio.metasound_connect_output
    group: audio
    description: >-
      Connect a node output vertex to a graph output. Params: assetPath (or
      metasoundPath), fromNodeId, fromOutput, graphOutput
  audio.metasound_connect_audio_out:
    class_path: ue-mcp.builtin/audio.metasound_connect_audio_out
    group: audio
    description: >-
      Connect a node output vertex to the source's audio output. Params:
      assetPath (or metasoundPath), fromNodeId, fromOutput, channel?
  audio.metasound_set_default:
    class_path: ue-mcp.builtin/audio.metasound_set_default
    group: audio
    description: >-
      Set a default value on a node input vertex (nodeId + inputName), or on a
      graph input (graphInput). Params: assetPath (or metasoundPath), value,
      dataType?, nodeId?, inputName?, graphInput?
  audio.metasound_read_document:
    class_path: ue-mcp.builtin/audio.metasound_read_document
    group: audio
    description: >-
      Read a MetaSound graph back: document version, declared interfaces, graph
      inputs and outputs with their defaults, variables, every node and every
      connection. This is the verification counterpart to metasound_author, and
      the reason it matters is that the bridge could BUILD a graph and never
      read it, so it could write but not verify or iterate. Reads the asset's
      own document, which is the same one the write actions edit, so there is no
      second unflushed copy that could disagree with it; source and
      hasActiveBuilder report whether a builder is attached to that document.
      Reports pageId and readDefaultPage, falling back to the first page the
      document holds when it declares none under the default page id. Node ids
      match what metasound_add_node returned. Params: assetPath (or
      metasoundPath), pageId?, includeNodes?, includeConnections?
  audio.metasound_list_connections:
    class_path: ue-mcp.builtin/audio.metasound_list_connections
    group: audio
    description: >-
      List every edge in the graph, each reported using the exact field names
      metasound_connect takes (fromNodeId, fromOutput, toNodeId, toInput), so a
      listed connection can be echoed straight back as a call payload. Use it to
      see what is already wired before adding more. Malformed edges are counted
      separately rather than silently dropped. Params: assetPath (or
      metasoundPath), pageId?, nodeId?, direction?, dataType?
  audio.metasound_list_variables:
    class_path: ue-mcp.builtin/audio.metasound_list_variables
    group: audio
    description: >-
      List the graph's variables with data type, initial value, the node that
      sets each one and the node ids that read it, so a variable can be followed
      to the wiring that consumes it. Most graphs declare none, which is normal
      rather than a fault. Params: assetPath (or metasoundPath), pageId?,
      filter?
  audio.metasound_search_nodes:
    class_path: ue-mcp.builtin/audio.metasound_search_nodes
    group: audio
    description: >-
      Find node INSTANCES inside one existing graph, by name, class, namespace,
      variant, data type or class type. This is the step between reading a
      document and acting on a node. Distinct from metasound_list_node_classes,
      which lists classes you could add rather than nodes already present.
      Params: assetPath (or metasoundPath), pageId?, query?, dataType?,
      classType?, limit?
  audio.metasound_inspect_node:
    class_path: ue-mcp.builtin/audio.metasound_inspect_node
    group: audio
    description: >-
      Inspect one node in full: its class identity in metasound_add_node's own
      parameter names, every input and output vertex with data type, default and
      connection state, and the incoming and outgoing edges named by node. A
      wrong nodeId comes back with the valid ones rather than a bare failure.
      Params: assetPath (or metasoundPath), nodeId, pageId?
  audio.metasound_list_node_pins:
    class_path: ue-mcp.builtin/audio.metasound_list_node_pins
    group: audio
    description: >-
      List just a node's input and output vertices with their types, connection
      state and set defaults, plus a count of unconnected inputs. The lean way
      to get the exact vertex names metasound_connect and
      metasound_set_input_default require, without reading the whole document.
      Params: assetPath (or metasoundPath), nodeId, pageId?, direction?,
      dataType?
  audio.metasound_validate:
    class_path: ue-mcp.builtin/audio.metasound_validate
    group: audio
    description: >-
      Diagnose a MetaSound graph and report actionable problems: undriven graph
      outputs, orphaned nodes, dead-end nodes, unconnected Trigger and Audio
      inputs, cross-type edges, dangling edges, and unread or unwritten
      variables. Returns problems[] naming the node and the call that fixes it,
      plus runnable. This is what catches the graph that builds successfully and
      then plays silence. Params: assetPath (or metasoundPath), pageId?
  audio.metasound_build:
    class_path: ue-mcp.builtin/audio.metasound_build
    group: audio
    description: >-
      SAVE the MetaSound asset to disk. Despite the name this compiles nothing
      and flushes nothing: every authoring action writes straight into the
      asset's own document, so what this adds is persistence, and it is what
      makes edits survive an editor restart. A read does not need it, since the
      reads see the same document. Params: assetPath (or metasoundPath)
  audio.metasound_remove_node:
    class_path: ue-mcp.builtin/audio.metasound_remove_node
    group: audio
    description: >-
      Remove a node from a MetaSound graph, with every edge that touched it.
      Attaches a builder to the asset's own document the way the MetaSound
      editor does, so a MetaSound already on disk, from any editor run, can be
      edited with no create call first. The edit lands in that document and is
      saved, so pendingBuild comes back false and metasound_build is not needed
      after it; source says whether a builder was already attached when the call
      arrived. Idempotent: alreadyDeleted=true when the id is not in the graph,
      and the miss lists the ids that are. Params: assetPath (or metasoundPath),
      nodeId, removeUnusedDependencies?
  audio.metasound_disconnect:
    class_path: ue-mcp.builtin/audio.metasound_disconnect
    group: audio
    description: >-
      Cut MetaSound edges: the inverse of all four connect actions in one call,
      because they all reduce to the same two builder handles. Four addressing
      forms - all of fromNodeId, fromOutput, toNodeId and toInput drops that one
      edge and is the only form with an exact rollback; toNodeId plus toInput
      alone clears whatever drives that input; fromNodeId plus fromOutput alone
      clears every edge leaving that output; graphOutput clears what drives a
      graph output, which is also how an audio output is cleared since the audio
      outs are graph outputs named 'Out Mono', 'Out Left' and 'Out Right'.
      metasound_list_connections reports edges in these exact field names. Works
      on any MetaSound asset on disk, with no create call first, and saves the
      document it edited. Idempotent: alreadyDisconnected=true when nothing was
      connected there. Params: assetPath (or metasoundPath), fromNodeId?,
      fromOutput?, toNodeId?, toInput?, graphOutput?
  audio.metasound_remove_member:
    class_path: ue-mcp.builtin/audio.metasound_remove_member
    group: audio
    description: >-
      Remove a graph input, graph output or variable: the inverse of
      metasound_add_input and metasound_add_output, and the only removal path
      for a variable. Works on any MetaSound asset on disk, with no create call
      first, and saves the document it edited. The miss lists the members that
      do exist, and the result carries the removed member's dataType so the
      rollback can restore it. Note that every edge the member drove is cut with
      it, so read them with metasound_list_connections first if they matter.
      Idempotent: alreadyDeleted=true when the member is absent. Params:
      assetPath (or metasoundPath), memberKind, name
  audio.metasound_rename_member:
    class_path: ue-mcp.builtin/audio.metasound_rename_member
    group: audio
    description: >-
      Rename a graph input or output on any MetaSound asset on disk, with no
      create call first, saving the document it edited. Not a property write:
      the rename rewires the template nodes that stand in for the member inside
      the graph, which a direct document write would leave dangling. Both names
      are checked first, so renaming onto an existing name is refused with the
      list rather than colliding, and a replay where the new name is already
      present reports unchanged=true. The inverse is the same call with the
      names swapped. Params: assetPath (or metasoundPath), memberKind, name,
      newName
  audio.cue_author:
    class_path: ue-mcp.builtin/audio.cue_author
    group: audio
    description: >-
      PREFERRED: create a SoundCue and stamp its whole node tree in ONE call.
      Each element reports ok/error; links + saves at the end. Params: name,
      packagePath?, onConflict?, nodes?, connections?, root?
  audio.create_cue:
    class_path: ue-mcp.builtin/audio.create_cue
    group: audio
    description: >-
      Create an empty SoundCue. Add a wave with cue_add_node, or prefer
      cue_author for a whole graph. Params: name, packagePath?, onConflict?
  audio.cue_add_node:
    class_path: ue-mcp.builtin/audio.cue_add_node
    group: audio
    description: >-
      Add a node to a SoundCue graph. Returns nodeId. Params: cuePath (or
      assetPath), nodeType, soundWavePath?, properties?
  audio.cue_connect:
    class_path: ue-mcp.builtin/audio.cue_connect
    group: audio
    description: >-
      Connect a SoundCue node as a child of another (or as the cue root).
      Params: cuePath (or assetPath), childNodeId, parentNodeId?, childIndex?
  audio.cue_get_graph:
    class_path: ue-mcp.builtin/audio.cue_get_graph
    group: audio
    description: >-
      Read a SoundCue node graph: nodes (id, type, children) and root. Params:
      cuePath (or assetPath)
  audio.cue_remove_node:
    class_path: ue-mcp.builtin/audio.cue_remove_node
    group: audio
    description: >-
      Remove a node from a SoundCue: detach it from every parent, drop its
      paired editor graph node, and clear the cue root if it was the root. Its
      own children are ORPHANED rather than deleted, because they are separate
      nodes the caller may still want and an unasked-for cascade is the harder
      failure to recover from; they come back in orphanedChildren. Warns when
      the cue is left with no root, since the cue then plays nothing.
      Idempotent: alreadyDeleted=true when the id is not in the cue, and the
      miss lists the ids that are. Params: cuePath (or assetPath), nodeId
  audio.cue_disconnect:
    class_path: ue-mcp.builtin/audio.cue_disconnect
    group: audio
    description: >-
      Detach a SoundCue child from its parent: the inverse of cue_connect. With
      parentNodeId it removes that one link; without, it removes the child from
      every parent. clearRoot=true unsets the cue root instead, which is the
      inverse of a cue_connect that named no parent. Idempotent:
      alreadyDisconnected=true when the link was not there. Params: cuePath (or
      assetPath), childNodeId?, parentNodeId?, clearRoot?
  audio.create_submix:
    class_path: ue-mcp.builtin/audio.create_submix
    group: audio
    description: >-
      Create a USoundSubmix, optionally parented. Params: name, packagePath?,
      onConflict?, parentPath?, outputVolume?, wetLevel?, dryLevel?
  audio.set_submix_parent:
    class_path: ue-mcp.builtin/audio.set_submix_parent
    group: audio
    description: >-
      Reparent a submix (sets ParentSubmix, updating both ends). Params:
      submixPath, parentPath?
  audio.add_submix_effect:
    class_path: ue-mcp.builtin/audio.add_submix_effect
    group: audio
    description: >-
      Append a submix effect preset to a submix's effect chain (creates the
      preset asset). Params: submixPath, effectType, name?, packagePath?,
      settings?
  audio.create_sound_class:
    class_path: ue-mcp.builtin/audio.create_sound_class
    group: audio
    description: >-
      Create a USoundClass, optionally parented, with properties. Params: name,
      packagePath?, onConflict?, properties?, parentPath?
  audio.set_sound_class_parent:
    class_path: ue-mcp.builtin/audio.set_sound_class_parent
    group: audio
    description: >-
      Reparent a sound class through USoundClass::SetParentClass, which is the
      call that keeps all three sides consistent: ParentClass on the child,
      ChildClasses on the new parent, and the removal from the old parent's
      list. Writing ParentClass with a property setter produces a class the
      audio engine walks up from and the mixer never walks down to, which is why
      this is a handler. An empty parentPath detaches to the root, and a parent
      already below this class is refused as a cycle. Reports listedOnParent,
      read back from the other end. Params: soundClassPath (or assetPath),
      parentPath?
  audio.read_sound_routing:
    class_path: ue-mcp.builtin/audio.read_sound_routing
    group: audio
    description: >-
      Read where a sound actually goes: its sound class chain up to the root and
      its submix chain up to the master, each entry with its objectPath, plus
      submix sends, attenuation, concurrency, and problems[] naming the calls
      that fix them. This is the verification half of set_sound_submix,
      add_sound_submix_send, set_sound_class, set_sound_attenuation and
      set_sound_concurrency, which could all assign routing and none of which
      could read it back. Catches the cases that make a correctly authored mix
      silent anyway: a sound class at volume 0, a send at level 0, a duplicate
      send (add_sound_submix_send appends without checking), an attenuation with
      a falloff distance and bAttenuate off, a concurrency with MaxCount 0, and
      a cycle in either chain. Params: soundPath (or assetPath)
  audio.create_sound_mix:
    class_path: ue-mcp.builtin/audio.create_sound_mix
    group: audio
    description: >-
      Create a USoundMix with sound-class adjusters. Params: name, packagePath?,
      onConflict?, fadeInTime?, fadeOutTime?, adjusters?
  audio.create_concurrency:
    class_path: ue-mcp.builtin/audio.create_concurrency
    group: audio
    description: >-
      Create a USoundConcurrency asset. Params: name, packagePath?, onConflict?,
      maxCount?, limitToOwner?, volumeScale?, resolutionRule?
  audio.create_attenuation:
    class_path: ue-mcp.builtin/audio.create_attenuation
    group: audio
    description: >-
      Create a USoundAttenuation asset from a settings struct, with
      falloffDistance, spatialize and enableOcclusion as shortcuts over it.
      Params: name, packagePath?, onConflict?, settings?, falloffDistance?,
      spatialize?, enableOcclusion?
  audio.set_sound_submix:
    class_path: ue-mcp.builtin/audio.set_sound_submix
    group: audio
    description: >-
      Set a sound's base submix (routing target). Params: soundPath (or
      assetPath), submixPath?
  audio.add_sound_submix_send:
    class_path: ue-mcp.builtin/audio.add_sound_submix_send
    group: audio
    description: >-
      Add a submix send to a sound. Params: soundPath (or assetPath),
      submixPath, sendLevel?
  audio.set_sound_class:
    class_path: ue-mcp.builtin/audio.set_sound_class
    group: audio
    description: >-
      Assign a sound class to a sound. Params: soundPath (or assetPath),
      soundClassPath
  audio.set_sound_attenuation:
    class_path: ue-mcp.builtin/audio.set_sound_attenuation
    group: audio
    description: >-
      Attach an attenuation asset to a sound. Params: soundPath (or assetPath),
      attenuationPath?
  audio.set_sound_concurrency:
    class_path: ue-mcp.builtin/audio.set_sound_concurrency
    group: audio
    description: >-
      Attach a concurrency asset to a sound. Params: soundPath (or assetPath),
      concurrencyPath?
  audio.set_property:
    class_path: ue-mcp.builtin/audio.set_property
    group: audio
    description: >-
      Set any UPROPERTY on an audio asset by (dotted) name, value as JSON.
      Handles nested structs, arrays, object refs. Params: assetPath,
      propertyName, value
  widget.read_tree:
    class_path: ue-mcp.builtin/widget.read_tree
    group: widget
    description: 'Read widget hierarchy. Params: assetPath (or path, or widgetBlueprintPath)'
  widget.get_details:
    class_path: ue-mcp.builtin/widget.get_details
    group: widget
    description: >-
      Inspect widget (curated subset). Params: assetPath (or path, or
      widgetBlueprintPath), widgetName (or widgetDisplayName)
  widget.get_properties:
    class_path: ue-mcp.builtin/widget.get_properties
    group: widget
    description: >-
      Full reflected property dump for a widget - every UPROPERTY
      (RenderOpacity, Visibility, ColorAndOpacity, Border padding/colors, Image
      brush TintColor/ImageSize, fonts, etc.) plus the slot block, for
      diagnosing visual bugs get_details omits. Pass includeSubtree to also dump
      children (#547). Params: assetPath (or path, or widgetBlueprintPath),
      widgetName (or widgetDisplayName), includeSubtree?
  widget.list_bindings:
    class_path: ue-mcp.builtin/widget.list_bindings
    group: widget
    description: >-
      List designer property bindings on a WidgetBlueprint (the UE 5.7 Python
      API keeps them protected). Returns {widgetName, propertyName,
      functionName, bindingType}. Optional filterWidgetName/filterProperty
      (#530). Params: assetPath (or path, or widgetBlueprintPath),
      filterWidgetName?, filterProperty?
  widget.clear_binding:
    class_path: ue-mcp.builtin/widget.clear_binding
    group: widget
    description: >-
      Remove designer binding(s) matching widgetName (and optional propertyName)
      from a WidgetBlueprint without opening the editor. Idempotent (#530).
      Params: assetPath (or path, or widgetBlueprintPath), widgetName (or
      widgetDisplayName), propertyName?
  widget.set_property:
    class_path: ue-mcp.builtin/widget.set_property
    group: widget
    description: >-
      Set widget property. Slot struct props take UE struct text that persists
      every field - `Slot.Size`=`(Value=1.0,SizeRule=Fill)`,
      `Slot.Padding`=`(Left=8,Top=8,Right=8,Bottom=8)` - or a nested field path
      like `Slot.Size.Value` / `Slot.Padding.Left`; an invalid value errors
      instead of silently writing 0 (#532). Params: assetPath (or path, or
      widgetBlueprintPath), widgetName (or widgetDisplayName), propertyName,
      value (or propertyValue)
  widget.set_style:
    class_path: ue-mcp.builtin/widget.set_style
    group: widget
    description: >-
      Set a full/nested style struct on a widget from JSON (FButtonStyle,
      FEditableTextBoxStyle, FSlateFontInfo, FSlateColor and their nested
      brushes) - what set_property's scalar path can't express. value is a JSON
      object mirroring the struct; propertyName is the struct property, e.g.
      WidgetStyle (#563). Params: assetPath (or path, or widgetBlueprintPath),
      widgetName (or widgetDisplayName), propertyName, value
  widget.reorder_child:
    class_path: ue-mcp.builtin/widget.reorder_child
    group: widget
    description: >-
      Reorder a widget among its parent panel's children (move to a sibling
      index) - e.g. insert a new row BETWEEN two existing children. move_widget
      only reparents (#635). Params: assetPath (or path, or
      widgetBlueprintPath), widgetName (or widgetDisplayName), index
  widget.bulk_set_properties:
    class_path: ue-mcp.builtin/widget.bulk_set_properties
    group: widget
    description: >-
      Apply many {widgetName, propertyName, value} style/property writes to a
      WidgetBlueprint in one call (single compile+save) - font/color/style
      stylesheet across many widgets (#563). Params: assetPath (or path, or
      widgetBlueprintPath), properties
  widget.list:
    class_path: ue-mcp.builtin/widget.list
    group: widget
    description: >-
      List Widget BPs, sorted by object path. Params: recursive?, cursor?,
      limit?
  widget.read_animations:
    class_path: ue-mcp.builtin/widget.read_animations
    group: widget
    description: 'Read UMG animations. Params: assetPath (or path, or widgetBlueprintPath)'
  widget.create_animation:
    class_path: ue-mcp.builtin/widget.create_animation
    group: widget
    description: >-
      Create a UMG animation on a Widget Blueprint, with its MovieScene, display
      rate and playback range. Idempotent by animationName: a second call
      reports existed and leaves the timing alone. Params: assetPath (or path,
      or widgetBlueprintPath), animationName, durationSeconds?, displayRate?,
      displayLabel?
  widget.delete_animation:
    class_path: ue-mcp.builtin/widget.delete_animation
    group: widget
    description: >-
      Delete a UMG animation from a Widget Blueprint, including its bindings.
      The rollback recreates an empty animation of the same name and rate, so
      the tracks and keys are NOT restored. Params: assetPath (or path, or
      widgetBlueprintPath), animationName
  widget.get_animation:
    class_path: ue-mcp.builtin/widget.get_animation
    group: widget
    description: >-
      Read one UMG animation in full: display rate, tick resolution, playback
      range, and per bound widget every track, section, channel and key
      time/value in SECONDS, plus the event tracks. read_animations reports the
      shape, this reports the values, which is what verifies a key actually
      landed. Params: assetPath (or path, or widgetBlueprintPath), animationName
  widget.add_animation_track:
    class_path: ue-mcp.builtin/widget.add_animation_track
    group: widget
    description: >-
      Add a property track to a UMG animation, binding the widget into the
      animation first if it is not bound yet. The track class is chosen from the
      property's own reflected type; a property Sequencer cannot key is refused
      by name with the keyable types listed. Params: assetPath (or path, or
      widgetBlueprintPath), animationName, widgetName (or widgetDisplayName),
      propertyName
  widget.remove_animation_track:
    class_path: ue-mcp.builtin/widget.remove_animation_track
    group: widget
    description: >-
      Remove a property track from a UMG animation. The rollback re-adds the
      empty track, so its keys are NOT restored. Params: assetPath (or path, or
      widgetBlueprintPath), animationName, widgetName (or widgetDisplayName),
      propertyName
  widget.add_animation_key:
    class_path: ue-mcp.builtin/widget.add_animation_key
    group: widget
    description: >-
      Set a key on an animation track channel at a time in SECONDS, creating the
      track and the section if needed. Pick the channel by name (R/G/B/A,
      Left/Top/Right/Bottom, Translation.X) or by channelIndex; a miss lists the
      channels the section actually has. Params: assetPath (or path, or
      widgetBlueprintPath), animationName, widgetName (or widgetDisplayName),
      propertyName, time, value, channel?, channelIndex?, interpolation?
  widget.remove_animation_key:
    class_path: ue-mcp.builtin/widget.remove_animation_key
    group: widget
    description: >-
      Remove the key at a time in SECONDS from an animation track channel.
      Removing a key that is not there reports unchanged rather than failing.
      Params: assetPath (or path, or widgetBlueprintPath), animationName,
      widgetName (or widgetDisplayName), propertyName, time, channel?,
      channelIndex?
  widget.add_animation_event_key:
    class_path: ue-mcp.builtin/widget.add_animation_event_key
    group: widget
    description: >-
      Add an event key that calls a Widget Blueprint function at a time in
      SECONDS, creating the event track and its trigger section if needed.
      trackName defaults to Events. Params: assetPath (or path, or
      widgetBlueprintPath), animationName, functionName, time?, trackName?
  widget.remove_animation_event_key:
    class_path: ue-mcp.builtin/widget.remove_animation_event_key
    group: widget
    description: >-
      Remove the event key at a time in SECONDS from an animation event track.
      Params: assetPath (or path, or widgetBlueprintPath), animationName, time?,
      trackName?
  widget.bind_animation_event:
    class_path: ue-mcp.builtin/widget.bind_animation_event
    group: widget
    description: >-
      Bind an animation lifecycle event (Finished or Started) on a Widget
      Blueprint to a handler graph, creating the K2Node_WidgetAnimationEvent if
      it is not there. userTag scopes a Started binding. Idempotent: an existing
      binding reports existed. Params: assetPath (or path, or
      widgetBlueprintPath), animationName, event?, userTag?
  widget.unbind_animation_event:
    class_path: ue-mcp.builtin/widget.unbind_animation_event
    group: widget
    description: >-
      Remove an animation lifecycle event binding from a Widget Blueprint.
      Params: assetPath (or path, or widgetBlueprintPath), animationName,
      event?, userTag?
  widget.set_navigation:
    class_path: ue-mcp.builtin/widget.set_navigation
    group: widget
    description: >-
      Write UMG navigation rules on a widget: rule is Escape, Explicit, Wrap,
      Stop, Custom or CustomBoundary, direction is Up, Down, Left, Right, Next
      or Previous, and widgetToFocus names the target for Explicit. Creates the
      UWidgetNavigation subobject that set_property cannot make. Pass one write
      as widgetName + direction + rule, or many as rules[] of {widgetName,
      direction, rule, widgetToFocus}; the whole batch is validated before
      anything is written. Params: assetPath (or path, or widgetBlueprintPath),
      rules OR widgetName (or widgetDisplayName), direction?, rule?,
      widgetToFocus?
  widget.clear_navigation:
    class_path: ue-mcp.builtin/widget.clear_navigation
    group: widget
    description: >-
      Reset navigation rules on a widget back to Escape. Omit direction to clear
      all six. Clearing what is already clear reports unchanged. Params:
      assetPath (or path, or widgetBlueprintPath), widgetName (or
      widgetDisplayName), direction?
  widget.restore_navigation:
    class_path: ue-mcp.builtin/widget.restore_navigation
    group: widget
    description: >-
      Restore navigation rules from a captured snapshot - the `previous` array
      that set_navigation and clear_navigation put in their rollback payload, so
      a failed flow can be undone by hand as well as by the runner. Params:
      assetPath (or path, or widgetBlueprintPath), previous
  widget.audit_focus_chain:
    class_path: ue-mcp.builtin/widget.audit_focus_chain
    group: widget
    description: >-
      Read-only report over the whole widget tree: which widgets can take focus,
      their explicit navigation edges, widgets reachable from none of them,
      edges pointing at a missing/invisible/unfocusable target, and directions
      whose opposite does not lead back. Params: assetPath (or path, or
      widgetBlueprintPath)
  widget.audit_accessibility:
    class_path: ue-mcp.builtin/widget.audit_accessibility
    group: widget
    description: >-
      Read-only accessibility report over the whole widget tree: font sizes
      under minFontSize, interactive widgets whose authored hit area is under
      minHitSize, and what could not be checked from authored values alone.
      Params: assetPath (or path, or widgetBlueprintPath), minFontSize?,
      minHitSize?
  widget.get_runtime_focus_path:
    class_path: ue-mcp.builtin/widget.get_runtime_focus_path
    group: widget
    description: >-
      Read the live Slate focus path for a user index in PIE - which widget
      holds focus and the chain of widgets above it. Requires a running PIE or
      Game world; the editor's own focus is never reported. Params: userIndex?
  widget.set_runtime_focus:
    class_path: ue-mcp.builtin/widget.set_runtime_focus
    group: widget
    description: >-
      Give keyboard focus to a named child of a live PIE widget, so a navigation
      chain can be walked and verified rather than predicted. Locate the host
      with className when more than one instance is up. Setting focus where it
      already is reports unchanged. Params: widgetName (or widgetDisplayName),
      userIndex?, className?
  widget.create:
    class_path: ue-mcp.builtin/widget.create
    group: widget
    description: >-
      Create Widget BP. assetPath is the full destination, e.g.
      /Game/UI/WBP_Example; name + packagePath is the older spelling of the same
      thing. Idempotent by path. Params: at least one of assetPath (or path, or
      widgetBlueprintPath)/name, packagePath?, parentClass?, onConflict?
  widget.create_utility_widget:
    class_path: ue-mcp.builtin/widget.create_utility_widget
    group: widget
    description: >-
      Create editor utility widget. assetPath is the full destination; name +
      packagePath is the older spelling. Idempotent by path. Params: at least
      one of assetPath (or path, or widgetBlueprintPath)/name, packagePath?,
      onConflict?
  widget.run_utility_widget:
    class_path: ue-mcp.builtin/widget.run_utility_widget
    group: widget
    description: >-
      Open editor utility widget. Params: assetPath (or path, or
      widgetBlueprintPath)
  widget.create_utility_blueprint:
    class_path: ue-mcp.builtin/widget.create_utility_blueprint
    group: widget
    description: >-
      Create editor utility blueprint. assetPath is the full destination; name +
      packagePath is the older spelling. Idempotent by path. Params: at least
      one of assetPath (or path, or widgetBlueprintPath)/name, packagePath?,
      onConflict?
  widget.run_utility_blueprint:
    class_path: ue-mcp.builtin/widget.run_utility_blueprint
    group: widget
    description: >-
      Run editor utility blueprint. Params: assetPath (or path, or
      widgetBlueprintPath)
  widget.add_widget:
    class_path: ue-mcp.builtin/widget.add_widget
    group: widget
    description: >-
      Add widget to widget tree. Idempotent by assetPath + widgetName: passing
      widgetName makes a retry safe, and the result carries
      requestedWidgetName/persistedWidgetName/renamed plus compileStatus.
      Params: assetPath (or path, or widgetBlueprintPath), widgetClass (or
      typeName), widgetName? (or name, or widgetDisplayName), parentWidgetName?
      (or parentWidget)
  widget.remove_widget:
    class_path: ue-mcp.builtin/widget.remove_widget
    group: widget
    description: >-
      Remove widget from tree. Idempotent, and clears the widget's Widget
      Blueprint GUID metadata so later compiles stop reporting a deleted
      variable (#799). Params: assetPath (or path, or widgetBlueprintPath),
      widgetName (or widgetDisplayName)
  widget.move_widget:
    class_path: ue-mcp.builtin/widget.move_widget
    group: widget
    description: >-
      Reparent widget. Params: assetPath (or path, or widgetBlueprintPath),
      widgetName (or widgetDisplayName), newParentWidgetName (or
      parentWidgetName, or parentWidget)
  widget.set_root:
    class_path: ue-mcp.builtin/widget.set_root
    group: widget
    description: >-
      Replace WBP root with an existing widget by name (#365). Params: assetPath
      (or path, or widgetBlueprintPath), widgetName (or widgetDisplayName)
  widget.wrap_root:
    class_path: ue-mcp.builtin/widget.wrap_root
    group: widget
    description: >-
      Wrap the current root in a new panel widget (UMG 'Wrap With').
      wrapperClass must be a UPanelWidget subclass (#365). Params: assetPath (or
      path, or widgetBlueprintPath), wrapperClass (or widgetClass), wrapperName?
  widget.list_classes:
    class_path: ue-mcp.builtin/widget.list_classes
    group: widget
    description: >-
      List the UWidget classes this editor has loaded, grouped by the module
      that defines them, each with its full path, parent class, whether it is a
      panel that accepts children, and the slot properties its children take.
      This is how a CommonUI or project-C++ widget is discovered: pass a row's
      `name` to add_widget as widgetClass, or its `path` when two modules share
      a name. Loaded classes only, so a Widget Blueprint nothing has opened is
      absent (use list) and a class from a disabled plugin does not exist until
      project(enable_plugin) and a restart. Params: filter?, module?,
      includeAbstract?, includeBlueprint?, cursor?, limit?
  widget.get_bind_widget_contract:
    class_path: ue-mcp.builtin/widget.get_bind_widget_contract
    group: widget
    description: >-
      Report the BindWidget contract a native UserWidget parent imposes: every
      UPROPERTY marked BindWidget, BindWidgetOptional, BindWidgetAnim or
      BindWidgetAnimOptional, with the exact widget name it demands, the class
      that name must be, whether it is optional, and which ancestor declares it.
      Metadata is not a property value and reflect_class does not report these
      keys, so this is the only way to learn the contract short of a failed
      compile. Pass className for the contract alone, or assetPath to also check
      one Widget Blueprint's own tree against its parent and get back
      satisfied/missing/wrongType. Params: at least one of className/assetPath
      (or path, or widgetBlueprintPath)
  widget.audit_commonui:
    class_path: ue-mcp.builtin/widget.audit_commonui
    group: widget
    description: >-
      Read-only CommonUI wiring report. Checks the rules that fail silently at
      runtime rather than at compile time: the plugin being enabled at all,
      GameViewportClientClass being a CommonGameViewportClient (without it
      gamepad navigation and Back do nothing), CommonInputSettings.InputData
      being set (without it no input action resolves and bound action bars
      render empty) and, when assetPath names a Widget Blueprint, an activatable
      widget with no DesiredFocusWidget, a CommonBoundActionBar with no
      ActionButtonClass, and CommonUI widgets with no Style. Every problem
      carries the exact call that fixes it. Params: assetPath? (or path, or
      widgetBlueprintPath)
  widget.extract_subtree:
    class_path: ue-mcp.builtin/widget.extract_subtree
    group: widget
    description: >-
      Lift an authored designer subtree out of one WidgetBlueprint into a
      standalone one, using UMG's own clipboard serializer so hierarchy, child
      order, editable properties, panel slot data and named-slot content
      survive. The selected widget becomes the destination root. dryRun defaults
      to true and only returns the name mapping - pass dryRun=false to actually
      write the asset. The destination must be absent or empty; an exact-shape
      replay returns existed. The source is never compiled or saved. Params:
      sourceAssetPath (or sourcePath), sourceWidgetName (or widgetName, or
      widgetDisplayName), destinationAssetPath (or destinationPath),
      destinationParentClass?, destinationRootName?, dryRun?
  widget.list_runtime:
    class_path: ue-mcp.builtin/widget.list_runtime
    group: widget
    description: >-
      (#160) List live UUserWidget instances in the PIE world, sorted by object
      path. Params: classFilter?, namePrefix?, viewportOnly?, cursor?, limit?
  widget.get_runtime:
    class_path: ue-mcp.builtin/widget.get_runtime
    group: widget
    description: >-
      (#160) Inspect a live PIE widget tree with text/visibility/brush/percent
      plus style values: renderOpacity (all), colorAndOpacity (TextBlock/Image),
      Border brushColor/contentColorAndOpacity (#592). includeLayout adds
      read-only layout diagnostics to every node - geometry
      (desired/local/absolute size, layout and render bounds), render transform,
      effective opacity, reflected slot properties including structured Canvas
      anchors/offsets/alignment, derived clipping, parent and viewport overlap,
      and a diagnostics array - plus the host UserWidget node under `host`, a
      `layoutCapture` summary, and per-node `deltaSincePreviousCapture` against
      the previous includeLayout call on that instance, so capture / reproduce /
      capture again isolates position-dependent sizing. Off by default: it is a
      much larger payload. A given widgetName and className must both match.
      Params: at least one of widgetName (or widgetDisplayName)/className,
      childName?, maxDepth?, includeLayout?
  widget.inspect_runtime_instances:
    class_path: ue-mcp.builtin/widget.inspect_runtime_instances
    group: widget
    description: >-
      Inspect every matching live widget instance (never an implicit first
      match), with stable identity/owning-player metadata and selected reflected
      properties on the widget or subtree. Requires a running PIE/Game world and
      errors instead of falling back to the editor world. Passing childName or
      childClassFilter implies includeSubtree. Provide widgetName or
      classFilter. Params: widgetName? (or widgetDisplayName), classFilter?,
      propertyNames?, includeSubtree?, childName?, childClassFilter?,
      viewportOnly?, world?, pieInstance?, maxInstances?, maxNodesPerInstance?
  widget.get_runtime_delegates:
    class_path: ue-mcp.builtin/widget.get_runtime_delegates
    group: widget
    description: >-
      (#161) Read delegate binding state on a live PIE widget, located by
      widgetName or className. Returns array of {delegateName, isBound,
      numBindings}. Params: widgetName? (or widgetDisplayName), className?
  widget.add_to_viewport:
    class_path: ue-mcp.builtin/widget.add_to_viewport
    group: widget
    description: >-
      (#602) Instantiate a WidgetBlueprint and add it to the live PIE viewport
      for visual verification. Requires PIE running. Params: assetPath (or path,
      or widgetBlueprintPath), zOrder?
  widget.invoke_runtime_function:
    class_path: ue-mcp.builtin/widget.invoke_runtime_function
    group: widget
    description: >-
      (#559/#812) Fire a UI interaction on a live PIE widget: a parameterless
      UFUNCTION (functionName) on the located UserWidget, OR drive an
      interactive child via childName - Button (click), CheckBox (value
      true/false/toggle), Slider and SpinBox (numeric value),
      EditableText/EditableTextBox/MultiLineEditableText/MultiLineEditableTextBox
      (string value), ComboBoxString (option string or index). The matching
      delegate is broadcast so bound Blueprint logic runs. functionName
      alongside childName picks the delegate (e.g. OnPressed, OnTextChanged).
      Locate the widget with widgetName or className. Params: at least one of
      widgetName (or widgetDisplayName)/className, functionName?, childName?,
      value?, commitMethod?
  widget.epic_add_uicomponent:
    class_path: ue-mcp.builtin/widget.epic_add_uicomponent
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Adds a UI component of the given class to the
      named widget. Params: widgetBlueprint, widgetName, componentClass
  widget.epic_add_widget:
    class_path: ue-mcp.builtin/widget.epic_add_widget
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Adds a widget to the tree at the specified
      position. Returns full widget info including Slot pointer. When
      ParentWidget is null and no root exists, the new widget becomes the root
      of the tree. Use ObjectTools.list_properties on the returned Widget and
      Slot to get property names before calling set_properties. Params:
      widgetBlueprint, widgetClass, widgetDisplayName, parentWidget?,
      childIndex?
  widget.epic_bind_to_event_property:
    class_path: ue-mcp.builtin/widget.epic_bind_to_event_property
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Adds a Blueprint event handler graph node
      bound to a widget's multicast delegate event, Typical events:
      UButton::OnClicked / OnPressed / OnReleased / OnHovered / OnUnhovered,
      UCheckBox::OnCheckStateChanged, USlider::OnValueChanged. The matching
      delegate UPROPERTY must exist on PropertyClass (or a parent of it).
      Preconditions: - PropertyName must exist in the blueprint. - PropertyClass
      must be the widget's class (or a parent class) that declares the delegate.
      Params: widgetBlueprint, eventName, propertyName, propertyClass
  widget.epic_click:
    class_path: ue-mcp.builtin/widget.epic_click
    group: widget
    description: >-
      [Epic SlateInspectorToolset.SlateInspectorToolset] Click a Slate widget
      identified by its ref. Params: ref, button?, doubleClick?, modifiers?
  widget.epic_compile_widget_blueprint:
    class_path: ue-mcp.builtin/widget.epic_compile_widget_blueprint
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Compiles a widget blueprint. Returns false
      with error details if compilation fails. Errors include missing BindWidget
      bindings, type mismatches, and graph errors. Call after all widgets and
      properties are set. Save separately via AssetTools.save_asset. Params:
      widgetBlueprint
  widget.epic_create_widget_blueprint:
    class_path: ue-mcp.builtin/widget.epic_create_widget_blueprint
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Creates a new Widget Blueprint asset. Returns
      the blueprint or nullptr on failure. Params: folderPath, assetName,
      parentClass
  widget.epic_drag:
    class_path: ue-mcp.builtin/widget.epic_drag
    group: widget
    description: >-
      [Epic SlateInspectorToolset.SlateInspectorToolset] Drag from one Slate
      widget to another (mouse down, move, release). Params: startRef, endRef,
      modifiers?
  widget.epic_fill_form:
    class_path: ue-mcp.builtin/widget.epic_fill_form
    group: widget
    description: >-
      [Epic SlateInspectorToolset.SlateInspectorToolset] Fill multiple Slate
      form fields at once. Params: fields
  widget.epic_get_named_slots:
    class_path: ue-mcp.builtin/widget.epic_get_named_slots
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Returns named slot bindings (separate from
      tree hierarchy). Params: widgetBlueprint
  widget.epic_get_widget_class_info:
    class_path: ue-mcp.builtin/widget.epic_get_widget_class_info
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Returns the Category, Description and if it's
      a Panel for a single widget class. Same per-entry data as
      ListWidgetClasses, but lets callers query a class they already have
      without scanning every UClass. Returns an empty entry if WidgetClass is
      null. Can be used to get more information on the class from the
      Description and Category. Params: widgetClass
  widget.epic_get_widget_description:
    class_path: ue-mcp.builtin/widget.epic_get_widget_description
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Full property dump of every widget in the
      tree. Each line: [N] Type Name Prop:Value ... slot:(SlotProp:Value ...) N
      is the 0-based index into result.Widgets -- use result.Widgets[N] to get
      the widget ref without text parsing. Same indentation format as
      GetTaggedWidgetDescription; richer per-widget detail. Params:
      widgetBlueprint, startWidget?, maxDepth?
  widget.epic_get_widget_tree_depth:
    class_path: ue-mcp.builtin/widget.epic_get_widget_tree_depth
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Returns the maximum depth of the widget tree.
      Depth: root with no children = 0; root + children = 1; etc. Params:
      widgetBlueprint, startWidget?
  widget.epic_get_widgets:
    class_path: ue-mcp.builtin/widget.epic_get_widgets
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Returns blueprint info and all widgets in
      depth-first order. Children within each parent are in their panel slot
      order - this is the hierarchy order shown in the designer. Info contains
      ParentClass (pass to CreateWidgetBlueprint) and RootWidgetClass. Use
      ObjectTools.list_properties on each returned Widget and Slot to get
      property names before calling set_properties. Params: widgetBlueprint
  widget.epic_hover:
    class_path: ue-mcp.builtin/widget.epic_hover
    group: widget
    description: >-
      [Epic SlateInspectorToolset.SlateInspectorToolset] Hover over a Slate
      widget, triggering any hover state or tooltip. Params: ref
  widget.epic_list_observers:
    class_path: ue-mcp.builtin/widget.epic_list_observers
    group: widget
    description: >-
      [Epic SlateInspectorToolset.SlateInspectorToolset] List all active
      observers as a JSON array for debugging. Each entry includes the observer
      identifier, whether it is the root observer, the root widget ref (if any),
      max depth, and cached snapshot size. Params: none
  widget.epic_list_widget_blueprints:
    class_path: ue-mcp.builtin/widget.epic_list_widget_blueprints
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Lists widget blueprints in a content folder.
      Params: folderPath
  widget.epic_list_widget_classes:
    class_path: ue-mcp.builtin/widget.epic_list_widget_classes
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Lists available widget classes, optionally
      filtered by name substring. Params: filter
  widget.epic_move_uicomponent:
    class_path: ue-mcp.builtin/widget.epic_move_uicomponent
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Moves a UI component before or after another
      component on the same widget. Params: widgetBlueprint, widgetName,
      componentClassToMove, relativeToComponentClass, bMoveAfter
  widget.epic_move_widget:
    class_path: ue-mcp.builtin/widget.epic_move_widget
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Moves a widget to a new parent panel at the
      specified position. Returns updated widget info with new Slot. Params:
      widgetBlueprint, widget, newParent, childIndex?
  widget.epic_observe:
    class_path: ue-mcp.builtin/widget.epic_observe
    group: widget
    description: >-
      [Epic SlateInspectorToolset.SlateInspectorToolset] Register an observer on
      a widget subtree so its refs are continuously kept up to date (~100ms
      tick). Call this on the window or panel you are about to work with. It
      ensures new widgets appearing in that subtree are assigned refs
      automatically. Unobserve when you are done. A shallow root observer (depth
      0) already covers top-level windows. Params: ref, maxDepth?
  widget.epic_press_key:
    class_path: ue-mcp.builtin/widget.epic_press_key
    group: widget
    description: >-
      [Epic SlateInspectorToolset.SlateInspectorToolset] Press and release a
      keyboard key on the currently focused Slate widget. Supports modifier
      prefixes: "Ctrl+C", "Shift+1". Params: key
  widget.epic_remove_uicomponent:
    class_path: ue-mcp.builtin/widget.epic_remove_uicomponent
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Removes a UI component of the given class
      from the named widget. Params: widgetBlueprint, widgetName, componentClass
  widget.epic_remove_widget:
    class_path: ue-mcp.builtin/widget.epic_remove_widget
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Removes a widget and its children from the
      tree. Params: widgetBlueprint, widget
  widget.epic_rename_widget:
    class_path: ue-mcp.builtin/widget.epic_rename_widget
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Renames a widget. Returns updated widget info
      or empty on failure. Params: widgetBlueprint, widget, newDisplayName
  widget.epic_replace_widget_with_child:
    class_path: ue-mcp.builtin/widget.epic_replace_widget_with_child
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Replaces a panel widget with its first child,
      removing the panel from the tree. The widget to replace must be a
      UPanelWidget with only one child. Params: widgetBlueprint, widgetToReplace
  widget.epic_replace_widget_with_named_slot:
    class_path: ue-mcp.builtin/widget.epic_replace_widget_with_named_slot
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Replaces a host widget with the content of
      one of its named slots. The host must implement INamedSlotInterface (e.g.,
      a UUserWidget exposing named slots). The slot's content widget is moved up
      to take the host's place in the tree. Params: widgetBlueprint,
      widgetToReplace, namedSlot
  widget.epic_replace_widget_with_template:
    class_path: ue-mcp.builtin/widget.epic_replace_widget_with_template
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Replaces a widget instance in the blueprint's
      widget tree with a new instance created from a different template widget
      class. Preserves references for members that exist on both classes with a
      compatible type/signature: bindings, BP graph variable references,
      animation bindings, and delegate bindings. Members without a compatible
      counterpart on the new class are listed in the returned report; references
      to those members in the outer blueprint will become orphaned graph nodes /
      dangling bindings. Params: widgetBlueprint, widgetToReplace, templateClass
  widget.epic_screenshot:
    class_path: ue-mcp.builtin/widget.epic_screenshot
    group: widget
    description: >-
      [Epic SlateInspectorToolset.SlateInspectorToolset] Screenshot a Slate
      widget or the active editor window. Prefer this over
      SceneTools.take_screenshot for Editor UI; use SceneTools only for 3D
      viewport. Params: ref
  widget.epic_select_option:
    class_path: ue-mcp.builtin/widget.epic_select_option
    group: widget
    description: >-
      [Epic SlateInspectorToolset.SlateInspectorToolset] Select an option in a
      Slate combobox by its text label. Opens the dropdown, finds the matching
      text, and clicks it. Params: ref, value
  widget.epic_set_named_slot_content:
    class_path: ue-mcp.builtin/widget.epic_set_named_slot_content
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Sets content for a named slot. Returns full
      widget info including Slot pointer. Params: widgetBlueprint, hostWidget,
      slotName, widgetClass, widgetName
  widget.epic_snapshot:
    class_path: ue-mcp.builtin/widget.epic_snapshot
    group: widget
    description: >-
      [Epic SlateInspectorToolset.SlateInspectorToolset] Capture a Slate UI
      accessibility snapshot. Use this to read the current widget tree and
      discover refs for action tools (Click, Type, Hover, etc.). A shallow root
      observer (depth 0) covers top-level windows automatically. Before
      interacting with a specific window or panel, call Observe() on it to get
      deep coverage, then Snapshot that subtree to see its contents. Refs
      discovered by a previous Snapshot remain usable. You do NOT need to call
      Snapshot again before every action. Params: ref, maxDepth?,
      bIncludeSourceLocations?
  widget.epic_toggle_widget_as_variable:
    class_path: ue-mcp.builtin/widget.epic_toggle_widget_as_variable
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Sets the bIsVariable flag. Params:
      widgetBlueprint, widget, bIsVariable
  widget.epic_type:
    class_path: ue-mcp.builtin/widget.epic_type
    group: widget
    description: >-
      [Epic SlateInspectorToolset.SlateInspectorToolset] Type text into a Slate
      text input widget. Focuses the widget first, then sends one key event per
      character. Params: ref, text, submit?
  widget.epic_unobserve:
    class_path: ue-mcp.builtin/widget.epic_unobserve
    group: widget
    description: >-
      [Epic SlateInspectorToolset.SlateInspectorToolset] Remove an observer by
      its identifier. Params: identifier
  widget.epic_wait_for:
    class_path: ue-mcp.builtin/widget.epic_wait_for
    group: widget
    description: >-
      [Epic SlateInspectorToolset.SlateInspectorToolset] Check if text is
      present or absent in the Slate widget tree. Non-blocking: checks once and
      returns immediately. Poll to wait. Params: text, textGone
  widget.epic_windows:
    class_path: ue-mcp.builtin/widget.epic_windows
    group: widget
    description: >-
      [Epic SlateInspectorToolset.SlateInspectorToolset] List, select, or close
      top-level Slate editor windows. Params: index?, input? (carries action,
      which cannot be sent at the top level)
  widget.epic_wrap_widgets:
    class_path: ue-mcp.builtin/widget.epic_wrap_widgets
    group: widget
    description: >-
      [Epic UMGToolSet.UMGToolSet] Wraps one or more widgets in a new panel
      widget of the specified class. Only the root-most widgets in the selection
      are wrapped - children of other selected widgets are skipped because their
      parent will be wrapped. Returns info for each newly created wrapper. Use
      ObjectTools.list_properties on each returned Widget and Slot to discover
      property names before calling set_properties (padding, alignment, anchors,
      etc. vary per panel class). Params: widgetBlueprint, widgets, wrapperClass
  editor.start_editor:
    class_path: ue-mcp.builtin/editor.start_editor
    group: editor
    description: >-
      Launch Unreal Editor and BLOCK until it is fully ready (not merely until
      the socket answers), rendering a startup progress bar in the terminal.
      Returns the phase timeline it waited through. Do NOT poll get_engine_state
      or get_status afterwards: this call already waited, and a ready editor is
      the only way it returns success. An editor already running for this
      project is reported as a failure, because this call launched nothing, with
      alreadyRunning=true, bridgeReady, and the port it published, so a caller
      can tell "there was nothing to do" from "the launch broke" without parsing
      the sentence. A flow step that expects that outcome sets ignore_failure:
      true on itself rather than asking this action to call a non-launch a
      launch. dialogPolicy answers startup prompts before they can wedge the
      game thread, which is how the post-crash "Restore Packages" modal used to
      stall a launch (#968). Params: timeout? (seconds, default 300),
      dialogPolicy? ("pattern=response;pattern=response", responses as
      set_dialog_policy takes them)
  editor.get_engine_state:
    class_path: ue-mcp.builtin/editor.get_engine_state
    group: editor
    description: >-
      What the engine is REALLY doing, read from outside the game thread:
      startup phase from the editor's own log, every process holding this
      project's .uproject open (PID, command line, responding), the plugin's
      status snapshot (slow-task name and percent, active modal dialog,
      game-thread stall), and native dialog windows. `running` follows the
      strongest evidence: an editor that answered over the bridge is running
      whatever the process table saw, and a probe that could not run is reported
      as processProbeFailed rather than as an absent editor (#965). Call this
      ONCE when something is already wrong (handlers timing out, an editor that
      will not come up). Never call it in a wait loop: start_editor blocks until
      ready on its own, and polling this during startup burns tokens re-reading
      state that is already tracked. Params: probeWindows? (default true; scans
      native windows, costs ~2s)
  editor.stop_editor:
    class_path: ue-mcp.builtin/editor.stop_editor
    group: editor
    description: >-
      Close Unreal Editor gracefully (asks the editor to quit itself via the
      bridge; never an OS kill). Acts only on the editor for the loaded project,
      resolved from the port lockfile that editor published at
      <project>/Saved/UE_MCP_Bridge/port.json. With no lockfile there is no port
      to aim at and the call refuses, naming the file it checked, rather than
      probing a default port that another project's editor could answer on
      (#819). With no editor of this project running there is nothing to quit,
      and the call fails saying so, with alreadyStopped=true marking that reason
      apart from a running editor that cannot be reached or refuses on unsaved
      work. A flow that stops the editor before building sets ignore_failure:
      true on the stop step. With more than one editor of this project open it
      closes the one the lockfile names and reports the rest under
      remainingInstances, so plain success never has to be read as 'no editor of
      this project is running' (#1072). Unsaved work: the quit is sent and the
      EDITOR decides. It refuses inside the engine and names every dirty package
      without scheduling a close, so nothing is lost and no quit is left
      pending; save them with editor(save_dirty), or close the editor yourself
      and answer its save prompt by hand. There is deliberately no flag that
      discards. This action has no dialog behaviour of its own: a modal blocks
      it exactly as it blocks every other action, refused by the same gate with
      the same fields. Read the dialog with editor(list_dialogs) and answer it
      with editor(respond_to_dialog). Params: none
  editor.restart_editor:
    class_path: ue-mcp.builtin/editor.restart_editor
    group: editor
    description: >-
      Stop then start the editor for the loaded project. Editors for other
      projects are left alone: the stop is aimed by this project's port
      lockfile, and the decision to start is made from the process holding this
      project's .uproject open, never from whether some editor is running
      (#819). The stop half is editor(stop_editor) exactly as it behaves on its
      own, so a restart refuses on unsaved packages and reports them rather than
      acting on them, and an editor that was already down is not a reason to
      refuse the start. Like the stop half it has no dialog behaviour of its
      own: a modal blocks it through the same gate as every other action.
      Params: none
  editor.build_project:
    class_path: ue-mcp.builtin/editor.build_project
    group: editor
    description: >-
      Build the project's C++ out of process with UnrealBuildTool. Works with
      the editor STOPPED, which a full rebuild requires (UBT cannot link while
      an editor holds the module DLLs). Blocks until the build finishes and
      returns the compiler output. Params: configuration? (default Development),
      platform? (default the host platform), clean? (#958)
  editor.execute_command:
    class_path: ue-mcp.builtin/editor.execute_command
    group: editor
    description: 'Run console command. Params: command'
  editor.execute_python:
    class_path: ue-mcp.builtin/editor.execute_python
    group: editor
    description: >-
      GATED LAST RESORT. execute_python is unreachable until a semantic tool
      search over your taskSummary has been run AND every candidate it returns
      is EXPLICITLY ruled out with a stated reason. Flow: (1) call with
      taskSummary (+code) - it returns the candidate actions AND the exact
      ruledOut array to send back; (2) re-call with the same taskSummary/code
      PLUS that ruledOut=[{action, reason}], each reason at least 12 characters
      saying why that candidate does not fit. The action field accepts the bare
      name, tool(action) or tool.action, and rulings are remembered for the
      session so rewording the taskSummary never asks you to justify the same
      action twice. A candidate the running plugin does not register cannot do
      the task, so it needs no ruling: it is listed under notInRunningPlugin
      with the upgrade command instead. Python runs only once every candidate is
      ruled out. Params: code, taskSummary (required), ruledOut?,
      resultVariable? (name of a top-level variable to return as `result`,
      separate from print()/log; #732) (#704, #938, #960, #1167)
  editor.run_python_file:
    class_path: ue-mcp.builtin/editor.run_python_file
    group: editor
    description: >-
      Run a Python file from disk with __file__/__name__ populated (#142). Pass
      entryPoint to load the file WITHOUT firing its `if __name__ == "__main__"`
      guard and then call one named function in it, which is how a Tools/ script
      holding several stages behind a main() is driven a stage at a time; `args`
      are then that call's positional arguments rather than sys.argv, `kwargs`
      its keyword arguments, and its return value comes back as `result` with no
      resultVariable needed. captureLog=false drops everything the script logged
      except its errors, and maxLogChars keeps only the tail: a script that
      prints a few hundred lines otherwise returns tens of KB to a caller that
      wanted one value. (#142/#732/#995) Params: filePath (or path),
      entryPoint?, args?, kwargs?, resultVariable?, captureLog?, maxLogChars?
  editor.purge_python_modules:
    class_path: ue-mcp.builtin/editor.purge_python_modules
    group: editor
    description: >-
      Purge cached embedded-Python modules whose name starts with a prefix, so
      the editor drops stale code after you edit a Python tool on disk. Returns
      the purged module names + count (#719). Params: prefix
  editor.close_sequence:
    class_path: ue-mcp.builtin/editor.close_sequence
    group: editor
    description: >-
      Close the currently open Level Sequence editor (Sequencer). Do this before
      bulk-deleting actors a sequence may possess - open sequences re-resolve
      possessables by name during destruction and can mis-bind. Returns wasOpen
      + closedSequence (#718). Params: none
  editor.open_tab:
    class_path: ue-mcp.builtin/editor.open_tab
    group: editor
    description: >-
      Open a registered editor tab by ID so its UI can be screenshotted as
      evidence (e.g. 'ProjectSettings', 'OutputLog', 'ContentBrowserTab1')
      (#727). Params: tabId
  editor.open_settings:
    class_path: ue-mcp.builtin/editor.open_settings
    group: editor
    description: >-
      Open (and navigate) a settings viewer for visual settings evidence.
      section takes a bare name with category, or a combined 'Engine.Physics'
      (#727). Params: container?, category?, section?
  editor.set_property:
    class_path: ue-mcp.builtin/editor.set_property
    group: editor
    description: >-
      Set UObject property. Saves the package to disk by default; pass
      save=false to leave it dirty in-memory (batch many writes, then
      editor(save_dirty)/asset(save)) (#674). TMap values take either { "Key":
      value } or, for struct keys, [{ key: {...}, value: ... }] - exactly what
      get_property/describe_object return under `value`. A write that cannot
      store every entry it was given fails and leaves the old value in place;
      containers report elementCount on success (#820).
      SkeletalMeshAsset/SkinnedAsset on a skinned mesh component go through
      SetSkinnedAssetAndUpdate, since a raw write crashes the next pose
      evaluation; for a placed actor use level(set_component_skeletal_mesh)
      (#1099). Params: objectPath (or path, or assetPath), propertyName, value,
      save?
  editor.get_property:
    class_path: ue-mcp.builtin/editor.get_property
    group: editor
    description: >-
      Read UObject property. `value` is structured JSON and is always safe to
      write straight back with set_property; `valueText` is UE export text and
      for a struct-keyed TMap does not read back, so valueTextRoundTrips reports
      whether it can be reused (#820). Params: objectPath (or path, or
      assetPath), propertyName
  editor.describe_object:
    class_path: ue-mcp.builtin/editor.describe_object
    group: editor
    description: >-
      Describe a UObject and optionally list/read properties. Per property,
      `value` is the round-trippable structured form and valueTextRoundTrips
      flags export text that is not (#820). Params: objectPath (or path, or
      assetPath), includeProperties?, includeValues?, propertyNames?
  editor.play_in_editor:
    class_path: ue-mcp.builtin/editor.play_in_editor
    group: editor
    description: >-
      PIE control. A start with a session already active fails with
      alreadyRunning, and a stop with none active fails with alreadyStopped:
      neither call changed anything, and the marker names the reason. A flow
      step that expects either outcome carries ignore_failure: true. pieAction
      defaults to status. A start waits for the AssetRegistry initial scan by
      default, since PIE silently no-ops during it on a cold editor (#406).
      Params: pieAction?, waitForAssetRegistry?, assetRegistryTimeoutSeconds?
  editor.play_in_editor_ignore_blueprint_errors:
    class_path: ue-mcp.builtin/editor.play_in_editor_ignore_blueprint_errors
    group: editor
    description: >-
      Start PIE for one launch with the editor's unresolved-Blueprint-error
      prompt suppressed. PIE then runs whatever bytecode those Blueprints last
      compiled to, so the launch is authorized per call: set
      ue-mcp.pie.allowIgnoreBlueprintErrors to true in your ue-mcp config to
      pre-authorize it, otherwise the user answers an MCP approval prompt. The
      bridge refuses the launch when a Blueprint would have to be recompiled
      first (dirty non-data Blueprints, errored Level Blueprints) and lists
      every errored Blueprint it suppressed in loadedErroredBlueprints. Params:
      waitForAssetRegistry? (default true), assetRegistryTimeoutSeconds?
      (default 180).
  editor.get_runtime_value:
    class_path: ue-mcp.builtin/editor.get_runtime_value
    group: editor
    description: >-
      Read PIE actor property. Pass actorLabel or actorPath. propertyName
      supports dotted paths (component.field or component.struct.field) for
      nested reads on component subobjects (#344/#381). Params: actorLabel?,
      actorPath?, propertyName, world?, pieInstance?
  editor.get_pie_pawn:
    class_path: ue-mcp.builtin/editor.get_pie_pawn
    group: editor
    description: >-
      Resolve the controlled pawn in the active PIE world. Returns
      actorLabel/class/location/rotation (#228/#229). Params: playerIndex?
  editor.list_pie_instances:
    class_path: ue-mcp.builtin/editor.list_pie_instances
    group: editor
    description: >-
      List the running PIE worlds with their instance id, net mode
      (standalone|listenServer|dedicatedServer|client), player count and whether
      they own a game viewport. In a multiplayer PIE session every other runtime
      action resolves the primary world (the server) unless you pass
      pieInstance, so this is how you discover that a client exists and what id
      addresses it (#778). Params: none
  editor.invoke_object_function:
    class_path: ue-mcp.builtin/editor.invoke_object_function
    group: editor
    description: >-
      Call a UFUNCTION on any UObject, not just a placed actor. Target it with
      objectPath, or
      target=gameinstance|gamemode|gamestate|playercontroller|playerpawn|subsystem
      (subsystem also needs subsystemClass; playercontroller/playerpawn accept
      playerIndex). The GameInstance, GameMode and subsystems have no actor
      label, so invoke_function could never reach them. Returns output and
      return params under returnValues, with a TArray/TSet/TMap return as real
      JSON and everything else as export text (#885); an unknown function name
      lists the available ones. A scripted call runs under the editor
      script-execution guard, which forces every actor callspace to Local, so a
      UFUNCTION(Server) executes locally instead of being sent; the result warns
      when that happened, and deferToNextTick=true queues the call for the next
      engine tick where it routes normally, at the cost of returning before it
      runs (#973). To click a UMG button in PIE, use
      widget(invoke_runtime_function) (#1140). (#739) Params: functionName,
      objectPath?, target?, subsystemClass?, playerIndex?, args?, world?,
      pieInstance?, deferToNextTick?
  editor.invoke_object_functions:
    class_path: ue-mcp.builtin/editor.invoke_object_functions
    group: editor
    description: >-
      Call 1-64 UFUNCTIONs in order without yielding to the editor tick loop.
      Each call independently targets a UObject using the same fields as
      invoke_object_function, so one sequence can span an actor and its
      components. Calls stop at the first failure; earlier calls are not rolled
      back. Returns results[] in call order plus completedCalls/requestedCalls,
      and failedIndex when it stops early, so a retry can resume instead of
      replaying mutations. Params: calls, world?, pieInstance?
  editor.read_bone_transforms:
    class_path: ue-mcp.builtin/editor.read_bone_transforms
    group: editor
    description: >-
      Read live skeletal bone and socket transforms off an actor, once. This is
      a point-in-time read, NOT a time series - for per-frame capture over a
      window use the pie category's observe actions. Pass actorLabel or
      actorPath. Pass bones (bone OR socket names) or omit for every bone up to
      limit. space=world (default) or component; component space is independent
      of where the actor is standing. Pass relativeTo (bone OR socket name) to
      express every sample in that live reference frame; relativeTo supersedes
      space and is calculated in component space. world defaults to auto. Also
      reports the AnimInstance class/path (#756/#757/#761/#764). Params:
      actorLabel?, actorPath?, componentName?, bones?, relativeTo?, space?,
      limit?, world?, pieInstance?
  editor.get_object_properties:
    class_path: ue-mcp.builtin/editor.get_object_properties
    group: editor
    description: >-
      Read reflected properties off any UObject, with the same targeting as
      invoke_object_function: objectPath, or target (plus subsystemClass or
      playerIndex). Blueprint-declared variables are reflected properties, so
      they read the same way as native ones. Pass propertyNames to filter;
      entries may use the Details-panel spelling ('World Context Object' finds
      WorldContextObject, 'Is Active' finds bIsActive). Names that do not exist
      come back under missingProperties instead of silently returning nothing.
      Properties holding a TMap are also reported under `values` in the
      structured form set_property accepts, because export text cannot carry a
      struct-keyed map back (#820). world defaults to auto (#739/#802). Params:
      objectPath?, target?, subsystemClass?, playerIndex?, propertyNames?,
      world?, pieInstance?, limit?, maxValueLength?
  editor.set_movement_mode:
    class_path: ue-mcp.builtin/editor.set_movement_mode
    group: editor
    description: >-
      Set a live PIE character's movement mode and/or velocity on its
      CharacterMovementComponent. Pass actorLabel or actorPath. Modes are named
      (none|walking|navwalking|falling|swimming|flying|custom) rather than raw
      enum numbers, because a wrong number reads as success and then behaves as
      None. Reports previousMode/previousVelocity and reads the mode back
      afterwards, since SetMovementMode can refuse a mode the character cannot
      enter (flying with bCanFly off, swimming outside a volume). world defaults
      to pie (#757). Params: actorLabel?, actorPath?, mode?, customMode?,
      velocity?, world?, pieInstance?
  editor.set_object_property:
    class_path: ue-mcp.builtin/editor.set_object_property
    group: editor
    description: >-
      Write a reflected property on a live UObject instance, with the same
      targeting as invoke_object_function: objectPath, or target (plus
      subsystemClass or playerIndex). Use this for a PIE actor, a spawned widget
      or any runtime instance: editor(set_property) is the asset path and marks
      the package dirty and saves it, which a live instance has no business
      doing. propertyName accepts dotted/indexed paths and the Details-panel
      spelling. Reports previousValue plus the value read back after the write,
      so a coerced or clamped write is visible. Nothing is saved; pass
      postEditChange=true to fire PostEditChangeProperty. world defaults to auto
      (#802). Params: propertyName, value, objectPath?, target?,
      subsystemClass?, playerIndex?, postEditChange?, world?, pieInstance?
  editor.find_object:
    class_path: ue-mcp.builtin/editor.find_object
    group: editor
    description: >-
      Resolve or search for a live UObject instance and report the objectPath
      that addresses it, which is what invoke_object_function /
      get_object_properties / set_object_property need. Pass objectPath to check
      one path (returns found/isValid rather than failing when it is gone), or
      className and/or nameContains to search every loaded object. className
      takes a short name (StaticMeshActor), a /Script path, a generated class
      name (WBP_Hud_C) or a Blueprint asset path. This is how you get the path
      of something spawned at runtime, an editor utility widget or a UMG widget,
      which no naming convention predicts. The search is paged: pass back
      nextCursor as cursor to read the next page (#802). Params: at least one of
      objectPath/className/nameContains, outerPath?, exactClass?,
      includeDefaults?, world?, pieInstance?, cursor?, limit?
  editor.teleport_runtime_actor:
    class_path: ue-mcp.builtin/editor.teleport_runtime_actor
    group: editor
    description: >-
      Move a live PIE actor and have it STAY moved. A plain SetActorLocation on
      a Character is undone by CharacterMovement on the next tick, so this stops
      the movement component, teleports, and stops it again. Pass actorLabel or
      actorPath. Reports actualLocation read back from the actor rather than
      what was requested. world defaults to pie (#770/#777). Params:
      actorLabel?, actorPath?, location?, rotation?, stopMovement?, sweep?,
      world?, pieInstance?
  editor.set_runtime_visibility:
    class_path: ue-mcp.builtin/editor.set_runtime_visibility
    group: editor
    description: >-
      Hide or show live PIE actors and their scene components, capturing an
      exact rollback snapshot. PIE-only: world must be 'pie' (the default) and
      pieInstance picks the world when several are running (see
      list_pie_instances). Provide exactly ONE actor selector - actorLabels[],
      actorPaths[] (the unambiguous one) or actorClass; a label matching several
      actors is refused rather than resolved at random. hidden=true hides,
      hidden=false shows. componentNames[]/componentClasses[] narrow to matching
      SceneComponents and imply affectComponents; with no component filter the
      actor itself is the target. affectActor/affectComponents override that
      split, propagateToChildren (default true) also takes each matched
      component's descendants, matchSubclasses (default true) widens class
      matching, and maxTargets bounds how far the expansion may go. dryRun
      defaults to TRUE: the call reports what it would change and mutates
      nothing until dryRun=false. Returns hidden, dryRun, mutationPerformed,
      matchedActors, targetCount, changed, alreadyDesired, worldPath,
      pieInstance, netMode, targets[], and on a real mutation a rollbackToken to
      hand to restore_runtime_visibility. Params: hidden, actorLabels OR
      actorPaths OR actorClass, componentNames?, componentClasses?,
      affectActor?, affectComponents?, propagateToChildren?, matchSubclasses?,
      maxTargets?, dryRun?, world?, pieInstance?
  editor.restore_runtime_visibility:
    class_path: ue-mcp.builtin/editor.restore_runtime_visibility
    group: editor
    description: >-
      Put back the exact visibility state set_runtime_visibility captured,
      addressed by the rollbackToken from its response. Run
      set_runtime_visibility with dryRun=false first; a dry run issues no token.
      The token belongs to one PIE session and expires with it, so restore
      before play ends. world, if passed, must be 'pie', and pieInstance must
      match the token's session. Returns restored, rollbackToken, targetCount,
      changed, alreadyRestored, worldPath, pieInstance, netMode. Params:
      rollbackToken, world?, pieInstance?
  editor.invoke_static_function:
    class_path: ue-mcp.builtin/editor.invoke_static_function
    group: editor
    description: >-
      Call a static UFUNCTION on a UBlueprintFunctionLibrary (no actor
      instance). invoke_function needs an actor/component target; this targets
      the library class CDO instead, so it reaches static *_BlueprintOnly
      libraries (Voxel sculpt/query/stamp), GeometryScript, Kismet math, any
      function library. world/pieInstance pick WHICH world fills the context
      param, so a static that looks a GameInstance subsystem up off its context
      can be exercised against a live PIE session (#971); the result names the
      world it ran against and the parameter that carried it. Returns return/out
      params under returnValues, with a TArray/TSet/TMap return as real JSON and
      everything else as export text (#885). Discover libraries + functions with
      list_function_libraries. Params: className, functionName, args?,
      actorArgs?, worldContextParam?, world?, pieInstance?
  editor.invoke_function:
    class_path: ue-mcp.builtin/editor.invoke_function
    group: editor
    description: >-
      Call a BlueprintCallable / Exec UFUNCTION on a target actor or one of its
      components. world=editor (the default) runs the function on the actor
      placed in the level, no PIE session needed, and reports which instance ran
      it as resolvedActorLabel/resolvedActorPath. actorLabel is matched against
      placed actors by editor label first, then internal object name, then full
      object path; a miss is an error naming what was searched (#806). Returns
      out/return params under returnValues; a TArray/TSet/TMap return comes back
      as real JSON and everything else as export text (#885). A scripted call
      runs under the editor script-execution guard, which forces every actor
      callspace to Local, so a UFUNCTION(Server) executes locally instead of
      being sent; the result warns when that happened, and deferToNextTick=true
      queues the call for the next engine tick where it routes normally, at the
      cost of returning before it runs (#973). A component redirects the call to
      that subobject (#382), and actorArgs fills UObject* parameters from actor
      labels (#383). See #228/#229. Params: functionName, at least one of
      actorLabel/actorPath, component?, args?, actorArgs?, world?, pieInstance?,
      deferToNextTick?
  editor.list_function_libraries:
    class_path: ue-mcp.builtin/editor.list_function_libraries
    group: editor
    description: >-
      Enumerate UBlueprintFunctionLibrary subclasses on this build. Filter by
      name with pattern (case-insensitive substring, e.g. 'GeometryScript' /
      'Kismet' / 'Animation'). Returns name, module, and (by default) every
      static BlueprintCallable function on the library with its tooltip. Use to
      discover what's available for editor.invoke_function (#455). Params:
      pattern?, includeFunctions?
  editor.set_pie_time_scale:
    class_path: ue-mcp.builtin/editor.set_pie_time_scale
    group: editor
    description: >-
      Fast-forward PIE game time. Raises WorldSettings caps and calls
      SetGlobalTimeDilation. Params: factor
  editor.hot_reload:
    class_path: ue-mcp.builtin/editor.hot_reload
    group: editor
    description: 'Hot reload C++. Params: none'
  editor.undo:
    class_path: ue-mcp.builtin/editor.undo
    group: editor
    description: 'Undo last transaction. Params: none'
  editor.redo:
    class_path: ue-mcp.builtin/editor.redo
    group: editor
    description: 'Redo last transaction. Params: none'
  editor.get_perf_stats:
    class_path: ue-mcp.builtin/editor.get_perf_stats
    group: editor
    description: 'Editor performance stats. Params: none'
  editor.run_stat:
    class_path: ue-mcp.builtin/editor.run_stat
    group: editor
    description: >-
      Run a stat overlay. name is a bare stat name (e.g.
      'unit','fps','game','gpu') prefixed with 'stat '; command is a full
      console command and wins over name (#722). Params: command?, name?
  editor.set_scalability:
    class_path: ue-mcp.builtin/editor.set_scalability
    group: editor
    description: >-
      Set rendering quality via the Scalability system (actually applies +
      persists, not just sg.* cvars). Returns appliedLevels (#591). Params:
      level?
  editor.get_cvars:
    class_path: ue-mcp.builtin/editor.get_cvars
    group: editor
    description: >-
      Read console variables from the running editor by name, names, or pattern
      (substring match over every registered variable). Each row carries value,
      defaultValue, isDefault, type, whether it is a cheat, and `setBy`: the
      priority the current value was written at, which is what separates a
      variable sitting at its default from one a scalability group or device
      profile drove there. A variable set at a higher priority ignores later
      writes from lower ones. Names that do not resolve come back under notFound
      rather than as an error (#1006). Params: name?, names?, pattern?, limit?
  editor.set_cvars:
    class_path: ue-mcp.builtin/editor.set_cvars
    group: editor
    description: >-
      Bulk-set console variables, from a {name: value} object or a [{name,
      value}] array. Returns per-cvar old/new values and any notFound names. Use
      get_cvars to read one back, including which priority its value was set at
      (#591). Params: cvars
  editor.capture_screenshot:
    class_path: ue-mcp.builtin/editor.capture_screenshot
    group: editor
    description: >-
      Screenshot. target=pie synchronously captures the selected PIE client game
      viewport with UMG/Slate UI; target=editor captures the level viewport;
      target=window synchronously captures a whole Slate window via
      FSlateApplication::TakeScreenshot - pixel-true for ALL Slate/UMG UI,
      returns after the PNG is written, and works while the window is unfocused
      or off-screen. Multi-instance PIE automatically prefers a world with a
      game viewport; pass pieInstance or worldPath to select explicitly, which
      for target=window is what picks the PIE client window instead of the
      active editor window. Every mode captures at the source viewport/window
      size - use capture_scene_png for a chosen output size. outputPath is
      accepted for filename, so the two capture actions take the same name
      (#966). Returns the resolved PIE instance/world and image dimensions
      (#226/#724). Params: filename (or outputPath), target?, pieInstance?,
      worldPath?
  editor.capture_scene_png:
    class_path: ue-mcp.builtin/editor.capture_scene_png
    group: editor
    description: >-
      Headless PNG via a transient SceneCapture2D (RGBA8 LDR). Returns
      captureMetadata with the actual camera transform/basis, FOV, resolution,
      world/PIE identity and resolved focus actor/bounds. Pair this data with
      this image; get_viewport_state and hit_test_viewport_pixel refer to a
      different, live editor camera. The capture actor is destroyed before
      return. Old stray capture actors are swept and their removal reported as
      strayCaptureActorsRemoved. focusActorLabel or focusActorPath auto-frames
      the camera on that actor's bounds (#599/#662). Params: outputPath (or
      filename), location?, rotation?, focusActorLabel?, focusActorPath?,
      focusDirection?, focusMargin?, world?, pieInstance?, width?, height?,
      fov?, fullyLoadTextures?
  editor.get_viewport_state:
    class_path: ue-mcp.builtin/editor.get_viewport_state
    group: editor
    description: >-
      Full readout of a level viewport: viewMode, viewportType, fov, nearClip,
      farClipOverride, exposure (fixed or auto, with the EV100), cameraSpeed,
      gameView, realtime, location and rotation, plus the view modes this engine
      build supports. get_viewport reports location, rotation and fov only. Call
      this before a capture to record the conditions it was taken under, so two
      captures can be compared honestly. Params: viewportIndex?
  editor.set_view_mode:
    class_path: ue-mcp.builtin/editor.set_view_mode
    group: editor
    description: >-
      Pin the viewport's shading mode (Lit, Unlit, Wireframe, LightingOnly,
      DetailLighting, ShaderComplexity and the rest this build supports). The
      single biggest determinism lever for screenshot comparison: Unlit takes
      lighting out of the picture, Wireframe takes shading out. An unknown name
      is refused with the full list this engine supports rather than silently
      ignored. Idempotent: setting the mode it already has reports unchanged,
      and the previous mode comes back as a rollback. Params: viewMode,
      viewportIndex?
  editor.set_viewport_exposure:
    class_path: ue-mcp.builtin/editor.set_viewport_exposure
    group: editor
    description: >-
      Pin the editor viewport to a fixed EV100 instead of auto eye-adaptation.
      Targets the viewport CLIENT, so it is transient, editor-only and does not
      dirty the level. This does not pin capture_scene_png's separate
      SceneCapture2D exposure. Post-process volumes remain asset(set_property)
      territory. Pass ev100 for a fixed value, or mode='auto' to return to eye
      adaptation. Params: ev100?, fixed?, mode?, viewportIndex?
  editor.set_viewport_view:
    class_path: ue-mcp.builtin/editor.set_viewport_view
    group: editor
    description: >-
      Set fov, nearClip, farClip, viewportType and cameraSpeed in one call.
      set_viewport writes only location and rotation and does not write the fov
      it reads back, which is the gap this fills. Reports a per-field changed
      flag and the previous values, and rolls back to them. nearClip's rollback
      is marked lossy because the engine reports the effective plane rather than
      the override. Params: fov?, nearClip?, farClip?, viewportType?,
      cameraSpeed?, viewportIndex?
  editor.set_game_view:
    class_path: ue-mcp.builtin/editor.set_game_view
    group: editor
    description: >-
      Toggle game view, which hides editor-only overlays (grid, gizmos, actor
      icons, volume wireframes) so a viewport capture shows what the game shows
      rather than what the editor shows. Idempotent: setting the state it
      already has reports unchanged. Params: enabled?, viewportIndex?
  editor.redraw_viewport:
    class_path: ue-mcp.builtin/editor.redraw_viewport
    group: editor
    description: >-
      Force the viewport to repaint. A bridge write marks the viewport dirty but
      does not repaint it, so a capture taken immediately afterwards can show
      the state from before the write. Use set_realtime instead when a ticking
      simulation also has to advance. Params: allViewports?,
      invalidateHitProxies?, viewportIndex?
  editor.begin_transaction:
    class_path: ue-mcp.builtin/editor.begin_transaction
    group: editor
    description: >-
      Open an undo transaction so a run of writes collapses into ONE undo step.
      General-purpose, unlike material(begin_transaction) which is
      material-scoped. Nesting is reported rather than refused. Pair with
      end_transaction to commit or cancel_transaction to discard. Params:
      description? (or label)
  editor.end_transaction:
    class_path: ue-mcp.builtin/editor.end_transaction
    group: editor
    description: >-
      Commit the open undo transaction and return its index in the undo buffer.
      Ending with nothing open reports that rather than erroring, so a flow that
      already closed one is safe to replay. Params: none
  editor.cancel_transaction:
    class_path: ue-mcp.builtin/editor.cancel_transaction
    group: editor
    description: >-
      Discard the open transaction and restore every object it touched. This is
      what makes 'do several writes, detect a failure partway, abort, leave the
      editor unchanged' possible at all; material's begin/end pair had no
      cancel, so an aborted flow could only ever commit. Cancelling with nothing
      open reports that rather than erroring. Params: index?
  editor.get_undo_state:
    class_path: ue-mcp.builtin/editor.get_undo_state
    group: editor
    description: >-
      Report canUndo and canRedo plus the DESCRIPTION strings of what an undo or
      redo would actually apply, the queue length, the undo count and the
      current index. Look before you undo, instead of undoing and reading back a
      bare boolean. Params: none
  editor.undo_redo_steps:
    class_path: ue-mcp.builtin/editor.undo_redo_steps
    group: editor
    description: >-
      Undo or redo several steps at once, returning appliedDescriptions: the
      titles of the transactions actually reversed or reapplied, which is how
      you confirm you undid what you meant. Stops early with a stated reason
      rather than silently doing fewer steps, and refuses while a transaction is
      open. Params: steps?, direction?
  editor.get_transaction_history:
    class_path: ue-mcp.builtin/editor.get_transaction_history
    group: editor
    description: >-
      Read the undo buffer itself, newest first: per entry the index, title, id,
      record count, byte size and primary object, and whether it is applied or
      undone. currentIndex splits the applied entries from the undone ones. Use
      it to find the transaction a later cancel or undo should target. Params:
      maxEntries?
  editor.start_trace:
    class_path: ue-mcp.builtin/editor.start_trace
    group: editor
    description: >-
      Start an Unreal Insights trace. Writes a .utrace and REPORTS WHERE IT
      LANDED (traceFile, plus the exact UnrealInsights command that opens it) -
      the bridge records traces, it does not read them back, because trace
      analysis lives in the engine's TraceServices/TraceAnalysis Developer
      modules that this plugin does not link. Defaults to a timestamped file
      under <Project>/Saved/Profiling so the path is deterministic rather than
      invented by the engine. Idempotent in the way that matters here: a trace
      that is ALREADY running is reported as alreadyTracing rather than quietly
      starting a second one, because only one connection exists per process. A
      channels list where nothing resolves is refused with the closest channel
      names. Rollback: stop_trace. Params: channels?, traceTarget?, file?,
      host?, truncate?, excludeTail?
  editor.stop_trace:
    class_path: ue-mcp.builtin/editor.stop_trace
    group: editor
    description: >-
      Stop the running trace and report the finished file: absolute path, byte
      size, and the UnrealInsights command line that opens it. The destination
      is only readable while connected, so it is captured before the stop rather
      than lost by it. Stopping when nothing is running reports wasTracing=false
      rather than erroring, so a replayed flow is safe. Warns when profiling
      regions were still open, since those have no end event in the file. The
      rollback is LOSSY and says so: restarting writes a NEW .utrace and cannot
      reopen this one. Params: none
  editor.pause_trace:
    class_path: ue-mcp.builtin/editor.pause_trace
    group: editor
    description: >-
      Pause or resume the running trace by muting every active channel, without
      closing the file. Idempotent: pausing an already-paused trace reports
      changed=false. Rollback restores the previous state. Params: paused?
  editor.get_trace_status:
    class_path: ue-mcp.builtin/editor.get_trace_status
    group: editor
    description: >-
      Read the whole trace system: tracing, paused, systemStatus,
      connectionType, destination, activeChannels, byte and memory statistics,
      the channel presets start_trace accepts, whether UnrealInsights is on
      disk, every profiling region still open, and whether a bridge-launched
      standalone run is alive. Params: none
  editor.list_trace_channels:
    class_path: ue-mcp.builtin/editor.list_trace_channels
    group: editor
    description: >-
      Every trace channel this build registers, with its enabled state and, on
      UE 5.7+, its description, id and read-only flag. This is what makes
      start_trace's channels parameter discoverable instead of guesswork.
      Params: filter?, enabledOnly?
  editor.set_trace_channels:
    class_path: ue-mcp.builtin/editor.set_trace_channels
    group: editor
    description: >-
      Turn named trace channels on and off, including mid-trace. Validates the
      WHOLE request before applying any of it, so a typo cannot leave a
      half-configured trace recording something other than what was asked for,
      and an unknown name comes back with the closest real ones. Each channel
      reports wasEnabled, enabled and changed read back from the trace system
      rather than assumed, so a read-only channel refusing at runtime is visible
      instead of silent. Rollback restores exactly the channels that moved.
      Params: enable?, disable?
  editor.begin_profile_region:
    class_path: ue-mcp.builtin/editor.begin_profile_region
    group: editor
    description: >-
      Open a named bracket around an operation so it can be measured. Times wall
      clock unconditionally and, on UE 5.7+ with a trace running, also emits an
      Insights timing region; when it cannot emit one it says so in tracedReason
      rather than pretending. The name is the key: opening the same name twice
      reports the existing region rather than nesting two begins under one end.
      Rollback: end_profile_region. Params: regionName, regionCategory?
  editor.end_profile_region:
    class_path: ue-mcp.builtin/editor.end_profile_region
    group: editor
    description: >-
      Close a named bracket and return what it measured: durationMs and the
      number of rendered frames it spanned. A region spanning zero frames says
      so, because a CPU-versus-GPU verdict cannot describe work that ran inside
      one tick. Ending a region that is not open reports wasOpen=false and lists
      the ones that are, rather than erroring. No inverse exists and the
      response says why. Params: regionName
  editor.add_trace_bookmark:
    class_path: ue-mcp.builtin/editor.add_trace_bookmark
    group: editor
    description: >-
      Drop a named marker on the Insights timeline. Reports recorded=false with
      the reason when no trace is running or the Bookmark channel is off,
      instead of returning a success for an event that was dropped. Deliberately
      NOT idempotent: a bookmark is a point event, so two calls write two
      markers and the response says so. Params: bookmarkName
  editor.get_frame_timing:
    class_path: ue-mcp.builtin/editor.get_frame_timing
    group: editor
    description: >-
      Frame timings WITH A VERDICT: gameThreadMs, renderThreadMs, rhiThreadMs,
      swapBufferMs, per-thread wait time, frameMs and fps, and GPU min/avg/max
      drained from the RHI's own history, then bound = gpu | cpu-game |
      cpu-render | cpu-rhi | balanced | unknown with the arithmetic that
      produced it spelled out in verdict. Says unknown when the RHI published no
      GPU timing rather than guessing. warnings[] names the conditions that make
      the numbers meaningless and the exact call that fixes each, including the
      unfocused-editor CPU throttle, which is a plain UPROPERTY and is therefore
      REPORTED here with its objectPath for editor(set_property) instead of
      getting a typed setter that would duplicate a working path. sampleWindow
      states what was actually measured: a handler runs inside one tick and
      cannot advance frames to build a window. Params: cpuGpuMarginPercent?
  editor.trigger_hitch:
    class_path: ue-mcp.builtin/editor.trigger_hitch
    group: editor
    description: >-
      Stall the game thread for a known number of milliseconds, so
      hitch-detection logic can be tested against a hitch whose size is known in
      advance. Brackets the stall with a trace region and a bookmark so it is
      findable in the capture. Capped at 5000ms because this blocks the same
      thread the bridge answers on. Sleeping consumes no CPU, so it reads as a
      long frame rather than as game-thread work. No inverse: time does not come
      back. Params: hitchMilliseconds?, bookmark?
  editor.launch_standalone:
    class_path: ue-mcp.builtin/editor.launch_standalone
    group: editor
    description: >-
      Launch the project as a separate -game process, optionally tracing, so
      frame times come from a real game process rather than from the editor.
      Passing channels (or traceFile) adds -trace and -tracefile, and the
      response carries the .utrace path plus the UnrealInsights command that
      opens it. Idempotent: a bridge-launched run that is still alive is
      reported as alreadyRunning rather than joined by a second. The process is
      detached and its output is not read; poll get_standalone_status. Rollback:
      stop_standalone. Params: mapName?, channels?, traceFile?, windowed?,
      resX?, resY?, extraArgs?
  editor.get_standalone_status:
    class_path: ue-mcp.builtin/editor.get_standalone_status
    group: editor
    description: >-
      Is the bridge-launched standalone run still alive: running, processId,
      commandLine, uptimeSeconds, the exit code once it has ended, and its
      .utrace path with the command that opens it. Only reports runs this bridge
      started; one launched another way is not tracked. Params: none
  editor.stop_standalone:
    class_path: ue-mcp.builtin/editor.stop_standalone
    group: editor
    description: >-
      Terminate the standalone run this bridge launched, killing its process
      tree so nothing is left holding the .utrace open. Stopping when nothing is
      running reports wasRunning=false rather than erroring. Termination is not
      a graceful quit and the response says what that costs. No inverse:
      relaunching is a new run. Params: none
  editor.set_realtime:
    class_path: ue-mcp.builtin/editor.set_realtime
    group: editor
    description: >-
      Toggle realtime update on the level editor viewports so the editor-world
      sim (Niagara, anims) ticks - otherwise capture_scene_png renders an
      unticked, empty sim (#537). Params: enabled?
  editor.get_viewport:
    class_path: ue-mcp.builtin/editor.get_viewport
    group: editor
    description: 'Get viewport camera. Params: none'
  editor.hit_test_viewport_pixel:
    class_path: ue-mcp.builtin/editor.hit_test_viewport_pixel
    group: editor
    description: >-
      Ray-cast from a screen pixel through the active editor viewport and return
      the first hit. Builds the ray from the live viewport's projection matrix
      (no FOV/aspect guessing). width and height override the viewport size when
      picking from a different-resolution screenshot. Returns hit +
      actorLabel/actorClass/componentName/componentClass/materialPath/location/impactPoint/normal/distance/faceIndex/boneName/physicalMaterial
      (#418). Params: x, y, width?, height?, maxDistance?, ignoreActors?
  editor.get_runtime_values:
    class_path: ue-mcp.builtin/editor.get_runtime_values
    group: editor
    description: >-
      Bulk runtime read across the active world. For each actor/component
      matching classFilter, resolves every path against the (actor|component)
      root and returns rows of {actorLabel, actorClass, componentName?,
      componentClass?, values, errors?}. Paths support property hops, sub-object
      hops, and BlueprintCallable getter calls at any segment (e.g.
      'PowerConnector.GetRequired' reaches a UFUNCTION on a UObject sub-object).
      A getter that takes arguments is written with them inline,
      'GetMirroredTallyWeight(overclock)' or 'GetBalance(gold, 2)', which is
      what makes a keyed accessor readable across every matched instance in one
      call; the literals are coerced by the same rules invoke_object_function's
      args use, so FName/FString/int/float/bool/enum all read (#969).
      classFilter matches actor class OR component class - omit to match
      everything. componentName roots every path at the component with that
      instance name (case-insensitive) and skips actors without one, so two
      components of the same class are addressable apart (#1113). A path whose
      result is a TArray/TSet/TMap comes back as real JSON rather than one
      string (#885). World defaults to PIE if running, else editor (#414).
      Params: classFilter?, componentName?, paths, world?, pieInstance?
  editor.set_viewport:
    class_path: ue-mcp.builtin/editor.set_viewport
    group: editor
    description: >-
      Set the viewport camera, its projection and its orthographic zoom. The
      projection is switched BEFORE the requested pose is applied, because the
      viewport keeps a separate transform cache per projection and writing the
      pose first would hand back the camera from the mode you just left. Every
      value is validated before anything is written, and the rollback restores
      the projection and zoom as well as the location and rotation. Acts on the
      active level viewport (#1029). Params: location?, rotation?, projection?,
      viewportType?, orthoZoom?
  editor.focus_on_actor:
    class_path: ue-mcp.builtin/editor.focus_on_actor
    group: editor
    description: >-
      Focus on actor. Pass actorLabel or actorPath (#983). Params: actorLabel?,
      actorPath?
  editor.create_sequence:
    class_path: ue-mcp.builtin/editor.create_sequence
    group: editor
    description: 'Create Level Sequence. Params: name, packagePath?, onConflict?'
  editor.get_sequence_info:
    class_path: ue-mcp.builtin/editor.get_sequence_info
    group: editor
    description: >-
      Read sequence: bindings (possessable/spawnable) with their Sequencer tags
      (#556), tracks, and optional section detail. UNITS: playbackRange is
      reported in TICKS (tick resolution, commonly 24000/s), while
      MovieSceneScripting*Channel.add_key defaults its time_unit to
      DISPLAY_RATE. Keys authored with a tick number under the default unit land
      roughly 800x past the range and the track evaluates to its first key,
      which presents as transforms that do not work on a structurally perfect
      sequence (#881). Params: assetPath (or path), includeSectionDetails?
  editor.add_sequence_track:
    class_path: ue-mcp.builtin/editor.add_sequence_track
    group: editor
    description: >-
      Add an empty track. actorLabel or actorPath binds it to an actor; omit
      both for a master track (#983). Params: assetPath (or path), trackType,
      actorLabel?, actorPath?
  editor.add_sequence_section:
    class_path: ue-mcp.builtin/editor.add_sequence_section
    group: editor
    description: >-
      Add a section to a track (creating the track if needed), set its start/end
      in seconds, and for a CameraCut track bind it to a camera. actorLabel or
      actorPath scopes the track to an actor binding. Returns the section index
      + channel names to key (#548/#983). Params: sequencePath (or assetPath, or
      path), trackType, actorLabel?, actorPath?, startSeconds?, endSeconds?,
      cameraActorLabel?, cameraActorPath?
  editor.set_sequence_keyframes:
    class_path: ue-mcp.builtin/editor.set_sequence_keyframes
    group: editor
    description: >-
      Add keyframes to a section channel. Transform channels: Location.X/Y/Z,
      Rotation.X/Y/Z (or friendly x/y/z, yaw/pitch/roll); Fade/Float: the float
      channel (#548). Params: sequencePath (or assetPath, or path), trackType,
      actorLabel?, actorPath?, sectionIndex?, channel, keyframes, interpolation?
  editor.set_sequence_playback_range:
    class_path: ue-mcp.builtin/editor.set_sequence_playback_range
    group: editor
    description: >-
      Set a Level Sequence's playback range in seconds (#548). Params:
      sequencePath (or assetPath, or path), startSeconds, endSeconds
  editor.play_sequence:
    class_path: ue-mcp.builtin/editor.play_sequence
    group: editor
    description: >-
      Play/stop/pause a Level Sequence in Sequencer. Pass sequencePath (or
      assetPath) to target a specific sequence - it is opened first, because the
      underlying Sequencer commands act on whatever is currently open. Omit it
      and the call applies to the open sequence and says so. sequenceAction
      defaults to play. Params: sequencePath? (or assetPath, or path),
      sequenceAction?
  editor.scrub_sequence:
    class_path: ue-mcp.builtin/editor.scrub_sequence
    group: editor
    description: >-
      Park the Sequencer playhead on an exact time and evaluate there, then
      return. This is what makes scrub-then-capture_scene_png deterministic:
      play_sequence only offers play/pause/stop and realtime playback races the
      capture. Pauses first, scrubs, and forces the evaluation before answering,
      because the playhead move alone does not write possessed-actor transforms.
      Pass exactly one of seconds or frame. frame is read in timeUnit: display
      (default, the frame numbers Sequencer shows) or tick (the units
      get_sequence_info's playbackRange reports). Returns the evaluated time in
      all three units plus displayRate/tickResolution/playbackRange, and warns
      when the time is outside the playback range (#881). Params: sequencePath?
      (or assetPath, or path), seconds?, frame?, timeUnit?
  editor.render_sequence_frames:
    class_path: ue-mcp.builtin/editor.render_sequence_frames
    group: editor
    description: >-
      Render a Level Sequence to a PNG image sequence in ONE call: for each
      frame it scrubs, forces the evaluation, and captures through a transient
      SceneCapture2D (RGBA8 LDR, real PNG), instead of scrub_sequence +
      capture_scene_png per frame. Camera: the sequence's camera cuts by default
      (frames with no active cut are skipped and reported), or
      cameraActorLabel/cameraActorPath for one camera actor, or
      location/rotation/fov for a fixed camera. The camera's own FOV and post
      process are used. Range is in display frames: startFrame and endFrame
      (inclusive), or startSeconds and endSeconds (end exclusive); default is
      the playback range. frameStep skips frames. More frames than maxFrames is
      refused. Files are written to outputDir (absolute or project-relative,
      default Saved/SequenceFrames/<sequence>) as <sequence>.<frame>.png.
      Refused while PIE runs. The playhead is restored afterwards and playback
      is left paused. A run that nears the 600s timeout stops, returns
      truncated=true and nextStartFrame. Returns files[], frames[] with
      per-frame evaluateMs/captureMs/exportMs/totalMs, and timing totals
      (#1098). Params: sequencePath (or assetPath, or path), startFrame?,
      endFrame?, startSeconds?, endSeconds?, frameStep?, maxFrames?, width?,
      height?, outputDir?, format?, cameraActorLabel?, cameraActorPath?,
      location?, rotation?, fov?, fullyLoadTextures?
  editor.build_all:
    class_path: ue-mcp.builtin/editor.build_all
    group: editor
    description: 'Build all (geometry, lighting, paths, HLOD). Params: none'
  editor.build_geometry:
    class_path: ue-mcp.builtin/editor.build_geometry
    group: editor
    description: 'Rebuild BSP geometry. Params: none'
  editor.build_hlod:
    class_path: ue-mcp.builtin/editor.build_hlod
    group: editor
    description: 'Build HLODs. Params: none'
  editor.validate_assets:
    class_path: ue-mcp.builtin/editor.validate_assets
    group: editor
    description: >-
      Run data validation over a directory (default /Game/) or over exact assets
      named by assetPath or assetPaths, one selector per call. Params:
      directory?, assetPath?, assetPaths?
  editor.get_build_status:
    class_path: ue-mcp.builtin/editor.get_build_status
    group: editor
    description: 'Get build/map status. Params: none'
  editor.cook_content:
    class_path: ue-mcp.builtin/editor.cook_content
    group: editor
    description: 'Cook content. Params: platform?'
  editor.get_log:
    class_path: ue-mcp.builtin/editor.get_log
    group: editor
    description: >-
      Read output log. maxLines selects how far back into the ring buffer to
      read (default 100); limit pages the lines that match filter/category
      within that window, and each line carries the sequence number that anchors
      a cursor. Params: maxLines?, filter?, category?, cursor?, limit?
  editor.search_log:
    class_path: ue-mcp.builtin/editor.search_log
    group: editor
    description: >-
      Search the captured log. Every match in the 4096-line ring buffer is
      collected and paged, so a busy log reports how many matched instead of
      stopping at the first hundred. maxResults caps the search itself and
      reports cappedAtMaxResults when it was what ended the collection. Params:
      query, maxResults?, cursor?, limit?
  editor.get_message_log:
    class_path: ue-mcp.builtin/editor.get_message_log
    group: editor
    description: >-
      Read a Message Log listing (MapCheck, AssetCheck, PIE, LoadErrors,
      LightingResults...). Call with NO logName to list the registered listings
      with their error/warning counts, then read one. Counts come from the
      listing itself; message bodies come from the current page and honour the
      Message Log tab's severity checkboxes, so when fewer are readable than
      exist the response says so instead of reading clean. An unknown logName is
      an error, not an empty log. Blueprint COMPILE results are not here - the
      compiler makes a listing per Blueprint; use blueprint(compile). Params:
      logName?, maxLines?, severity?
  editor.list_crashes:
    class_path: ue-mcp.builtin/editor.list_crashes
    group: editor
    description: >-
      List crash reports, sorted by folder name, which is chronological. Params:
      cursor?, limit?
  editor.get_crash_info:
    class_path: ue-mcp.builtin/editor.get_crash_info
    group: editor
    description: 'Get crash details. Params: crashFolder'
  editor.check_for_crashes:
    class_path: ue-mcp.builtin/editor.check_for_crashes
    group: editor
    description: 'Check for recent crashes. Params: none'
  editor.set_dialog_policy:
    class_path: ue-mcp.builtin/editor.set_dialog_policy
    group: editor
    description: >-
      Arm an answer, in advance, for dialogs whose title or message contains a
      pattern. READ THIS BEFORE USING IT: an armed policy presses the button for
      you, so from then on a matching prompt is answered and dismissed and the
      user never sees the question. On a save prompt that means unsaved work can
      be discarded without anyone reading the warning. Nothing arms a policy on
      your behalf - the plugin ships none and no other action arms one - so
      every policy in effect is one somebody typed here deliberately, and this
      is the only way the bridge ever answers a dialog by itself. Covers the
      Slate modal windows the editor raises itself (the shutdown "Save Content"
      prompt among them, whose buttons are Save Selected / Don't Save / Cancel).
      A response keyword (yes/no/ok/cancel/retry/continue/yesall/noall) resolves
      to whichever of the dialog's buttons carries that meaning, so
      response='no' presses "Don't Save"; pass buttonLabel to name a button
      literally instead. A policy set here answers a matching dialog whoever
      raised it, and answers one that is already on screen. To read a dialog
      instead of pre-answering it, use editor(list_dialogs) and then
      editor(respond_to_dialog). Params: pattern, at least one of
      response/buttonLabel
  editor.clear_dialog_policy:
    class_path: ue-mcp.builtin/editor.clear_dialog_policy
    group: editor
    description: 'Clear dialog policies. Params: pattern?'
  editor.get_dialog_policy:
    class_path: ue-mcp.builtin/editor.get_dialog_policy
    group: editor
    description: >-
      Get the dialog policies currently armed, each with its response and
      literal buttonLabel. Every one was armed by a caller through
      set_dialog_policy: the plugin arms none of its own, so an empty list means
      nothing will answer any dialog on its own. Params: none
  editor.list_dialogs:
    class_path: ue-mcp.builtin/editor.list_dialogs
    group: editor
    description: >-
      Read the modal dialog blocking the editor, in full: its exact title, its
      COMPLETE message text (never truncated - messageTruncated is always
      false), every button label in the order the dialog lays them out, and a
      `choices` array pairing each button with the exact
      editor(respond_to_dialog) call that presses it. When the dialog asks a
      question per row (the "Save Content" prompt is a checkbox per unsaved
      package), an `items` array reports each tickable row: its index, its
      label, its cells (asset name, package path, class path) and whether it is
      currently ticked. No button is marked recommended and none is reordered;
      choosing is yours. Also reports which armed policy matches and which
      button that policy would press, if any. `blocksGameThread` says whether
      the editor is actually held: true only for a window on Slate's modal
      stack, which is what parks the game thread and refuses every other action.
      A prompt the editor raised without AddModalWindow comes back with
      `blocksGameThread` false and `detectedBy` parentedWindow - it is reported,
      because an unanswered question must not be quit out from under, and
      nothing is refused for it (#1118). `notTreatedAsDialogs` names any window
      the walk considered and rejected, with the reason: a standalone Message
      Log or an undocked Output Log is a regular parented window like a dialog
      is, and used to block every action for the life of the session with no
      button that could answer it (#1078). A window in that list is NOT blocking
      anything. Runs even while a dialog is blocking the editor, when every
      other handler times out, so this is the way to see what the editor is
      asking. Params: none
  editor.respond_to_dialog:
    class_path: ue-mcp.builtin/editor.respond_to_dialog
    group: editor
    description: >-
      Press one named button on the active modal dialog, releasing the game
      thread. This is the deliberate way to answer a dialog: read it with
      editor(list_dialogs) first, then name the button you chose. Runs even
      while the dialog is blocking the editor. ONLY IN auto MODE. The dialog
      handling mode decides who answers, and it is enforced here: under
      interactive the question is put to the person in an elicitation form
      (raised on the call AFTER the one that hands the dialog back, so its text
      is read somewhere nothing truncates it) and only their button is pressed,
      under defer they answer it in the Unreal Editor window, and in both this
      call is refused with the dialog named. editor(list_dialogs) stays
      available in every mode, so the dialog can always be READ. Pass
      dialogAction='close' (or 'escape') to destroy the dialog window when no
      button label fits, which ends the modal without answering the question. It
      is NOT called 'action': that name is this tool's own dispatch field, so a
      call writing action='close' selects a nonexistent editor action and never
      reaches the dialog (#1078). Pass items to tick or untick the dialog's own
      rows before the button is pressed, which is what makes "Save Selected"
      mean something: read them from editor(list_dialogs) and send [{index,
      checked}] for the ones you want changed. The ticks and the press happen in
      this one call, so a modal is never left holding a selection nobody pressed
      anything on. Params: at least one of buttonLabel/buttonIndex/dialogAction,
      items?
  editor.open_asset:
    class_path: ue-mcp.builtin/editor.open_asset
    group: editor
    description: 'Open asset in its editor. Params: assetPath (or path)'
  editor.get_open_asset_editors:
    class_path: ue-mcp.builtin/editor.get_open_asset_editors
    group: editor
    description: >-
      What the user currently has open in the editor, and which of it holds
      focus. Returns every open asset editor with its asset path/class, its
      window and major tab label, and its own tabs - so an open PCG Graph, the
      Blueprint graph documents someone has open, and the Details panel they are
      looking at all come back by name. Unreal publishes no single answer to
      this: the asset editor subsystem knows what is open, the global tab
      manager knows the active tab, and each tab knows when it was last
      activated, and nothing joins them. focusedAssetEditor is the editor
      holding Slate's active tab, activeTab.context says whether that tab is in
      an asset editor, the Level Editor or elsewhere, and
      mostRecentlyActiveAssetEditor is where the user last was. Read
      editorApplicationFocused before trusting the word focused: an agent driven
      from a terminal has taken OS focus away from Unreal, so Slate's active tab
      is a record of where the user was rather than where their cursor is, and
      focusNote says which of the two this answer is. Reads only - it never
      focuses or opens anything, which editor(open_asset) is for (#1112).
      Params: none
  editor.reload_bridge:
    class_path: ue-mcp.builtin/editor.reload_bridge
    group: editor
    description: 'Hot-reload Python bridge handlers from disk. Params: none'
  editor.save_dirty:
    class_path: ue-mcp.builtin/editor.save_dirty
    group: editor
    description: >-
      Flush every dirty package and return a per-package saved/failed map. Use
      after multi-step CDO/component edits when set_class_default leaves the
      asset dirty without persisting (#378). With commitDeletes=true it uses the
      editor's own dirty-package save instead, which deletes the external
      package of a deleted World Partition actor rather than failing with
      'SavePackage returned false', and reports written, deleted and stillDirty
      per package (#1156). Params: includeMaps?, includeContent?, commitDeletes?
  editor.configure_pie:
    class_path: ue-mcp.builtin/editor.configure_pie
    group: editor
    description: >-
      Set ULevelEditorPlaySettings - multi-client PIE, net mode, single-process
      flag, Play-in-New-Window resolution (#384/#671). Params: numClients?,
      netMode?, runUnderOneProcess?, launchSeparateServer?, newWindowWidth?,
      newWindowHeight?
  editor.get_pie_config:
    class_path: ue-mcp.builtin/editor.get_pie_config
    group: editor
    description: >-
      Read current ULevelEditorPlaySettings (numClients, netMode,
      single-process, separate-server) (#384). Params: none
  editor.pie_set_player_view:
    class_path: ue-mcp.builtin/editor.pie_set_player_view
    group: editor
    description: >-
      Point the running PIE player's view (control rotation) at a pitch/yaw/roll
      so a capture frames the intended direction. Requires PIE (#671). Params:
      pitch?, yaw?, roll?
  editor.stage_game_input:
    class_path: ue-mcp.builtin/editor.stage_game_input
    group: editor
    description: >-
      Stage input for the running game: set input mode
      (gameOnly|gameAndUI|uiOnly) and mouse cursor so injected/simulated input
      reaches the pawn. This only sets the mode - the injection itself lives in
      the pie category (pie(inject_input*)), not here. Requires PIE (#671).
      Params: inputMode?, showMouseCursor?
  editor.run_automation_tests:
    class_path: ue-mcp.builtin/editor.run_automation_tests
    group: editor
    description: >-
      Run registered Automation tests matching a filter and return per-test
      pass/fail plus error lines. Runs them synchronously through the test
      framework rather than the console queue, and suspends the editor's
      unfocused-CPU throttle for the duration - otherwise an unfocused editor
      drops to a few FPS and the framework's interactive-frame-rate gate never
      opens, leaving tests queued forever (#765). A test whose latent commands
      are still queued when latentTimeoutSeconds runs out is reported as
      abandoned, with the reason: latent work needs engine frames, and this runs
      on the game thread, so a test that starts PIE (CQTest multi-client network
      tests, for instance) belongs in the editor's Automation window or
      -ExecCmds="Automation RunTests <name>" at launch. Such a test used to
      terminate the editor outright (#993) (#693). Params: filter?, maxTests?,
      latentTimeoutSeconds?
  editor.list_dirty_packages:
    class_path: ue-mcp.builtin/editor.list_dirty_packages
    group: editor
    description: >-
      Enumerate currently-dirty content + map packages, read from the editor's
      own dirty-package lists (the same ones Save All uses). Includes a
      never-saved /Temp world, because an unsaved new map is exactly the unsaved
      work a caller needs to see before closing or reloading (#340). Params:
      none
  editor.get_world_state:
    class_path: ue-mcp.builtin/editor.get_world_state
    group: editor
    description: >-
      One atomic read of which world is open and what is unsaved. Returns
      editorWorldName, editorWorldPackage, persistentLevelPackage,
      worldPackageDirty, a sorted dirtyPackages list with counts, and the
      editor/play/simulate mode. level(get_current) plus
      editor(list_dirty_packages) is two calls, so the editor can change between
      them and neither result proves which world the other described; this
      answers both in one game-thread dispatch. Read-only, and fails closed
      rather than reporting an empty world as a clean one (#920/#921). Params:
      none
  editor.request_editor_shutdown:
    class_path: ue-mcp.builtin/editor.request_editor_shutdown
    group: editor
    description: >-
      Ask the editor to close itself from inside the engine, after it has
      checked that closing is safe. Refuses by default when any content or map
      package is dirty (including an unsaved /Temp world) and reports which
      ones, so nothing is lost to a silent discard. Ends an active PIE/SIE
      session first and closes only once play has actually stopped. The response
      is returned before the process exits. Aimed at the same editor stop_editor
      aims at, through the same ownership check, so the two can never disagree
      about which editor belongs to the loaded project (#967), including what
      happens when none is running: both fail with alreadyStopped=true rather
      than one succeeding and the other refusing. This IS what stop_editor
      sends: stop_editor calls it with requireClean=false, so the editor
      schedules its own close and raises its own save prompt for anything dirty
      rather than the server refusing in its place. Called directly it defaults
      to requireClean=true, which refuses and names the dirty packages without
      scheduling anything. Use editor(stop_editor) for the full stop-and-confirm
      flow; this action is the in-engine half of it. Params: requireClean?
      (default true), endPIE? (default true)
  editor.epic_capture_asset_image:
    class_path: ue-mcp.builtin/editor.epic_capture_asset_image
    group: editor
    description: >-
      [Epic EditorToolset.EditorAppToolset] Renders a thumbnail for the
      specified asset (e.g. static meshes, skeletal meshes, skeletons,
      animations, montages, materials, textures). Params: assetPath
  editor.epic_capture_editor_image:
    class_path: ue-mcp.builtin/editor.epic_capture_editor_image
    group: editor
    description: >-
      [Epic EditorToolset.EditorAppToolset] Captures an image of the entire
      editor application as the user sees it. Params: none
  editor.epic_capture_viewport:
    class_path: ue-mcp.builtin/editor.epic_capture_viewport
    group: editor
    description: >-
      [Epic EditorToolset.EditorAppToolset] Captures the level viewport with
      optional annotations. Annotations rendering overlays a projected 3D
      world-space grid plus name + position labels on visible actors. The grid
      is drawn at a configurable ground-plane Z and projected through the
      camera, with coordinate numbers at intersections (shown in meters). Each
      labeled actor gets a crosshair at its projected screen position with a
      leader-line callout placed to avoid overlap. This gives a vision-capable
      agent spatial awareness: it can reference grid coordinates to direct
      placement and identify scene contents by label. Params: captureTransform?,
      annotations?, bShowUI?
  editor.epic_focus_on_actors:
    class_path: ue-mcp.builtin/editor.epic_focus_on_actors
    group: editor
    description: >-
      [Epic EditorToolset.EditorAppToolset] Repositions the level editor camera
      to focus on the specified actors. Cannot be called while PIE is active.
      Params: actors
  editor.epic_get_camera_transform:
    class_path: ue-mcp.builtin/editor.epic_get_camera_transform
    group: editor
    description: >-
      [Epic EditorToolset.EditorAppToolset] Returns the position and rotation of
      the level viewport camera. Params: none
  editor.epic_get_content_browser_path:
    class_path: ue-mcp.builtin/editor.epic_get_content_browser_path
    group: editor
    description: >-
      [Epic EditorToolset.EditorAppToolset] Gets the current path of the active
      content browser. Params: none
  editor.epic_get_log_categories:
    class_path: ue-mcp.builtin/editor.epic_get_log_categories
    group: editor
    description: >-
      [Epic EditorToolset.LogsToolset] Returns a sorted list of registered log
      categories. Params: filter
  editor.epic_get_log_entries:
    class_path: ue-mcp.builtin/editor.epic_get_log_entries
    group: editor
    description: >-
      [Epic EditorToolset.LogsToolset] Returns log entries from the current
      session's log file. Params: category?, pattern, maxEntries?
  editor.epic_get_open_assets:
    class_path: ue-mcp.builtin/editor.epic_get_open_assets
    group: editor
    description: >-
      [Epic EditorToolset.EditorAppToolset] Gets the list of assets currently
      open in asset editors. Params: none
  editor.epic_get_selected_actors:
    class_path: ue-mcp.builtin/editor.epic_get_selected_actors
    group: editor
    description: >-
      [Epic EditorToolset.EditorAppToolset] Gets the currently selected actors
      in the level editor. Params: none
  editor.epic_get_selected_assets:
    class_path: ue-mcp.builtin/editor.epic_get_selected_assets
    group: editor
    description: >-
      [Epic EditorToolset.EditorAppToolset] Gets the list of assets selected in
      the content browser. Params: none
  editor.epic_get_verbosity:
    class_path: ue-mcp.builtin/editor.epic_get_verbosity
    group: editor
    description: >-
      [Epic EditorToolset.LogsToolset] Returns the current verbosity level for a
      log category. Params: category?
  editor.epic_get_visible_actors:
    class_path: ue-mcp.builtin/editor.epic_get_visible_actors
    group: editor
    description: >-
      [Epic EditorToolset.EditorAppToolset] Returns all actors in the current
      level whose bounds intersect the viewport frustum. Params: none
  editor.epic_is_pierunning:
    class_path: ue-mcp.builtin/editor.epic_is_pierunning
    group: editor
    description: >-
      [Epic EditorToolset.EditorAppToolset] Returns whether a Play In Editor
      session is currently running. Params: none
  editor.epic_open_editor_for_asset:
    class_path: ue-mcp.builtin/editor.epic_open_editor_for_asset
    group: editor
    description: >-
      [Epic EditorToolset.EditorAppToolset] Opens an asset editor for the
      specified asset. Params: assetPath
  editor.epic_screen_coords_to_world:
    class_path: ue-mcp.builtin/editor.epic_screen_coords_to_world
    group: editor
    description: >-
      [Epic EditorToolset.EditorAppToolset] Finds the world position of the
      nearest solid object at a given set of normalized view space coords.
      Params: coords, traceDistance?
  editor.epic_search_cvars:
    class_path: ue-mcp.builtin/editor.epic_search_cvars
    group: editor
    description: >-
      [Epic EditorToolset.EditorAppToolset] Finds all console variables that
      contain a given name. Params: name
  editor.epic_select_actors:
    class_path: ue-mcp.builtin/editor.epic_select_actors
    group: editor
    description: >-
      [Epic EditorToolset.EditorAppToolset] Selects the specified actors in the
      current scene. Params: actors
  editor.epic_select_assets:
    class_path: ue-mcp.builtin/editor.epic_select_assets
    group: editor
    description: >-
      [Epic EditorToolset.EditorAppToolset] Selects the specified assets in the
      content browser. Completes once the content browser has applied the
      selection. Params: assetPaths
  editor.epic_set_camera_transform:
    class_path: ue-mcp.builtin/editor.epic_set_camera_transform
    group: editor
    description: >-
      [Epic EditorToolset.EditorAppToolset] Sets the position and rotation of
      the level viewport camera. Params: transform
  editor.epic_set_content_browser_path:
    class_path: ue-mcp.builtin/editor.epic_set_content_browser_path
    group: editor
    description: >-
      [Epic EditorToolset.EditorAppToolset] Navigates the active content browser
      to the specified folder path. Params: path
  editor.epic_set_verbosity:
    class_path: ue-mcp.builtin/editor.epic_set_verbosity
    group: editor
    description: >-
      [Epic EditorToolset.LogsToolset] Sets the verbosity level for a log
      category. Params: category?, verbosity
  editor.epic_start_pie:
    class_path: ue-mcp.builtin/editor.epic_start_pie
    group: editor
    description: >-
      [Epic EditorToolset.EditorAppToolset] Starts a Play-In-Editor or
      Simulate-In-Editor session using the current level. Completes after the
      engine fires PostPIEStarted (session fully started, BeginPlay called) and
      Options.WarmupSeconds have elapsed, giving project- specific
      initialization (services, authentication, plugin warmup) time to settle
      before the agent inspects state or logs. Raises an error if a play session
      is already running. Params: options
  editor.epic_stop_pie:
    class_path: ue-mcp.builtin/editor.epic_stop_pie
    group: editor
    description: >-
      [Epic EditorToolset.EditorAppToolset] Stops the currently running play
      session (PIE or Simulate). Raises an error if no play session is running.
      Params: none
  editor.epic_world_pos_to_screen_coords:
    class_path: ue-mcp.builtin/editor.epic_world_pos_to_screen_coords
    group: editor
    description: >-
      [Epic EditorToolset.EditorAppToolset] Converts a world-space position into
      normalized screen space based on the editor viewport camera. Params:
      position
  reflection.reflect_class:
    class_path: ue-mcp.builtin/reflection.reflect_class
    group: reflection
    description: >-
      Reflect UClass. className accepts the C++ spelling with or without the
      A/U/F/E prefix (UMyConfig and MyConfig both resolve), a
      /Script/Module.ClassName path, or a Blueprint class path; a failed lookup
      lists the spellings tried and the closest matches (#823). Params:
      className, includeInherited?
  reflection.reflect_instance:
    class_path: ue-mcp.builtin/reflection.reflect_instance
    group: reflection
    description: >-
      Per-instance writable schema: what can be written on THIS asset, CDO or
      subobject right now. reflect_class answers what a class has; this answers
      what the object in front of you will accept, which is what removes the
      write-and-see loop. Per property: type and kind, the same
      tooltip/category/displayName/clamp/UI-range/units metadata reflect_class
      reports, the UPROPERTY flag names, the current value and valueText, and
      the constraints a write has to satisfy - enum values, allowed and
      disallowed classes for an object reference, array/set element type, map
      key and value types, struct field layout, container element count.
      Instance state on top of that: 'editable' with a 'notEditableReason'
      (EditConst, EditDefaultsOnly read on an instance, EditInstanceOnly read on
      defaults), the EditCondition and whether it is met on THIS object,
      'settable' saying whether asset/editor(set_property) can write it at all,
      and 'valueObjectPath' for an instanced subobject so the next call can aim
      at it. objectPath takes an asset path, an object path, a class path or a
      Blueprint path (its generated-class defaults). propertyPath scopes the
      read to one nested struct or object reference. Params: objectPath,
      propertyPath?, filter?, includeInherited?, includeValues?, editableOnly?,
      maxDepth?, cursor?, limit?
  reflection.reflect_struct:
    class_path: ue-mcp.builtin/reflection.reflect_struct
    group: reflection
    description: 'Reflect UScriptStruct. Params: structName'
  reflection.reflect_enum:
    class_path: ue-mcp.builtin/reflection.reflect_enum
    group: reflection
    description: >-
      Reflect UEnum by full path, short name, or short name without the E
      prefix. Resolves native enums in any loaded module and loads unloaded
      Blueprint (UserDefinedEnum) assets via the asset registry. Returns
      enumPath, userDefined, and per-value name/value/displayName/tooltip; a
      failed lookup lists close matches (#762). Params: enumName
  reflection.list_classes:
    class_path: ue-mcp.builtin/reflection.list_classes
    group: reflection
    description: >-
      List classes. parentFilter resolves with or without the C++ A/U/F/E prefix
      (#823). Rows carry name, path and parent, sorted by path so a page
      boundary is stable. Params: parentFilter?, cursor?, limit?
  reflection.list_structs:
    class_path: ue-mcp.builtin/reflection.list_structs
    group: reflection
    description: >-
      List UScriptStructs, native and user-defined. Rows carry name (the
      registered spelling, without the F prefix), cppName (with it), path,
      package, parent, native and tableRow (derives from FTableRowBase, so
      usable as a DataTable row struct), sorted by path so a page boundary is
      stable. package narrows to one package or content folder: /Script/Engine,
      a bare module name (Engine), or /Game/Data. filter is a case-insensitive
      substring of name or cppName (#1088). Params: package?, filter?, cursor?,
      limit?
  reflection.list_tags:
    class_path: ue-mcp.builtin/reflection.list_tags
    group: reflection
    description: >-
      List gameplay tags, optionally only those under a prefix. Params: filter?,
      cursor?, limit?
  reflection.create_tag:
    class_path: ue-mcp.builtin/reflection.create_tag
    group: reflection
    description: >-
      Create a gameplay tag in Config/DefaultGameplayTags.ini. Registers it live
      through the Gameplay Tags editor when that module is loaded
      (method=gameplay_tags_editor, registeredLive=true, no restart); otherwise
      appends the ini entry and the tag appears after a restart
      (method=ini_append). Idempotent: a tag the ini already declares reports
      existed. A failure names the ini path and the cause, including a read-only
      (checked-in) file. Params: tag, comment?
  reflection.create_enum:
    class_path: ue-mcp.builtin/reflection.create_enum
    group: reflection
    description: >-
      Create UUserDefinedEnum asset, optionally seeded with entries: strings, or
      {name, displayName?} objects (#274). Params: name, packagePath?, entries?,
      onConflict?
  reflection.set_enum_entries:
    class_path: ue-mcp.builtin/reflection.set_enum_entries
    group: reflection
    description: >-
      Replace entries on an existing UUserDefinedEnum. entries takes the
      create_enum form: strings, or {name, displayName?} (#274). Params:
      assetPath, entries
  reflection.is_class_loaded:
    class_path: ue-mcp.builtin/reflection.is_class_loaded
    group: reflection
    description: >-
      Report whether a UClass is currently loaded in the editor (loaded),
      whether it exists/is loadable (exists), and its owning module + that
      module's load state. Distinguishes 'not loaded yet' from 'does not exist'.
      className takes a short name, /Script/<Module>.<Class>, or a BP class path
      (#689). Params: className (or class)
  reflection.is_module_loaded:
    class_path: ue-mcp.builtin/reflection.is_module_loaded
    group: reflection
    description: >-
      Report whether a named module is currently loaded (#689). Params:
      moduleName (or module)
  reflection.list_loaded_modules:
    class_path: ue-mcp.builtin/reflection.list_loaded_modules
    group: reflection
    description: >-
      Enumerate modules with runtime load state. filter is a case-insensitive
      substring; loadedOnly defaults to false. Returns modules[{name, loaded,
      gameModule}] + totalLoaded/totalModules (#689). Params: filter?,
      loadedOnly?, cursor?, limit?
  reflection.inspect_save_game:
    class_path: ue-mcp.builtin/reflection.inspect_save_game
    group: reflection
    description: >-
      Load a SaveGame slot read-only and return its reflected
      UPROPERTY(SaveGame) values. Non-serializable properties are listed in
      skippedProperties instead of failing the call. userIndex defaults to 0.
      Params: slotName, userIndex?
  reflection.epic_get_class:
    class_path: ue-mcp.builtin/reflection.epic_get_class
    group: reflection
    description: >-
      [Epic editor_toolset.toolsets.object.ObjectTools] Returns the class of an
      Unreal object. Params: instance
  reflection.epic_get_properties:
    class_path: ue-mcp.builtin/reflection.epic_get_properties
    group: reflection
    description: >-
      [Epic editor_toolset.toolsets.object.ObjectTools] Returns the values of
      one or more properties on an object. Params: instance, properties
  reflection.epic_list_properties:
    class_path: ue-mcp.builtin/reflection.epic_list_properties
    group: reflection
    description: >-
      [Epic editor_toolset.toolsets.object.ObjectTools] Returns a list of
      properties that are on the specified object. Params: instance
  reflection.epic_reset_properties:
    class_path: ue-mcp.builtin/reflection.epic_reset_properties
    group: reflection
    description: >-
      [Epic editor_toolset.toolsets.object.ObjectTools] Resets one or more
      properties on an object to their default values, removing any per-instance
      overrides. Params: instance, properties
  reflection.epic_search_subclasses:
    class_path: ue-mcp.builtin/reflection.epic_search_subclasses
    group: reflection
    description: >-
      [Epic editor_toolset.toolsets.object.ObjectTools] Finds all subclasses of
      a given class. Params: base_class, class_name
  reflection.epic_set_properties:
    class_path: ue-mcp.builtin/reflection.epic_set_properties
    group: reflection
    description: >-
      [Epic editor_toolset.toolsets.object.ObjectTools] Sets the values of
      properties on an object. Params: instance, values
  gameplay.set_collision_profile:
    class_path: ue-mcp.builtin/gameplay.set_collision_profile
    group: gameplay
    description: >-
      Set the collision preset on every primitive component of a placed actor.
      Reports existed=true and unchanged=true when every component already used
      that profile. Rolls back through this same action with the profile that
      was there, addressed by actorPath, and marked lossy when more than one
      component was written since the record carries the FIRST one's profile. No
      record at all when the previous profile read as the 'Custom' sentinel,
      which names no profile the engine can look up: the response says so rather
      than emitting an inverse that would restore nothing. Params: actorLabel OR
      actorPath, profileName
  gameplay.set_simulate_physics:
    class_path: ue-mcp.builtin/gameplay.set_simulate_physics
    group: gameplay
    description: >-
      Toggle physics simulation on every primitive component of a placed actor.
      Reports existed=true and unchanged=true when every component was already
      in that state. Rolls back through this same action with the previous flag,
      addressed by actorPath, and marked lossy when more than one component was
      written since the record carries the FIRST one's flag. Params: actorLabel
      OR actorPath, simulate (or enabled)
  gameplay.add_impulse:
    class_path: ue-mcp.builtin/gameplay.add_impulse
    group: gameplay
    description: >-
      Apply an impulse (or force with mode='force') to a (PIE) actor's
      simulating physics body so its motion can be observed over time - loop
      level(read_actor_motion) to sample the response. No inverse: the solver
      integrates the impulse immediately, so an opposite impulse cancels the
      velocity but not the motion, and the response says rollbackPossible=false
      with that reason. unchanged is MEASURED, from the body's linear and
      angular velocity read either side of the push, so mode='force' reports
      unchanged (a force is integrated over the next substep, not applied
      instantly) and so does a vector the solver absorbed. It does NOT mean a
      replay is safe: two calls are two impulses, which is why there is no
      already* flag (#676). Params: actorLabel OR actorPath, impulse (or force,
      or vector), mode?, componentName?, boneName?, location?, velChange?,
      accelChange?, world?, pieInstance?
  gameplay.set_collision_enabled:
    class_path: ue-mcp.builtin/gameplay.set_collision_enabled
    group: gameplay
    description: >-
      Set the collision mode on every primitive component of a placed actor:
      NoCollision | QueryOnly | PhysicsOnly | QueryAndPhysics. Reports
      existed=true and unchanged=true when every component already held that
      mode. Rolls back through this same action with the previous mode,
      addressed by actorPath; marked lossy when more than one component was
      written, because the record carries the mode read from the FIRST of them
      and components that differed all come back with that one's.
      gameplay(set_collision) with a componentName is the per-component form.
      Params: actorLabel OR actorPath, collisionEnabled (or collisionType)
  gameplay.set_collision:
    class_path: ue-mcp.builtin/gameplay.set_collision
    group: gameplay
    description: >-
      Unified collision authoring for a placed actor (actorLabel or actorPath)
      or a Blueprint component template (assetPath+componentName). Apply any of:
      collisionProfile, collisionEnabled
      (NoCollision|QueryOnly|PhysicsOnly|QueryAndPhysics), objectType (channel
      name), responseToAllChannels (Block|Overlap|Ignore), responses ({channel:
      Block|Overlap|Ignore}). Profile is applied first, then overrides.
      componentName optional for actors (defaults to all primitive components),
      required for Blueprint templates. Reports unchanged=true when the
      component already held everything the call wrote, compared against a full
      before/after read. The inverse is this same action with the previous
      values: writing a profile or responseToAllChannels resets the whole
      response table, so both make the record carry every channel, not only the
      ones named. A component whose profile read as the 'Custom' sentinel comes
      back through its collision mode, object type and full response table
      instead, since that name resolves to no profile; that and a
      multi-component target are the two cases marked lossy (#545). Params:
      actorLabel OR actorPath OR assetPath, componentName?, collisionProfile?,
      collisionEnabled?, objectType?, responseToAllChannels?, responses?
  gameplay.set_physics_properties:
    class_path: ue-mcp.builtin/gameplay.set_physics_properties
    group: gameplay
    description: >-
      Set mass/damping/gravity on every primitive component body of a placed
      actor. Only the fields passed are written, and only those are in the
      inverse, which is this same action carrying the values that were there. A
      call that passed none of them reports existed=true and unchanged=true
      rather than a bare success. Marked lossy when more than one component body
      was written, because the record carries the values read from the FIRST of
      them. Params: actorLabel OR actorPath, mass?, linearDamping?,
      angularDamping?, enableGravity?
  gameplay.rebuild_navigation:
    class_path: ue-mcp.builtin/gameplay.rebuild_navigation
    group: gameplay
    description: >-
      Rebuild navmesh. No inverse: the navmesh is derived data recomputed from
      the level, so nothing restores the previous one and the response says
      rollbackPossible=false. Params: none
  gameplay.find_nav_path:
    class_path: ue-mcp.builtin/gameplay.find_nav_path
    group: gameplay
    description: >-
      Synchronous nav-path query between two world points. Returns
      valid/partial/length plus the polyline. The standard 'why doesn't my AI
      move?' diagnostic. pathfindingContext (actor label) or
      pathfindingContextPath (object path) picks the agent and filter the query
      uses (#424/#983). Params: start, end, pathfindingContext?,
      pathfindingContextPath?
  gameplay.list_nav_invokers:
    class_path: ue-mcp.builtin/gameplay.list_nav_invokers
    group: gameplay
    description: >-
      Enumerate actors carrying a NavigationInvokerComponent + their tile
      generation/removal radii. Diagnoses 'no navmesh in this region' caused by
      missing or mis-sized invokers (#424). Params: none
  gameplay.get_navmesh_info:
    class_path: ue-mcp.builtin/gameplay.get_navmesh_info
    group: gameplay
    description: 'Query nav system. Params: none'
  gameplay.project_to_nav:
    class_path: ue-mcp.builtin/gameplay.project_to_nav
    group: gameplay
    description: 'Project point to navmesh. Params: location'
  gameplay.spawn_nav_modifier:
    class_path: ue-mcp.builtin/gameplay.spawn_nav_modifier
    group: gameplay
    description: >-
      Place a NavModifierVolume. The brush is built for real (a bare spawn
      leaves an AVolume with no geometry, which the engine skips entirely - it
      requires both Brush and AreaClass). extent is a HALF-size in world units,
      default 100. areaClass defaults to NavArea_Null, which cuts a hole in the
      navmesh; pass NavArea_Obstacle to make the region costly instead, or any
      UNavArea subclass. Params: location?, extent?, areaClass?, label?, scale?,
      onConflict?
  gameplay.create_input_action:
    class_path: ue-mcp.builtin/gameplay.create_input_action
    group: gameplay
    description: 'Create InputAction. Params: name, packagePath?, onConflict?, valueType?'
  gameplay.create_input_mapping:
    class_path: ue-mcp.builtin/gameplay.create_input_mapping
    group: gameplay
    description: 'Create InputMappingContext. Params: name, packagePath?, onConflict?'
  gameplay.list_input_assets:
    class_path: ue-mcp.builtin/gameplay.list_input_assets
    group: gameplay
    description: >-
      List input assets. Every InputAction and InputMappingContext is one row
      under `assets`, tagged with its kind and sorted by object path;
      inputActions and inputMappingContexts hold this page's rows of each kind,
      and inputActionCount / inputMappingContextCount count the whole listing.
      Params: cursor?, limit?
  gameplay.read_imc:
    class_path: ue-mcp.builtin/gameplay.read_imc
    group: gameplay
    description: >-
      Read InputMappingContext mappings. Returns {key, inputAction, triggers[],
      modifiers[]}. Params: imcPath (or mappingContext, or assetPath)
  gameplay.get_applied_imcs:
    class_path: ue-mcp.builtin/gameplay.get_applied_imcs
    group: gameplay
    description: >-
      Read applied Input Mapping Contexts (name, path, priority,
      registrationCount), highest priority first - the order Enhanced Input
      resolves in. Covers EVERY running PIE world by default, so a multiplayer
      client can be inspected, not just the primary/server world; narrow with
      pieInstance and/or playerIndex. Pass mappingContext for a direct
      hasRequestedContext yes/no. A remote controller with no LocalPlayer says
      so rather than reporting an empty list. BREAKING in 1.1.36: results are
      now nested under worlds[].players[] (was a flat appliedContexts[] for one
      world), the array is mappingContexts (was appliedContexts), each entry
      uses path (was imc), and a call with PIE stopped returns success with
      worldCount 0 instead of erroring (#604/#778). Params: pieInstance?,
      playerIndex?, mappingContext?, includeActions?
  gameplay.list_input_mappings:
    class_path: ue-mcp.builtin/gameplay.list_input_mappings
    group: gameplay
    description: >-
      Alias for read_imc. List key→action bindings with triggers/modifiers.
      Params: imcPath
  gameplay.add_imc_mapping:
    class_path: ue-mcp.builtin/gameplay.add_imc_mapping
    group: gameplay
    description: >-
      Add key mapping to IMC. Idempotent: the same (action, key) pair reports
      existed. Rolls back through remove_imc_mapping on that pair, with nothing
      lost - the mapping is created bare. Returns saved, persisted,
      packageDirty, packageName, and persistError when not persisted. Params:
      imcPath (or mappingContext, or assetPath), inputActionPath (or
      inputAction), key, save?
  gameplay.set_mapping_modifiers:
    class_path: ue-mcp.builtin/gameplay.set_mapping_modifiers
    group: gameplay
    description: >-
      Set modifiers/triggers on an IMC mapping. Each modifier OR trigger is
      either {type:'<ShortName>', <prop>:<val>} or
      {class:'/Script/Module.Class', properties:{...}} - the class form resolves
      any custom UInputModifier/UInputTrigger subclass (e.g. type:'Hold' |
      class:'/Script/EnhancedInput.InputTriggerHold', with HoldTimeThreshold).
      Unresolvable trigger specs are reported in failedTriggers and never leave
      a null entry (#649/#725). Reports unchanged=true when the rebuilt lists
      hold the same classes carrying the same property values, compared as an
      export of every object's every property either side of the write - so
      retuning a Hold threshold on the same trigger class reads as an update
      rather than as a no-op. The inverse replays this call with the classes
      that were on the mapping, each rebuilt at its CLASS DEFAULTS, so it is
      marked lossy whenever the previous objects had tuned properties. Returns
      saved, persisted, packageDirty, packageName, and persistError when not
      persisted. Params: imcPath, mappingIndex?, modifiers?, triggers?, save?
  gameplay.remove_imc_mapping:
    class_path: ue-mcp.builtin/gameplay.remove_imc_mapping
    group: gameplay
    description: >-
      Remove an IMC mapping. Idempotent when selected by (inputActionPath +
      key): a pair that is not there reports alreadyDeleted=true, so a replayed
      rollback is safe. Rolls back through add_imc_mapping on the same pair,
      marked lossy because the mapping is re-added at the END of the list and
      its modifiers and triggers are not carried. Select the mapping by
      mappingIndex, or by inputActionPath plus key; save defaults to true.
      Returns saved, persisted, packageDirty, packageName, and persistError when
      not persisted (#158). Params: imcPath (or mappingContext, or assetPath),
      mappingIndex?, inputActionPath? (or inputAction), key?, save?
  gameplay.set_imc_mapping_key:
    class_path: ue-mcp.builtin/gameplay.set_imc_mapping_key
    group: gameplay
    description: >-
      Rebind an IMC mapping to a new key. Reports unchanged=true when the
      mapping already used that key, and otherwise rolls back to the previous
      key by mappingIndex, which this call does not move. Select the mapping by
      mappingIndex, key or inputActionPath. Returns saved, persisted,
      packageDirty, packageName, and persistError when not persisted (#158).
      Params: imcPath, newKey, mappingIndex?, key?, inputActionPath?, save?
  gameplay.set_imc_mapping_action:
    class_path: ue-mcp.builtin/gameplay.set_imc_mapping_action
    group: gameplay
    description: >-
      Retarget an IMC mapping to a different InputAction. Reports unchanged=true
      when the mapping already used that action, and otherwise rolls back to the
      previous action by mappingIndex. A mapping that had NO action before
      cannot be rolled back, because the inverse needs a loadable path; the
      response says so. Select the mapping by mappingIndex, key or
      inputActionPath. Returns saved, persisted, packageDirty, packageName, and
      persistError when not persisted (#158). Params: imcPath,
      newInputActionPath, mappingIndex?, key?, inputActionPath?, save?
  gameplay.read_input_action:
    class_path: ue-mcp.builtin/gameplay.read_input_action
    group: gameplay
    description: >-
      Read an InputAction back: valueType, actionDescription, the four
      consumption/pause flags, accumulationBehavior, playerMappableKeySettings,
      and the ACTION's own instanced triggers[] and modifiers[] with each one's
      class, current property values and objectPath. Nothing could read an
      InputAction before, so an authored one could not be verified. There are no
      typed setters for any scalar here: they are plain UPROPERTYs, so write
      them with editor(set_property) at the returned objectPath, and add or
      remove trigger/modifier entries with set_action_triggers. These arrays are
      the action's own, applied after every mapping's; read_imc reports the
      per-mapping ones. Returns inputActionPath, name, objectPath, valueType,
      triggers[], modifiers[], triggerCount, modifierCount. Params:
      inputActionPath
  gameplay.set_action_triggers:
    class_path: ue-mcp.builtin/gameplay.set_action_triggers
    group: gameplay
    description: >-
      Replace the ACTION's own Triggers and/or Modifiers arrays on an
      InputAction. asset(set_property) cannot do this: both are Instanced
      TArrays and the JSON property setter only assigns an object it can load
      from a path, so it can neither mint nor destroy the subobjects they hold.
      Each entry is {type:'Hold', HoldTimeThreshold:0.5} or
      {class:'/Script/EnhancedInput.InputTriggerHold', properties:{...}}, the
      same grammar set_mapping_modifiers takes, except an unresolvable class or
      an unknown property is an ERROR here rather than a silent drop, and both
      arrays are fully built before either is assigned. A supplied array
      replaces that array wholesale; an omitted one is left alone unless clear
      is true, which empties both. Repeating the same call reports
      unchanged=true. Rollback restores the exact prior arrays. Returns
      triggerCount, modifierCount, triggersReplaced, modifiersReplaced,
      unchanged. Params: inputActionPath, triggers?, modifiers?, clear?
  gameplay.set_player_mappable_settings:
    class_path: ue-mcp.builtin/gameplay.set_player_mappable_settings
    group: gameplay
    description: >-
      Create or update the protected Instanced UPlayerMappableKeySettings
      subobject on an InputAction. asset(set_property) cannot mint that
      subobject, and the pointer is protected, so this is the authoring path.
      mappingName is the stable FName saved with the mapping and must be
      non-empty. displayName and displayCategory are optional display text; an
      omitted one is left alone. Repeating the same write reports
      unchanged=true. save defaults to true. Returns the authored metadata plus
      saved, persisted, packageDirty and persistError when not persisted.
      Params: inputActionPath, mappingName, displayName?, displayCategory?,
      save?
  gameplay.apply_mapping_context:
    class_path: ue-mcp.builtin/gameplay.apply_mapping_context
    group: gameplay
    description: >-
      Apply an InputMappingContext to a LIVE PIE player at a priority, the write
      half get_applied_imcs never had. Calls the local player's Enhanced Input
      subsystem, which is an engine call rather than a property write, and
      forces the control-mapping rebuild immediately so the very next
      get_applied_imcs sees it. Idempotent: already applied at the same priority
      reports alreadyApplied=true and changes nothing; applied at a different
      priority reports previousPriority and rolls back to it. This is runtime
      state, so it affects the live player only and is gone when PIE stops.
      Returns mappingContext, priority, alreadyApplied, pieInstance,
      playerIndex, worldPath, scope. Params: mappingContext, priority?,
      pieInstance?, playerIndex?
  gameplay.remove_mapping_context:
    class_path: ue-mcp.builtin/gameplay.remove_mapping_context
    group: gameplay
    description: >-
      Remove an InputMappingContext from a LIVE PIE player. The inverse of
      apply_mapping_context and its rollback target. Idempotent: a context that
      is not applied reports alreadyAbsent=true rather than erroring, and
      rollback re-applies it at the priority it was removed from. Runtime state
      only, gone when PIE stops. Returns mappingContext, alreadyAbsent,
      removedPriority, pieInstance, playerIndex, worldPath. Params:
      mappingContext, pieInstance?, playerIndex?
  gameplay.get_action_value:
    class_path: ue-mcp.builtin/gameplay.get_action_value
    group: gameplay
    description: >-
      Read what an InputAction is worth on a LIVE PIE player right now: value
      {x,y,z}, magnitude, nonZero, triggerEvent, elapsedProcessedTime,
      elapsedTriggeredTime, lastTriggeredWorldTime and the keys currently mapped
      to it. This is the only way to prove input arrived, because
      FInputActionInstance is transient per-player state and its accessors are
      plain C++ methods, not UFUNCTIONs, so editor(invoke_function) cannot reach
      them. Omit inputActionPath for every action the player currently has
      bound. An action with hasInstanceData=false is bound by no applied
      context, which is a different failure from bound-but-reading-zero. The
      engine zeroes value outside a Triggered event, so read triggerEvent before
      concluding nothing arrived. Returns actions[], actionCount, pieInstance,
      playerIndex, worldPath. Params: inputActionPath?, pieInstance?,
      playerIndex?
  gameplay.validate_input:
    class_path: ue-mcp.builtin/gameplay.validate_input
    group: gameplay
    description: >-
      Audit Enhanced Input assets for the failures that produce no error
      anywhere: a mapping with no InputAction, a key name that is not a
      registered FKey, a duplicate action plus key pair inside one context, a
      null entry in a Triggers or Modifiers array (which fails asset validation
      on save), an empty mapping context, an InputAction no context maps, and
      the quiet one, an Axis2D/Axis3D action driven by a 1D or boolean key with
      no Swizzle Input Axis Values modifier on the mapping or the action, which
      reads zero on every component past X forever. Pass imcPath for one
      context, or sweep every InputMappingContext under directory. Read-only.
      Returns scanned[], contextCount, mappingsChecked, unmappedActions[],
      problems[] ({severity, code, message, asset, mappingIndex}), errorCount,
      warningCount, valid. Params: imcPath?, directory?, recursive?, limit?
  gameplay.list_behavior_trees:
    class_path: ue-mcp.builtin/gameplay.list_behavior_trees
    group: gameplay
    description: 'List behavior trees, sorted by object path. Params: cursor?, limit?'
  gameplay.get_behavior_tree_info:
    class_path: ue-mcp.builtin/gameplay.get_behavior_tree_info
    group: gameplay
    description: >-
      Inspect a BehaviorTree asset: root node, blackboard asset, every
      blackboard key (name, type, instanceSynced, description) plus the keys
      inherited from the blackboard's parent chain, and the node/decorator
      counts (#887). Params: assetPath (or path)
  gameplay.read_behavior_tree_graph:
    class_path: ue-mcp.builtin/gameplay.read_behavior_tree_graph
    group: gameplay
    description: >-
      Walk a BT asset: composites, tasks, decorators, services, each with a
      stable nodePath ('Root.Children[0].Decorators[1]') you pass to
      read_bt_node_properties / set_bt_node_property. Every decorator reports
      its full runtime config - blackboardKey {selectedKeyName,
      selectedKeyType}, basicOperation (Set|NotSet), arithmeticOperation,
      textOperation, flowAbortMode, notifyObserver, inverseCondition,
      int/float/stringValue and staticDescription - which is what answers 'the
      tree is running but the wrong branch fires'. Set includeProperties for
      each node's own UPROPERTY values, propertyNames to narrow those,
      includeInherited to keep UBTNode's own fields (#888). Params: assetPath
      (or path), includeProperties?, includeInherited?, propertyNames?
  gameplay.read_bt_node_properties:
    class_path: ue-mcp.builtin/gameplay.read_bt_node_properties
    group: gameplay
    description: >-
      Filtered read of BT node UPROPERTY values: pick nodes by nodeClass,
      nodeName, nodePath or kind and get back only their own properties, instead
      of an unfiltered whole-asset dump. Narrow further with propertyNames. A UE
      5.8 FValueOrBBKey_* field (AcceptableRadius, WaitTime, FilterClass) is
      unpacked into {defaultValue, key, isBound, baseClass, text}; class
      defaults use the canonical class object path while text preserves Unreal's
      export form (#919). Params: assetPath (or path), nodeClass?, nodeName?,
      nodePath?, kind?, propertyNames?, includeInherited?
  gameplay.list_bt_tasks:
    class_path: ue-mcp.builtin/gameplay.list_bt_tasks
    group: gameplay
    description: >-
      Inventory BTTask nodes with their name, class, parent path and
      FilterClass. Pass assetPath for one tree, or directory (+recursive) to
      sweep many. On UE 5.8 BTTask_MoveTo.FilterClass is a FValueOrBBKey_Class,
      so it is reported as {defaultValue, defaultValueName, key, isBound,
      baseClass, text} - the shape get_editor_property reads as empty.
      filterClassOnly keeps only tasks that declare one (#940). Params:
      assetPath?, directory?, recursive?, taskClass?, filterClassOnly?, limit?,
      nodeClass?, nodeName?, nodePath?, kind?
  gameplay.set_bt_node_property:
    class_path: ue-mcp.builtin/gameplay.set_bt_node_property
    group: gameplay
    description: >-
      Scoped write onto one owned BT node subobject. Pick the node with nodePath
      (from read_behavior_tree_graph), nodeName, nodeClass or kind - the write
      refuses to run unless exactly one node matches - then set property +
      value, or a properties map of dotted/indexed paths ('Lines[1].Text',
      'BlackboardKey.SelectedKeyName'). A scalar aimed at a UE 5.8
      FValueOrBBKey_* field lands on its DefaultValue; an object writes the
      struct's own fields, so {Key: 'MyKey'} binds it to a blackboard key. Every
      target is read back and reported with its previous value (#919). Params:
      assetPath (or path), nodePath?, nodeName?, nodeClass?, kind?, property?,
      value?, properties?
  gameplay.list_bt_graph_nodes:
    class_path: ue-mcp.builtin/gameplay.list_bt_graph_nodes
    group: gameplay
    description: >-
      List the EDITOR-GRAPH nodes of a BehaviorTree, which is the layer
      add_bt_node / move_bt_node / remove_bt_node address. Each entry carries
      its guid (the primary key: stable across recompiles and unaffected by
      inserting a sibling), category (root|composite|task|decorator|service),
      class, parentGuid, indexInParent, childGuids in execution order,
      decoratorGuids, serviceGuids, graph position and any node error.
      runtimePath cross-references the same node's read address
      ('Root.Children[0]') so one listing serves both surfaces. A tree that has
      never been opened in the BT editor reports hasGraph false and no nodes;
      add_bt_node seeds the graph (#889). Params: assetPath (or path)
  gameplay.add_bt_node:
    class_path: ue-mcp.builtin/gameplay.add_bt_node
    group: gameplay
    description: >-
      Add a composite, task, decorator or service to a BehaviorTree's editor
      graph and recompile it into the runnable tree. This is the authoring half
      that reflection cannot reach: UBehaviorTreeGraph::UpdateAsset, which turns
      the graph into the UBTCompositeNode tree, is editor-only and unexposed, so
      nodes spawned by script alone never become a valid tree. parent takes a
      guid from list_bt_graph_nodes, a runtime address from
      read_behavior_tree_graph, a unique node name, or 'root' (the default).
      Decorators and services attach as subnodes of their parent rather than as
      children. index places the node among its siblings, which is the execution
      order a Selector or Sequence is defined by; on a SimpleParallel it picks
      the output (0 = main task, 1 = background). properties writes UPROPERTY
      values (a bare number aimed at a UE 5.8 FValueOrBBKey_* field lands on its
      DefaultValue), and blackboardKeys points FBlackboardKeySelector fields at
      named blackboard keys, resolved against the tree's blackboard (#889).
      Params: assetPath (or path), nodeClass, nodeCategory?, parent?, index?,
      nodeName?, properties?, blackboardKeys?
  gameplay.move_bt_node:
    class_path: ue-mcp.builtin/gameplay.move_bt_node
    group: gameplay
    description: >-
      Reconnect a BehaviorTree node to a different parent, reorder it among its
      siblings, or both, then recompile. Pass parent to reparent and index to
      reorder; at least one is required. Child order is what a Selector or
      Sequence executes by, so this is behaviour rather than layout. Decorators
      and services move between their owners' subnode lists. Moving a node under
      itself or its own descendant is refused, and the whole subtree travels
      with it. Returns the parent's siblingOrder after the compile (#947).
      Params: assetPath (or path), node (or nodePath), parent?, index?
  gameplay.remove_bt_node:
    class_path: ue-mcp.builtin/gameplay.remove_bt_node
    group: gameplay
    description: >-
      Delete a node from a BehaviorTree's editor graph and recompile. A
      composite takes its whole branch with it, so the compiled tree never
      reports nodes that no longer run. Decorators and services detach from
      their owner. The root node cannot be removed. Returns every removed node's
      guid and class (#889). Params: assetPath (or path), node (or nodePath)
  gameplay.set_bt_task_property:
    class_path: ue-mcp.builtin/gameplay.set_bt_task_property
    group: gameplay
    description: >-
      Write a property on one BT task node, FilterClass included. Same selector
      and dotted-path rules as set_bt_node_property. Retarget a MoveTo filter
      with property='FilterClass' and a class path, a short class name or a
      Blueprint asset path; pass null to clear it, or {Key: 'MyKey'} to bind it
      to a blackboard key. The new value is read back and returned (#940).
      Params: assetPath (or path), nodePath?, nodeName?, nodeClass?, kind?,
      property?, value?, properties?
  gameplay.create_blackboard:
    class_path: ue-mcp.builtin/gameplay.create_blackboard
    group: gameplay
    description: 'Create Blackboard. Params: name, packagePath?, onConflict?'
  gameplay.add_blackboard_key:
    class_path: ue-mcp.builtin/gameplay.add_blackboard_key
    group: gameplay
    description: >-
      Add a typed key to a Blackboard asset. baseClass types an Object/Class key
      - Behaviour Tree nodes filter on it, so an untyped key silently will not
      bind. For keyType=Enum pass the enum via enumType (or baseClass).
      Idempotent: a key of that name already on the Blackboard reports
      existed=true and emits no record, so a replay cannot delete a key it did
      not create. A key this call DID declare rolls back exactly, through
      remove_blackboard_key on the same name, and that action is itself
      idempotent on a name it cannot find (#250). Params: blackboardPath,
      keyName, keyType?, baseClass?, enumType?
  gameplay.remove_blackboard_key:
    class_path: ue-mcp.builtin/gameplay.remove_blackboard_key
    group: gameplay
    description: >-
      Remove a key from a Blackboard asset by name. Idempotent. Rolls back
      through add_blackboard_key with the key type it carried, including the
      baseClass of an Object/Class key and the enum of an Enum key. Always
      marked lossy: that action takes a name and a type and nothing else, so
      bInstanceSynced and the editor-only description and category are not
      restored, and a key that was not the last one comes back appended with a
      new key ID (Behaviour Tree nodes bind by name, so they still resolve). A
      key whose type is not one of the ten add_blackboard_key accepts - a
      NativeEnum key, or any project-defined UBlackboardKeyType subclass - gets
      no record at all rather than one that would be refused on replay (#469).
      Params: blackboardPath, keyName
  gameplay.set_blackboard_parent:
    class_path: ue-mcp.builtin/gameplay.set_blackboard_parent
    group: gameplay
    description: >-
      Set Parent on a BlackboardData asset (canonical UE child-of-parent
      pattern). Pass parentPath="None" or omit to clear. autoPruneDuplicateKeys
      (default true) removes own-keys that the parent chain already defines so
      the BT compiler accepts the child (#469). Params: blackboardPath,
      parentPath?, autoPruneDuplicateKeys?
  gameplay.read_blackboard:
    class_path: ue-mcp.builtin/gameplay.read_blackboard
    group: gameplay
    description: >-
      Read a Blackboard asset: parent path, ownKeys, inheritedKeys (walks the
      parent chain) (#469). Params: blackboardPath (or assetPath)
  gameplay.list_bt_node_classes:
    class_path: ue-mcp.builtin/gameplay.list_bt_node_classes
    group: gameplay
    description: >-
      Enumerate every concrete BehaviorTree node class on this build
      (composites, tasks, decorators, services). Filter by kind to narrow; an
      unrecognised kind is refused rather than answered with an empty palette.
      Every class is one row under `classes`, tagged with its kind and sorted by
      class path within each kind; composites/tasks/decorators/services hold
      this page's rows of each kind, and
      compositeCount/taskCount/decoratorCount/serviceCount count the whole
      build. Useful for discovering plugin-supplied decorator/task classes
      without grepping engine + plugin source (#494). Params: kind?, cursor?,
      limit?
  gameplay.set_behavior_tree_blackboard:
    class_path: ue-mcp.builtin/gameplay.set_behavior_tree_blackboard
    group: gameplay
    description: >-
      Rebind a BehaviorTree asset's BlackboardAsset reference. The C++ field is
      protected so reflection is the only writable path (#250). Params:
      behaviorTreePath, blackboardPath
  gameplay.create_behavior_tree:
    class_path: ue-mcp.builtin/gameplay.create_behavior_tree
    group: gameplay
    description: >-
      Create behavior tree. blackboardPath is assigned before the first save; an
      unknown path creates nothing. Params: name, packagePath?, onConflict?,
      blackboardPath?
  gameplay.create_eqs_query:
    class_path: ue-mcp.builtin/gameplay.create_eqs_query
    group: gameplay
    description: 'Create EQS query. Params: name, packagePath?, onConflict?'
  gameplay.list_eqs_queries:
    class_path: ue-mcp.builtin/gameplay.list_eqs_queries
    group: gameplay
    description: 'List EQS queries. Params: none'
  gameplay.list_eqs_types:
    class_path: ue-mcp.builtin/gameplay.list_eqs_types
    group: gameplay
    description: >-
      List every EQS generator, test and context class this build has, with the
      short name the editor's dropdown shows (which add_eqs_generator and
      add_eqs_test both accept) and the full class path. Every class is one row
      under `types`, tagged with its kind and sorted by class path within each
      kind; generators/tests/contexts hold this page's rows of each kind, and
      generatorCount/testCount/contextCount count the whole build. Call this
      before authoring: the class names are long and guessing one costs a round
      trip. Params: filter?, cursor?, limit?
  gameplay.read_eqs_query:
    class_path: ue-mcp.builtin/gameplay.read_eqs_query
    group: gameplay
    description: >-
      Read an EQS query's structure back: every option with its generator, every
      test with its index, class, purpose (Filter|Score|FilterAndScore), filter
      type, scoring equation, and the objectPath that editor(set_property) uses
      to configure it. Also reports problems[] and runnable: an option with no
      generator produces no items, and a query whose tests are all filter-only
      scores every survivor equally so its 'best' item is arbitrary. This is how
      you verify authoring without opening the editor. Params: queryPath
  gameplay.add_eqs_generator:
    class_path: ue-mcp.builtin/gameplay.add_eqs_generator
    group: gameplay
    description: >-
      Add an option with a generator to an EQS query, which is what makes it
      produce items at all. generatorClass takes the short name
      ('ActorsOfClass', 'OnCircle', 'SimpleGrid') or a full class path;
      list_eqs_types lists them. Returns generatorObjectPath, which
      editor(set_property) uses to tune the generator (radius, extents, class
      filters). Two options with the same generator class are allowed, because
      two donuts at different radii is a real thing to want. Params: queryPath,
      generatorClass
  gameplay.add_eqs_test:
    class_path: ue-mcp.builtin/gameplay.add_eqs_test
    group: gameplay
    description: >-
      Add a test to one option of an EQS query. testClass takes the short name
      ('Distance', 'Trace', 'Pathfinding', 'Dot') or a full path. purpose sets
      what the test is for: filter discards items, score ranks them, both does
      each. Returns testObjectPath for editor(set_property), which is how
      ScoringFactor, FilterType, FloatValueMin/Max, ScoringEquation and the
      test's own parameters are set. Params: queryPath, testClass, optionIndex?,
      purpose?
  gameplay.remove_eqs_option:
    class_path: ue-mcp.builtin/gameplay.remove_eqs_option
    group: gameplay
    description: >-
      Remove a whole option, generator and all its tests, from an EQS query.
      Without this an option could be added and never taken away, which left
      add_eqs_generator with no inverse. Idempotent: an index past the end
      reports alreadyRemoved rather than failing. Emits a rollback that restores
      the generator class, and says plainly that generator tuning and the
      option's tests are NOT restored by it. Params: queryPath, optionIndex
  gameplay.remove_eqs_test:
    class_path: ue-mcp.builtin/gameplay.remove_eqs_test
    group: gameplay
    description: >-
      Remove one test from an option by index. Reports remainingTests and warns
      that later indices shifted down, which matters when removing several in
      one pass. Params: queryPath, testIndex, optionIndex?
  gameplay.reorder_eqs_tests:
    class_path: ue-mcp.builtin/gameplay.reorder_eqs_tests
    group: gameplay
    description: >-
      Reorder an option's tests. Test order matters in EQS: a cheap filter
      placed first discards items before an expensive test (a trace, a pathfind)
      ever runs on them. order is the current indices in the order you want
      them, and must be a full permutation, so a mistake is refused rather than
      silently dropping a test. Params: queryPath, order, optionIndex?
  gameplay.list_ai_agents:
    class_path: ue-mcp.builtin/gameplay.list_ai_agents
    group: gameplay
    description: >-
      List every actor in a live world carrying a BrainComponent, with its pawn
      and controller identity, running/paused state, current and root
      BehaviorTree, active node and blackboard asset. Call this FIRST: it is how
      you discover a target for the other BT runtime actions. A zero result
      reports how many actors were scanned and how many brains were found,
      because AI only exists in a game world. Params: world?, pieInstance?,
      runningOnly?, behaviorTreeOnly?, classFilter?, limit?
  gameplay.get_bt_runtime:
    class_path: ue-mcp.builtin/gameplay.get_bt_runtime
    group: gameplay
    description: >-
      Read the LIVE execution path of a running BehaviorTree, which is what
      tells you whether an authored tree actually works. Returns the active node
      with its task status, the composite ancestor chain above it, current
      versus root tree (so a running subtree is visible),
      running/paused/restartPending/abortPending, the decorators and services
      currently active, and the engine's own DescribeActiveTasks dump. A tree
      must have been started first, by run_behavior_tree or the game's own
      BeginPlay; the first search runs on the next tick, so activeNode is null
      immediately after a start. Pass actorLabel or actorPath. Params:
      actorLabel?, actorPath?, world?, pieInstance?, includeAuxNodes?,
      includeDebugStrings?
  gameplay.get_live_blackboard:
    class_path: ue-mcp.builtin/gameplay.get_live_blackboard
    group: gameplay
    description: >-
      Dump every key on a running BlackboardComponent with its name, key id,
      type, instance-sync flag, the engine's own value description, and a typed
      value for Bool/Int/Float/String/Name/Vector/Rotator/Object/Class/Enum.
      Requires a blackboard to have been initialised, which happens when a tree
      with a BlackboardAsset starts. Pass key for one entry; a miss lists every
      real key name. Pass actorLabel or actorPath. Params: actorLabel?,
      actorPath?, world?, pieInstance?, key?, verbosity?
  gameplay.set_live_blackboard:
    class_path: ue-mcp.builtin/gameplay.set_live_blackboard
    group: gameplay
    description: >-
      Write one key on a running blackboard through the typed SetValueAs
      accessor, so the key-change notification fires and observing decorators
      re-evaluate their branch. A raw property write would NOT notify, which is
      why this exists. Reports the previous and current value, changed, and
      alreadySet when the key already held it, and emits a rollback that writes
      the captured previous value back. Pass actorLabel or actorPath. Params:
      actorLabel?, actorPath?, world?, pieInstance?, key, value?, clear?
  gameplay.run_behavior_tree:
    class_path: ue-mcp.builtin/gameplay.run_behavior_tree
    group: gameplay
    description: >-
      Start a BehaviorTree on a live agent via AAIController::RunBehaviorTree,
      which also creates the BehaviorTree component and initialises the
      blackboard. Idempotent: the same tree already running returns
      alreadyRunning without restarting unless restartIfRunning is set. Rollback
      stops the tree, or restarts whatever was running before, marked lossy
      because a restart cannot restore execution position. Pass actorLabel or
      actorPath. Params: assetPath (or behaviorTreePath), actorLabel?,
      actorPath?, world?, pieInstance?, executionMode?, restartIfRunning?
  gameplay.stop_behavior_tree:
    class_path: ue-mcp.builtin/gameplay.stop_behavior_tree
    group: gameplay
    description: >-
      Stop, restart, pause or resume a running BehaviorTree. Safe to call twice:
      a stop on a stopped tree returns alreadyStopped and a pause on a paused
      one alreadyPaused. Pause and resume roll back to each other; stop rolls
      back to a run of the tree that was running, marked lossy because the
      instance stack it destroyed cannot be re-entered. Pass actorLabel or
      actorPath. Params: actorLabel?, actorPath?, world?, pieInstance?, mode?,
      reason?, completeRestart?
  gameplay.read_perception:
    class_path: ue-mcp.builtin/gameplay.read_perception
    group: gameplay
    description: >-
      Read an AIPerceptionComponent, from a Blueprint's construction script or a
      live actor, and return every sense config with its class, maxAge,
      startsEnabled, affiliation flags, full parameter dump and objectPath. Tune
      any sense with editor(set_property) at that objectPath; there are
      deliberately no per-parameter setters. A problems[] array names the faults
      a setup cannot report about itself: no sense configs at all, every sense
      starting disabled, LoseSightRadius below SightRadius, all affiliation
      flags false, and no sight stimuli source anywhere in the world. Pass
      blueprintPath, or actorLabel or actorPath. Params: blueprintPath?,
      actorLabel?, actorPath?, world?, pieInstance?, componentName?
  gameplay.remove_sense:
    class_path: ue-mcp.builtin/gameplay.remove_sense
    group: gameplay
    description: >-
      Delete one sense config from an AIPerceptionComponent template's Instanced
      SensesConfig array. set_property cannot do this because it cannot destroy
      instanced subobjects. Idempotent: an index past the end, or a sense that
      is not configured, returns alreadyRemoved rather than failing, so a
      rollback replays safely. Emits a configure_sense rollback carrying every
      value that differed from the class defaults, and reports rollbackIsLossy
      plus rollbackUncapturedProperties when a tuned value could not be
      represented. Pass index or senseType. Params: blueprintPath, index?,
      senseType?, componentName?
  gameplay.get_perceived_actors:
    class_path: ue-mcp.builtin/gameplay.get_perceived_actors
    group: gameplay
    description: >-
      List what an AI currently perceives, what it still remembers, and which of
      those are hostile, each with distance, stimulus age and last-known
      location. This reads PerceptualData, a bare C++ TMap that is not a
      UPROPERTY, so nothing else on this surface can reach it. Finds the
      component on the actor or on the AIController possessing it. An empty
      result explains the usual causes rather than returning a bare zero. Pass
      actorLabel or actorPath. Params: actorLabel?, actorPath?, world?,
      pieInstance?, senseType?
  gameplay.check_perception:
    class_path: ue-mcp.builtin/gameplay.check_perception
    group: gameplay
    description: >-
      Answer whether one actor perceives another right now, with the youngest
      stimulus age, the last known location, and how far that has drifted from
      the target's real position. Breaks the answer down per configured sense,
      so you can see which sense is carrying the detection and which is not
      firing. Uses HasAnyActiveStimulus and GetYoungestStimulusAge, which are
      not UFUNCTIONs and so cannot be reached through editor(invoke_function).
      Pass perceiverLabel or perceiverPath, and targetLabel or targetPath.
      Params: perceiverLabel?, perceiverPath?, targetLabel?, targetPath?,
      world?, pieInstance?
  gameplay.report_noise_event:
    class_path: ue-mcp.builtin/gameplay.report_noise_event
    group: gameplay
    description: >-
      Inject a hearing or damage stimulus into a live world so a perception
      setup can be exercised without a real game event. Reports which perception
      components in the world have that sense configured, with each listener's
      distance and, for hearing, whether the noise falls inside its
      HearingRange, so an event nobody could receive is distinguishable from a
      silent one. The stimulus is delivered on the AI system's next update, so
      read the outcome with check_perception or get_perceived_actors. Params:
      senseType?, location?, loudness?, maxRange?, instigatorLabel?,
      instigatorPath?, tag?, targetLabel?, targetPath?, amount?, hitLocation?,
      world?, pieInstance?
  gameplay.run_eqs_query:
    class_path: ue-mcp.builtin/gameplay.run_eqs_query
    group: gameplay
    description: >-
      Run an EQS query against a live world and return the scored items, which
      is the only way to know an authored query does what you meant. Returns
      each item's score and location, plus actorLabel/actorPath for actor items,
      sorted by the engine's own ranking. Needs a world with an AI system, so
      PIE rather than the pure editor world. querierLabel names the actor the
      query runs FROM, which every querier-relative context resolves against;
      without one those contexts silently produce nothing. An empty result is
      not an error and explains itself: runMode 'all' returns only items that
      pass every filter test, so a filter left at its default range rejects
      nearly everything, while 'best' ranks instead and still returns one.
      Params: queryPath, querierLabel?, querierPath?, runMode?, world?,
      pieInstance?, limit?
  gameplay.add_perception:
    class_path: ue-mcp.builtin/gameplay.add_perception
    group: gameplay
    description: >-
      Add an AIPerceptionComponent to a Blueprint and configure its senses.
      senses takes short names (Sight, Hearing, Damage, Touch, Team,
      Prediction), AISenseConfig_* names, or class paths - a component with no
      sense configs perceives nothing. Params: blueprintPath, senses?
  gameplay.configure_sense:
    class_path: ue-mcp.builtin/gameplay.configure_sense
    group: gameplay
    description: >-
      Add OR tune an AI perception sense config on the blueprint's
      AIPerceptionComponent. settings are applied whether the sense was just
      created or was already there, so 'add a sense then tune it' writes on the
      second call. Reports the three outcomes apart: created, existed+updated
      (changedProperties), existed+unchanged (unchangedProperties, asset
      untouched). An unknown settings key is refused with the valid property
      names and nothing is written; a value that will not convert restores what
      it had already applied. Params: blueprintPath, senseType?, settings?,
      componentName?
  gameplay.get_state_tree_runtime:
    class_path: ue-mcp.builtin/gameplay.get_state_tree_runtime
    group: gameplay
    description: >-
      Read a running StateTreeComponent's active state names in PIE (the 'brain'
      state) (#654). Params: actorLabel?, actorPath?, world?, pieInstance?,
      componentName?
  gameplay.create_state_tree:
    class_path: ue-mcp.builtin/gameplay.create_state_tree
    group: gameplay
    description: >-
      Create a StateTree with editor data, a schema and a root state, so
      states/tasks are authorable via statetree(*) and persist across save/load
      (#653). The schema is required for the tree to compile at all: omit it to
      take StateTreeComponentSchema, then StateTreeAIComponentSchema, then
      whatever concrete schema this editor has, and read schemaSource /
      schemaNote to see which was used. Refuses (and writes nothing) when a
      named schema does not resolve, or when the editor has no schema class at
      all, listing availableSchemas and naming the plugin to enable (#833).
      Params: name, packagePath?, onConflict?, schema?
  gameplay.list_state_trees:
    class_path: ue-mcp.builtin/gameplay.list_state_trees
    group: gameplay
    description: 'List StateTrees, sorted by object path. Params: cursor?, limit?'
  gameplay.add_state_tree_component:
    class_path: ue-mcp.builtin/gameplay.add_state_tree_component
    group: gameplay
    description: 'Add StateTreeComponent. Params: blueprintPath'
  gameplay.create_smart_object_def:
    class_path: ue-mcp.builtin/gameplay.create_smart_object_def
    group: gameplay
    description: >-
      Create SmartObjectDefinition. Pass defaultBehaviorClass to give it a
      default behavior definition, which is what makes every slot added later
      legal: the editor rejects a definition whose slot has no behavior and
      whose definition has no default. Returns definitionValid +
      defaultBehaviorCount (#833). Params: name, packagePath?, onConflict?,
      defaultBehaviorClass?, instanceProperties?
  gameplay.add_smart_object_component:
    class_path: ue-mcp.builtin/gameplay.add_smart_object_component
    group: gameplay
    description: 'Add SmartObjectComponent. Params: blueprintPath'
  gameplay.add_smart_object_slot:
    class_path: ue-mcp.builtin/gameplay.add_smart_object_slot
    group: gameplay
    description: >-
      Append a FSmartObjectSlotDefinition to a SmartObjectDefinition's Slots
      array. Pass behaviorClass to give the slot its behavior definition in the
      same call; without one the definition needs a default or the editor's
      asset check rejects the asset, which the response reports as
      definitionValid=false plus the exact fix. Returns the new slotIndex.
      Rollback removes the slot (#416/#833). Params: assetPath, name?, offset?,
      rotation?, tags?, behaviorClass?, instanceProperties?
  gameplay.set_smart_object_slot:
    class_path: ue-mcp.builtin/gameplay.set_smart_object_slot
    group: gameplay
    description: >-
      Mutate an existing slot's offset/rotation/tags/name. Omitted fields keep
      their current values (#416). Reports unchanged=true when the slot ends up
      identical, compared as exported struct text before and after. The inverse
      writes back exactly the fields this call overwrote, captured through the
      same type-checked accessors the writer uses, so a field supplied in the
      wrong JSON shape is neither written nor carried. Params: assetPath,
      slotIndex, name?, offset?, rotation?, tags?
  gameplay.remove_smart_object_slot:
    class_path: ue-mcp.builtin/gameplay.remove_smart_object_slot
    group: gameplay
    description: >-
      Remove a slot by index. Idempotent: out-of-range returns
      alreadyDeleted=true. Removing the LAST slot rolls back through
      add_smart_object_slot, which appends it to the same index (lossy on the
      slot BehaviorDefinitions, which that action can only restore one class of,
      with no instance values). Removing any other slot has no inverse, because
      re-adding would append it to the end and leave every later slotIndex
      shifted; the full removed slot is reported as removedSlot for manual
      recovery (#416). Params: assetPath, slotIndex
  gameplay.list_smart_object_slots:
    class_path: ue-mcp.builtin/gameplay.list_smart_object_slots
    group: gameplay
    description: >-
      List slots on a SmartObjectDefinition with index, offset, rotation, and
      raw text (#416). Params: assetPath
  gameplay.add_smart_object_slot_behavior:
    class_path: ue-mcp.builtin/gameplay.add_smart_object_slot_behavior
    group: gameplay
    description: >-
      Attach a behavior definition (UBehaviorDefinition asset or class) to a
      slot's BehaviorDefinitions array. Pass instanceProperties to seed
      UPROPERTYs on a freshly-spawned class-instance. No inverse: nothing
      removes an entry from a slot BehaviorDefinitions array, and removing the
      slot would undo more than this did, so the response says
      rollbackPossible=false and names the behaviorIndex it added (#416).
      Params: assetPath, slotIndex, behaviorClass, instanceProperties?
  gameplay.add_smart_object_default_behavior:
    class_path: ue-mcp.builtin/gameplay.add_smart_object_default_behavior
    group: gameplay
    description: >-
      Add a behavior definition to the SmartObjectDefinition's
      DefaultBehaviorDefinitions, the list every slot falls back to when it
      provides none of its own. This is the definition-wide half of
      add_smart_object_slot_behavior, and it is what makes an existing
      definition that already carries bare slots pass the editor's asset check.
      Returns definitionValid and, when slots are still short, the indices that
      are (#833). Params: assetPath, behaviorClass, instanceProperties?
  gameplay.create_game_mode:
    class_path: ue-mcp.builtin/gameplay.create_game_mode
    group: gameplay
    description: >-
      Create GameMode BP. parentClass must derive from GameModeBase (short name,
      /Script path, or a Blueprint asset path). Params: name, packagePath?,
      parentClass?
  gameplay.create_game_state:
    class_path: ue-mcp.builtin/gameplay.create_game_state
    group: gameplay
    description: >-
      Create GameState BP. parentClass must derive from GameStateBase. Params:
      name, packagePath?, parentClass?
  gameplay.create_player_controller:
    class_path: ue-mcp.builtin/gameplay.create_player_controller
    group: gameplay
    description: >-
      Create PlayerController BP. parentClass must derive from PlayerController.
      Params: name, packagePath?, parentClass?
  gameplay.create_player_state:
    class_path: ue-mcp.builtin/gameplay.create_player_state
    group: gameplay
    description: >-
      Create PlayerState BP. parentClass must derive from PlayerState. Params:
      name, packagePath?, parentClass?
  gameplay.create_hud:
    class_path: ue-mcp.builtin/gameplay.create_hud
    group: gameplay
    description: >-
      Create HUD BP. parentClass must derive from HUD. Params: name,
      packagePath?, parentClass?
  gameplay.set_world_game_mode:
    class_path: ue-mcp.builtin/gameplay.set_world_game_mode
    group: gameplay
    description: 'Set level GameMode override. Params: gameModeClass (or gameModePath)'
  gameplay.get_framework_info:
    class_path: ue-mcp.builtin/gameplay.get_framework_info
    group: gameplay
    description: 'Get level framework classes. Params: none'
  gameplay.ensure_mass_entity_config:
    class_path: ue-mcp.builtin/gameplay.ensure_mass_entity_config
    group: gameplay
    description: >-
      Idempotently create or update a MassEntityConfigAsset and author its
      ordered trait list. Needs the MassGameplay/MassSpawner plugins enabled,
      otherwise the call fails saying so. Each traits[] entry is {class (a
      concrete UMassEntityTraitBase subclass, or traitClass), properties?
      (fields written onto the trait instance, dotted paths allowed)}; the order
      is the asset's order and duplicate classes are refused. Every property is
      validated against a transient copy of the trait first, so a bad property
      late in the list leaves nothing half-authored, and the whole write runs
      inside one transaction. An existing asset may only be extended: fewer
      traits than it has, or a different class at an existing index, is refused
      as destructive rather than applied. onConflict is skip|error|update
      (default update). Returns assetPath, traits (count), propertiesSet, and
      created/existed/updated. Params: assetPath OR name, packagePath?, traits,
      onConflict?
  gameplay.read_mass_entity_config:
    class_path: ue-mcp.builtin/gameplay.read_mass_entity_config
    group: gameplay
    description: >-
      Read back a MassEntityConfigAsset authored by ensure_mass_entity_config:
      its ordered traits and every non-transient property on each one, exported
      as text (object and soft-object properties come back as asset paths).
      Needs the MassGameplay/MassSpawner plugins enabled. Returns assetPath,
      assetClass, traitClasses[] (class paths in order), traits[] ({index,
      classPath, className, properties}) and traitCount. Params: assetPath
  gameplay.list_mass_types:
    class_path: ue-mcp.builtin/gameplay.list_mass_types
    group: gameplay
    description: >-
      List the concrete UMassEntityTraitBase and UMassProcessor subclasses this
      editor has loaded, which is what ensure_mass_entity_config's
      traits[].class accepts and there was no way to discover. Each entry
      carries className, classPath, module, parentClass and the CDO objectPath,
      plus validTargetConfig for a trait and
      processingPhase/executionFlags/autoRegister/executionOrder for a
      processor. Those are all config UPROPERTYs on the default object, so tune
      them with editor(set_property) at objectPath; no typed setters are
      shipped. Enumerates LOADED classes only, so a Mass module nothing has
      referenced yet contributes nothing. Needs the MassGameplay and MassEntity
      plugins. Returns traits[], processors[], traitCount, processorCount,
      unavailable[], note. Params: kind?, filter?, limit?
  gameplay.remove_mass_trait:
    class_path: ue-mcp.builtin/gameplay.remove_mass_trait
    group: gameplay
    description: >-
      Remove one trait from a MassEntityConfigAsset's Config.Traits, the half of
      trait CRUD nothing could do. ensure_mass_entity_config refuses to shrink a
      config on purpose, and asset(set_property) cannot help because
      Config.Traits is an Instanced TArray whose subobjects a property write can
      neither mint nor destroy. Select with traitClass (idempotent: removes the
      first trait of that class, and a second call reports alreadyRemoved=true)
      or index (positional: removes whatever currently sits there). Removing the
      LAST trait rolls back exactly, through ensure_mass_entity_config with the
      captured prior list; removing an earlier one cannot, because
      ensure_mass_entity_config only appends, so the result says so and returns
      priorTraits plus the two-call recipe instead of a rollback that would
      fail. Returns assetPath, removedIndex, removedClass, traitCount,
      alreadyRemoved, rollbackAvailable. Params: assetPath, traitClass?, index?
  gameplay.reorder_mass_traits:
    class_path: ue-mcp.builtin/gameplay.reorder_mass_traits
    group: gameplay
    description: >-
      Set the order of a MassEntityConfigAsset's Config.Traits. Trait order is
      the order the entity template is built in, and nothing else could change
      it: ensure_mass_entity_config refuses an existing class that differs from
      the requested one at the same index. order is the current trait indices in
      the order wanted and must be a full permutation, validated in whole before
      anything moves. An identity permutation reports unchanged=true. Rollback
      is the inverse permutation, so this is an exact undo. Returns assetPath,
      traitCount, traitClasses[], unchanged. Params: assetPath, order
  gameplay.validate_mass_entity_config:
    class_path: ue-mcp.builtin/gameplay.validate_mass_entity_config
    group: gameplay
    description: >-
      Audit a MassEntityConfigAsset and its whole Config.Parent chain: parent
      cycles, a null or wrong-typed trait entry, an
      abstract/deprecated/reinstanced trait class, a trait class provided twice
      (traits are combined uniquely, so the second copy is dead), an unset
      object or soft-object reference on a trait (the usual reason a Mass agent
      spawns and renders nothing) and an entirely empty config. Read-only, and
      it does NOT run the engine's own FMassEntityConfig ValidateEntityTemplate,
      which is a C++-only API that would need MassSpawner linked. Every reported
      trait carries its objectPath for editor(set_property). Returns assetPath,
      parentChain[], traits[], traitCount, problems[] ({severity, code, message,
      config, traitIndex, objectPath}), errorCount, warningCount, valid. Params:
      assetPath
  gameplay.query_zone_graph:
    class_path: ue-mcp.builtin/gameplay.query_zone_graph
    group: gameplay
    description: >-
      Query the BUILT Zone Graph in a world. The graph lives in
      AZoneGraphData.ZoneStorage as parallel index arrays, where a lane names a
      half-open range into LanePoints and another into LaneLinks, so a raw
      editor(get_property) dump of it is technically reachable and unusable;
      this resolves the indirection. queryMode is summary (lane/zone counts and
      tagsInUse), lanes (index, zoneIndex, width, length, tags, start and end
      point), lane (one lane's full polyline plus its linked lanes, needs
      laneIndex) or nearest (closest point on any lane to location, within
      radius). Filter by tag NAME with tags[]. Zone SHAPE authoring is not here
      and does not need to be: spawn AZoneShape with level(spawn_actor), write
      its Points with editor(set_property), and call
      SetShapeType/SetTags/SetPolygonRoutingType with
      editor(invoke_object_function). If the world has shapes but no lanes then
      the graph has not been built, and the note says how to trigger it. Needs
      the ZoneGraph plugin. Returns data[], dataActorCount, laneCount,
      zoneShapeActorCount, plus found/laneIndex/distance/nearestPoint for
      nearest. Params: queryMode?, laneIndex?, location?, radius?, tags?,
      limit?, world?, pieInstance?, actorLabel?, actorPath?
  gameplay.get_navmesh_details:
    class_path: ue-mcp.builtin/gameplay.get_navmesh_details
    group: gameplay
    description: >-
      Read RecastNavMesh generation params (cellSize, agentHeight,
      maxStepHeight, etc.) (#163). Params: none
  gameplay.epic_add_body:
    class_path: ue-mcp.builtin/gameplay.epic_add_body
    group: gameplay
    description: >-
      [Epic PhysicsToolsets.PhysicsAssetToolset] Adds a new empty body for the
      given bone. Params: physicsAsset, boneName
  gameplay.epic_add_constraint:
    class_path: ue-mcp.builtin/gameplay.epic_add_constraint
    group: gameplay
    description: >-
      [Epic PhysicsToolsets.PhysicsAssetToolset] Adds a new constraint between
      two bodies. Both bodies must already exist. Params: physicsAsset,
      bone1Name, bone2Name
  gameplay.epic_add_tag:
    class_path: ue-mcp.builtin/gameplay.epic_add_tag
    group: gameplay
    description: >-
      [Epic GameplayTagsToolset.GameplayTagsToolset] Adds a new gameplay tag to
      the project. This should ONLY be called after getting explicit direction
      or permission from the user. Params: tagName, comment?, tagSource
  gameplay.epic_create_from_mesh:
    class_path: ue-mcp.builtin/gameplay.epic_create_from_mesh
    group: gameplay
    description: >-
      [Epic PhysicsToolsets.PhysicsAssetToolset] Creates a physics asset from a
      skeletal mesh, auto-generating collision bodies for each bone. The asset
      is placed in the same folder as the mesh with the suffix "_PhysicsAsset".
      Params: meshPath, bAssignToMesh
  gameplay.epic_find_referencers_by_tag:
    class_path: ue-mcp.builtin/gameplay.epic_find_referencers_by_tag
    group: gameplay
    description: >-
      [Epic GameplayTagsToolset.GameplayTagsToolset] Returns assets that
      reference a gameplay tag. Params: tagName
  gameplay.epic_get_blackboard:
    class_path: ue-mcp.builtin/gameplay.epic_get_blackboard
    group: gameplay
    description: >-
      [Epic aimodule_toolset.toolsets.behavior_tree.BehaviorTreeTools] Returns
      the blackboard asset for this behavior tree. Params: behavior_tree
  gameplay.epic_get_body_mass_scale:
    class_path: ue-mcp.builtin/gameplay.epic_get_body_mass_scale
    group: gameplay
    description: >-
      [Epic PhysicsToolsets.PhysicsAssetToolset] Returns the mass-scale
      multiplier for the given body. Params: physicsAsset, boneName
  gameplay.epic_get_body_names:
    class_path: ue-mcp.builtin/gameplay.epic_get_body_names
    group: gameplay
    description: >-
      [Epic PhysicsToolsets.PhysicsAssetToolset] Returns the bone name for each
      rigid body in a physics asset. Params: physicsAsset
  gameplay.epic_get_body_physics_mode:
    class_path: ue-mcp.builtin/gameplay.epic_get_body_physics_mode
    group: gameplay
    description: >-
      [Epic PhysicsToolsets.PhysicsAssetToolset] Returns the physics simulation
      mode for the given body. Params: physicsAsset, boneName
  gameplay.epic_get_body_shapes:
    class_path: ue-mcp.builtin/gameplay.epic_get_body_shapes
    group: gameplay
    description: >-
      [Epic PhysicsToolsets.PhysicsAssetToolset] Returns all collision shapes
      assigned to a body. Params: physicsAsset, boneName
  gameplay.epic_get_children:
    class_path: ue-mcp.builtin/gameplay.epic_get_children
    group: gameplay
    description: >-
      [Epic aimodule_toolset.toolsets.behavior_tree.BehaviorTreeTools] Returns
      direct child nodes of a composite node. Params: composite
  gameplay.epic_get_condition_description:
    class_path: ue-mcp.builtin/gameplay.epic_get_condition_description
    group: gameplay
    description: >-
      [Epic WorldConditionsToolset.WorldConditionTools] Returns a human-readable
      description of a single world condition. The condition must be passed as
      an FInstancedStruct containing an FWorldConditionBase-derived struct.
      Params: condition
  gameplay.epic_get_constraints:
    class_path: ue-mcp.builtin/gameplay.epic_get_constraints
    group: gameplay
    description: >-
      [Epic PhysicsToolsets.PhysicsAssetToolset] Returns all constraints in the
      physics asset with their current angular limits. Params: physicsAsset
  gameplay.epic_get_node_depth:
    class_path: ue-mcp.builtin/gameplay.epic_get_node_depth
    group: gameplay
    description: >-
      [Epic aimodule_toolset.toolsets.behavior_tree.BehaviorTreeTools] Returns
      the tree depth of a node by its list_nodes index. Params: behavior_tree,
      node_index
  gameplay.epic_get_node_depths:
    class_path: ue-mcp.builtin/gameplay.epic_get_node_depths
    group: gameplay
    description: >-
      [Epic aimodule_toolset.toolsets.behavior_tree.BehaviorTreeTools] Returns
      tree depths for all nodes, matching list_nodes order. Params:
      behavior_tree
  gameplay.epic_get_query_description:
    class_path: ue-mcp.builtin/gameplay.epic_get_query_description
    group: gameplay
    description: >-
      [Epic WorldConditionsToolset.WorldConditionTools] Returns a human-readable
      description of a world condition query. Params: queryDefinition
  gameplay.epic_get_root_decorators:
    class_path: ue-mcp.builtin/gameplay.epic_get_root_decorators
    group: gameplay
    description: >-
      [Epic aimodule_toolset.toolsets.behavior_tree.BehaviorTreeTools] Returns
      root-level decorators on this tree. Params: behavior_tree
  gameplay.epic_get_subtree:
    class_path: ue-mcp.builtin/gameplay.epic_get_subtree
    group: gameplay
    description: >-
      [Epic aimodule_toolset.toolsets.behavior_tree.BehaviorTreeTools] Returns
      the sub-BT asset referenced by a RunBehavior task. Params: node
  gameplay.epic_get_tag_info:
    class_path: ue-mcp.builtin/gameplay.epic_get_tag_info
    group: gameplay
    description: >-
      [Epic GameplayTagsToolset.GameplayTagsToolset] Returns detailed
      information about a specific gameplay tag. Params: tagName
  gameplay.epic_list_nodes:
    class_path: ue-mcp.builtin/gameplay.epic_list_nodes
    group: gameplay
    description: >-
      [Epic aimodule_toolset.toolsets.behavior_tree.BehaviorTreeTools] Returns a
      flat list of all node UObjects in tree order. Order: root decorators, then
      DFS (composite, services, per-child decorators, child node). Params:
      behavior_tree
  gameplay.epic_list_tags:
    class_path: ue-mcp.builtin/gameplay.epic_list_tags
    group: gameplay
    description: >-
      [Epic GameplayTagsToolset.GameplayTagsToolset] Returns gameplay tags
      registered in the project. Params: parentTag
  gameplay.epic_remove_body:
    class_path: ue-mcp.builtin/gameplay.epic_remove_body
    group: gameplay
    description: >-
      [Epic PhysicsToolsets.PhysicsAssetToolset] Removes the body for the given
      bone along with any constraints that reference it. Raises a script error
      if PhysicsAsset is null or no body exists for BoneName. Params:
      physicsAsset, boneName
  gameplay.epic_remove_constraint:
    class_path: ue-mcp.builtin/gameplay.epic_remove_constraint
    group: gameplay
    description: >-
      [Epic PhysicsToolsets.PhysicsAssetToolset] Removes the constraint between
      two bodies. Params: physicsAsset, bone1Name, bone2Name
  gameplay.epic_remove_shape:
    class_path: ue-mcp.builtin/gameplay.epic_remove_shape
    group: gameplay
    description: >-
      [Epic PhysicsToolsets.PhysicsAssetToolset] Removes a collision primitive
      from a body by name. Params: physicsAsset, boneName, shapeName
  gameplay.epic_remove_tag:
    class_path: ue-mcp.builtin/gameplay.epic_remove_tag
    group: gameplay
    description: >-
      [Epic GameplayTagsToolset.GameplayTagsToolset] Removes a gameplay tag from
      the project. This should ONLY be called after getting explicit direction
      or permission from the user. Params: tagName
  gameplay.epic_rename_tag:
    class_path: ue-mcp.builtin/gameplay.epic_rename_tag
    group: gameplay
    description: >-
      [Epic GameplayTagsToolset.GameplayTagsToolset] Renames a gameplay tag,
      updating all references in the project. This should ONLY be called after
      getting explicit direction or permission from the user. Params:
      oldTagName, newTagName
  gameplay.epic_set_body_mass_scale:
    class_path: ue-mcp.builtin/gameplay.epic_set_body_mass_scale
    group: gameplay
    description: >-
      [Epic PhysicsToolsets.PhysicsAssetToolset] Sets the mass-scale multiplier
      for the given body. Params: physicsAsset, boneName, massScale
  gameplay.epic_set_body_physics_mode:
    class_path: ue-mcp.builtin/gameplay.epic_set_body_physics_mode
    group: gameplay
    description: >-
      [Epic PhysicsToolsets.PhysicsAssetToolset] Sets the physics simulation
      mode for the given body. Params: physicsAsset, boneName, mode
  gameplay.epic_set_box:
    class_path: ue-mcp.builtin/gameplay.epic_set_box
    group: gameplay
    description: >-
      [Epic PhysicsToolsets.PhysicsAssetToolset] Adds or replaces a box
      collision primitive on a body. If any shape with the given name already
