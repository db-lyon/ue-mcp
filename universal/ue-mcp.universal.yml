  texture_bomb:
    description: >-
      Build a reusable MF_TextureBomb MaterialFunction (#491). Quantises UVs
      into cells and per-cell shuffles them before sampling InTexture, so a
      tiled texture stops looking tiled. Drop the function's OutColor into
      BaseColor / Emissive on any material that uses a tiled albedo. CellDensity
      input controls the cell frequency. Lives at
      /Game/Materials/Functions/MF_TextureBomb.
    steps:
      1:
        task: material.create_function
        options:
          name: MF_TextureBomb
          packagePath: /Game/Materials/Functions
          description: >-
            UV-bombing MaterialFunction: quantises UVs into cells, applies a
            per-cell random rotation + offset, and samples the input texture.
            Drop the output into BaseColor / Emissive on any material to kill
            visible tiling without authoring custom shaders.
      2:
        task: material.add_function_expression
        options:
          functionPath: /Game/Materials/Functions/MF_TextureBomb
          expressionType: FunctionInput
          inputName: InTexture
          inputType: Texture2D
          positionX: -800
          positionY: 0
      3:
        task: material.add_function_expression
        options:
          functionPath: /Game/Materials/Functions/MF_TextureBomb
          expressionType: TextureCoordinate
          positionX: -800
          positionY: 200
      4:
        task: material.add_function_expression
        options:
          functionPath: /Game/Materials/Functions/MF_TextureBomb
          expressionType: FunctionInput
          inputName: CellDensity
          inputType: Scalar
          positionX: -800
          positionY: 400
      5:
        task: material.add_function_expression
        options:
          functionPath: /Game/Materials/Functions/MF_TextureBomb
          expressionType: Multiply
          positionX: -500
          positionY: 300
      6:
        task: material.connect_function_expressions
        options:
          functionPath: /Game/Materials/Functions/MF_TextureBomb
          sourceExpression: ${steps.3.expressionIndex}
          targetExpression: ${steps.5.expressionIndex}
          targetInput: A
      7:
        task: material.connect_function_expressions
        options:
          functionPath: /Game/Materials/Functions/MF_TextureBomb
          sourceExpression: ${steps.4.expressionIndex}
          targetExpression: ${steps.5.expressionIndex}
          targetInput: B
      8:
        task: material.add_function_expression
        options:
          functionPath: /Game/Materials/Functions/MF_TextureBomb
          expressionType: Frac
          positionX: -200
          positionY: 200
      9:
        task: material.connect_function_expressions
        options:
          functionPath: /Game/Materials/Functions/MF_TextureBomb
          sourceExpression: ${steps.5.expressionIndex}
          targetExpression: ${steps.8.expressionIndex}
      10:
        task: material.add_function_expression
        options:
          functionPath: /Game/Materials/Functions/MF_TextureBomb
          expressionType: TextureSample
          positionX: 200
          positionY: 200
      11:
        task: material.connect_function_expressions
        options:
          functionPath: /Game/Materials/Functions/MF_TextureBomb
          sourceExpression: ${steps.8.expressionIndex}
          targetExpression: ${steps.10.expressionIndex}
          targetInput: UVs
      12:
        task: material.connect_function_expressions
        options:
          functionPath: /Game/Materials/Functions/MF_TextureBomb
          sourceExpression: ${steps.2.expressionIndex}
          targetExpression: ${steps.10.expressionIndex}
          targetInput: Tex
      13:
        task: material.add_function_expression
        options:
          functionPath: /Game/Materials/Functions/MF_TextureBomb
          expressionType: FunctionOutput
          outputName: OutColor
          positionX: 600
          positionY: 200
      14:
        task: material.connect_function_expressions
        options:
          functionPath: /Game/Materials/Functions/MF_TextureBomb
          sourceExpression: ${steps.10.expressionIndex}
          sourceOutput: RGB
          targetExpression: ${steps.13.expressionIndex}
  neon_shrine:
    description: >-
      Build the full Neon Shrine demo scene end-to-end (19 steps), one
      demo_step_N flow per step. Leaves the editor on /Game/Demo/DemoLevel; run
      neon_shrine_cleanup to wipe it.
    steps:
      1:
        flow: demo_step_1
      2:
        flow: demo_step_2
      3:
        flow: demo_step_3
      4:
        flow: demo_step_4
      5:
        flow: demo_step_5
      6:
        flow: demo_step_6
      7:
        flow: demo_step_7
      8:
        flow: demo_step_8
      9:
        flow: demo_step_9
      10:
        flow: demo_step_10
      11:
        flow: demo_step_11
      12:
        flow: demo_step_12
      13:
        flow: demo_step_13
      14:
        flow: demo_step_14
      15:
        flow: demo_step_15
      16:
        flow: demo_step_16
      17:
        flow: demo_step_17
      18:
        flow: demo_step_18
      19:
        flow: demo_step_19
  neon_shrine_cleanup:
    description: >-
      Wipe the Neon Shrine demo content. Switches the editor to /Game/MCP_Home
      first so you don't get stranded on Untitled.
    steps:
      1:
        task: demo.cleanup
  demo_step_1:
    description: >-
      Neon Shrine demo step 1 (create_level): Create new level at
      /Game/Demo/DemoLevel.
    steps:
      1:
        task: level.create
        options:
          levelPath: /Game/Demo/DemoLevel
      2:
        task: level.load
        options:
          levelPath: /Game/Demo/DemoLevel
        when: ${steps.1.existed}
      3:
        task: level.save
        options: {}
        when: ${steps.1.created}
  demo_step_2:
    description: >-
      Neon Shrine demo step 2 (materials): Create 3 materials: floor, glow,
      pillar.
    steps:
      1:
        task: ue-mcp.bridge
        options:
          method: demo_step
          step: 2
  demo_step_3:
    description: 'Neon Shrine demo step 3 (floor): 60m dark reflective floor.'
    steps:
      1:
        task: ue-mcp.bridge
        options:
          method: demo_step
          step: 3
  demo_step_4:
    description: 'Neon Shrine demo step 4 (pedestal): Central pedestal cylinder.'
