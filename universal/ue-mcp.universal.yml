# Auto-generated - do not edit by hand.
# Source: scripts/generate-universal.ts (tasks, beacon, Neon Shrine) and
# universal/flows.yml (hand-authored flows). Run: npm run generate:universal
ue-mcp:
  version: 1
tasks:
  project.get_status:
    class_path: ue-mcp.builtin/project.get_status
    group: project
    description: >-
      Check server mode and editor connection. pluginBuildStale reports the
      compiled bridge being older than its source, read from disk.
      deployedPlugin is what the binary that answered says about itself: when it
      was built, and how many methods this server advertises that it does not
      register, which is what 'Unknown method' on a real action means.
      answeringPid is the editor process the bridge is connected to;
      projectEditors and projectEditorsWarning appear when several editor
      processes (headless included) hold the project, and every response then
      carries the answering pid. Params: none (#785, #1002, #1021, #1150)
  project.set_project:
    class_path: ue-mcp.builtin/project.set_project
    group: project
    description: >-
      Switch project: moves both path resolution and the editor connection to
      the new .uproject. Params: projectPath
  project.list_editors:
    class_path: ue-mcp.builtin/project.list_editors
    group: project
    description: >-
      List every editor session this server drives: name, project, bridge port,
      whether the socket is connected, whether anything is answering on that
      port, and which session untargeted calls fall through to. Params: none
      (#817)
  project.use_editor:
    class_path: ue-mcp.builtin/project.use_editor
    group: project
    description: >-
      Make one editor session the default target for untargeted calls. Does not
      change the session set and never touches any editor process. Params:
      editorTarget (session name, project name, or .uproject path) (#817)
  project.add_editor:
    class_path: ue-mcp.builtin/project.add_editor
    group: project
    description: >-
      Register another project as an addressable editor session, with its own
      bridge connection and port. Optionally launch its editor. Every category
      then accepts editor="<name>" to run a call there. Params: projectPath,
      editorName? (defaults to the project name), start? (launch the editor and
      wait for it to be ready), timeout? (seconds, default 300) (#817)
  project.drop_editor:
    class_path: ue-mcp.builtin/project.drop_editor
    group: project
    description: >-
      Forget an editor session and close its bridge socket. The editor process
      is LEFT RUNNING and untouched - this detaches, it does not stop anything
      (use editor(stop_editor) for that). Params: editorTarget (#817)
  project.get_info:
    class_path: ue-mcp.builtin/project.get_info
    group: project
    description: 'Read .uproject file details. Params: none'
  project.read_config:
    class_path: ue-mcp.builtin/project.read_config
    group: project
    description: 'Read INI config. Params: configName (e.g. ''Engine'', ''Game'')'
  project.search_config:
    class_path: ue-mcp.builtin/project.search_config
    group: project
    description: 'Search INI files. Params: query'
  project.list_config_tags:
    class_path: ue-mcp.builtin/project.list_config_tags
    group: project
    description: 'Extract gameplay tags from config. Params: none'
  project.read_cpp_header:
    class_path: ue-mcp.builtin/project.read_cpp_header
    group: project
    description: 'Parse a .h file. Params: headerPath'
  project.read_module:
    class_path: ue-mcp.builtin/project.read_module
    group: project
    description: 'Read module source. Params: moduleName'
  project.list_modules:
    class_path: ue-mcp.builtin/project.list_modules
    group: project
    description: 'List C++ modules. Params: none'
  project.search_cpp:
    class_path: ue-mcp.builtin/project.search_cpp
    group: project
    description: 'Search .h/.cpp files. Params: query, directory?'
  project.read_engine_header:
    class_path: ue-mcp.builtin/project.read_engine_header
    group: project
    description: >-
      Parse a .h file from the engine source tree. Params: headerPath (relative
      to Engine/Source, or absolute)
  project.find_engine_symbol:
    class_path: ue-mcp.builtin/project.find_engine_symbol
    group: project
    description: 'Grep engine headers for a symbol. Params: symbol, maxResults?'
  project.list_engine_modules:
    class_path: ue-mcp.builtin/project.list_engine_modules
    group: project
    description: 'List modules in Engine/Source/Runtime. Params: none'
  project.search_engine_cpp:
    class_path: ue-mcp.builtin/project.search_engine_cpp
    group: project
    description: >-
      Search engine .h/.cpp/.inl files across Runtime/Editor/Developer/Plugins.
      Params: query, tree? (Runtime|Editor|Developer|Plugins|all - default
      Runtime), subdirectory?, maxResults? (default 500)
  project.search_tools:
    class_path: ue-mcp.builtin/project.search_tools
    group: project
    description: >-
      Search every ue-mcp tool + action by keyword or task INTENT (a synonym
      layer maps 'screenshot'->capture_scene_png, 'tile a texture'->the
      texture-bomb flow, etc.) and return ranked matches (tool, action,
      description, score). The first step before editor(execute_python); most
      tasks already have a dedicated action. Params: query (space-separated
      keywords/intent), limit? (default 20) (#704)
  project.describe_action:
    class_path: ue-mcp.builtin/project.describe_action
    group: project
    description: >-
      Return the live parameter schema for one action: every parameter it
      accepts, with type, required/optional, description, allowed values and
      default, plus the bridge method it dispatches to. search_tools finds an
      action by keyword and hands back only prose; this answers what to actually
      pass, so the first call is the right one. name takes 'tool.action'
      (asset.set_property) or a bare action name, which reports every category
      providing it. A name that does not resolve comes back with the closest
      spellings rather than a bare failure. Reads the graph THIS editor
      advertises, so injected Epic and plugin actions are included. Each action
      also reports class: read (observes), mutate (changes the editor, its
      project on disk, or its process) or unknown (decided by a parameter, so
      gated like mutate) - MCP's own readOnlyHint is per tool, and every tool
      here is a category holding both, so a harness that gates writes reads it
      from here. Params: name (required), category? (return every action of one
      category instead of one action)
  project.list_available_actions:
    class_path: ue-mcp.builtin/project.list_available_actions
    group: project
    description: >-
      Report which actions this server can serve RIGHT NOW and why the rest
      cannot. With no editor attached the surface is advertised in full but most
      of it cannot run, and this is the line between the two halves: an action
      either runs in this Node process (availability 'always') or dispatches to
      a bridge method only a running editor answers (availability 'editor', with
      bridgeMethod naming it). The offline half is the engine symbol index and
      the C++ correctness checks, the project config, source and file readers,
      the surface introspection, and the process lifecycle actions that start,
      stop and build. An action contributed by a plugin whose route is
      undeclared reports 'unknown' and should be treated as needing an editor.
      Counts come back by default, per category as well as overall;
      includeNames=true adds the actions themselves, and category narrows the
      whole report to one. With an editor attached everything is available and
      the classification still answers the question worth asking then, which is
      what keeps working once the editor is stopped for a rebuild. Params:
      category?, includeNames? (default false), state? (available|blocked|all,
      default available)
  project.list_content_assets:
    class_path: ue-mcp.builtin/project.list_content_assets
    group: project
    description: >-
      List the project's assets from the package files on DISK, which is the one
      asset query that works with no editor running. Takes a mount path (/Game,
      /Game/Characters, or a plugin's /MyPlugin) and resolves it through the
      same mount table the live path uses, so an offline listing names assets
      exactly as the editor would. It answers existence, layout, size and
      modified time, and it deliberately does not answer class, registry tags or
      dependencies: those live in the editor's asset registry and are not in the
      file, so asset(list) and asset(search) remain the answer once an editor is
      up. maxResults stops the walk rather than trimming the result, and
      truncated says when it did. Params: contentPath? (default /Game),
      recursive? (default true), namePattern? (case-insensitive substring of the
      asset name), maxResults? (default 1000)
  project.check_install:
    class_path: ue-mcp.builtin/project.check_install
    group: project
    description: >-
      Answer whether this project can run the bridge at all, from disk, with no
      editor running and nothing compiled. Reports the project kind (a project
      declaring no native modules of its own is Blueprint-only, which is NOT a
      blocker: UnrealBuildTool writes temporary target and module files under
      Intermediate/Source/ and compiles the plugin against them), the engine
      that will be used and where it was resolved from, whether the plugin is
      deployed, enabled in the .uproject, compiled and up to date with its
      source, and whether this machine has the C++ toolchain Unreal needs. Every
      problem carries a stable code, what is wrong and the exact fix, and
      nextSteps is those fixes in order. Read-only: it never deploys, enables or
      builds anything. Params: projectPath? (default the loaded project),
      skipToolchain? (skip the toolchain probe, which shells out to vswhere or
      the compiler)
  project.execute_python_report:
    class_path: ue-mcp.builtin/project.execute_python_report
    group: project
    description: >-
      Measurement for #704: reads this session's execute_python calls and, for
      each, runs its taskSummary back through search_tools to flag calls that
      OVERLAPPED an existing dedicated action ('you used Python for X, but tool
      Y does X'). Returns totalCalls, overlapping[] and an overlapRate. Params:
      none (#704)
  project.list_files:
    class_path: ue-mcp.builtin/project.list_files
    group: project
    description: >-
      List files on disk under a directory, optionally filtered by extension(s).
      Runs in the MCP server process (no editor round-trip). Params: directory
      (absolute, or relative to the project dir), extensions? (e.g.
      ['png','exr'] or 'png'), recursive? (default false), maxResults? (default
      1000) (#608)
  project.set_config:
    class_path: ue-mcp.builtin/project.set_config
    group: project
    description: 'Write to INI. Params: configName? (or configFile), section, key, value'
  project.build:
    class_path: ue-mcp.builtin/project.build
    group: project
    description: >-
      Build the project's C++ out of process with UnrealBuildTool. Works with
      the editor STOPPED, which a full rebuild requires (UBT cannot link while
      an editor holds the module DLLs). Blocks until the build finishes and
      returns the compiler output. Params: configuration? (default Development),
      platform? (default the host platform), clean? (#958)
  project.generate_project_files:
    class_path: ue-mcp.builtin/project.generate_project_files
    group: project
    description: 'Generate IDE project files (Visual Studio, Xcode, etc.). Params: none'
  project.create_cpp_class:
    class_path: ue-mcp.builtin/project.create_cpp_class
    group: project
    description: >-
      Create a new native UCLASS in a project module. Uses the same engine
      template path as File → New C++ Class. Writes .h + .cpp; returns both
      paths plus needsEditorRestart (true unless Live Coding successfully
      hot-reloaded). Params: className, parentClass?, moduleName?, classDomain?,
      subPath?
  project.list_project_modules:
    class_path: ue-mcp.builtin/project.list_project_modules
    group: project
    description: >-
      List native modules in the current project (name, host type, source path),
      in the .uproject's own declaration order. Feed moduleName from here into
      create_cpp_class. Params: cursor?, limit?
  project.list_loaded_modules:
    class_path: ue-mcp.builtin/project.list_loaded_modules
    group: project
    description: >-
      Enumerate ALL engine+project modules with runtime load state
      (loaded/gameModule), not just uproject-declared ones. filter is a
      case-insensitive substring; loadedOnly defaults to false (#689). Params:
      filter?, loadedOnly?, cursor?, limit?
  project.is_module_loaded:
    class_path: ue-mcp.builtin/project.is_module_loaded
    group: project
    description: >-
      Report whether a named module is currently loaded in the editor (#689).
      Params: moduleName (or module)
  project.list_available_plugins:
    class_path: ue-mcp.builtin/project.list_available_plugins
    group: project
    description: >-
      List every plugin installed in this engine or project, sorted by name,
      with its category, version, type, whether it is enabled in THIS editor
      session, whether it is enabled by default, and the .uproject's current
      reference to it under projectReference {present, enabled}. Those two
      disagree after enable_plugin until the editor restarts, which is the point
      of reporting both. Params: filter?, pluginCategory?, enabledOnly?,
      cursor?, limit?
  project.enable_plugin:
    class_path: ue-mcp.builtin/project.enable_plugin
    group: project
    description: >-
      Enable a plugin in the .uproject. Plugin enablement is neither a UPROPERTY
      nor an INI key, it is a JSON array in the .uproject read once at startup,
      so set_config cannot reach it and without this a plugin-gated capability
      stays permanently unreachable through the bridge. Idempotent: a plugin
      already enabled, or enabled by default with no entry, reports existed and
      writes nothing. The change is a file change, so modules, classes, content
      and settings appear only after editor(restart_editor), which the result
      says. Params: pluginName
  project.disable_plugin:
    class_path: ue-mcp.builtin/project.disable_plugin
    group: project
    description: >-
      Disable a plugin in the .uproject. removeReference deletes the entry
      outright instead of writing an explicit disable, which is the difference
      between handing a default-on plugin back to its default and overriding it,
      and the two are not the same file. Idempotent against whichever of the two
      was asked for. Refuses to disable the bridge itself, since that would
      leave no way to undo it. Takes effect on the next editor start. Params:
      pluginName, removeReference?
  project.live_coding_compile:
    class_path: ue-mcp.builtin/project.live_coding_compile
    group: project
    description: >-
      Trigger a Live Coding compile (Windows only). Hot-patches method bodies of
      existing UCLASSes without editor restart - the fast inner loop for
      UFUNCTION implementations. Does NOT reliably register brand-new UCLASSes;
      use build_project + editor restart for those. Params: wait?
  project.live_coding_status:
    class_path: ue-mcp.builtin/project.live_coding_status
    group: project
    description: >-
      Report Live Coding availability/state (available, started,
      enabledForSession, compiling). Helps choose between live_coding_compile
      and build_project. Params: none
  project.resolve_collision_profile:
    class_path: ue-mcp.builtin/project.resolve_collision_profile
    group: project
    description: >-
      Read one collision profile's resolved per-channel responses:
      collisionEnabled, objectType, and every channel with Block/Overlap/Ignore.
      This is the project-side half of blueprint(get_component_collision)
      (#925): a component's ResponseArray only lists the channels it OVERRIDES,
      so the profile is where an inherited response actually comes from. Project
      trace and object channels appear under their configured names, with
      enumName (ECC_GameTraceChannel1) alongside so a caller can key on
      something stable. By default the eight engine channels plus every channel
      the project configured are returned; includeAllChannels=true adds the
      unused slots. channel narrows it to one. A profile that does not exist
      lists the ones that do. Params: profileName, channel?, includeAllChannels?
  project.write_cpp_file:
    class_path: ue-mcp.builtin/project.write_cpp_file
    group: project
    description: >-
      Write a .h / .cpp / .inl file under the project's Source/ tree. Used to
      append UPROPERTYs/UFUNCTIONs or method bodies after create_cpp_class.
      Writes are scoped to Source/ for safety. Params: path (relative to Source/
      or absolute within Source/), content (full file contents). After editing,
      call live_coding_compile (for existing classes) or build_project (for new
      classes).
  project.read_cpp_source:
    class_path: ue-mcp.builtin/project.read_cpp_source
    group: project
    description: >-
      Read a .cpp file from the project Source/ tree. Companion to
      read_cpp_header for round-trip edits. Params: sourcePath (relative to
      Source/ or absolute).
  project.write_source_file:
    class_path: ue-mcp.builtin/project.write_source_file
    group: project
    description: >-
      Write a .h/.cpp/.inl into a named module's Public/Private folder (resolves
      the module dir for you, including plugin modules under Plugins/*/Source/
      that write_cpp_file refuses). After a new file, build_project + restart;
      after a body edit, live_coding_compile. Params: module (module name,
      default the project's primary module), visibility (Public|Private, default
      Private), fileName, content.
  project.read_source_file:
    class_path: ue-mcp.builtin/project.read_source_file
    group: project
    description: >-
      Read a .h/.cpp/.inl from a named module's folder (companion to
      write_source_file; resolves plugin modules too). With no visibility it
      tries Public then Private then the module root. Params: module,
      visibility?, fileName.
  project.build_engine_index:
    class_path: ue-mcp.builtin/project.build_engine_index
    group: project
    description: >-
      Build or refresh the engine symbol index that verify_symbols,
      lint_cpp_header and suggest_build_deps read. Scans roughly 31,000 headers
      across Runtime, Editor, Developer and the includable half of
      Engine/Plugins, and records for each symbol the header that declares it,
      the module that owns it, its signature and any UE_DEPRECATED. The result
      is cached per engine under the user directory and shared by every project
      on that engine, so this is a one-time cost per engine install: expect
      several minutes cold (first touch of each file goes through the virus
      scanner on Windows) and a few seconds warm. The other actions build it on
      demand, so this is only needed to refresh after an engine upgrade or to
      pay the cost deliberately. Params: refresh? (rebuild even when a valid
      cache exists)
  project.verify_symbols:
    class_path: ue-mcp.builtin/project.verify_symbols
    group: project
    description: >-
      Check that engine symbols exist BEFORE writing C++ that uses them, and get
      back what you need to write it: the header to #include, the owning module
      for Build.cs, the exact declaration, the base class, and any UE_DEPRECATED
      with its version and message. Accepts a qualified
      'UGameplayStatics::GetPlayerPawn' as well as a bare type name, and covers
      plugin modules (GameplayAbilities, Niagara, PCG, EnhancedInput) as well as
      the engine. A name that does not resolve comes back with close spellings;
      a member miss on a class that does exist says so, which separates a
      misspelled method from a misspelled class. The aggregate includes[] and
      modules[] are the whole edit you need to make. Builds the index on first
      use, which can take several minutes on a cold filesystem. Params: names
      (string[] or comma-separated string, max 200)
  project.suggest_build_deps:
    class_path: ue-mcp.builtin/project.suggest_build_deps
    group: project
    description: >-
      Given the engine symbols a module uses, report which modules its Build.cs
      has to depend on and which of those it does not list yet, plus the
      AddRange line to paste. Core and CoreUObject are omitted because every
      module already has them. buildCsPath defaults to the Build.cs owning
      modulePath, or the project's first module. Pair with
      add_module_dependency, which performs the edit. Params: names (string[] or
      comma-separated string), buildCsPath? (absolute), modulePath? (a file or
      directory whose owning Build.cs to use)
  project.find_example_usage:
    class_path: ue-mcp.builtin/project.find_example_usage
    group: project
    description: >-
      Find real call sites for an engine symbol in the engine's own .cpp files,
      which answers 'how is this actually used' with code that compiles. Better
      than a signature for anything with a non-obvious calling convention.
      Searches sources rather than headers on purpose: a header gives the
      declaration, which verify_symbols already returns. An engine installed
      from the Epic launcher ships headers WITHOUT .cpp sources, so on those
      there are no engine call sites to find; the result says so via
      engineSourcesAvailable and falls back to inline code in headers and to
      this project's own Source tree, rather than returning an empty list that
      reads as 'nothing uses this'. Params: symbol (bare or Class::Member),
      limit? (default 10), trees? (Runtime|Editor|Developer, default Runtime)
  project.class_hierarchy:
    class_path: ue-mcp.builtin/project.class_hierarchy
    group: project
    description: >-
      Report what a class derives from and what derives from it, which is the
      question behind 'what should I subclass' and 'what already does this'.
      Ancestors are the full chain up to the root, nearest parent first;
      descendants default to the direct subclasses only, because every
      transitive subclass of UObject is tens of thousands of names. Every node
      carries its module, its include and whether it crosses a module boundary
      from the queried class, since crossing one is what forces a Build.cs
      dependency; crossModuleDependencies is that list on its own. Reads the
      engine symbol index and no files, so it is fast once the index exists, and
      builds it on first use, which can take several minutes on a cold
      filesystem. A base the index cannot resolve (a template, a macro-generated
      type) stops the walk and is reported as unresolvedAncestor rather than
      silently ending the chain. Params: symbol (class or struct name, prefix
      optional), direction? (ancestors|descendants|both, default both), depth?
      (generations of descendants, default 1), limit? (max descendants, default
      100)
  project.find_references:
    class_path: ue-mcp.builtin/project.find_references
    group: project
    description: >-
      Find every line in the engine tree that names a symbol, which answers 'how
      is this woven into the engine' and 'what would break if this changed'.
      Broader than find_callers on purpose: a reference is a member declaration,
      a UPROPERTY type, a cast, a template argument or a call, and both headers
      and .cpp files are searched. Comment lines and preprocessor lines are
      skipped, since neither is a use. Each site reports its file, line, text
      and owning module. An engine installed from the Epic launcher ships
      headers WITHOUT .cpp sources, so engineSourcesAvailable says whether
      implementation files could be searched at all and the note says what was
      searched instead. Scans files rather than the index, so a rare name on a
      cold filesystem is slow. Params: symbol (bare or Class::Member), limit?
      (max sites, default 40), trees? (Runtime|Editor|Developer|Plugins|all,
      default Runtime), includeProject? (also search this project's Source and
      Plugins, default true)
  project.find_callers:
    class_path: ue-mcp.builtin/project.find_callers
    group: project
    description: >-
      Find who calls a function, and from which enclosing function, which is how
      to see the conventions around a call before writing one: what is checked
      first, what is passed, what is done with the result. Searches .cpp bodies
      first, since a mention in a header is usually a declaration rather than a
      call, and excludes the function's own definition. Each site reports file,
      line, text, module and, for a site in a .cpp, the Class::Method it sits
      inside. An engine installed from the Epic launcher ships headers WITHOUT
      .cpp sources, so on those there are no engine call sites to find:
      engineSourcesAvailable reports that and the search falls back to inline
      code in headers and to this project's own Source tree, rather than
      returning an empty list that reads as 'nothing calls this'. Params: symbol
      (bare or Class::Method), limit? (max sites, default 25), trees?
      (Runtime|Editor|Developer|Plugins|all, default Runtime), includeProject?
      (also search this project's Source and Plugins, default true)
  project.find_callees:
    class_path: ue-mcp.builtin/project.find_callees
    group: project
    description: >-
      Report what a function calls, by reading its body and looking every called
      name back up in the engine index. Answers 'what does doing this properly
      actually involve': the result carries each callee's module and include,
      and modules[] is the Build.cs cost of writing code that does the same
      thing. The body is found via the index, which keeps the search to the
      owning class's module rather than the whole tree, and the definition it
      read is reported with its file and line range. An engine installed from
      the Epic launcher ships headers WITHOUT .cpp sources, so only functions
      whose body is inline in a header can be read there; engineSourcesAvailable
      and the note say so instead of returning an empty list. Builds the index
      on first use. Params: symbol (Class::Method, or a bare exported free
      function), limit? (max callees, default 100), trees? (which trees to test
      for sources, default Runtime)
  project.symbol_context:
    class_path: ue-mcp.builtin/project.symbol_context
    group: project
    description: >-
      Return the lines of engine source around a declaration, so the API
      surrounding a symbol can be read without opening the file: the sibling
      overloads, the UPROPERTY above it, the comment saying which of three
      similar methods to call. verify_symbols returns the declaration line
      alone, which is the signature and nothing else; this is that line in its
      neighbourhood. Accepts Class::Member as well as a bare type and resolves
      both exactly as verify_symbols does. When the declaration opens a body
      that closes inside the window the result ends at the closing brace instead
      of mid-type, and reports bodyEndLine. Builds the index on first use, which
      can take several minutes on a cold filesystem. Params: symbol (bare or
      Class::Member), contextBefore? (lines before the declaration, default 8),
      contextAfter? (lines after, default 40)
  project.lint_cpp_header:
    class_path: ue-mcp.builtin/project.lint_cpp_header
    group: project
    description: >-
      Check a header you just wrote against the engine it has to build against,
      and report what the compiler would before the compiler runs. Covers the
      structural mistakes that produce baffling Unreal build errors (a reflected
      type with no .generated.h include, a .generated.h that is not last, a
      UCLASS or USTRUCT with no GENERATED_BODY, no #pragma once) and the
      engine-facing ones (a symbol that does not exist, one used without its
      include, one whose module is missing from Build.cs, one the engine
      deprecated). A forward declaration counts as satisfying an include, since
      in a header it usually is. Run this after write_cpp_file and before
      build_project. Params: path (absolute, or relative to the project
      Source/), buildCsPath? (defaults to the owning module's)
  project.add_module_dependency:
    class_path: ue-mcp.builtin/project.add_module_dependency
    group: project
    description: >-
      Add a module to a target module's Build.cs dependency array. Params:
      moduleName (the Build.cs to edit - must exist in the project), dependency
      (module name to add, e.g. 'UMG'), access? ('public'|'private', default
      'private'). Creates the corresponding AddRange block if missing. Rebuild
      required afterward.
  project.add_cpp_member:
    class_path: ue-mcp.builtin/project.add_cpp_member
    group: project
    description: >-
      Append a UPROPERTY/UFUNCTION declaration to an existing UCLASS header
      inside the access specifier you choose. Idempotent: if a declaration
      containing the same memberName is already present, returns existed:true.
      Params: headerPath (relative to Source/ or absolute), declaration (full
      multi-line UPROPERTY(...) / UFUNCTION(...) block plus its single-line
      member or function signature), memberName (the identifier the declaration
      introduces - used for idempotency), access?
      ('public'|'protected'|'private', default 'public').
  project.epic_discover_tests:
    class_path: ue-mcp.builtin/project.epic_discover_tests
    group: project
    description: >-
      [Epic AutomationTestToolset.AutomationTestToolset] Initialize automation
      worker discovery and load the test list. Must be called once before
      ListTests or RunTests. Takes several seconds as it discovers the local
      automation worker and enumerates all registered tests. Returns an async
      result that completes with a JSON status object when tests are available,
      or an error if discovery fails. Params: bForceRediscover?
  project.epic_get_section_property_values:
    class_path: ue-mcp.builtin/project.epic_get_section_property_values
    group: project
    description: >-
      [Epic ConfigSettingsToolset.ConfigSettingsToolset] Returns the current
      values of the specified properties as a JSON object. Raises an error if
      the section does not exist, has no settings object, or any requested
      property cannot be read. Params: containerName, categoryName, sectionName,
      propertyNames
  project.epic_get_section_schema:
    class_path: ue-mcp.builtin/project.epic_get_section_schema
    group: project
    description: >-
      [Epic ConfigSettingsToolset.ConfigSettingsToolset] Returns a JSON Schema
      describing the user-visible properties of a settings section. The schema
      maps each property name to its type, description, and constraints. Raises
      an error if the section does not exist or has no backing settings object
      (e.g. uses a custom widget instead). Params: containerName, categoryName,
      sectionName
  project.epic_get_test_results:
    class_path: ue-mcp.builtin/project.epic_get_test_results
    group: project
    description: >-
      [Epic AutomationTestToolset.AutomationTestToolset] Get detailed results
      for the current or most recent test run. Requires DiscoverTests() to have
      completed. Returns a JSON object with per-test state, duration, errors,
      and warnings. Params: none
  project.epic_get_test_status:
    class_path: ue-mcp.builtin/project.epic_get_test_status
    group: project
    description: >-
      [Epic AutomationTestToolset.AutomationTestToolset] Get a lightweight
      status snapshot of the automation controller. Requires DiscoverTests() to
      have completed. Returns a JSON object with the controller state, enabled
      test count, and completion/pass/fail counts. Params: none
  project.epic_list_categories:
    class_path: ue-mcp.builtin/project.epic_list_categories
    group: project
    description: >-
      [Epic ConfigSettingsToolset.ConfigSettingsToolset] Lists the names of all
      categories within a settings container, sorted alphabetically. Raises an
      error if the container does not exist. Params: containerName
  project.epic_list_containers:
    class_path: ue-mcp.builtin/project.epic_list_containers
    group: project
    description: >-
      [Epic ConfigSettingsToolset.ConfigSettingsToolset] Lists the names of all
      known settings containers, sorted alphabetically. Common containers are
      "Editor" and "Project". Params: none
  project.epic_list_sections:
    class_path: ue-mcp.builtin/project.epic_list_sections
    group: project
    description: >-
      [Epic ConfigSettingsToolset.ConfigSettingsToolset] Lists the names of all
      sections within a settings category, sorted alphabetically. Raises an
      error if the container or category does not exist. Params: containerName,
      categoryName
  project.epic_list_tests:
    class_path: ue-mcp.builtin/project.epic_list_tests
    group: project
    description: >-
      [Epic AutomationTestToolset.AutomationTestToolset] List available
      automation tests. Requires DiscoverTests() to have completed. Returns a
      JSON object: {"tests": ["path1", ...], "total": N, "returned": N}. Params:
      nameFilter, tagFilter, limit?
  project.epic_reset_section_to_defaults:
    class_path: ue-mcp.builtin/project.epic_reset_section_to_defaults
    group: project
    description: >-
      [Epic ConfigSettingsToolset.ConfigSettingsToolset] Resets the settings in
      a section to their default values. Raises an error if the section does not
      exist or reset is not supported. Params: containerName, categoryName,
      sectionName
  project.epic_run_tests:
    class_path: ue-mcp.builtin/project.epic_run_tests
    group: project
    description: >-
      [Epic AutomationTestToolset.AutomationTestToolset] Run a set of automation
      tests by name. Requires DiscoverTests() to have completed. Starts
      executing the specified tests and returns an async result that completes
      with a JSON summary when all tests finish. Params: testNames
  project.epic_run_tests_by_filter:
    class_path: ue-mcp.builtin/project.epic_run_tests_by_filter
    group: project
    description: >-
      [Epic AutomationTestToolset.AutomationTestToolset] Run automation tests
      selected by a filter expression. Requires DiscoverTests() to have
      completed. Much faster than RunTests when targeting a large batch because
      the engine narrows the report tree in a single pass instead of running a
      per-leaf membership check against the requested name list. Filter syntax
      (multiple expressions joined by '+'): "StartsWith:System.Engine" prefix
      match against the full test path "^Foo" prefix anchor (equivalent to
      StartsWith:) "Bar$" suffix anchor "Substring" bare token matches anywhere
      in the path "Group:Smoke" expand a named group from
      AutomationControllerSettings ini Groups Returns an async result that
      completes with the same JSON summary as RunTests. Params: filterExpression
  project.epic_save_section:
    class_path: ue-mcp.builtin/project.epic_save_section
    group: project
    description: >-
      [Epic ConfigSettingsToolset.ConfigSettingsToolset] Saves the settings in a
      section. Raises an error if the section does not exist or saving is not
      supported. Params: containerName, categoryName, sectionName
  project.epic_set_section_properties:
    class_path: ue-mcp.builtin/project.epic_set_section_properties
    group: project
    description: >-
      [Epic ConfigSettingsToolset.ConfigSettingsToolset] Sets one or more
      properties on a settings section from a JSON object and saves.
      PropertiesJson must be a JSON object mapping property names to new values,
      in the same format returned by GetSectionPropertyValues. Raises an error
      if the section does not exist, cannot be edited, has no settings object,
      the default config file is not writable, or any property cannot be set.
      Params: containerName, categoryName, sectionName, propertiesJson
  project.epic_stop_tests:
    class_path: ue-mcp.builtin/project.epic_stop_tests
    group: project
    description: >-
      [Epic AutomationTestToolset.AutomationTestToolset] Stop all currently
      running tests. Requires DiscoverTests() to have completed. If a RunTests
      async result is pending, it will be completed with an error. Params: none
  asset.list:
    class_path: ue-mcp.builtin/asset.list
    group: asset
    description: >-
      List assets via the AssetRegistry (sees /Game and every mounted plugin
      root). Cursor-paginated, so a large folder is walked deterministically
      instead of dropping the bridge on one oversized response (#790): every
      page carries totalMatched, hasMore and a nextCursor to pass back. The row
      offset this used to page with is refused, because a row number cannot
      report that the folder changed underneath it. maxResults is a deprecated
      spelling of limit. Params: directory?, classFilter? (or typeFilter),
      recursive?, cursor?, limit? (or maxResults), offset?
  asset.search:
    class_path: ue-mcp.builtin/asset.search
    group: asset
    description: >-
      Search by name/class/path. maxResults is a deprecated spelling of limit
      and sizes the page when limit is omitted. With extra content roots
      configured and no directory, this searches each root and pages ONE ROOT AT
      A TIME, so a cursor has to be passed back together with the directory it
      came from. Params: query, directory?, maxResults?, searchAll?, cursor?,
      limit?
  asset.read:
    class_path: ue-mcp.builtin/asset.read
    group: asset
    description: 'Read asset via reflection. Params: assetPath (or path)'
  asset.read_properties:
    class_path: ue-mcp.builtin/asset.read_properties
    group: asset
    description: >-
      Read asset properties with values. Blueprint paths resolve to the
      generated-class CDO (#568). propertyName accepts dotted/indexed paths into
      nested structs, array elements, and instanced subobjects (e.g.
      `Config.Traits[1].Params.Field`); landing on an array of subobjects also
      lists each element's index+class (#527). expandDepth inlines the
      properties of subobjects OWNED by this asset, so a data asset's nested
      payload comes back in ONE call instead of a reference you have to chase
      (#755); references to OTHER assets are marked expandable rather than
      followed, unless expandExternal=true. Capped by maxExpandedObjects with
      expansionTruncated reported. Params: assetPath (or path), propertyName?,
      includeValues?, valueFormat?, expandDepth?, expandExternal?,
      maxExpandedObjects?
  asset.list_properties:
    class_path: ue-mcp.builtin/asset.list_properties
    group: asset
    description: >-
      List reflected properties on any asset. Params: assetPath (or path),
      propertyName?, includeValues?, valueFormat?, expandDepth?,
      expandExternal?, maxExpandedObjects?
  asset.get_properties:
    class_path: ue-mcp.builtin/asset.get_properties
    group: asset
    description: >-
      Read property values on any asset; the same read as read_properties with
      includeValues on by default. propertyName accepts dotted/indexed paths
      into nested structs, array elements, and instanced subobjects.
      valueFormat='json' returns structured values. Params: assetPath (or path),
      propertyName?, includeValues?, valueFormat?, expandDepth?,
      expandExternal?, maxExpandedObjects?
  asset.duplicate:
    class_path: ue-mcp.builtin/asset.duplicate
    group: asset
    description: 'Duplicate asset. Params: sourcePath, destinationPath, onConflict?'
  asset.rename:
    class_path: ue-mcp.builtin/asset.rename
    group: asset
    description: >-
      Rename asset: pass assetPath and newName, or sourcePath and
      destinationPath. World Partition levels are detected and their
      __ExternalActors__/__ExternalObjects__ packages migrate atomically
      alongside the .umap, source-side redirectors get fixed up, and the active
      editor world is swapped to blank if it matches the source (#409). Refuses
      if any package is dirty - save first. If a prior rename left externals
      orphaned at the old path, re-running reconciles them. Rollback descriptor
      is emitted even on partial failure so the inverse rename can recover.
      `force=true` lets the call merge into a destination with pre-existing
      externals (used by rollback). For batches of 3+ scene-referenced non-world
      assets use bulk_rename instead. Params: sourcePath?, destinationPath?,
      assetPath?, newName?, force?
  asset.bulk_rename:
    class_path: ue-mcp.builtin/asset.bulk_rename
    group: asset
    description: >-
      Batched rename using IAssetTools::RenameAssets - single transaction with
      one redirector-fixup pass (matches Content Browser drag). Use this over
      looped rename for scene-referenced assets. World assets are rejected
      (status=rejected_world); use rename_asset which handles WP externals
      atomically (#409). The fix-up pass cannot see a referencer that is not
      loaded, so each renamed item reports redirectorLeft and the result carries
      redirectorsLeft/redirectorsRemoved plus redirectorPackages, which feeds
      straight into fixup_redirectors (#908). A batch that would leave another
      object of a multi-object package at the old path is refused with
      reason=package_objects_left_behind and splitPackages naming each one;
      nothing moves (#1137). Params: renames
  asset.fixup_redirectors:
    class_path: ue-mcp.builtin/asset.fixup_redirectors
    group: asset
    description: >-
      Clean up ObjectRedirectors left at the old paths after a move, bounded to
      exactly the packages you name. Preflights each redirector, its
      destination, and its hard AND soft referencers, then reports
      packagesToLoad/packagesToSave before touching anything; dryRun=true stops
      there. The real run loads only those referencers (a soft reference in an
      unloaded package is what the rename's own fix-up pass misses), rewrites
      them, saves them, RE-QUERIES the asset registry, and deletes a redirector
      only when nothing references it any more, reporting kept vs deleted per
      package with the referencers that survived. Naming a whole content root is
      refused unless allowProjectWide=true, so this can never turn into a
      project-wide resave. Protected mounts are refused outright. dryRun is the
      way to preview: save=false only skips the explicit save pass, because the
      editor's own fix-up writes what it can regardless (#908). Params: paths,
      dryRun?, save?, allowProjectWide?
  asset.move:
    class_path: ue-mcp.builtin/asset.move
    group: asset
    description: >-
      Move asset: pass sourcePath and destinationPath. The same call as rename.
      Params: sourcePath?, destinationPath?, assetPath?, newName?, force?
  asset.delete:
    class_path: ue-mcp.builtin/asset.delete
    group: asset
    description: >-
      Delete asset. force defaults to false and is a REAL guard: the bridge asks
      the Asset Registry for referencers first and refuses with success=false,
      reason='has_referencers' and the full referencers list rather than
      destroying an asset other packages point at (#976). force=true takes the
      force-delete path, which also auto-closes open asset editors (#278). On a
      delete the editor attempted and could not finish, the reason is
      open_in_editor / has_referencers / in_memory_referenced /
      package_read_only / package_dirty / unknown, with referencers,
      inMemoryReferencers, packageReadOnly and packageDirty diagnostics (#601).
      Params: assetPath (or path), force?
  asset.delete_batch:
    class_path: ue-mcp.builtin/asset.delete_batch
    group: asset
    description: >-
      Batch-delete assets. Per-path status is deleted | absent | protected |
      refused | failed, plus reason+referencers on refused and failed entries. A
      referenced asset is refused per entry with force=false and the rest of the
      batch still runs, so one guarded asset never hides behind a bare failed
      count (#976, #278). Result carries
      deleted/absent/refused/failed/protected/total. Params: assetPaths (or
      paths), force?
  asset.create_data_asset:
    class_path: ue-mcp.builtin/asset.create_data_asset
    group: asset
    description: >-
      Create UDataAsset instance of custom class. className accepts the C++
      spelling with or without the A/U/F/E prefix (UMyConfig and MyConfig both
      resolve), a /Script/Module.ClassName path, or a loaded class name; a
      failed lookup lists the spellings tried and the closest matches (#823).
      Params: name, className (or class), packagePath?, properties?, onConflict?
  asset.create_asset_by_class:
    class_path: ue-mcp.builtin/asset.create_asset_by_class
    group: asset
    description: >-
      Create an asset of ANY concrete UObject class (not just UDataAsset) -
      physical-material subclasses, curves, settings objects. className accepts
      the C++ spelling with or without the A/U/F/E prefix, a
      /Script/Module.ClassName path, or a loaded class name (#823).
      Actors/components and specialized assets (Blueprint/Material) have
      dedicated actions (#726). Params: name, className (or class),
      packagePath?, properties?, onConflict?
  asset.read_graph:
    class_path: ue-mcp.builtin/asset.read_graph
    group: asset
    description: >-
      Read the NODE GRAPH of any EdGraph-backed asset: every graph in it, every
      node, and every node's pins with what each pin is connected to. Reflection
      cannot reach topology: UEdGraphNode declares its Pins array with no
      UPROPERTY, and UEdGraphPin is a plain class rather than a UObject, so no
      set_property, reflect_instance or find_object can read, break or make a
      connection (#1059). For the EdGraph types with no category of their own,
      CustomizableObject (Mutable) among them. A Blueprint, a PCG graph or a
      Material is REFUSED here and pointed at blueprint(read_graph) /
      blueprint(get_connections) / pcg(read_graph) / material(read_graph), which
      own those types and address them in their own terms. Each node reports
      name, path, class, title, position and comment; each pin reports name,
      pinId, direction, type, defaultValue and linkedTo[] naming the node and
      pin at the other end. Node settings themselves are read with
      reflection(action='reflect_instance') on the node path this returns, which
      already works; this reports what that cannot see. connectionCount is per
      graph and counts each wire once; nodesReported is how many nodes this call
      emitted, which maxNodes can cut below a graph's own nodeCount. A node
      reported with hasNoPins is broken: AllocateDefaultPins never ran for it,
      so it can never be wired and the editor cannot draw it. Each node also
      reports nodeGuid. To change the graph use connect_graph_pins,
      disconnect_graph_pins, add_graph_node and remove_graph_node, which go
      through the graph's own schema. An asset with no graph answers with an
      empty list and says so rather than failing. Params: assetPath (or path),
      graphName?, includePins?, maxNodes?
  asset.connect_graph_pins:
    class_path: ue-mcp.builtin/asset.connect_graph_pins
    group: asset
    description: >-
      Connect two pins in any EdGraph-backed asset with no category of its own,
      CustomizableObject (Mutable) among them, through the graph's own schema
      (TryCreateConnection), so the graph type's rules decide what is legal. A
      refusal returns the schema's own message with reason='schema_disallowed'.
      Address each end by node (nodeGuid, node path, name or unique title from
      read_graph) and pinId, which is the reliable form because pin names repeat
      on some node types; pin name plus direction also works. A pinId alone
      needs no node. brokenLinks lists any link the schema replaced. Rollback:
      disconnect_graph_pins. A Blueprint, Material or PCG graph is refused and
      pointed at its own category. Params: assetPath (or path), graphName?,
      sourceNode?, sourcePinId?, sourcePin?, sourcePinDirection?, targetNode?,
      targetPinId?, targetPin?, targetPinDirection?, save?
  asset.disconnect_graph_pins:
    class_path: ue-mcp.builtin/asset.disconnect_graph_pins
    group: asset
    description: >-
      Break links in an EdGraph-backed asset through its schema. With a target
      pin, breaks that one link (BreakSinglePinLink); without one, breaks every
      link on the source pin (BreakPinLinks). Pins are addressed as in
      connect_graph_pins. A link that does not exist is reported with
      wasConnected=false and nothing changes. Rollback: connect_graph_pins when
      exactly one link was broken; otherwise brokenLinks names each one. Params:
      assetPath (or path), graphName?, sourceNode?, sourcePinId?, sourcePin?,
      sourcePinDirection?, targetNode?, targetPinId?, targetPin?,
      targetPinDirection?, save?
  asset.add_graph_node:
    class_path: ue-mcp.builtin/asset.add_graph_node
    group: asset
    description: >-
      Add a node to an EdGraph-backed asset's graph through the schema's own
      node action, so its pins are allocated and it is parented to the graph.
      nodeClass is the class the action spawns (a CustomizableObjectNode class
      for Mutable, a SoundNode class for a SoundCue); actionName picks a menu
      entry by name ('category|name' also works) when several actions spawn the
      same class. When nothing matches, the error lists availableActions.
      spawnMode=direct constructs nodeClass itself (CreateNewGuid,
      PostPlacedNewNode, AllocateDefaultPins), and auto does that only for a
      schema that publishes no node actions. Returns nodeGuid, nodePath and
      every pin with its pinId. Rollback: remove_graph_node. Params: assetPath
      (or path), graphName?, nodeClass?, actionName?, spawnMode?, posX?, posY?,
      save?
  asset.remove_graph_node:
    class_path: ue-mcp.builtin/asset.remove_graph_node
    group: asset
    description: >-
      Remove a node from an EdGraph-backed asset's graph: the schema breaks its
      links, then the node is destroyed. A node the graph type forbids deleting
      (a root or output node) is refused. brokenLinks names every link it had so
      they can be re-made. Rollback: add_graph_node with the same class and
      position when exactly one schema action spawns it (lossy: a fresh default
      node); otherwise rollbackPossible=false. Params: assetPath (or path),
      graphName?, node, save?
  asset.create_customizable_object:
    class_path: ue-mcp.builtin/asset.create_customizable_object
    group: asset
    description: >-
      Create a Mutable CustomizableObject through Mutable's own factory, so it
      holds its Source graph with the Base Object node and can be authored with
      add_graph_node and connect_graph_pins at once. An asset made with
      create_asset_by_class has no graph. Returns objectPath, graphName,
      rootNode (nodeGuid and pins with pinIds) and every graph node.
      onConflict=skip returns an existing CustomizableObject as existed; error
      refuses. Fails with 'Mutable plugin not available' when the plugin is off.
      Rollback: delete_asset. Params: name, packagePath?, onConflict?, save?
  asset.compile_customizable_object:
    class_path: ue-mcp.builtin/asset.compile_customizable_object
    group: asset
    description: >-
      Compile a Mutable CustomizableObject synchronously, without saving or
      gathering references, and report the outcome: state, compiled, and the
      LogMutable errors and warnings the compile wrote. A failed compile returns
      success=false with the first error. Fails with 'Mutable plugin not
      available' when the Mutable plugin is not enabled. Params: assetPath (or
      path), optimizationLevel?, textureCompression?
  asset.create_subobject:
    class_path: ue-mcp.builtin/asset.create_subobject
    group: asset
    description: >-
      Create a named subobject OWNED by an existing asset, inside that asset's
      package, and return its object path for later property writes. This is the
      missing half of editing a data asset whose payload is named subobjects
      referenced from a struct array: set_property, bulk_set_properties and
      append_array_elements can edit the entries, and this makes a new one.
      Component classes are accepted, unlike create_asset_by_class; Actors are
      refused because they are spawned into a level. className takes a
      /Script/Module.Class path, which is how you name a plugin class the Python
      `unreal` module never exposes. The new object is created RF_Standalone and
      the package is saved in the same call, so it survives the garbage
      collection that used to eat a fresh object within one call and is
      reachable by path from the next one. properties are applied to a throwaway
      instance first, so a bad path or value creates nothing. outer='asset'
      (default) gives '<asset>.<name>'; outer='package' puts it beside the asset
      in the package (#975). Params: assetPath (or path), className, name,
      properties?, outer?, onConflict?, save?
  asset.bulk_upsert_data_assets:
    class_path: ue-mcp.builtin/asset.bulk_upsert_data_assets
    group: asset
    description: >-
      Create or update up to 500 UDataAsset instances in ONE call. Every
      descriptor is first applied to a transient copy, so a bad class, property
      path, or value rejects the whole batch before a package is touched;
      nothing is half-written by a typo. Per-item status is created | updated |
      unchanged | skipped | failed (dryRun reports wouldCreate | wouldUpdate |
      wouldRemainUnchanged | wouldSkip), each with its own error when it failed.
      Replaying the same request returns unchanged, and only changed packages
      are saved. Emits a rollback descriptor that restores prior values and
      deletes what it created. Params: items, onConflict?, dryRun?, save?
  asset.save:
    class_path: ue-mcp.builtin/asset.save
    group: asset
    description: >-
      Save one asset, or every dirty asset under /Game when assetPath is
      omitted. force=true saves regardless of the dirty flag - several edits
      (OFPA level actors, some subsystem property writes) never mark their
      package dirty, so a dirty-only save skipped them and still reported
      success. Returns the package name plus on-disk file path, size and mtime
      so the write can be verified rather than trusted (#768). A failed save
      returns the engine's reason in error and saveDiagnostics, and when the
      engine refused a reference to a private object, illegalReference names
      that object, the object and property holding it, and how to clear it
      (#1120). Params: assetPath? (or path), force?
  asset.save_all_dirty:
    class_path: ue-mcp.builtin/asset.save_all_dirty
    group: asset
    description: >-
      Flush every dirty package to disk in one call. Reports the packages it
      attempted, which ones reached disk (with file path, size and mtime) and
      which are still dirty afterwards, because a bare savedAll boolean has come
      back true while packages were never written (#768). Params:
      saveMapPackages?, saveContentPackages?
  asset.set_mesh_material:
    class_path: ue-mcp.builtin/asset.set_mesh_material
    group: asset
    description: >-
      Assign material to static mesh slot. Params: assetPath (or path),
      materialPath, slotIndex?
  asset.set_mesh_materials_batch:
    class_path: ue-mcp.builtin/asset.set_mesh_materials_batch
    group: asset
    description: >-
      Assign materials across many meshes and slots in one call, so an N mesh x
      M slot kit costs one round trip instead of N*M. StaticMesh and
      SkeletalMesh both work. Address a slot by slotName (survives a reimport
      reordering slot indices) or by slotIndex (default 0); passing both is
      rejected when they disagree. Every submitted assignment returns its own
      index/ok/status/error, status being
      ok|updated|unchanged|invalid|protected|duplicate|not_found|slot_not_found|failed|skipped.
      Default is all-or-nothing: any preflight rejection aborts before a mesh is
      touched. Pass continueOnError to apply the assignments that did pass and
      keep the rejects reported alongside them. Each mesh is written and saved
      once no matter how many of its slots the batch names, and the rollback
      payload restores only the writes that landed (#822). Params: assignments,
      save?, dryRun?, continueOnError?
  asset.recenter_pivot:
    class_path: ue-mcp.builtin/asset.recenter_pivot
    group: asset
    description: >-
      Move static mesh pivot to geometry center. With assetPaths, the first mesh
      sets the reference pivot for all of them. Params: assetPath (or path) OR
      assetPaths
  asset.import_static_mesh:
    class_path: ue-mcp.builtin/asset.import_static_mesh
    group: asset
    description: >-
      Import from FBX, OBJ, or GLB/glTF (glTF routes through Interchange)
      (#549). importUniformScale=100 fixes metre-authored FBX (#687). Params:
      filePath (or filename), name? (or assetName), packagePath? (or
      destinationPath), combineMeshes?, importMaterials?, importTextures?,
      generateLightmapUVs?, importUniformScale?
  asset.import_skeletal_mesh:
    class_path: ue-mcp.builtin/asset.import_skeletal_mesh
    group: asset
    description: >-
      Import skeletal mesh from FBX. importUniformScale=100 fixes metre-authored
      FBX (Blender FBX_SCALE_ALL) that lands 100x too small on a cm skeleton
      (#687). Returns post-import readback: boxExtent, morphTargets[], numLODs,
      skeleton (#678). Params: filePath (or filename), name? (or assetName),
      packagePath? (or destinationPath), skeletonPath?, importMaterials?,
      importTextures?, importUniformScale?, importMorphTargets?,
      createPhysicsAsset?, replaceExisting?
  asset.import_animation:
    class_path: ue-mcp.builtin/asset.import_animation
    group: asset
    description: >-
      Import anim from FBX. importSettings sets any FbxAnimSequenceImportData or
      FbxImportUI field by UPROPERTY name or dotted path, e.g.
      {bSnapToClosestFrameBoundary: true} for clips whose length is not
      frame-aligned; a bool may drop its b prefix. An unknown key fails before
      anything is imported (#1134). Params: filePath (or filename), name? (or
      assetName), packagePath? (or destinationPath), skeletonPath,
      importCustomAttribute?, removeRedundantKeys?, importSettings?
  asset.import_file:
    class_path: ue-mcp.builtin/asset.import_file
    group: asset
    description: >-
      Import any source file through a chosen factory, unattended. factoryClass
      names a UFactory subclass by name or /Script path, including one a plugin
      ships (resolved at runtime; omit it to let the editor pick by extension).
      factoryProperties sets that factory's properties by UPROPERTY name or
      dotted path before the import runs, which is how a factory that raises its
      own options dialog is told to use the supplied options instead, since
      unattended mode cancels the dialog and the import with it. The file
      extension is checked against the factory's formats first. An unknown
      property fails before anything is imported (#1096). Params: filePath (or
      filename), packagePath (or destinationPath), name? (or assetName),
      factoryClass?, factoryProperties?, replaceExisting?, save?, automated?
  asset.import_texture:
    class_path: ue-mcp.builtin/asset.import_texture
    group: asset
    description: >-
      Import image. sRGB/compressionSettings/lodGroup/neverStream are applied at
      import time (folded in, no second call needed) (#661). Params: filePath
      (or filename), name? (or assetName), packagePath? (or destinationPath),
      sRGB?, compressionSettings?, lodGroup?, neverStream?, noCompression?,
      noAlpha?
  asset.create_render_target_2d:
    class_path: ue-mcp.builtin/asset.create_render_target_2d
    group: asset
    description: >-
      Create and persist a TextureRenderTarget2D asset. Render format is applied
      before resource initialization. Params: name, packagePath?, width?,
      height?, format?, clearColor?, generateMips?, targetGamma?, onConflict?
  asset.read_skeletal_mesh_build_settings:
    class_path: ue-mcp.builtin/asset.read_skeletal_mesh_build_settings
    group: asset
    description: >-
      Read a SkeletalMesh's per-LOD FSkeletalMeshBuildSettings without changing
      anything. lodIndex and allLods are mutually exclusive. Returns assetPath,
      lodCount and lods[] of {lodIndex, beforeBuildSettings, afterBuildSettings
      (identical on a read), beforeOptimizeForInstancing,
      afterOptimizeForInstancing, changed}, where each settings object carries
      bRecomputeNormals, bRecomputeTangents, bUseMikkTSpace,
      bComputeWeightedNormals, bRemoveDegenerates,
      bUseHighPrecisionTangentBasis, bUseHighPrecisionSkinWeights,
      bUseFullPrecisionUVs, bUseBackwardsCompatibleF16TruncUVs,
      bOptimizeForInstancing, thresholdPosition, thresholdTangentNormal,
      thresholdUV, morphThresholdPosition and boneInfluenceLimit. Params:
      assetPath, lodIndex?, allLods?
  asset.set_skeletal_mesh_optimize_for_instancing:
    class_path: ue-mcp.builtin/asset.set_skeletal_mesh_optimize_for_instancing
    group: asset
    description: >-
      Write bOptimizeForInstancing on a SkeletalMesh's LOD build settings, which
      reorders the skin data so instanced draws of the mesh batch. Only LODs
      whose current value differs are touched, and the asset is only rebuilt and
      saved when at least one changes, so a call that asks for the value already
      set is a no-op. Read the current state with
      read_skeletal_mesh_build_settings first. lodIndex and allLods are mutually
      exclusive. Returns assetPath, lodCount and lods[] of {lodIndex,
      beforeBuildSettings, afterBuildSettings, beforeOptimizeForInstancing,
      afterOptimizeForInstancing, changed}. Params: assetPath, enabled,
      lodIndex?, allLods?
  asset.read_skeletal_mesh_skin_weights:
    class_path: ue-mcp.builtin/asset.read_skeletal_mesh_skin_weights
    group: asset
    description: >-
      Read existing per-vertex skin influences from one SkeletalMesh source LOD
      and profile. The caller must name 1-256 source MeshDescription vertex IDs,
      so a read cannot dump a whole mesh. Each influence returns boneName,
      boneIndex, normalized weight and exact uint16 rawWeight. Render data may
      use 8-bit weights unless high-precision skin weights are enabled.
      Generated LODs without source geometry are refused. Params: assetPath,
      vertexIndices, lodIndex?, profileName?
  asset.set_skeletal_mesh_skin_weights:
    class_path: ue-mcp.builtin/asset.set_skeletal_mesh_skin_weights
    group: asset
    description: >-
      Replace skin influences on explicitly selected source MeshDescription
      vertices in one existing SkeletalMesh LOD/profile. The complete batch is
      validated before mutation: invalid or duplicate vertices/bones,
      non-finite/negative/out-of-range weights and all-zero sets fail without a
      write. Unreal's FBoneWeights normalizes, quantizes to uint16 source
      weights and prunes ordinary edits to its influence limit; actual
      before/after values are read back. Other source vertices and source
      profiles are untouched. Rebuilding may refresh derived render data and
      dependent generated LODs. A changed mesh is rebuilt and saved; an
      identical request is a no-op. Rollback payloads use restoreRawWeights with
      exact uint16 rawWeight values. Params: assetPath, edits, lodIndex?,
      profileName?, restoreRawWeights?
  asset.read_cloth_data:
    class_path: ue-mcp.builtin/asset.read_cloth_data
    group: asset
    description: >-
      Read Chaos cloth data on a skeletal mesh: per clothing asset, its configs
      (reflected properties), LOD count, and per-LOD point-weight-map summary
      (name, target, vertex count, min/max - including the MaxDistances mask).
      Also reports which render sections each clothing asset is bound to
      (boundSections, bound), every section of every LOD (sections: lodIndex,
      sectionIndex, materialIndex, usesCloth, clothingAsset, assetLodIndex) and
      unboundClothingAssets: an asset bound to no section never simulates
      (#595/#1139). Params: skeletalMeshPath (or assetPath)
  asset.bind_cloth_to_section:
    class_path: ue-mcp.builtin/asset.bind_cloth_to_section
    group: asset
    description: >-
      Bind a clothing asset to one render section so it simulates, as the
      skeletal mesh editor's section clothing dropdown does. Whatever the
      section was bound to is unbound first. lodIndex and sectionIndex are
      validated against the mesh, assetLodIndex against the clothing asset.
      Saves the mesh; rolls back to the previous binding (#1139). Params:
      skeletalMeshPath (or assetPath), lodIndex, sectionIndex, clothingAsset?,
      assetLodIndex?
  asset.unbind_cloth_from_section:
    class_path: ue-mcp.builtin/asset.unbind_cloth_from_section
    group: asset
    description: >-
      Remove the clothing asset bound to one render section. The engine unbinds
      per LOD, so other sections of that LOD bound to the same asset are
      released too and listed in releasedSections. A section with no binding is
      a no-op. Saves the mesh; rolls back by rebinding (#1139). Params:
      skeletalMeshPath (or assetPath), lodIndex, sectionIndex, clothingAsset?
  asset.set_cloth_config:
    class_path: ue-mcp.builtin/asset.set_cloth_config
    group: asset
    description: >-
      Set properties on a clothing asset's Chaos cloth config via reflection
      (#595). Params: skeletalMeshPath (or assetPath), properties,
      clothingAsset?, configType?
  asset.export_texture:
    class_path: ue-mcp.builtin/asset.export_texture
    group: asset
    description: >-
      Export a Texture2D to a PNG on disk (for inspection or external diffing)
      (#697). Params: assetPath (or path), outputPath (or filePath)
  asset.compare_textures:
    class_path: ue-mcp.builtin/asset.compare_textures
    group: asset
    description: >-
      Compare two Texture2D assets by dimensions, pixel format, and
      source-content identity (FTextureSource id) - tells you whether an
      authored texture actually changed without offline pixel-diffing (#697).
      Params: assetPathA (or a), assetPathB (or b)
  asset.import_texture_batch:
    class_path: ue-mcp.builtin/asset.import_texture_batch
    group: asset
    description: >-
      Import many textures in one call - the loop stays inside the editor (no
      per-file bridge round-trip), so this finishes far faster than N
      import_texture calls. Per-item result records mirror import_texture.
      Returns requested/imported/failed counts + items[] (#430). Params: items,
      packagePath?, save?, automated?
  asset.reimport:
    class_path: ue-mcp.builtin/asset.reimport
    group: asset
    description: >-
      Reimport asset from source file. Params: assetPath (or path), filePath?
      (or filename)
  asset.read_datatable:
    class_path: ue-mcp.builtin/asset.read_datatable
    group: asset
    description: >-
      Read DataTable rows. A large table overflows the response inline: pass
      outputPath to write the rows (after rowFilter) to a file as a JSON array
      instead. The response then carries outputPath (resolved absolute path),
      rowCount, bytes, rowStruct and totalRowCount, with no rows or rowNames. A
      relative outputPath resolves under the project's Saved/, missing folders
      are created and an existing file is overwritten. Params: assetPath (or
      path), rowFilter?, outputPath?
  asset.create_datatable:
    class_path: ue-mcp.builtin/asset.create_datatable
    group: asset
    description: 'Create DataTable. Params: name, rowStruct, packagePath?, onConflict?'
  asset.reimport_datatable:
    class_path: ue-mcp.builtin/asset.reimport_datatable
    group: asset
    description: >-
      Reimport DataTable from JSON. Params: assetPath (or path), jsonPath?,
      jsonString?
  asset.set_datatable_row:
    class_path: ue-mcp.builtin/asset.set_datatable_row
    group: asset
    description: >-
      Append or overwrite a single DataTable row. row carries row-struct fields,
      and a partial update merges with the existing row. Idempotent; rollback
      restores the prior row (#437). Params: assetPath (or path), rowName, row
      (or fields, or data)
  asset.add_datatable_row:
    class_path: ue-mcp.builtin/asset.add_datatable_row
    group: asset
    description: >-
      Alias for set_datatable_row (#437). Params: assetPath (or path), rowName,
      row (or fields, or data)
  asset.update_datatable_row:
    class_path: ue-mcp.builtin/asset.update_datatable_row
    group: asset
    description: >-
      Alias for set_datatable_row; partial update merges with existing row
      (#437). Params: assetPath (or path), rowName, row (or fields, or data)
  asset.remove_datatable_row:
    class_path: ue-mcp.builtin/asset.remove_datatable_row
    group: asset
    description: >-
      Remove a single DataTable row. Idempotent (alreadyDeleted=true if missing)
      (#437). Params: assetPath (or path), rowName
  asset.get_datatable_row:
    class_path: ue-mcp.builtin/asset.get_datatable_row
    group: asset
    description: >-
      Read one DataTable row's fields without dumping the whole table (#535).
      Params: assetPath (or path), rowName
  asset.set_datatable_cell:
    class_path: ue-mcp.builtin/asset.set_datatable_cell
    group: asset
    description: >-
      Write a single field on a single existing row (merges, leaves other cells
      untouched). Errors if the row doesn't exist (#535). Params: assetPath (or
      path), rowName, fieldName, value
  asset.rename_datatable_row:
    class_path: ue-mcp.builtin/asset.rename_datatable_row
    group: asset
    description: >-
      Rename a row key, preserving its values (#535). Params: assetPath (or
      path), oldName (or rowName), newName
  asset.fill_datatable_from_json:
    class_path: ue-mcp.builtin/asset.fill_datatable_from_json
    group: asset
    description: >-
      Bulk-upsert rows from a {rowName: {field: value}} object without touching
      unrelated rows (non-destructive, unlike reimport_datatable) (#535).
      Params: assetPath (or path), rows?, jsonString?
  asset.create_curvetable:
    class_path: ue-mcp.builtin/asset.create_curvetable
    group: asset
    description: 'Create CurveTable asset. Params: name, packagePath?, onConflict?'
  asset.read_curvetable:
    class_path: ue-mcp.builtin/asset.read_curvetable
    group: asset
    description: 'Read CurveTable rows and keys. Params: assetPath (or path), rowFilter?'
  asset.list_curvetable_rows:
    class_path: ue-mcp.builtin/asset.list_curvetable_rows
    group: asset
    description: 'Alias for read_curvetable. Params: assetPath (or path), rowFilter?'
  asset.import_curvetable:
    class_path: ue-mcp.builtin/asset.import_curvetable
    group: asset
    description: >-
      Import CurveTable from JSON/CSV string or file. Params: assetPath (or
      path), jsonString?, csvString?, filePath? (or jsonPath, or csvPath),
      format?, interpMode?
  asset.add_curvetable_row:
    class_path: ue-mcp.builtin/asset.add_curvetable_row
    group: asset
    description: >-
      Add CurveTable row. Params: assetPath (or path), rowName, curveType? (or
      mode), interpMode?
  asset.remove_curvetable_row:
    class_path: ue-mcp.builtin/asset.remove_curvetable_row
    group: asset
    description: >-
      Remove CurveTable row. Idempotent if missing. Params: assetPath (or path),
      rowName
  asset.rename_curvetable_row:
    class_path: ue-mcp.builtin/asset.rename_curvetable_row
    group: asset
    description: >-
      Rename CurveTable row. Params: assetPath (or path), oldName (or rowName),
      newName
  asset.get_curvetable_keys:
    class_path: ue-mcp.builtin/asset.get_curvetable_keys
    group: asset
    description: 'Read keys from one CurveTable row. Params: assetPath (or path), rowName'
  asset.set_curvetable_keys:
    class_path: ue-mcp.builtin/asset.set_curvetable_keys
    group: asset
    description: >-
      Replace keys on one CurveTable row. Params: assetPath (or path), rowName,
      keys
  asset.add_curvetable_key:
    class_path: ue-mcp.builtin/asset.add_curvetable_key
    group: asset
    description: >-
      Add or update one key on a CurveTable row. Params: assetPath (or path),
      rowName, time, value, interpMode?, keyTimeTolerance?
  asset.list_textures:
    class_path: ue-mcp.builtin/asset.list_textures
    group: asset
    description: >-
      List textures, cursor-paginated. maxResults is a deprecated spelling of
      limit. Params: directory?, cursor?, limit? (or maxResults)
  asset.get_texture_info:
    class_path: ue-mcp.builtin/asset.get_texture_info
    group: asset
    description: 'Get texture details. Params: assetPath (or path)'
  asset.set_texture_settings:
    class_path: ue-mcp.builtin/asset.set_texture_settings
    group: asset
    description: >-
      Set texture settings, at the top level or inside settings. Params:
      assetPath (or path), settings?, compressionSettings?, lodGroup?, sRGB?,
      neverStream?
  asset.create_stringtable:
    class_path: ue-mcp.builtin/asset.create_stringtable
    group: asset
    description: >-
      Create a StringTable asset. Params: name, packagePath?, namespace?,
      onConflict?
  asset.read_stringtable:
    class_path: ue-mcp.builtin/asset.read_stringtable
    group: asset
    description: 'Read StringTable entries and keys. Params: assetPath (or path), keyFilter?'
  asset.list_stringtable_keys:
    class_path: ue-mcp.builtin/asset.list_stringtable_keys
    group: asset
    description: 'List StringTable keys. Params: assetPath (or path), keyFilter?'
  asset.get_stringtable_entry:
    class_path: ue-mcp.builtin/asset.get_stringtable_entry
    group: asset
    description: 'Read one StringTable entry. Params: assetPath (or path), key'
  asset.set_stringtable_entry:
    class_path: ue-mcp.builtin/asset.set_stringtable_entry
    group: asset
    description: >-
      Create or update one StringTable entry. Pass sourceString, or value as a
      second spelling of it. Params: assetPath (or path), key, sourceString?,
      value?
  asset.remove_stringtable_entry:
    class_path: ue-mcp.builtin/asset.remove_stringtable_entry
    group: asset
    description: >-
      Remove one StringTable entry. Idempotent (alreadyDeleted=true if missing).
      Params: assetPath (or path), key
  asset.import_stringtable:
    class_path: ue-mcp.builtin/asset.import_stringtable
    group: asset
    description: >-
      Import StringTable entries from CSV. Params: assetPath (or path), filePath
      (or filename, or csvPath)
  asset.import_stringtable_csv:
    class_path: ue-mcp.builtin/asset.import_stringtable_csv
    group: asset
    description: >-
      Import or refresh a String Table from a CSV that is the canonical source,
      using Unreal's own String Table CSV importer. The CSV is parsed into a
      throwaway table and checked against expectedKeys FIRST, so a malformed
      file or a key set that does not match leaves the asset untouched and comes
      back with missingKeys/unexpectedKeys instead. replaceExisting=true prunes
      entries the CSV no longer carries, which is what makes the CSV canonical
      rather than additive; the prune runs after a successful merge so a bad
      parse can never empty the table. Returns addedKeys, updatedKeys,
      removedKeys, entry counts and an explicit persisted/saved plus
      persistError, so a write that did not reach disk is never reported as a
      success. A relative csvPath is read against the project directory (#978).
      Params: assetPath (or path), csvPath (or filePath), expectedKeys?,
      requireExactKeys?, replaceExisting?, save?
  asset.add_input_mapping:
    class_path: ue-mcp.builtin/asset.add_input_mapping
    group: asset
    description: >-
      Append an Enhanced Input key mapping to an InputMappingContext
      (InputAction + key by name string e.g. 'Mouse2D','LeftMouseButton').
      Idempotent on (action,key). For modifiers/triggers use
      gameplay(set_mapping_modifiers). Same as gameplay(add_imc_mapping) (#525).
      Returns saved, persisted, packageDirty, packageName, and persistError when
      not persisted. Params: imcPath (or mappingContext, or assetPath),
      inputActionPath (or inputAction), key, save?
  asset.remove_input_mapping:
    class_path: ue-mcp.builtin/asset.remove_input_mapping
    group: asset
    description: >-
      Remove an IMC key mapping. Same as gameplay(remove_imc_mapping) (#525).
      Returns saved, persisted, packageDirty, packageName, and persistError when
      not persisted. Params: imcPath (or mappingContext, or assetPath),
      mappingIndex?, inputActionPath? (or inputAction), key?, save?
  asset.list_input_mappings:
    class_path: ue-mcp.builtin/asset.list_input_mappings
    group: asset
    description: >-
      List an IMC's key->action bindings with triggers/modifiers. Same as
      gameplay(read_imc) (#525). Params: imcPath (or mappingContext, or
      assetPath)
  asset.add_socket:
    class_path: ue-mcp.builtin/asset.add_socket
    group: asset
    description: >-
      Add socket to StaticMesh or SkeletalMesh. SkeletalMesh writes mesh-local
      sockets by default; pass a Skeleton asset path to edit skeleton-level
      sockets. Idempotent on socket name; pass onConflict='update' to overwrite
      an existing socket's transform with the supplied
      relativeLocation/relativeRotation/relativeScale (#412). Params: assetPath,
      socketName, boneName?, relativeLocation?, relativeRotation?,
      relativeScale?, onConflict?
  asset.remove_socket:
    class_path: ue-mcp.builtin/asset.remove_socket
    group: asset
    description: 'Remove socket by name. Params: assetPath, socketName'
  asset.list_sockets:
    class_path: ue-mcp.builtin/asset.list_sockets
    group: asset
    description: >-
      List sockets on a mesh (StaticMesh or SkeletalMesh). SkeletalMesh results
      include mesh-local sockets plus assigned Skeleton sockets, each with
      source='mesh' or source='skeleton'. Params: assetPath
  asset.set_socket_transform:
    class_path: ue-mcp.builtin/asset.set_socket_transform
    group: asset
    description: >-
      Update an existing socket's relative transform on StaticMesh or
      SkeletalMesh. Pass any subset of
      relativeLocation/relativeRotation/relativeScale; omitted fields stay at
      their current values. Errors if the socket does not exist (use add_socket
      to create). Common after FBX import when SOCKET_* empties land with
      scale=(100,100,100) (#412). Params: assetPath, socketName,
      relativeLocation?, relativeRotation?, relativeScale?
  asset.set_property:
    class_path: ue-mcp.builtin/asset.set_property
    group: asset
    description: >-
      Set a UPROPERTY on any loaded asset (Material, DataAsset, DataTable,
      SubsurfaceProfile, etc.) using a dotted path. Blueprint paths resolve to
      the generated-class CDO so you can author its defaults + Instanced
      sub-object arrays (#568). Walks nested structs, array elements by index,
      and instanced subobjects internally - no more read-modify-write copies
      (e.g. `settings.mean_free_path_distance` on a UMaterial, or
      `Config.Traits[1].Params.Field` on a config asset #527). Value goes
      through MCPJsonProperty::SetJsonOnProperty so JSON null clears object
      refs, structs accept {x,y,z}, arrays/maps round-trip. TMap values take {
      "Key": value } or, for struct keys, [{ key: {...}, value: ... }]; a write
      that cannot store every entry fails and leaves the old value untouched
      (#820). The write is saved to the package by default and the result
      reports persisted plus the package name; a write that could not reach disk
      (save=false, a protected mount, a read-only file, a refused save) comes
      back with persisted=false and persistError naming the reason instead of a
      bare success that reverts on the next editor start (#931) (#420). Params:
      assetPath (or path), propertyName, value, save?
  asset.append_array_elements:
    class_path: ue-mcp.builtin/asset.append_array_elements
    group: asset
    description: >-
      Append one or more JSON values to a reflected TArray without replacing
      existing entries. Supports dotted property paths plus native and
      user-defined USTRUCT elements. All elements are validated before mutation;
      returns appended indices and rollback data. The append is saved to the
      package by default and reports persisted / persistError the same way
      set_property does (#931). Params: assetPath (or path), propertyName,
      elements, save?
  asset.bulk_set_properties:
    class_path: ue-mcp.builtin/asset.bulk_set_properties
    group: asset
    description: >-
      Set dotted UPROPERTY paths on as many as 500 assets in one preflighted
      batch. Every asset, path, and value is validated before anything is
      mutated, and every submitted item comes back with its own ok/status/error,
      so a bad path in item 300 never hides the other 499 verdicts. Default is
      all-or-nothing: any preflight rejection aborts before a single UObject is
      touched. Pass continueOnError to apply the items that did pass and keep
      the rejects reported alongside them. Returns per-property readback,
      aggregate counts, targeted save results, and a replayable rollback payload
      covering only the writes that landed. Params: items, save?, dryRun?,
      continueOnError?
  asset.bulk_read_properties:
    class_path: ue-mcp.builtin/asset.bulk_read_properties
    group: asset
    description: >-
      Read the SAME properties off many assets in one call, filtered and
      aggregated in the editor. read_properties answers one asset per call,
      which turns a library-wide question (concurrency settings across 582 sound
      assets, cull distances across 201 foliage types) into a loop. Select with
      assetPaths or with directory narrowed by classNames; propertyNames accepts
      dotted paths into nested structs (e.g. 'CullDistance.Max'), and a
      Blueprint path reads its generated-class CDO. Predicates, groupBy and
      countBy all evaluate here: filtering happens before anything crosses the
      wire, with the same operators as level(query_components). Absent and null
      are reported separately, because 'this class has no such property' and
      'this property is unset' are different findings; suspect is true for
      either, and suspectOnly returns just those rows. Never writes, and reports
      dirtiedPackages (#909). Params: propertyNames, assetPaths OR directory,
      recursive?, classNames?, matchSubclasses?, where?, whereMode?,
      suspectOnly?, groupBy?, countBy?, sampleLimit?, countOnly?, limit?,
      startIndex?, maxAssets?, outputPath?
  asset.set_texture_settings_by_type:
    class_path: ue-mcp.builtin/asset.set_texture_settings_by_type
    group: asset
    description: >-
      Apply the canonical (compressionSettings, sRGB, LOD group) combo to every
      texture in each group: normal -> Normalmap, grayscale -> Grayscale,
      baseColor -> Default sRGB, hdr -> HDR (#421). Params: groups
  asset.create_interchange_pipeline:
    class_path: ue-mcp.builtin/asset.create_interchange_pipeline
    group: asset
    description: >-
      One-call factory for a UInterchangeGenericAssetsPipeline asset with the
      15-property mesh-import boilerplate already applied
      (RecomputeNormals=false, MikkTSpace=true, HighPrecisionTangents=true,
      BuildNanite=false, CreatePhysicsAsset=false, etc.) (#421). Params:
      assetPath OR name, packagePath?, meshType?, options?, onConflict?
  asset.reload_package:
    class_path: ue-mcp.builtin/asset.reload_package
    group: asset
    description: 'Force reload an asset package from disk. Params: assetPath (or path)'
  asset.health_check:
    class_path: ue-mcp.builtin/asset.health_check
    group: asset
    description: >-
      Diagnose stuck-unloadable asset. Returns
      onDisk/inRegistry/isLoaded/canLoad/isStuck flags so an agent can detect
      the half-shutdown state where load returns null but the file exists
      (#279). Params: assetPath (or path)
  asset.force_reload:
    class_path: ue-mcp.builtin/asset.force_reload
    group: asset
    description: >-
      Aggressive reload from disk: closes open editors, reloads the package
      (rebuilding a Blueprint's class and CDO so container properties come back
      fresh, not just scalars), and reports objectReplaced. Refuses a dirty
      package unless discardUnsaved=true, and fails loudly when the editor would
      not release the old object rather than serving stale values (#279/#820).
      Params: assetPath (or path), discardUnsaved?
  asset.export:
    class_path: ue-mcp.builtin/asset.export
    group: asset
    description: >-
      Export asset to disk file (Texture2D → PNG, StaticMesh → FBX, etc.).
      Params: assetPath (or path), outputPath
  asset.search_fts:
    class_path: ue-mcp.builtin/asset.search_fts
    group: asset
    description: >-
      Ranked asset search (token-scored over name/class/path). Every match is
      scored and the ranked list is paged, so the top page is a page rather than
      the whole answer. maxResults is a deprecated spelling of limit. Params:
      query, classFilter?, cursor?, limit? (or maxResults)
  asset.reindex_fts:
    class_path: ue-mcp.builtin/asset.reindex_fts
    group: asset
    description: >-
      Rescan a content path so newly added assets on disk become searchable by
      search_fts. Params: directory?
  asset.get_referencers:
    class_path: ue-mcp.builtin/asset.get_referencers
    group: asset
    description: >-
      Reverse dependency lookup (what references this) (#150). Returns
      {referencersByPackage, totalReferencers}. Params: packages?, packagePath?
  asset.get_dependencies:
    class_path: ue-mcp.builtin/asset.get_dependencies
    group: asset
    description: >-
      Forward dependency lookup (what packages this asset references) (#588).
      Returns {dependenciesByPackage, totalDependencies}. Params: packages?,
      packagePath?, hard?, soft?
  asset.list_skeleton_bones:
    class_path: ue-mcp.builtin/asset.list_skeleton_bones
    group: asset
    description: >-
      List bones (names + rest-pose local and component-space transforms) from a
      SkeletalMesh or Skeleton asset, no live actor needed (#593). Returns
      {bones, boneCount, sourceKind}. Params: assetPath (or path),
      includeTransforms?
  asset.get_primary_asset_ids:
    class_path: ue-mcp.builtin/asset.get_primary_asset_ids
    group: asset
    description: >-
      Enumerate AssetManager-registered FPrimaryAssetIds (verify a primary-asset
      registration) (#579). Returns {primaryAssetIds:[{primaryAssetId, type,
      name, assetPath}], count, total}. Params: type?, maxResults?
  asset.set_sk_material_slots:
    class_path: ue-mcp.builtin/asset.set_sk_material_slots
    group: asset
    description: >-
      Set materials on a USkeletalMesh by slot name or slotIndex (bypasses the
      blueprint override-materials path that UE's ICH silently reverts). Params:
      assetPath (or path), slots
  asset.diagnose_registry:
    class_path: ue-mcp.builtin/asset.diagnose_registry
    group: asset
    description: >-
      Scan a content path and compare disk vs AssetRegistry (including in-memory
      pending-kill entries). Returns onDiskCount, inMemoryIncludedCount,
      ghostCount and paths. Params: path, recursive?, reconcile?
  asset.get_mesh_bounds:
    class_path: ue-mcp.builtin/asset.get_mesh_bounds
    group: asset
    description: >-
      Get StaticMesh OR SkeletalMesh bounding box. Returns min, max, boxExtent,
      boxCenter, meshKind (#193/#351). Params: assetPath
  asset.get_mesh_info:
    class_path: ue-mcp.builtin/asset.get_mesh_info
    group: asset
    description: >-
      One-call mesh QA: bounds + material slots + skeleton + LOD/vertex counts.
      Works for both UStaticMesh and USkeletalMesh. Returns meshKind,
      boundsOrigin, boundsExtent, heightM, lodCount, vertexCount, skeletonPath
      (skeletal only), materialSlots:[{index, slotName, materialPath,
      isDefaultFallback}], materialCount (#431). Params: assetPath
  asset.read_import_sources:
    class_path: ue-mcp.builtin/asset.read_import_sources
    group: asset
    description: >-
      Read AssetImportData source filenames on an imported asset (StaticMesh,
      SkeletalMesh, Texture, Animation, etc.). Returns sources[] of
      {relativeFilename, absolutePath, timestamp, fileHash, displayLabelName}
      (#270). Params: assetPath (or path)
  asset.get_mesh_collision:
    class_path: ue-mcp.builtin/asset.get_mesh_collision
    group: asset
    description: >-
      Inspect StaticMesh collision setup. Returns collisionTraceFlag,
      hasSimple/ComplexCollision, element counts (#177). Params: assetPath
  asset.get_mesh_geometry:
    class_path: ue-mcp.builtin/asset.get_mesh_geometry
    group: asset
    description: >-
      Read actual vertex data off a StaticMesh OR SkeletalMesh: per-section
      positions, uvs, normals and triangle indices, from the engine's render
      data (no ProceduralMeshComponent plugin needed). Triangle indices are
      section-local, so they index that section's own positions array; add
      baseVertexIndex for LOD-global indices. Over 20000 vertices inline is
      refused - pass dumpToFile to write the full data to a JSON file instead,
      or narrow with sectionIndex (#948/#926/#953). Params: assetPath (or path),
      lodIndex?, sectionIndex?, include?, uvChannel?, dumpToFile?, outputPath?
  asset.measure_mesh_geometry:
    class_path: ue-mcp.builtin/asset.measure_mesh_geometry
    group: asset
    description: >-
      Measure a StaticMesh OR SkeletalMesh LOD: bounds, dimensions, surfaceArea,
      volume, triangleCount, vertexCount, isClosed, isManifold,
      boundaryEdgeCount, nonManifoldEdgeCount. surfaceArea and volume are NAMED
      fields, never a positional pair (the engine's get_mesh_volume_area returns
      them in the order opposite to its name, #938). Vertices are welded by
      position before topology analysis so a UV seam does not read as a hole
      (#938/#953). Params: assetPath (or path), lodIndex?, sectionIndex?
  asset.read_uv_channels:
    class_path: ue-mcp.builtin/asset.read_uv_channels
    group: asset
    description: >-
      Report every UV channel of a StaticMesh or SkeletalMesh LOD: bounds, UV
      area, unit-square coverage, overlap fraction and the triangles involved,
      island count, degenerate islands, seam edges, out-of-range and flipped
      triangles, plus which channel LightMapCoordinateIndex points at and the
      LOD's lightmap build settings. This is the verification half of the UV
      surface: every other UV action reports the same channel block after it
      writes, so a change can be checked rather than trusted. Overlap and
      coverage are RASTERISED at rasterSize rather than tested exactly, and the
      result says so via overlapMethod. Params: assetPath (or path), lodIndex?,
      channels?, includeIslands?, includeOverlap?, rasterSize?
  asset.set_uv_channel_count:
    class_path: ue-mcp.builtin/asset.set_uv_channel_count
    group: asset
    description: >-
      Add, remove, resize or copy a UV channel. Channel count is a
      mesh-description attribute with no UPROPERTY, so asset(set_property)
      cannot reach it. Setting the count it already has returns existed=true and
      skips the rebuild. Growing has an exact inverse and the rollback restores
      it; remove and copy-over-existing DESTROY coordinates, so those report
      rollbackRestoresChannelCountOnly rather than pretending the undo is
      complete. Params: assetPath (or path), lodIndex?, op?, channelCount?,
      count?, channel?, fromChannel?, toChannel?, save?, dryRun?
  asset.unwrap_uvs:
    class_path: ue-mcp.builtin/asset.unwrap_uvs
    group: asset
    description: >-
      Auto-unwrap and pack islands into one channel via Geometry Script, adding
      the channel if it does not exist. It converts the LOD to a DynamicMesh and
      back, so the WHOLE LOD is rewritten rather than only its UVs; the result
      says so. Pass backupToChannel for a lossless rollback, otherwise only the
      channel count is restorable. Without the Geometry Script plugin it returns
      reason='geometry_scripting_unavailable' naming what to enable instead of
      failing opaquely. Params: assetPath (or path), lodIndex?, channel?,
      method?, pack?, textureResolution?, maxIterations?, initialPatchCount?,
      islandSource?, projectionTransform?, preserveVertexOrder?,
      backupToChannel?, save?, dryRun?, rasterSize?
  asset.transform_uvs:
    class_path: ue-mcp.builtin/asset.transform_uvs
    group: asset
    description: >-
      One action for every UV transform: the whole channel, chosen islands,
      triangles facing a direction, or one material slot, plus flips. The filter
      is the only thing that varies, so the maths lives in one place rather than
      in four near-identical actions. Edits the mesh description directly,
      touching nothing but the UV channel, and emits an EXACT inverse as its
      rollback. A zero scale component is refused because it has no inverse; an
      identity transform returns existed=true without rebuilding. Params:
      assetPath (or path), lodIndex?, channel?, translate?, scale?, rotate?,
      origin?, flipU?, flipV?, order?, selection?, save?, dryRun?
  asset.generate_lightmap_uvs:
    class_path: ue-mcp.builtin/asset.generate_lightmap_uvs
    group: asset
    description: >-
      Apply the lightmap build settings AND run UStaticMesh::Build AND read the
      result back. Deliberately not a setter: bGenerateLightmapUVs,
      SrcLightmapIndex, DstLightmapIndex and LightMapCoordinateIndex are plain
      UPROPERTYs that asset(set_property) already writes, and writing them does
      NOTHING until the mesh rebuilds. That rebuild is the whole point. Returns
      the channel the build actually produced with its overlap and island
      report, and fails loudly when the channel did not appear. StaticMesh only.
      Rollback restores the settings, not the generated coordinates. Params:
      assetPath (or path), lodIndex?, enable?, sourceChannel?,
      destinationChannel?, minLightmapResolution?, lightmapResolution?,
      setLightmapCoordinateIndex?, force?, save?, dryRun?, rasterSize?
  asset.export_uv_layout:
    class_path: ue-mcp.builtin/asset.export_uv_layout
    group: asset
    description: >-
      Render one UV channel to a PNG under Saved/UVLayouts: white wireframe, one
      hue per island, red where two triangles share a texel, yellow unit-square
      border. Returns the file path plus the same channel statistics
      read_uv_channels reports, so the picture and the numbers describe the same
      rasterisation. Use it to SEE why a lightmap bake is wrong instead of
      inferring it from counts. Params: assetPath (or path), lodIndex?,
      channel?, outputPath?, imageSize?, showIslands?, showOverlaps?, showGrid?
  asset.check_uvs:
    class_path: ue-mcp.builtin/asset.check_uvs
    group: asset
    description: >-
      One-call UV health report, the same idiom as measure_mesh_geometry. Flags
      a missing lightmap channel, a LightMapCoordinateIndex that disagrees with
      the build's DstLightmapIndex, overlap in the lightmap channel over budget,
      lightmap UVs outside 0..1, empty or degenerate channels and islands, and
      flipped triangles, each with a severity and the action that fixes it.
      Out-of-range UVs OUTSIDE the lightmap channel are reported as info rather
      than a fault, because tiling is legitimate there. Params: assetPath (or
      path), lodIndex?, requireLightmapChannel?, maxOverlapFraction?,
      rasterSize?
  asset.apply_mesh_simplify:
    class_path: ue-mcp.builtin/asset.apply_mesh_simplify
    group: asset
    description: >-
      Reduce a StaticMesh's triangle count while keeping its silhouette, through
      Geometry Script. Nine strategies because 'simplify' means different
      things: a target triangleCount or vertexCount, a geometric tolerance (the
      furthest the surface may drift), an edgeLength, a fast cluster-based
      edgeLength, a structural collapse of coplanar regions (planar) or of
      PolyGroup faces (polygroup), and the editor's own reducer
      (editorTriangleCount, editorVertexCount). NOT reachable through
      asset(set_property): a StaticMesh's LOD reduction settings build a NEW
      LOD, they never rewrite LOD 0's source geometry, and no UPROPERTY means
      'collapse this mesh to 500 triangles'. Writes a SEPARATE asset by default
      (outputPath, or '<assetPath>_Simplified'), whose rollback is a complete
      delete; inPlace=true overwrites the source and reports that its edit has
      no inverse, with backupPath as the escape. Idempotent: a mesh already at
      or under the target reports changed=false and is not rewritten. Needs the
      Geometry Script engine plugin, and without it returns
      reason='geometry_scripting_unavailable' naming what to enable. Params:
      assetPath (or path), simplifyMode?, triangleCount?, vertexCount?,
      tolerance?, edgeLength?, angleThreshold?, method?, allowSeamCollapse?,
      preserveVertexPositions?, autoCompact?, outputPath?, inPlace?,
      backupPath?, lodType?, lodIndex?, onConflict?, copyMaterialsFromSource?,
      copyCollisionFromSource?, nanite?, recomputeNormals?, recomputeTangents?,
      removeDegenerates?, save?, dryRun?
  asset.apply_mesh_remesh:
    class_path: ue-mcp.builtin/asset.apply_mesh_remesh
    group: asset
    description: >-
      Rebuild a StaticMesh's triangulation at a uniform or adaptive density.
      Different from apply_mesh_simplify: simplify only removes triangles,
      remesh splits AND collapses AND flips edges to reach an even edge length,
      which is what a mesh needs before deformation, baking, or a convex
      decomposition that would otherwise follow the original triangulation's
      bias. Writes a SEPARATE asset by default ('<assetPath>_Remeshed').
      Deliberately NOT idempotent and says so in repeatIsIdempotent: remeshing a
      remeshed mesh keeps moving vertices, so a repeat is a second edit rather
      than a no-op, which is why the separate-output default matters here more
      than anywhere else. Needs the Geometry Script engine plugin. Params:
      assetPath (or path), remeshMode?, targetType?, targetTriangleCount?,
      targetEdgeLength?, smoothingType?, smoothingRate?, boundaryConstraint?,
      iterations?, discardAttributes?, reprojectToInputMesh?, relativeDensity?,
      outputPath?, inPlace?, backupPath?, lodType?, lodIndex?, onConflict?,
      copyMaterialsFromSource?, copyCollisionFromSource?, nanite?,
      recomputeNormals?, recomputeTangents?, removeDegenerates?, save?, dryRun?
  asset.apply_mesh_mirror:
    class_path: ue-mcp.builtin/asset.apply_mesh_mirror
    group: asset
    description: >-
      Reflect a StaticMesh across a plane, optionally cutting away the far side
      first and welding the seam. This is the 'model half of it and mirror'
      workflow, and it is real geometry rather than a negative component scale,
      which inverts the winding and lights wrong; no UPROPERTY on a StaticMesh
      mirrors its source geometry. Name the plane with axis=x|y|z through
      planeOrigin, or axis=custom with an explicit planeNormal. Writes a
      SEPARATE asset by default ('<assetPath>_Mirrored'). NOT idempotent and
      says so: mirroring a mirrored mesh doubles it again rather than returning
      the original. Needs the Geometry Script engine plugin. Params: assetPath
      (or path), axis?, planeOrigin?, planeNormal?, applyPlaneCut?,
      flipCutSide?, weldAlongPlane?, outputPath?, inPlace?, backupPath?,
      lodType?, lodIndex?, onConflict?, copyMaterialsFromSource?,
      copyCollisionFromSource?, nanite?, recomputeNormals?, recomputeTangents?,
      removeDegenerates?, save?, dryRun?
  asset.apply_mesh_hole_fill:
    class_path: ue-mcp.builtin/asset.apply_mesh_hole_fill
    group: asset
    description: >-
      Close every open boundary loop on a StaticMesh so it becomes watertight,
      which is what a boolean, a voxel operation, a convex decomposition and a
      physics conversion all require and the most common reason those fail.
      WELDS FIRST by default: a great many 'holes' are not holes but duplicated
      vertices along a seam that no fill can close, and running the fill alone
      on such a mesh reports zero holes filled while the mesh stays open.
      Genuinely idempotent: a mesh with nothing left to fill reports
      existed=true and is not rewritten. Reports filledHoles, failedHoleFills,
      weldedOpenEdges and the before/after open-border-edge counts, so
      'watertight now' can be verified rather than assumed. Needs the Geometry
      Script engine plugin. Params: assetPath (or path), fillMethod?,
      weldFirst?, weldTolerance?, removeDegenerateFirst?,
      deleteIsolatedTriangles?, outputPath?, inPlace?, backupPath?, lodType?,
      lodIndex?, onConflict?, copyMaterialsFromSource?,
      copyCollisionFromSource?, nanite?, recomputeNormals?, recomputeTangents?,
      removeDegenerates?, save?, dryRun?
  asset.generate_mesh_collision:
    class_path: ue-mcp.builtin/asset.generate_mesh_collision
    group: asset
    description: >-
      Build simple collision shapes for a StaticMesh from its own geometry, or
      clear them. Eight methods from axis-aligned boxes to a full convex
      decomposition. NOT reachable through asset(set_property): UBodySetup
      AggGeom is a UPROPERTY, but what has to go into it is the OUTPUT of a
      decomposition solver running over the mesh, and there is no value a caller
      could supply; the shape count and trace flag stay ordinary property writes
      and asset(get_mesh_collision) is still the read half. Idempotent:
      generation from the same mesh with the same options is deterministic, so a
      repeat reports changed=false without rewriting the asset, compared by a
      structural signature (shape counts per kind, hull vertex counts, trace
      flag) rather than byte-for-byte. op='clear' is the remove half and needs
      no plugin at all. A generation that produces zero shapes is reported as a
      failure naming apply_mesh_hole_fill, not as a success that quietly left
      the mesh with no collision. Params: assetPath (or path), op?, method?,
      maxConvexHulls?, hullTargetFaceCount?, maxShapeCount?, minThickness?,
      autoDetectSpheres?, autoDetectBoxes?, autoDetectCapsules?, simplifyHulls?,
      removeFullyContainedShapes?, decompositionErrorTolerance?,
      decompositionSearchFactor?, sweptHullAxis?, markAsCustomized?, lodType?,
      lodIndex?, save?, dryRun?
  asset.apply_mesh_fracture:
    class_path: ue-mcp.builtin/asset.apply_mesh_fracture
    group: asset
    description: >-
      Cut a StaticMesh with planes and write each resulting piece out as its own
      StaticMesh asset, ready to be placed, simulated or destroyed individually.
      Three patterns: slice (parallel cuts along one axis), grid (cuts along all
      three) and random (seeded planes through the bounds). WHAT THIS IS NOT: it
      is not Chaos destruction and produces no UGeometryCollection, because
      every engine entry point for that carries no UFUNCTION and reflection
      cannot reach it; the result says so in producesGeometryCollection=false
      rather than leaving it to be discovered. The source asset is never
      modified, so the rollback is an exact delete of the pieces it wrote.
      Seeded, therefore repeatable: onConflict='error' (the default) refuses
      rather than writing over pieces already there. dryRun lists the cut planes
      and every path it would write. Params: assetPath (or path), pattern?,
      axis?, pieces?, gridX?, gridY?, gridZ?, planeCount?, seed?, jitter?,
      gapWidth?, fillHoles?, minPieceTriangles?, outputBasePath?, onConflict?,
      copyMaterialsFromSource?, nanite?, recomputeNormals?, recomputeTangents?,
      lodType?, lodIndex?, save?, dryRun?
  asset.audit_hygiene:
    class_path: ue-mcp.builtin/asset.audit_hygiene
    group: asset
    description: >-
      One read-only sweep answering the questions a project accumulates answers
      to and never gets asked: what nothing references (unreferenced), what
      references nothing (brokenReferences), what exists twice (duplicates),
      what breaks the naming convention (naming), and what renames left behind
      (redirectors). asset(get_referencers) and asset(get_dependencies) answer
      the first two for ONE named package; this is the project-wide form, which
      is the one an agent needs. The unreferenced section carries a caveat to
      read before acting on it: an asset loaded by name from an INI setting,
      from C++ with a hardcoded path, or from a soft reference resolved at
      runtime has no package dependency and appears there while being very much
      in use, so treat it as candidates to review rather than a delete list.
      Maps, World Partition external actors and Asset Manager primary assets are
      already excluded for that reason. Duplicate detection by content matches
      class, file size and saved package hash, which finds a file copied
      verbatim but NOT a copy saved under a different name (the name is inside
      the file); duplicateMethod='name' is what catches an asset imported twice
      into two folders. Naming rules match on the asset's class name, so
      WidgetBlueprint and AnimBlueprint carry their own prefixes rather than
      inheriting Blueprint's, and the effective table comes back in
      rulesApplied. Counts are always complete; only the listings are capped by
      maxIssues. Params: directory?, directories?, recursive?, maxAssets?,
      maxIssues?, checks?, classNames?, excludePaths?, keepPaths?,
      duplicateMethod?, namingRules?, namingRuleMode?, includeWorlds?,
      ignoreRedirectorReferencers?
  asset.bulk_fix_hygiene:
    class_path: ue-mcp.builtin/asset.bulk_fix_hygiene
    group: asset
    description: >-
      The batched fix-up for the two audit_hygiene findings a machine can act on
      without deciding something a person should: a name that breaks the
      convention (fix='naming') and an asset nothing references
      (fix='unreferenced'). Same preflight shape as bulk_set_properties: every
      candidate is validated, every candidate gets a status back including the
      rejected ones, and a failed preflight aborts before anything is touched
      unless continueOnError. THREE SAFETY RULES that are not the shape: dryRun
      DEFAULTS TO TRUE and the dry run names every asset with its exact
      destination; fix='unreferenced' MOVES assets into quarantineFolder by
      default rather than deleting them, and that move has an exact inverse this
      call emits as its rollback; and findings are recomputed here rather than
      taken from an audit, so an asset that gained a referencer since then is
      skipped with the referencer named. maxFixes caps the batch far below the
      audit's scan ceiling. Worlds are refused outright, because moving one
      without migrating its external-actor packages in the same batch orphans
      every actor in the level; use asset(rename). fix='redirectors' is refused
      too and points at asset(fixup_redirectors), which already does it
      properly. Params: fix, assetPaths?, directory?, directories?, recursive?,
      maxAssets?, classNames?, excludePaths?, keepPaths?, namingRules?,
      namingRuleMode?, unreferencedAction?, quarantineFolder?,
      ignoreRedirectorReferencers?, maxFixes?, continueOnError?, save?, dryRun?
  asset.mesh_boolean:
    class_path: ue-mcp.builtin/asset.mesh_boolean
    group: asset
    description: >-
      Boolean CSG between two StaticMeshes: union, subtract, intersect,
      trimInside, trimOutside, newPolyGroupInside, newPolyGroupOutside. The
      target is the mesh being cut and the tool is what cuts it, each placed by
      its own optional transform. Writes to a SEPARATE output asset by default
      (outputPath, or '<targetPath>_<Operation>' when omitted); inPlace=true
      opts into overwriting the target and is the only destructive form. An
      existing outputPath is refused unless onConflict='replace'. An empty
      result is refused and nothing is written unless allowEmptyResult=true,
      because two meshes that never overlap otherwise report success having
      deleted everything. Returns triangle and vertex counts for both inputs and
      the result, plus the written asset's triangles, vertices, LOD count,
      material slots and bounds, so the operation can be verified rather than
      trusted. dryRun runs the boolean and reports those counts without writing.
      Materials and simple collision are copied from the target by default.
      Needs the Geometry Script engine plugin: without it the call returns
      reason='geometry_scripting_unavailable' naming what to enable, rather than
      failing opaquely (#916). Params: operation, targetPath, toolPath,
      outputPath?, inPlace?, targetTransform?, toolTransform?, lodType?,
      lodIndex?, fillHoles?, simplifyOutput?, simplifyPlanarTolerance?,
      allowEmptyResult?, recomputeNormals?, recomputeTangents?,
      removeDegenerates?, copyCollisionFromTarget?, copyMaterialsFromTarget?,
      nanite?, onConflict?, dryRun?, save?
  asset.migrate:
    class_path: ue-mcp.builtin/asset.migrate
    group: asset
    description: >-
      Copy assets and their dependencies into ANOTHER project's Content
      directory - the scripted form of the content browser's Migrate (#760).
      destinationContentDir is the TARGET project's Content folder. While this
      server drives more than one editor, a 'toEditor' parameter is offered as
      well: name the destination editor and its Content folder is resolved for
      you and its asset registry rescanned afterwards, so the assets are visible
      there without a manual rescan (#817). The call runs in the editor holding
      the SOURCE assets, so it pushes assets out of the project it is attached
      to. Unsaved or never-saved assets are refused, because migrate copies
      files and would otherwise silently omit your edits. Every asset is
      resolved before anything is copied, and the destination is checked for the
      packages afterwards rather than reporting success on the call returning.
      Params: assetPaths (string[]) or assetPath, toEditor OR
      destinationContentDir, includeDependencies? (default true), onConflict?
      (skip|overwrite, default skip), allowDirty?, dryRun?
  asset.move_folder:
    class_path: ue-mcp.builtin/asset.move_folder
    group: asset
    description: >-
      Move/rename entire content folder with redirector fixup in one
      transaction. Refused with reason=package_objects_left_behind, before
      anything moves, when a package in the folder holds an object the move
      would leave at the old path (#1137) (#192). Params: sourcePath,
      destinationPath
  asset.create_folder:
    class_path: ue-mcp.builtin/asset.create_folder
    group: asset
    description: >-
      Create empty content browser folder(s); path and paths combine. Returns
      per-path created/existed/failed (#212). Params: at least one of path/paths
  asset.delete_folder:
    class_path: ue-mcp.builtin/asset.delete_folder
    group: asset
    description: >-
      Delete content browser folder(s) - counterpart to delete_asset, which
      leaves the parent directory entry behind as an orphan. Empty folders only
      by default; pass force=true to also delete any assets still inside
      (Content Browser 'Delete folder' equivalent). A World Partition map's
      __ExternalActors__ and __ExternalObjects__ packages for the folder go with
      it and are counted in externalPackagesDeleted; packages still loaded are
      kept and reported. Per-path status (deleted/absent/failed) with reason
      (invalid_path/protected_path/not_empty/delete_failed) and a sample of
      contained assets on not_empty entries. Params: path?, paths?, force?
  asset.set_mesh_nav:
    class_path: ue-mcp.builtin/asset.set_mesh_nav
    group: asset
    description: >-
      Set StaticMesh nav contribution (#167). Params: assetPath,
      bHasNavigationData?, clearNavCollision?
  asset.create_user_defined_enum:
    class_path: ue-mcp.builtin/asset.create_user_defined_enum
    group: asset
    description: >-
      Create a UserDefinedEnum content asset, optionally pre-populated with
      values (#686). Params: name, packagePath?, values?, onConflict?
  asset.list_enum_values:
    class_path: ue-mcp.builtin/asset.list_enum_values
    group: asset
    description: >-
      List a UEnum's enumerators (index, authored short name, display name,
      value). Works on native and UserDefinedEnum assets (#686). Params:
      assetPath (or path)
  asset.edit_user_defined_enum:
    class_path: ue-mcp.builtin/asset.edit_user_defined_enum
    group: asset
    description: >-
      Author a UserDefinedEnum content asset. op=add_value appends an enumerator
      (authored name is auto-assigned; pass displayName - or name - to set the
      editable display text). op=rename_value sets a new displayName on the
      enumerator resolved by index or name (matches short or display name).
      op=remove_value deletes it. Recompiles dependents automatically. Native
      UEnums are not editable (#686). Params: assetPath (or path), op,
      displayName?, name?, index?
  asset.create_user_defined_struct:
    class_path: ue-mcp.builtin/asset.create_user_defined_struct
    group: asset
    description: >-
      Create a UserDefinedStruct content asset, optionally pre-populated with
      fields (#735). Params: name, packagePath?, structFields?, onConflict?
  asset.list_struct_fields:
    class_path: ue-mcp.builtin/asset.list_struct_fields
    group: asset
    description: >-
      List a UserDefinedStruct's members (index, internal name, friendly/display
      name, GUID, type label). Use this to find the GUID for a stable
      rename/retype. Native structs are not editable (#735). Params: assetPath
      (or path)
  asset.edit_user_defined_struct:
    class_path: ue-mcp.builtin/asset.edit_user_defined_struct
    group: asset
    description: >-
      Author a UserDefinedStruct content asset. op=add_field appends a member
      (type via MakePinType string; pass fieldName for its display name).
      op=rename_field sets a new newDisplayName on the member resolved by
      fieldGuid or fieldName - the member GUID is preserved so existing
      Blueprint pins and DataTable rows survive. op=set_field_type changes a
      member's type. op=remove_field deletes it. Recompiles dependents
      automatically. Native structs are not editable (#735). Params: assetPath
      (or path), op, fieldName?, fieldGuid?, newDisplayName?, type?
  asset.rename_struct_field:
    class_path: ue-mcp.builtin/asset.rename_struct_field
    group: asset
    description: >-
      Rename a UserDefinedStruct field's display name while preserving its
      member GUID, so Blueprint pins and DataTable rows keyed off it survive.
      The same edit as edit_user_defined_struct(op=rename_field). fieldName
      matches the friendly or internal name (#735). Params: assetPath (or path),
      fieldName OR fieldGuid, newDisplayName
  asset.lock:
    class_path: ue-mcp.builtin/asset.lock
    group: asset
    description: >-
      Acquire an exclusive lock on an asset for this editor. Returns
      acquired=true, or acquired=false with
      holder{sessionId,ttlSecondsRemaining} when another session holds it.
      Params: assetPath, ttlSeconds? (default 300), sessionId?
  asset.unlock:
    class_path: ue-mcp.builtin/asset.unlock
    group: asset
    description: >-
      Release an asset lock held by this editor (or force=true to break any
      holder's lock). Params: assetPath, force?, sessionId?
  asset.list_locks:
    class_path: ue-mcp.builtin/asset.list_locks
    group: asset
    description: >-
      List all currently-held asset locks with holder session id, acquiredAt,
      and ttlSecondsRemaining. Params: none
  asset.unlock_all:
    class_path: ue-mcp.builtin/asset.unlock_all
    group: asset
    description: >-
      Release every lock held by one session in a single call, returning the
      number released. Defaults to the addressed editor's own session; pass
      sessionId to clear a different one (for example after a crashed session
      left assets wedged). Params: sessionId?
  asset.diff:
    class_path: ue-mcp.builtin/asset.diff
    group: asset
    description: >-
      Semantic structural diff between two assets, dispatching on the asset's
      class. Blueprints: parent class, variables, functions, components,
      per-graph node and connection deltas. Skeleton and SkeletalMesh: raw bone
      additions and removals, reparenting (bone, fromParent, toParent),
      raw-index changes (bone, fromIndex, toIndex), and declared virtual-bone
      additions and removals, with hierarchyCompatible and editorCompatible
      reported SEPARATELY. That separation is the point: it answers whether two
      skeletons are bone-compatible enough to register as Compatible Skeletons
      or whether a retarget is required, because appending bones (virtual ones
      especially) leaves the shared hierarchy intact while reparenting an
      existing bone does not (#879). Deliberately OUT of scope and reported as
      such: reference-pose transforms (referencePoseCompared=false), export
      names (exportNamesCompared=false), sockets and retarget sources;
      structureScope spells the boundary out in the result. Both paths must be
      the same class. Other asset types report that diffing is not supported yet
      rather than failing opaquely. Params: assetPath (or path), otherPath
  asset.epic_add_key:
    class_path: ue-mcp.builtin/asset.epic_add_key
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.curve_table.CurveTableTools] Adds a key to a
      row. Params: curve_table, row_name, key
  asset.epic_add_row:
    class_path: ue-mcp.builtin/asset.epic_add_row
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.curve_table.CurveTableTools] Adds a new row
      to the curve table with an optional default value. Params: curve_table,
      row_name, default_value?
  asset.epic_add_rows:
    class_path: ue-mcp.builtin/asset.epic_add_rows
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.data_table.DataTableTools] Adds new rows
      with default values to the data table. Params: data_table, row_names
  asset.epic_can_edit_asset:
    class_path: ue-mcp.builtin/asset.epic_can_edit_asset
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.asset.AssetTools] Checks whether an asset
      can be edited. Params: asset_path
  asset.epic_create:
    class_path: ue-mcp.builtin/asset.epic_create
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.curve_table.CurveTableTools] Creates a new
      CurveTable asset. Params: folder_path, asset_name
  asset.epic_create__data_asset_tools:
    class_path: ue-mcp.builtin/asset.epic_create__data_asset_tools
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.data_asset.DataAssetTools] Creates a new
      DataAsset asset in the project. Params: folder_path, asset_name,
      asset_type
  asset.epic_create__data_table_tools:
    class_path: ue-mcp.builtin/asset.epic_create__data_table_tools
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.data_table.DataTableTools] Creates a new
      DataTable asset with the specified column schema. Params: folder_path,
      asset_name, schema
  asset.epic_create__string_table_tools:
    class_path: ue-mcp.builtin/asset.epic_create__string_table_tools
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.string_table.StringTableTools] Creates a new
      StringTable asset. Params: folder_path, asset_name
  asset.epic_create_folder:
    class_path: ue-mcp.builtin/asset.epic_create_folder
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.asset.AssetTools] Creates a folder at the
      specified path. Params: path
  asset.epic_delete:
    class_path: ue-mcp.builtin/asset.epic_delete
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.asset.AssetTools] Deletes an asset or
      folder. Params: path
  asset.epic_duplicate:
    class_path: ue-mcp.builtin/asset.epic_duplicate
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.asset.AssetTools] Makes a copy of a folder
      or asset. Params: path, new_path
  asset.epic_exists:
    class_path: ue-mcp.builtin/asset.epic_exists
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.asset.AssetTools] Determines if a folder or
      asset exists. Params: path
  asset.epic_find_assets:
    class_path: ue-mcp.builtin/asset.epic_find_assets
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.asset.AssetTools] Searches the project for
      assets that match specific criteria. Params: folder_path, name,
      asset_type?, recursive?, tags?
  asset.epic_find_similar:
    class_path: ue-mcp.builtin/asset.epic_find_similar
    group: asset
    description: >-
      [Epic SemanticSearchToolset.SemanticSearchToolset] Find assets whose
      embeddings are semantically similar to the given asset's embedding.
      Vector-only (no BM25). The source asset must already be indexed by the
      SemanticSearch plugin. Params: assetPath, classFilter, pathRegexes, k?
  asset.epic_generate_convex_collisions:
    class_path: ue-mcp.builtin/asset.epic_generate_convex_collisions
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.static_mesh.StaticMeshTools] Generates
      convex hull collision shapes for a static mesh. Convex hulls provide
      accurate collision for physics simulation. More hulls improve accuracy but
      increase runtime cost. Replaces any existing collision. Params: mesh,
      hull_count?, max_hull_verts?, hull_precision?
  asset.epic_generate_lods:
    class_path: ue-mcp.builtin/asset.epic_generate_lods
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.static_mesh.StaticMeshTools] Auto-generates
      LODs for a static mesh using triangle reduction. Each entry in
      triangle_percents creates one additional LOD. The value is the fraction of
      triangles to keep relative to LOD 0, from just above 0.0 (nearly empty) to
      1.0 (full detail). For example, [0.5, 0.25] creates LOD1 with 50% of the
      original triangles and LOD2 with 25%. Params: mesh, triangle_percents
  asset.epic_get_asset_class:
    class_path: ue-mcp.builtin/asset.epic_get_asset_class
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.asset.AssetTools] Gets the class of an
      asset. Params: asset_path
  asset.epic_get_asset_tags:
    class_path: ue-mcp.builtin/asset.epic_get_asset_tags
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.asset.AssetTools] Gets the asset registry
      tags for an asset. Params: asset_path
  asset.epic_get_bounds:
    class_path: ue-mcp.builtin/asset.epic_get_bounds
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.static_mesh.StaticMeshTools] Returns the
      local-space bounding box of a static mesh. Params: mesh
  asset.epic_get_dependencies:
    class_path: ue-mcp.builtin/asset.epic_get_dependencies
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.asset.AssetTools] Lists assets that the
      specified asset depends on. Params: asset_path
  asset.epic_get_entry:
    class_path: ue-mcp.builtin/asset.epic_get_entry
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.string_table.StringTableTools] Returns the
      source string for a specific key. Params: string_table, key
  asset.epic_get_items:
    class_path: ue-mcp.builtin/asset.epic_get_items
    group: asset
    description: >-
      [Epic DataRegistryToolset.DataRegistryTools] Returns cached item data.
      Items must be loaded in the registry cache to be returned. Params:
      registryName, itemNames
  asset.epic_get_keys:
    class_path: ue-mcp.builtin/asset.epic_get_keys
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.curve_table.CurveTableTools] Returns all
      keys for a row. Params: curve_table, row_name
  asset.epic_get_lod_count:
    class_path: ue-mcp.builtin/asset.epic_get_lod_count
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.static_mesh.StaticMeshTools] Returns the
      number of LODs in a static mesh asset. Params: mesh
  asset.epic_get_lod_thresholds:
    class_path: ue-mcp.builtin/asset.epic_get_lod_thresholds
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.static_mesh.StaticMeshTools] Returns the
      screen-size thresholds at which each LOD becomes active. Screen size is a
      ratio of the mesh's screen height to the viewport height. A value of 1.0
      means the mesh fills the full viewport height; values above 1.0 are valid
      and mean the mesh must appear larger than the viewport before the next LOD
      activates. Each LOD activates when the mesh appears smaller than its
      threshold. Params: mesh
  asset.epic_get_material:
    class_path: ue-mcp.builtin/asset.epic_get_material
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.static_mesh.StaticMeshTools] Returns the
      material assigned to a named slot on a static mesh. Params: mesh,
      slot_name
  asset.epic_get_material_slots:
    class_path: ue-mcp.builtin/asset.epic_get_material_slots
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.static_mesh.StaticMeshTools] Returns the
      names of all material slots in a static mesh. Material slot names are used
      when assigning materials to specific parts of the mesh. Use these names
      with get_material and set_material. Params: mesh
  asset.epic_get_metadata_tags:
    class_path: ue-mcp.builtin/asset.epic_get_metadata_tags
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.asset.AssetTools] Gets the metadata tags for
      an asset. Params: asset_path
  asset.epic_get_namespace:
    class_path: ue-mcp.builtin/asset.epic_get_namespace
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.string_table.StringTableTools] Returns the
      namespace of a StringTable asset. Params: string_table
  asset.epic_get_plugin_content_paths:
    class_path: ue-mcp.builtin/asset.epic_get_plugin_content_paths
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.asset.AssetTools] Returns the root content
      paths for plugins that have content. Params: include_engine?
  asset.epic_get_referencers:
    class_path: ue-mcp.builtin/asset.epic_get_referencers
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.asset.AssetTools] Lists assets that
      reference the specified asset. Params: asset_path
  asset.epic_get_registry_info:
    class_path: ue-mcp.builtin/asset.epic_get_registry_info
    group: asset
    description: >-
      [Epic DataRegistryToolset.DataRegistryTools] Returns detailed information
      about a specific registry. Params: registryName
  asset.epic_get_rows:
    class_path: ue-mcp.builtin/asset.epic_get_rows
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.data_table.DataTableTools] Returns the
      column values for one or more rows as a JSON string. Params: data_table,
      row_names
  asset.epic_get_schema:
    class_path: ue-mcp.builtin/asset.epic_get_schema
    group: asset
    description: >-
      [Epic DataRegistryToolset.DataRegistryTools] Returns the item struct
      schema as JSON. Params: registryName
  asset.epic_get_schema__data_table_tools:
    class_path: ue-mcp.builtin/asset.epic_get_schema__data_table_tools
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.data_table.DataTableTools] Returns the
      column schema of the data table as a JSON string. Params: data_table
  asset.epic_get_size:
    class_path: ue-mcp.builtin/asset.epic_get_size
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.texture.TextureTools] Returns the dimensions
      of a Texture2D in pixels. Params: texture
  asset.epic_get_table_id:
    class_path: ue-mcp.builtin/asset.epic_get_table_id
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.string_table.StringTableTools] Returns the
      table ID for a StringTable asset. The table ID is derived from the asset's
      package path and is used to reference the string table in text properties
      and localisation. Params: string_table
  asset.epic_get_triangle_count:
    class_path: ue-mcp.builtin/asset.epic_get_triangle_count
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.static_mesh.StaticMeshTools] Returns the
      number of triangles in a specific LOD of a static mesh. Params: mesh,
      lod_index?
  asset.epic_get_vertex_count:
    class_path: ue-mcp.builtin/asset.epic_get_vertex_count
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.static_mesh.StaticMeshTools] Returns the
      number of vertices in a specific LOD of a static mesh. Params: mesh,
      lod_index?
  asset.epic_import_file:
    class_path: ue-mcp.builtin/asset.epic_import_file
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.curve_table.CurveTableTools] Imports a file
      from disk as a CurveTable asset. The file's first column is the row name;
      subsequent columns are sample times and values. interp_mode controls how
      the imported keys are interpolated between samples. Params: folder_path,
      asset_name, source_file, interp_mode
  asset.epic_import_file__data_table_tools:
    class_path: ue-mcp.builtin/asset.epic_import_file__data_table_tools
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.data_table.DataTableTools] Imports a file
      from disk as a DataTable asset. The file's columns must match the property
      names in schema. Use search_row_structs to discover usable schema structs.
      Params: folder_path, asset_name, source_file, schema
  asset.epic_import_file__static_mesh_tools:
    class_path: ue-mcp.builtin/asset.epic_import_file__static_mesh_tools
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.static_mesh.StaticMeshTools] Imports a mesh
      file from disk as a StaticMesh asset. Params: folder_path, asset_name,
      source_file, import_materials?, import_textures?, combine_meshes?
  asset.epic_import_file__string_table_tools:
    class_path: ue-mcp.builtin/asset.epic_import_file__string_table_tools
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.string_table.StringTableTools] Imports a
      file from disk as a StringTable asset. The file must have a header row
      with at least 'Key' and 'SourceString' columns. Additional meta-data
      columns are imported but the namespace is not - the StringTable's
      namespace is derived from its asset path. Params: folder_path, asset_name,
      source_file
  asset.epic_import_file__texture_tools:
    class_path: ue-mcp.builtin/asset.epic_import_file__texture_tools
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.texture.TextureTools] Imports an image file
      from disk as a Texture2D asset. Params: folder_path, asset_name,
      source_file
  asset.epic_is_checked_out:
    class_path: ue-mcp.builtin/asset.epic_is_checked_out
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.asset.AssetTools] Checks whether an asset is
      checked out by the current user. Params: asset_path
  asset.epic_is_dirty:
    class_path: ue-mcp.builtin/asset.epic_is_dirty
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.asset.AssetTools] Checks whether an asset
      has unsaved changes. Params: asset_path
  asset.epic_is_nanite_enabled:
    class_path: ue-mcp.builtin/asset.epic_is_nanite_enabled
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.static_mesh.StaticMeshTools] Returns whether
      Nanite is enabled for a static mesh. Nanite is Unreal's virtualized
      geometry system that renders highly detailed meshes efficiently. It is
      most beneficial for meshes with many triangles. Params: mesh
  asset.epic_list_data_sources:
    class_path: ue-mcp.builtin/asset.epic_list_data_sources
    group: asset
    description: >-
      [Epic DataRegistryToolset.DataRegistryTools] Returns the editor-defined
      sources configured on a Data Registry. These are the sources as authored
      on the registry asset, before any runtime expansion of meta sources.
      Params: registryName
  asset.epic_list_folders:
    class_path: ue-mcp.builtin/asset.epic_list_folders
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.asset.AssetTools] Lists the folders
      contained within a folder. Params: root_path, recursive?
  asset.epic_list_items:
    class_path: ue-mcp.builtin/asset.epic_list_items
    group: asset
    description: >-
      [Epic DataRegistryToolset.DataRegistryTools] Returns all item names in a
      Data Registry. Params: registryName
  asset.epic_list_keys:
    class_path: ue-mcp.builtin/asset.epic_list_keys
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.string_table.StringTableTools] Lists all
      keys in the string table. Params: string_table
  asset.epic_list_registries:
    class_path: ue-mcp.builtin/asset.epic_list_registries
    group: asset
    description: >-
      [Epic DataRegistryToolset.DataRegistryTools] Returns the names of all
      registered Data Registries. Params: structFilter?
  asset.epic_list_rows:
    class_path: ue-mcp.builtin/asset.epic_list_rows
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.curve_table.CurveTableTools] Lists the names
      of all rows in the curve table. Params: curve_table
  asset.epic_list_rows__data_table_tools:
    class_path: ue-mcp.builtin/asset.epic_list_rows__data_table_tools
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.data_table.DataTableTools] Lists the names
      of all rows in the data table. Params: data_table
  asset.epic_list_runtime_sources:
    class_path: ue-mcp.builtin/asset.epic_list_runtime_sources
    group: asset
    description: >-
      [Epic DataRegistryToolset.DataRegistryTools] Returns the runtime sources
      for a Data Registry. This is the expanded list including transient child
      sources generated from meta sources. Will equal ListDataSources when the
      registry has no meta sources. Params: registryName
  asset.epic_load_asset:
    class_path: ue-mcp.builtin/asset.epic_load_asset
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.asset.AssetTools] Loads an asset from the
      project. Params: asset_path
  asset.epic_move:
    class_path: ue-mcp.builtin/asset.epic_move
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.asset.AssetTools] Moves or renames an asset
      or folder. Params: path, new_path
  asset.epic_read_file:
    class_path: ue-mcp.builtin/asset.epic_read_file
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.asset.AssetTools] Reads a text file from
      disk and returns its contents. Only files under /Game/, an enabled
      plugin's Content/ directory, or the project Saved/ directory may be read.
      Only plain text formats are supported. Params: file_path
  asset.epic_remove_collisions:
    class_path: ue-mcp.builtin/asset.epic_remove_collisions
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.static_mesh.StaticMeshTools] Removes all
      collision shapes from a static mesh. Params: mesh
  asset.epic_remove_entry:
    class_path: ue-mcp.builtin/asset.epic_remove_entry
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.string_table.StringTableTools] Removes an
      entry from the string table. Params: string_table, key
  asset.epic_remove_lods:
    class_path: ue-mcp.builtin/asset.epic_remove_lods
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.static_mesh.StaticMeshTools] Removes all
      auto-generated LODs from a static mesh, keeping only LOD 0. Params: mesh
  asset.epic_remove_row:
    class_path: ue-mcp.builtin/asset.epic_remove_row
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.curve_table.CurveTableTools] Removes a row
      from the curve table. Params: curve_table, row_name
  asset.epic_remove_rows:
    class_path: ue-mcp.builtin/asset.epic_remove_rows
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.data_table.DataTableTools] Removes rows from
      the data table. Params: data_table, row_names
  asset.epic_rename_row:
    class_path: ue-mcp.builtin/asset.epic_rename_row
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.curve_table.CurveTableTools] Renames a row
      in the curve table. Params: curve_table, row_name, new_row_name
  asset.epic_rename_rows:
    class_path: ue-mcp.builtin/asset.epic_rename_rows
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.data_table.DataTableTools] Renames one or
      more rows in the data table. Params: data_table, renames
  asset.epic_save_assets:
    class_path: ue-mcp.builtin/asset.epic_save_assets
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.asset.AssetTools] Saves assets to disk.
      Params: asset_paths
  asset.epic_search:
    class_path: ue-mcp.builtin/asset.epic_search
    group: asset
    description: >-
      [Epic SemanticSearchToolset.SemanticSearchToolset] Run a semantic search
      over the Content Browser assets indexed by the SemanticSearch plugin.
      Params: query, classFilter, pathRegexes, k?
  asset.epic_search_row_structs:
    class_path: ue-mcp.builtin/asset.epic_search_row_structs
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.data_table.DataTableTools] Finds structs
      that can be used as a DataTable schema. Params: struct_name?
  asset.epic_set_entry:
    class_path: ue-mcp.builtin/asset.epic_set_entry
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.string_table.StringTableTools] Adds or
      updates an entry in the string table. If the key already exists its value
      is replaced; otherwise a new entry is created. Params: string_table, key,
      value
  asset.epic_set_keys:
    class_path: ue-mcp.builtin/asset.epic_set_keys
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.curve_table.CurveTableTools] Replaces all
      keys in a row with the provided list. Params: curve_table, row_name, keys
  asset.epic_set_lod_thresholds:
    class_path: ue-mcp.builtin/asset.epic_set_lod_thresholds
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.static_mesh.StaticMeshTools] Sets the
      screen-size thresholds at which each LOD becomes active. Screen size is a
      ratio of the mesh's screen height to the viewport height. A value of 1.0
      means the mesh fills the full viewport height; values above 1.0 are valid
      and mean the mesh must appear larger than the viewport before the next LOD
      activates. Thresholds must be in strictly descending order (LOD 0 has the
      largest threshold), and there must be exactly one threshold per LOD.
      Params: mesh, thresholds
  asset.epic_set_material:
    class_path: ue-mcp.builtin/asset.epic_set_material
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.static_mesh.StaticMeshTools] Assigns a
      material to a named slot on a static mesh asset. This affects all
      instances of the mesh that do not override the slot material. Use
      set_component_material_override to change materials on a single instance.
      Params: mesh, slot_name, material
  asset.epic_set_nanite_enabled:
    class_path: ue-mcp.builtin/asset.epic_set_nanite_enabled
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.static_mesh.StaticMeshTools] Enables or
      disables Nanite for a static mesh. Changing this setting triggers a mesh
      rebuild. Nanite is most beneficial for high-polygon meshes. Low-polygon
      meshes may not benefit from Nanite. Params: mesh, enabled
  asset.epic_set_rows:
    class_path: ue-mcp.builtin/asset.epic_set_rows
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.data_table.DataTableTools] Sets column
      values for one or more rows. Params: data_table, values
  asset.epic_update_metadata_tags:
    class_path: ue-mcp.builtin/asset.epic_update_metadata_tags
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.asset.AssetTools] Sets or removes metadata
      tags on an asset. Params: asset_path, set_tags?, remove_tags?
  asset.epic_write_file:
    class_path: ue-mcp.builtin/asset.epic_write_file
    group: asset
    description: >-
      [Epic editor_toolset.toolsets.asset.AssetTools] Writes text content to a
      file on disk. Only files under /Game/, an enabled plugin's Content/
      directory, or the project Saved/ directory may be written. Only plain text
      formats are supported. Overwrites the file if it already exists. Params:
      file_path, content
  blueprint.read:
    class_path: ue-mcp.builtin/blueprint.read
    group: blueprint
    description: >-
      Read BP structure incl. SCS components AND inherited native components
      from the CDO (CharacterMesh0, CharMoveComp, etc.). assetPath also accepts
      a World/umap path such as /Game/Maps/SomeLevel, which resolves to that
      map's level script Blueprint at PersistentLevel.<MapName>; the result
      reports blueprintPath and isLevelScript so you can see what answered
      (#942) (#353/#370). Params: assetPath (or path),
      includeComponentProperties?
  blueprint.list_variables:
    class_path: ue-mcp.builtin/blueprint.list_variables
    group: blueprint
    description: >-
      List variables with name, type (pin category), typeSpec (the add_variable
      spelling, containers included, e.g. map<name,int>), guid, category,
      tooltip, exposeOnSpawn, blueprintReadOnly, private, and editFlag
      ('EditAnywhere'|'EditDefaultsOnly'|'EditInstanceOnly'|'none').
      instanceEditable is true only for EditAnywhere and EditInstanceOnly -
      EditDefaultsOnly is class-defaults-only and reports false (#744). private
      is reported separately because it is a Blueprint-graph access flag, not a
      details-panel one. Pass includeValues to add each variable's RESOLVED
      default from the generated-class CDO (value, valueText, cppType,
      declaringClass, inherited) plus one packageDirty/persisted verdict for the
      listing; off by default so the declaration list stays small (#902).
      Params: assetPath (or path), includeValues?, cursor?, limit?
  blueprint.list_functions:
    class_path: ue-mcp.builtin/blueprint.list_functions
    group: blueprint
    description: >-
      List the whole graph surface of a Blueprint, matching what list_graphs
      reports. Every entry carries kind ('function' own declaration | 'override'
      of a parent function | 'interface' implementation | 'event_graph' |
      'event' entry point on an event graph | 'macro' | 'delegate_signature' |
      'subgraph' collapsed graph | 'inherited'), source
      ('own'|'parent'|'interface'), graphName, and
      declaringClass/declaringClassPath where one applies. name and nodeCount
      are unchanged; nodeCount is 0 for entries that are not graphs (#809).
      Params: assetPath (or path), includeInherited?, cursor?, limit?
  blueprint.read_graph:
    class_path: ue-mcp.builtin/blueprint.read_graph
    group: blueprint
    description: >-
      Read graph nodes. Supports pagination, file dumps, and title/class node
      filters. assetPath accepts a World/umap path, resolved to that map's level
      script Blueprint (#942). With includeDefaults, literal FText pin values
      are returned inline (defaultValue falls back to the pin's text literal,
      plus an explicit defaultTextValue) and object-ref pins report
      defaultObject (#743) (#560). Params: assetPath (or path), graphName?,
      offset?, limit?, includePins?, includeDefaults?, includeComments?,
      dumpToFile?, outputPath?, titleFilter?, classFilter?
  blueprint.read_graph_summary:
    class_path: ue-mcp.builtin/blueprint.read_graph_summary
    group: blueprint
    description: >-
      Lightweight graph summary (~10KB). Returns nodes plus wires split across
      two arrays, execEdges and dataEdges, not a single combined edges array.
      Filterable node list. assetPath accepts a World/umap path, resolved to
      that map's level script Blueprint (#942) (#560). Params: assetPath (or
      path), graphName?, titleFilter?, classFilter?
  blueprint.get_execution_flow:
    class_path: ue-mcp.builtin/blueprint.get_execution_flow
    group: blueprint
    description: >-
      Trace exec pins from an entry point. assetPath accepts a World/umap path,
      resolved to that map's level script Blueprint (#942). Params: assetPath
      (or path), graphName?, entryPoint?
  blueprint.get_dependencies:
    class_path: ue-mcp.builtin/blueprint.get_dependencies
    group: blueprint
    description: >-
      Forward (classes/functions/assets) or reverse (referencers) deps. Params:
      assetPath (or path), reverse?
  blueprint.diff:
    class_path: ue-mcp.builtin/blueprint.diff
    group: blueprint
    description: >-
      Semantic structural diff between two Blueprints (binary uassets are
      unreviewable in git). Compares parent class, variables (type/default),
      functions/macros, components, and per-graph node + connection deltas keyed
      on stable node GUIDs so edits are matched rather than shown as remove+add.
      Returns a structured delta plus a human summary and changeCount. Changes
      read as assetPath (A) to otherPath (B). Revision-based diffing via source
      control is not implemented, and a revision parameter is refused. Params:
      assetPath (or path), otherPath, fromRevision?, toRevision?
  blueprint.create:
    class_path: ue-mcp.builtin/blueprint.create
    group: blueprint
    description: >-
      Create Blueprint. assetPath is the full destination, e.g.
      /Game/Blueprints/BP_Example; a name plus packagePath pair is accepted as
      the same thing. A .uasset suffix, an object suffix, and backslashes are
      normalized away rather than reaching the editor as an invalid asset name.
      Idempotent by path: an existing Blueprint is reported rather than
      replaced. Params: assetPath (or path) OR name + packagePath, parentClass?,
      onConflict?
  blueprint.add_variable:
    class_path: ue-mcp.builtin/blueprint.add_variable
    group: blueprint
    description: >-
      Add variable. varType accepts
      bool/int/float/string/name/text/byte/vector/rotator/transform/gameplaytag,
      object:/Script/Module.Class, struct:/Game/Path/To/Struct,
      enum:/Game/Path/E_Foo.E_Foo, TSubclassOf<Actor>, or a full class/struct
      path, and a container over any of those: Type[] or array<Type>, set<Type>,
      map<KeyType,ValueType> (e.g. map<enum:/Game/Enums/E_Team.E_Team,float>).
      Unrecognized types are rejected rather than silently defaulting. The
      result reports resolvedType, the spec the variable really got (#745).
      Params: assetPath (or path), name, varType? (or type), onConflict?
  blueprint.set_variable_properties:
    class_path: ue-mcp.builtin/blueprint.set_variable_properties
    group: blueprint
    description: >-
      Edit variable properties. Note: replication is set with
      networking(set_property_replicated), and blueprintReadOnly is not writable
      here - list_variables reports it. Params: assetPath (or path), name,
      editFlag?, instanceEditable?, private?, category?, tooltip?,
      exposeOnSpawn?
  blueprint.create_function:
    class_path: ue-mcp.builtin/blueprint.create_function
    group: blueprint
    description: 'Create function. Params: assetPath (or path), functionName, onConflict?'
  blueprint.delete_function:
    class_path: ue-mcp.builtin/blueprint.delete_function
    group: blueprint
    description: 'Delete function. Params: assetPath (or path), functionName'
  blueprint.rename_function:
    class_path: ue-mcp.builtin/blueprint.rename_function
    group: blueprint
    description: 'Rename function. Params: assetPath (or path), oldName, newName'
  blueprint.add_node:
    class_path: ue-mcp.builtin/blueprint.add_node
    group: blueprint
    description: >-
      Add graph node. For a CallFunction node bound to a custom C++ UFUNCTION,
      pass nodeParams {functionName, className (or targetClass) =
      /Script/Module.Class}; the function also resolves against the BP's own
      component classes and an unambiguous loaded BlueprintCallable function,
      producing a bound node with pins instead of a stub (#546).
      nodeClass='CallParent' places a 'Parent: <Function>' call bound to the
      parent implementation (functionName resolves against ParentClass) so an
      override graph can chain to the base (#688). Params: assetPath (or path),
      graphName?, nodeClass, nodeParams?
  blueprint.delete_node:
    class_path: ue-mcp.builtin/blueprint.delete_node
    group: blueprint
    description: >-
      Delete a node, addressed by nodeId (the GUID get_connections and
      find_nodes report) or by nodeName. Prefer the GUID: a title is ambiguous
      the moment a graph holds two nodes with the same one, and a GUID survives
      a recompile. A state, conduit or alias in an AnimBP state machine is
      removed the way animation(remove_state) removes it: every transition
      touching it goes too, each with its bound graph, and the result lists them
      in removedTransitions (#1132) (#996). Params: assetPath (or path),
      graphName?, graphSelector?, nodeId (or nodeName)
  blueprint.refresh_node:
    class_path: ue-mcp.builtin/blueprint.refresh_node
    group: blueprint
    description: >-
      Refresh a node, as the editor's Refresh Node does: rebuild its pins from
      its current definition. A pin whose definition is gone (a removed enum
      value, a deleted parameter) survives as an orphaned pin while it is still
      linked and fails the compile; the result lists those in orphanedPins, and
      breakOrphanedPins=true breaks their links and removes them, listing what
      it broke in brokenOrphanLinks. Idempotent: reports unchanged when the
      rebuild moved nothing (#1132). Params: assetPath (or path), graphName?,
      graphSelector?, nodeId (or nodeName), breakOrphanedPins?
  blueprint.disconnect_pins:
    class_path: ue-mcp.builtin/blueprint.disconnect_pins
    group: blueprint
    description: >-
      Break links on one pin, the inverse of connect_pins. With linkedNodeId
      (and optionally linkedPinName) only the links to that node or pin are
      broken; without it every link on the pin is. Every broken link is reported
      in brokenLinks with nodeId, pinName and direction. Idempotent: a pin with
      nothing to break reports alreadyDisconnected. Breaking exactly one link
      carries a connect_pins rollback (#1132). Params: assetPath (or path),
      graphName?, graphSelector?, nodeId (or nodeName), pinName, linkedNodeId?,
      linkedPinName?
  blueprint.set_node_property:
    class_path: ue-mcp.builtin/blueprint.set_node_property
    group: blueprint
    description: >-
      Set node pin default or struct property. Params: assetPath (or path),
      graphName?, nodeId (or nodeName), propertyName (or pinName), value (or
      defaultValue)
  blueprint.connect_pins:
    class_path: ue-mcp.builtin/blueprint.connect_pins
    group: blueprint
    description: >-
      Wire nodes. Address each end by sourceNodeId/targetNodeId (the GUIDs
      get_connections and find_nodes report) or by sourceNode/targetNode title.
      Prefer the GUIDs: a title cannot pick one of five identically titled math
      nodes apart, which is what makes re-targeting wiring by title unsafe.
      breakExistingSource/breakExistingTarget are applied even when the wire
      already exists, so they clear every other link on that pin; the result
      reports alreadyConnected. The rollback is disconnect_pins (#996). Params:
      assetPath (or path), graphName?, graphSelector?, sourceNodeId (or
      sourceNode), sourcePin (or sourcePinName), targetNodeId (or targetNode),
      targetPin (or targetPinName), breakExistingSource?, breakExistingTarget?
  blueprint.add_component:
    class_path: ue-mcp.builtin/blueprint.add_component
    group: blueprint
    description: >-
      Add BP component. componentClass accepts short names (e.g.
      'ChildActorComponent') or full paths. For a ChildActorComponent, pass
      childActorClass to set its ChildActorClass in the same call (a Blueprint
      path with or without _C, or a C++ class) (#526). Params: assetPath (or
      path), componentClass, componentName?, onConflict?, parentComponent?,
      childActorClass?
  blueprint.remove_component:
    class_path: ue-mcp.builtin/blueprint.remove_component
    group: blueprint
    description: 'Remove SCS component. Params: assetPath (or path), componentName'
  blueprint.set_component_property:
    class_path: ue-mcp.builtin/blueprint.set_component_property
    group: blueprint
    description: >-
      Set property on SCS or inherited component. Inherited components go
      through the child BP's InheritableComponentHandler override template so
      the parent stays untouched. Pass value=null to clear a
      TObjectPtr/SoftObject/WeakObject/UClass/Interface reference (e.g. clear
      AnimClass on CharacterMesh0) (#420). The Blueprint is saved and the result
      reports saved; a save that does not reach disk fails the call with
      saveError, and a read-only or protected package is refused before anything
      changes (#1109). Params: assetPath (or path), componentName, propertyName,
      value
  blueprint.set_component_override_materials:
    class_path: ue-mcp.builtin/blueprint.set_component_override_materials
    group: blueprint
    description: >-
      Write OverrideMaterials on a mesh-component template (StaticMeshComponent
      / SkeletalMeshComponent / any UMeshComponent). Pass materialPaths as a
      string[] of material asset paths (empty array clears). Avoids any
      TArray<UObject*> coercion on the generic set_component_property path
      (#442). Params: assetPath (or path), componentName, materialPaths
  blueprint.add_timeline_track:
    class_path: ue-mcp.builtin/blueprint.add_timeline_track
    group: blueprint
    description: >-
      Add a track to a Blueprint timeline. Creates the UTimelineTemplate if
      missing, builds the matching curve asset (float/vector/color/event),
      applies keyframes, bumps TimelineLength to cover the last key, then
      recompiles so K2Node_Timeline regenerates its output pins. value is a
      number for float/event, {x,y,z} for vector, {r,g,b,a} for color (#457)
      Params: assetPath (or path), timelineName, trackName, trackType?,
      keyframes?
  blueprint.set_capsule_size:
    class_path: ue-mcp.builtin/blueprint.set_capsule_size
    group: blueprint
    description: >-
      Call UCapsuleComponent::SetCapsuleSize on a CapsuleComponent template
      (CharacterMovement-friendly path; raw property writes leave the visualizer
      stale). Pass either or both of halfHeight/radius. Returns the new +
      previous values (#419). Params: assetPath (or path), componentName,
      halfHeight?, radius?
  blueprint.get_component_property:
    class_path: ue-mcp.builtin/blueprint.get_component_property
    group: blueprint
    description: >-
      Read a single property value from an SCS or inherited component template.
      Returns the ICH override value for child BPs if one exists. Params:
      assetPath (or path), componentName, propertyName
  blueprint.set_class_default:
    class_path: ue-mcp.builtin/blueprint.set_class_default
    group: blueprint
    description: >-
      Set UPROPERTY on Blueprint CDO. Pass value=null to clear an
      object/class/interface reference (#420). Params: assetPath (or path),
      propertyName, value
  blueprint.delete_variable:
    class_path: ue-mcp.builtin/blueprint.delete_variable
    group: blueprint
    description: 'Delete a member variable. Params: assetPath (or path), name'
  blueprint.add_function_parameter:
    class_path: ue-mcp.builtin/blueprint.add_function_parameter
    group: blueprint
    description: >-
      Add input or output parameter to a function. parameterType takes the
      add_variable vocabulary, containers included (int[], set<Name>,
      map<Name,int>); an unrecognized type is rejected. Params: assetPath (or
      path), functionName, parameterName, parameterType?, isOutput?
  blueprint.set_variable_default:
    class_path: ue-mcp.builtin/blueprint.set_variable_default
    group: blueprint
    description: >-
      Set default value on a BP variable. Params: assetPath (or path), name,
      value
  blueprint.get_variable_default:
    class_path: ue-mcp.builtin/blueprint.get_variable_default
    group: blueprint
    description: >-
      Read the RESOLVED default of a BP variable off the generated-class CDO,
      which is what a write-compile-readback loop has to compare against
      (list_variables alone only proves the variable exists). Returns value
      (typed JSON), valueText (UE export text), cppType,
      declaringClass/declaringClassPath and inherited. It also states whether
      that value is on DISK: packageDirty is the package's own unsaved-changes
      flag and persisted is its inverse, so a value written into the CDO but
      never saved reports persisted=false with a persistenceNote instead of
      reading back as if it had landed (#931).
      authoredDefault/matchesAuthoredDefault appear when the variable carries a
      non-empty authored default string that the next recompile could apply
      (#902). Params: assetPath (or path), name
  blueprint.compile:
    class_path: ue-mcp.builtin/blueprint.compile
    group: blueprint
    description: 'Compile Blueprint. Params: assetPath (or path)'
  blueprint.list_node_types:
    class_path: ue-mcp.builtin/blueprint.list_node_types
    group: blueprint
    description: 'List node types. Params: category?, cursor?, limit?'
  blueprint.get_connections:
    class_path: ue-mcp.builtin/blueprint.get_connections
    group: blueprint
    description: >-
      Read a Blueprint graph's edges, addressed by node GUID. read_graph reports
      each pin as connected true or false and never says to what, and
      read_graph_summary carries exec edges but no data edges, so there was no
      native way to answer "what feeds this pin" - which is what verifying or
      re-targeting wiring needs. Each edge carries fromNodeId/fromPin and
      toNodeId/toPin plus both node titles and classes, and a data edge also
      carries its pin category. Nodes are named by GUID because a title is
      exactly what is ambiguous when a graph holds five "float * float" nodes,
      and a GUID survives a recompile. Every edge is reported once, from its
      output side, which is the direction it actually has. Omit graphName to
      read every graph the Blueprint owns. Pass nodeId (GUID or name) to report
      only the edges into and out of that node (#996). Params: assetPath (or
      path), graphName?, graphSelector?, nodeId?, kind?, includeNestedGraphs?,
      cursor?, limit?
  blueprint.find_nodes:
    class_path: ue-mcp.builtin/blueprint.find_nodes
    group: blueprint
    description: >-
      Find nodes anywhere in ONE Blueprint, across every graph it owns including
      collapsed and nested ones. Narrow by `titles` (case-insensitive substrings
      matched against the node title), `nodeClasses` (exact class names such as
      K2Node_VariableGet), or `variableName` with an optional `variableAccess`
      of get|set|any - which is how you find every read and write of a member,
      the variable analogue of search_call_sites. The three are alternatives
      rather than a conjunction, so one pass answers "every get of bIsAiming,
      plus anything titled Sprint". read_graph takes one named graph at a time
      and does not descend into a collapsed subgraph; this walks them all. Each
      hit carries the graph selector list_graphs reports, the node title, class
      and GUID, which filter matched it, and for a variable node the member
      name, whether it is a get or a set, and its parent class. authoredOnly
      (default true) leaves out transient compiler graphs. A call naming none of
      the three filters is refused rather than dumping the Blueprint
      (#998/#1015). Params: assetPath (or blueprintPath), titles?, nodeClasses?,
      variableName?, variableAccess?, includeNestedGraphs?, authoredOnly?,
      cursor?, limit?
  blueprint.search_call_sites:
    class_path: ue-mcp.builtin/blueprint.search_call_sites
    group: blueprint
    description: >-
      Find authored call-site NODES for named functions across a whole directory
      in ONE call, including nested and collapsed graphs. Replaces the
      enumerate-every-Blueprint / read-every-graph sweep that overwhelms the
      bridge on a large project. Narrowing is done by the Asset Registry BEFORE
      any package is loaded: candidates come from a recursive Blueprint filter
      over `directory`, then every candidate whose package does not depend on a
      package declaring one of `functionNames` is ruled out unloaded. That step
      is reported (stats.narrowedByRegistry, stats.blueprintsSkippedByRegistry)
      and can be turned off with narrowByRegistry=false; it is also skipped
      automatically when a requested name has no resolvable declaring class, so
      a filter never silently drops a hit. Each hit carries assetPath,
      packageName, graphName + graphSelector (the same selector list_graphs
      reports, so it is unambiguous for duplicate nested graph names) +
      graphObjectPath, nodeId, nodeTitle, memberName, resolvedFunction (absent
      with unresolvedTarget=true when the function is gone, which is itself an
      audit finding), declaringClass/declaringClassPath, parentCall, and
      pinDefaults for unlinked input pins. Pass includeNeighbours for the
      immediate execution and data neighbours of each call. Level script
      Blueprints are NOT registry assets (they live inside their map package),
      so they are excluded unless you pass includeLevelScripts, which sweeps the
      World assets under the directory and costs a full map load each. Bounded
      and paginated: limit (default 200, max 1000) + offset, maxBlueprints
      (default 2000) caps package loads, and dumpToFile writes the whole result
      set to a JSON file the way read_graph does (#945). Params: functionNames,
      className?, directory?, includeNestedGraphs?, includeLevelScripts?,
      includeNeighbours?, narrowByRegistry?, offset?, cursor?, limit?,
      maxBlueprints?, dumpToFile?, outputPath?
  blueprint.export_batch:
    class_path: ue-mcp.builtin/blueprint.export_batch
    group: blueprint
    description: >-
      Export many Blueprints to disk in ONE call, for offline analysis. Select
      with assetPaths[] (a World path resolves to its level script) OR directory
      (+ recursive?, default true) with an optional parentClass filter (native
      parents are ruled out by the Asset Registry before loading);
      includeLevelScripts also sweeps the maps under the directory. Per
      Blueprint it writes <outputDir>/<package path>.json holding variables
      (typeSpec, flags), functions (function, override, interface, macro,
      dispatcher, event and custom_event entries), components (SCS name, class,
      parent) and every graph with the node, pin and default data read_graph
      reports plus each pin's linkedTo [{nodeId, pin}]. includeT3D also writes
      one <package path>/<graph selector>.t3d per graph, the export_nodes_t3d
      text of the nodes the graph actually holds, so nodes detached from a graph
      are not exported. outputDir is absolute, or relative to Saved/ (a leading
      Saved/ names the project's Saved folder), default
      Saved/UE_MCP/BlueprintExport; a relative path may not leave Saved/.
      maxAssets (default 200, max 5000) caps the batch and reports
      truncatedAtMaxAssets. Every asset gets a row with ok and its files, or its
      error, so one bad asset never fails the batch. Returns files[], the full
      written file list (#1166). Params: assetPaths?, directory?, recursive?,
      parentClass?, includeLevelScripts?, outputDir?, maxAssets?, includeT3D?
  blueprint.audit_dead_code:
    class_path: ue-mcp.builtin/blueprint.audit_dead_code
    group: blueprint
    description: >-
      Report-only dead-code audit over a directory (or assetPaths[]). Per
      Blueprint: unusedFunctions, unusedMacros, unusedCustomEvents and
      unusedDispatchers (declared here and referenced by no call, macro
      instance, delegate binding, bound event or widget binding anywhere in the
      scanned set), unusedVariables (never read or written) and
      writeOnlyVariables (written, never read), disconnectedFunctionBodies (the
      entry exec pin is unwired while the function holds executable nodes),
      unreachableNodes (the head of every exec island with no incoming exec wire
      that is not an event or entry, with islandSize) and unconnectedPureNodes
      (pure nodes whose outputs feed nothing). Overrides of parent and interface
      functions, the construction script and CallInEditor functions and events
      are excluded. References are counted across the audited Blueprints plus,
      with scanReferencers (default true), every Blueprint package the Asset
      Registry says depends on one of them, so a call from outside the directory
      still counts. Level script Blueprints are audited and scanned only with
      includeLevelScripts, at a full map load each. Counts are always complete;
      each finding list is capped at maxSamples (default 20) and the rows at
      limit (default 200); maxBlueprints (default 2000) caps package loads;
      dumpToFile writes every row to a JSON file the way read_graph does.
      Findings are candidates to review: a member reached only from C++ or by a
      runtime string reads as unused (#1166). Params: directory?, assetPaths?,
      recursive?, includeLevelScripts?, scanReferencers?, maxBlueprints?,
      maxSamples?, limit?, dumpToFile?, outputPath?
  blueprint.search_node_types:
    class_path: ue-mcp.builtin/blueprint.search_node_types
    group: blueprint
    description: >-
      Search placeable nodes across every loaded Blueprint function library
      (KismetMathLibrary, GameplayStatics, custom libraries) plus UEdGraphNode
      classes. Matches the C++ name, the palette label from DisplayName
      metadata, and Keywords metadata, ignoring case/spaces/underscores, so 'is
      point in box' finds IsPointInBox and 'vector length' finds VSize. Results
      are ranked and each carries an addNode block (nodeClass + nodeParams incl.
      targetClass) that add_node accepts verbatim (#808). Params: query,
      className? (or classFilter), includeGraphNodes?, cursor?, limit?
  blueprint.create_interface:
    class_path: ue-mcp.builtin/blueprint.create_interface
    group: blueprint
    description: >-
      Create BP Interface. Idempotent by path: an existing interface is reported
      rather than replaced. Params: assetPath (or path), onConflict?
  blueprint.add_interface:
    class_path: ue-mcp.builtin/blueprint.add_interface
    group: blueprint
    description: 'Implement interface. Params: blueprintPath, interfacePath'
  blueprint.override_function:
    class_path: ue-mcp.builtin/blueprint.override_function
    group: blueprint
    description: >-
      Override an inherited interface implementation (inherited via the parent
      class) or an overridable parent virtual function, with the matching
      signature so it actually binds as the override (create_function makes a
      blank, non-binding graph). Returns kind ('function' with a graphName, or
      'event' with a nodeId in EventGraph). Event-shaped functions become
      override events unless preferFunction=true. This is the path for
      BehaviorTree TASK Blueprint entry points: ReceiveExecuteAI and
      ReceiveAbortAI on a UBTTask_BlueprintBase child come back as kind='event'
      in EventGraph, and their FinishExecute / FinishAbort terminators are
      placed with add_node nodeClass='CallFunction',
      className='/Script/AIModule.BTTask_BlueprintBase' (#886). Pass
      interfacePath to also implement the interface first if it is not present.
      Then wire the body with add_node (use nodeClass='CallParent' to chain to
      the base implementation). An animation layer override in a child Anim BP
      is created as an AnimationGraph on the animation schema, mirrored from the
      graph that declared the layer, so it actually binds instead of compiling
      to an inert K2 function graph; the result reports graphClass, schemaClass
      and animationGraph (#894) (#688). Params: assetPath (or path),
      functionName, source?, preferFunction?, interfacePath?
  blueprint.list_overridable_functions:
    class_path: ue-mcp.builtin/blueprint.list_overridable_functions
    group: blueprint
    description: >-
      List functions this Blueprint can override: inherited interface
      implementations and overridable parent virtuals. Each entry has name,
      source ('interface'|'parent'), declaringClass, canBeEvent (#688). Params:
      assetPath (or path)
  blueprint.list_graphs:
    class_path: ue-mcp.builtin/blueprint.list_graphs
    group: blueprint
    description: >-
      List all graphs in a blueprint. Returns selector/objectPath plus
      duplicateIndex/duplicateCount; pass selector back as graphName for
      unambiguous nested graph edits. assetPath accepts a World/umap path,
      resolved to that map's level script Blueprint (#942). Params: assetPath
      (or path)
  blueprint.resolve_graph:
    class_path: ue-mcp.builtin/blueprint.resolve_graph
    group: blueprint
    description: >-
      Resolve a Blueprint graph name to selectors accepted by
      read_graph/add_node/connect_pins and other graph actions. assetPath
      accepts a World/umap path, resolved to that map's level script Blueprint
      (#942). Duplicate nested AnimBP names such as Locomotion return every
      match with selectors like Locomotion[3], object paths, and ambiguity
      metadata. Params: assetPath (or path), graphName
  blueprint.add_event_dispatcher:
    class_path: ue-mcp.builtin/blueprint.add_event_dispatcher
    group: blueprint
    description: >-
      Add event dispatcher (multicast delegate variable + signature graph +
      UFunction). Without parameters, broadcasters fire void(). With parameters,
      the signature graph gets typed user pins so K2Node_CallDelegate compiles
      cleanly (#276). parameters is [{name, type}], where type takes the
      add_variable vocabulary (bool, float, Vector,
      enum:/Game/Enums/E_Foo.E_Foo, object:/Script/Engine.Actor,
      struct:/Script/CoreUObject.Vector, int[], set<Name>, map<Name,int>). Every
      parameter type is resolved before anything is created, and a missing or
      unrecognized type refuses the call rather than producing a wildcard pin.
      The rollback is remove_event_dispatcher. Params: blueprintPath, name,
      parameters?
  blueprint.duplicate:
    class_path: ue-mcp.builtin/blueprint.duplicate
    group: blueprint
    description: 'Duplicate blueprint asset. Params: sourcePath, destinationPath'
  blueprint.add_local_variable:
    class_path: ue-mcp.builtin/blueprint.add_local_variable
    group: blueprint
    description: >-
      Add function-scope local variable. varType takes the add_variable
      vocabulary, containers included (int[], set<Name>, map<Name,int>); an
      unrecognized type is rejected. Params: assetPath (or path), functionName,
      name, varType? (or type)
  blueprint.list_local_variables:
    class_path: ue-mcp.builtin/blueprint.list_local_variables
    group: blueprint
    description: >-
      List local variables in a function. Params: assetPath (or path),
      functionName
  blueprint.validate:
    class_path: ue-mcp.builtin/blueprint.validate
    group: blueprint
    description: >-
      Validate blueprint without saving (compile + collect diagnostics). Params:
      assetPath (or path)
  blueprint.read_component_properties:
    class_path: ue-mcp.builtin/blueprint.read_component_properties
    group: blueprint
    description: >-
      Dump ALL UPROPERTYs on a BP component template incl. array contents
      (#105). Params: assetPath (or path), componentName
  blueprint.get_component_collision:
    class_path: ue-mcp.builtin/blueprint.get_component_collision
    group: blueprint
    description: >-
      Read a component's EFFECTIVE collision: enabled mode, object type, profile
      name, and the resolved Block/Overlap/Ignore per channel.
      read_component_properties cannot answer this - it exports BodyInstance as
      text, and that text carries only CollisionProfileName plus the responses
      that DIFFER from the profile, so a response INHERITED from the profile
      (the Pawn profile blocking Camera) is invisible in it. Each channel
      reports response (what GetCollisionResponseToChannel actually returns),
      profileResponse, and overridesProfile, so you can see whether an answer
      came from the profile or from the component. assetPath takes a Blueprint
      path OR a native class (/Script/MyGame.MyCharacter or 'MyCharacter'),
      which is how you verify a C++ constructor's SetCollisionResponseToChannel
      really landed in the CDO after a rebuild. Project trace and object
      channels appear under their configured names with enumName alongside.
      channel narrows it to one; includeAllChannels adds the unused
      GameTraceChannel slots (#925). Params: assetPath (or path), componentName,
      channel?, includeAllChannels?
  blueprint.read_node_property:
    class_path: ue-mcp.builtin/blueprint.read_node_property
    group: blueprint
    description: >-
      Read a node pin default OR a reflected node property for verification
      (#102). Params: assetPath (or path), graphName?, nodeId (or nodeName),
      propertyName (or pinName)
  blueprint.reparent_component:
    class_path: ue-mcp.builtin/blueprint.reparent_component
    group: blueprint
    description: >-
      Reparent an SCS component under a new parent, recompile and save (#115).
      Refuses before touching anything when the Blueprint's .uasset is read-only
      on disk (not checked out) or on a protected mount, and reports saved plus
      saveError when the write did not reach disk (#932). Params: assetPath (or
      path), componentName, newParent
  blueprint.reparent:
    class_path: ue-mcp.builtin/blueprint.reparent
    group: blueprint
    description: >-
      Change a Blueprint's ParentClass, recompile and save (#138). The save is
      part of the operation, so writability is checked FIRST: a read-only
      .uasset (never checked out of source control) or a protected mount returns
      reason='package_not_writable' naming the file, with nothing reparented,
      instead of taking the editor down with a fatal save error (#932). A write
      that still did not reach disk comes back with saved=false and saveError.
      Params: assetPath (or path), parentClass
  blueprint.flush_ich:
    class_path: ue-mcp.builtin/blueprint.flush_ich
    group: blueprint
    description: >-
      Flush orphaned InheritableComponentHandler override records (invalid
      component-override entries invisible to read/remove_component). Recompiles
      + saves. Returns recordsBefore/After/Removed (#580) Params: assetPath (or
      path)
  blueprint.flush_component_templates:
    class_path: ue-mcp.builtin/blueprint.flush_component_templates
    group: blueprint
    description: >-
      Flush orphaned UBlueprint::ComponentTemplates left by deleted Add
      Component nodes using Unreal's native maintenance routine. Live Add
      Component templates are preserved. Recompiles + saves only when changed.
      Returns recordsBefore/After/Removed and removed template identities.
      Params: assetPath (or path)
  blueprint.set_actor_tick_settings:
    class_path: ue-mcp.builtin/blueprint.set_actor_tick_settings
    group: blueprint
    description: >-
      Set actor CDO tick settings (#116). Params: assetPath (or path),
      bCanEverTick?, bStartWithTickEnabled?, TickInterval?
  blueprint.export_nodes_t3d:
    class_path: ue-mcp.builtin/blueprint.export_nodes_t3d
    group: blueprint
    description: >-
      Export graph nodes as T3D text (Ctrl+C equivalent) for bulk round-trip
      (#130). Params: assetPath (or path), graphName?, nodeIds?
  blueprint.import_nodes_t3d:
    class_path: ue-mcp.builtin/blueprint.import_nodes_t3d
    group: blueprint
    description: >-
      Paste a T3D node blob into a graph (Ctrl+V equivalent) for bulk authoring
      (#130). Params: assetPath (or path), graphName?, t3d (or text), posX?,
      posY?
  blueprint.set_cdo_property:
    class_path: ue-mcp.builtin/blueprint.set_cdo_property
    group: blueprint
    description: >-
      Set UPROPERTY on any C++ class CDO (not just Blueprints) (#182/#183).
      Params: className, propertyName, value
  blueprint.get_cdo_properties:
    class_path: ue-mcp.builtin/blueprint.get_cdo_properties
    group: blueprint
    description: >-
      Read UPROPERTY values from any C++ class CDO (#183). Params: className,
      propertyNames?
  blueprint.run_construction_script:
    class_path: ue-mcp.builtin/blueprint.run_construction_script
    group: blueprint
    description: >-
      Spawn temp actor, run construction script, return generated components and
      transforms (#195). Params: assetPath (or path), location?
  blueprint.compile_all:
    class_path: ue-mcp.builtin/blueprint.compile_all
    group: blueprint
    description: >-
      Batch compile + save Blueprints. Returns per-path status
      (compiled/failed/not_found) (#284) Params: assetPaths, save?
  blueprint.author:
    class_path: ue-mcp.builtin/blueprint.author
    group: blueprint
    description: >-
      Author a whole Blueprint in one call: optionally create it (parentClass),
      then add components, variables and function stubs, then compile - one
      agent-facing action instead of a dozen add_* round-trips. Params:
      assetPath, parentClass? (create/ensure the BP if given), components?
      [{componentClass, componentName?, parentComponent?, childActorClass?}],
      variables? [{name, varType}], functions? [{functionName}], compile?
      (default true). Returns per-step results + created flag. (#607)
  blueprint.cleanup_graph:
    class_path: ue-mcp.builtin/blueprint.cleanup_graph
    group: blueprint
    description: >-
      Remove orphan/corrupted nodes (no class, blank title+no pins, missing
      target UFunction) (#285). Params: assetPath (or path), graphName?
  blueprint.connect_pins_batch:
    class_path: ue-mcp.builtin/blueprint.connect_pins_batch
    group: blueprint
    description: >-
      Apply many pin connections in one call (single compile + save) (#267).
      Params: assetPath (or path), graphName?, connections
  blueprint.set_node_position:
    class_path: ue-mcp.builtin/blueprint.set_node_position
    group: blueprint
    description: >-
      Move a graph node to (posX, posY) (#277). Params: assetPath (or path),
      graphName?, nodeId (or nodeName), posX?, posY?
  blueprint.auto_layout:
    class_path: ue-mcp.builtin/blueprint.auto_layout
    group: blueprint
    description: >-
      Topological layered layout for a graph. Eliminates the (0,0) stack from
      programmatic add_node. This has no inverse: it rewrites every node's
      position and set_node_position moves one node per call. It answers that by
      returning previousPositions, every node's coordinates from before the
      layout ran, which you replay through set_node_position to undo it. That
      capture is skipped above previousPositionsLimit nodes (default 200) so a
      large EventGraph does not return an unbounded array;
      capturePreviousPositions=true forces it on at any size, and the result
      says through previousPositionsCaptured which of the two happened. Decide
      BEFORE running it: once the layout has run the old coordinates are gone
      (#277). Params: assetPath (or path), graphName?, columnGap?, rowGap?,
      previousPositionsLimit?, capturePreviousPositions?
  blueprint.list_interfaces:
    class_path: ue-mcp.builtin/blueprint.list_interfaces
    group: blueprint
    description: >-
      List the interfaces this Blueprint implements AND the ones it inherits
      from anywhere in its parent chain. The two halves are told apart by
      source: an inherited entry carries inheritedFrom, naming the ancestor
      class that declares it, which for a grandparent is not the immediate
      parent; an entry the Blueprint declares itself has no ancestor to name and
      carries no inheritedFrom. Where an inherited interface extends another the
      base is listed as well, since declaring the derived one puts the base in
      force too. Every function each declares is reported and whether anything
      actually answers it: implementedAs is 'graph' (a function graph), 'event'
      (an override event on the event graph, which is what an interface function
      with no outputs becomes) or 'missing'. add_interface creates the contract;
      this is the only thing that reports whether the contract is met, and
      unimplementedCount is the number to watch. removable is false for an
      inherited interface, which remove_interface refuses. Params: assetPath (or
      blueprintPath)
  blueprint.remove_interface:
    class_path: ue-mcp.builtin/blueprint.remove_interface
    group: blueprint
    description: >-
      Stop implementing an interface. The paired remove for add_interface, which
      until now had no inverse and therefore emitted no rollback.
      preserveFunctions=true keeps the implementations as ordinary Blueprint
      functions and is the non-destructive form; the default false deletes the
      interface's function graphs with it, and the result says so through
      rollbackLossy and names what re-adding would restore. Idempotent: an
      interface that is not implemented reports alreadyRemoved. An INHERITED
      interface is refused by name, and the refusal names the ancestor that
      declares it, which for a grandparent is not the immediate parent:
      reparenting or editing that class is the only way to drop it. Params:
      assetPath (or blueprintPath), interfacePath, preserveFunctions?
  blueprint.set_function_properties:
    class_path: ue-mcp.builtin/blueprint.set_function_properties
    group: blueprint
    description: >-
      Set the flags and metadata of a Blueprint function or macro: pure,
      isConst, accessSpecifier, category, tooltip, keywords, compactNodeTitle,
      callInEditor, threadSafe, deprecated, deprecationMessage. These are NOT
      UPROPERTYs on the asset - they live on the function graph's entry node as
      FUNC_ flags and FKismetUserDeclaredFunctionMetadata - so
      asset(set_property) cannot reach them. Validates everything before writing
      anything, reports existed plus unchanged when the request is already the
      current state, and the rollback restores exactly the fields this call
      changed. A macro accepts the metadata half only; the flag half is refused
      by name because a macro compiles to no UFunction. Params: assetPath (or
      path), functionName, pure?, isConst?, accessSpecifier?, category?,
      tooltip?, keywords?, compactNodeTitle?, callInEditor?, threadSafe?,
      deprecated?, deprecationMessage?
  blueprint.list_graph_parameters:
    class_path: ue-mcp.builtin/blueprint.list_graph_parameters
    group: blueprint
    description: >-
      Read the parameter signature of a function, macro, event-dispatcher
      signature or custom event: inputs and outputs with name, type, default
      value, by-ref and const. The read half of add_function_parameter and
      edit_graph_parameters. The reported type is the same string the write half
      accepts (int[], set<Name>, map<Name,int>, object:/Script/Engine.Actor), so
      a read can be echoed straight back as a call; typeRoundTrips is false for
      the few pin categories that vocabulary cannot spell. Name exactly one
      target. Params: assetPath (or path), functionName?, eventName?, graphName?
  blueprint.edit_graph_parameters:
    class_path: ue-mcp.builtin/blueprint.edit_graph_parameters
    group: blueprint
    description: >-
      Full parameter CRUD over one mechanism, for every node that owns
      user-defined pins: a function, a macro, an event-dispatcher signature or a
      custom event. op=add appends one (creating the function's return node on
      the first output), remove deletes it, rename rewrites it after probing for
      a collision so a clash refuses instead of half-renaming, set_type retypes
      it, set_default writes its default as export text, reorder takes the
      COMPLETE order and validates every entry before a single pin moves. This
      is what closes add_function_parameter's documented missing remove.
      isOutput selects the return side; a custom event and a dispatcher
      signature are input-only and say so. Params: assetPath (or path), op,
      functionName?, eventName?, graphName?, isOutput?, parameterName?,
      parameterType?, newName?, defaultValue?, order?
  blueprint.rename_variable:
    class_path: ue-mcp.builtin/blueprint.rename_variable
    group: blueprint
    description: >-
      Rename a member variable, rewriting every get and set node in this
      Blueprint's graphs, the RepNotify function name and the SCS entry for a
      component variable. delete_variable plus add_variable loses all of them.
      Reports referencesBefore, referencesUpdated and referencesStillOnOldName,
      so the fixup is counted rather than asserted. Refuses a name already taken
      by another variable on this Blueprint or by a property on the parent
      class, naming what is taken. Self-inverse rollback. Other Blueprints bind
      this member by its variable GUID, which the rename preserves;
      asset(get_asset_referencers) plus compile_all confirms them. Params:
      assetPath (or path), oldName, newName
  blueprint.get_variable_metadata:
    class_path: ue-mcp.builtin/blueprint.get_variable_metadata
    group: blueprint
    description: >-
      Read every metadata key on a member or local variable (ClampMin, UIMin,
      EditCondition, Bitmask, BitmaskEnum, MakeEditWidget, MultiLine, and so
      on). list_variables reports the declaration and set_variable_properties
      covers category, tooltip and the edit flags; this is the arbitrary-key
      half, which is not a UPROPERTY and has no other reader. Pass functionName
      for a local variable. Params: assetPath (or path), name, functionName?
  blueprint.set_variable_metadata:
    class_path: ue-mcp.builtin/blueprint.set_variable_metadata
    group: blueprint
    description: >-
      Write metadata keys on a member or local variable. metadata is an object
      of key/value strings; a JSON null value removes that key. Unreal stores
      every metadata value as text, so ClampMin is '0' and EditCondition is
      'bEnabled'. Validates the whole object and proves the variable exists in
      the named scope before writing anything, because the engine setter
      silently does nothing for a name it cannot find. Idempotent, and the
      rollback restores each key's previous value or removes it again if it did
      not exist. Pass functionName for a local variable. Params: assetPath (or
      path), name, metadata, functionName?
  blueprint.edit_local_variable:
    class_path: ue-mcp.builtin/blueprint.edit_local_variable
    group: blueprint
    description: >-
      Complete the local-variable CRUD that add_local_variable and
      list_local_variables leave half-built. op=rename rewrites the get and set
      nodes inside the function (a remove-then-add pair would delete them),
      remove drops the declaration, set_type retypes it, set_default writes its
      default as export text. remove is idempotent and reports alreadyRemoved. A
      Blueprint that has never compiled has no function signature to address a
      local variable through, and that is reported by name rather than failing
      silently. Params: assetPath (or path), functionName, name, op, newName?,
      varType? (or type), defaultValue?
  blueprint.list_event_dispatchers:
    class_path: ue-mcp.builtin/blueprint.list_event_dispatchers
    group: blueprint
    description: >-
      List this Blueprint's event dispatchers with their parameter signatures. A
      dispatcher is a multicast-delegate member variable PLUS a separate
      signature graph, and hasSignatureGraph=false is exactly the state that
      produces a missing SignatureFunction error at compile time, so it is
      reported rather than left to be discovered. Params: assetPath (or
      blueprintPath)
  blueprint.remove_event_dispatcher:
    class_path: ue-mcp.builtin/blueprint.remove_event_dispatcher
    group: blueprint
    description: >-
      Remove an event dispatcher: BOTH the member variable and its signature
      graph. delete_variable removes only the variable and leaves an orphan
      graph the compiler still walks. Captures the parameter signature first so
      the inverse re-declares the same one. Idempotent; a variable that is not a
      dispatcher is refused by name with its actual type. Bind, Unbind and Call
      nodes go with the variable and are not restored, and the result says so.
      Params: assetPath (or blueprintPath), name
  blueprint.add_custom_event:
    class_path: ue-mcp.builtin/blueprint.add_custom_event
    group: blueprint
    description: >-
      Add a custom event with a TYPED signature in one call.
      add_node(nodeClass='CustomEvent') can set the name and nothing else, and
      has no natural key, so calling it twice silently produces two events; this
      is idempotent on the event name. parameters is [{name, type}] and becomes
      the event's output pins. netMode (none|multicast|server|client) with
      reliable sets the replication flags, and callInEditor exposes the button
      in the details panel. Every parameter type is validated before the node is
      created. Params: assetPath (or path), eventName, graphName?, parameters?,
      netMode?, reliable?, callInEditor?, posX?, posY?
  blueprint.create_macro:
    class_path: ue-mcp.builtin/blueprint.create_macro
    group: blueprint
    description: >-
      Create a Blueprint macro graph with its input and output signature. Macros
      could be listed by list_functions and read by read_graph but never
      authored: create_function makes a function, and there was no macro path at
      all. inputs and outputs are [{name, type}] and land on the entry and exit
      tunnel nodes; every type is validated before the graph exists. Idempotent
      on the macro name, and a clash with an existing function or dispatcher
      graph is refused because graph names share one namespace. Params:
      assetPath (or path), macroName, inputs?, outputs?, onConflict?
  blueprint.delete_graph:
    class_path: ue-mcp.builtin/blueprint.delete_graph
    group: blueprint
    description: >-
      Delete any graph in a Blueprint, addressed the way list_graphs names one.
      This is the call for a collapsed subgraph that outlived its composite
      node: delete_function only walks FunctionGraphs and delete_macro only
      walks MacroGraphs, so both answer alreadyDeleted for an orphan that
      list_graphs plainly still reports, and leftover variable gets inside it go
      on blocking delete_variable. While the owning node still exists,
      delete_node is the right call instead - it takes the bound graph with it -
      and this refuses rather than leaving the node behind, unless you pass
      force. Deleting an event graph is refused for the same reason. Idempotent,
      and reports what it removed: kind, whether it was orphaned, and how many
      nodes went with it (#1010). Params: assetPath (or path), graphName?,
      graphSelector?, force?
  blueprint.delete_macro:
    class_path: ue-mcp.builtin/blueprint.delete_macro
    group: blueprint
    description: >-
      Delete a macro graph. Idempotent (alreadyDeleted). Reports
      orphanedInstances, the number of macro instance nodes elsewhere in the
      Blueprint that referenced it and are now broken - blueprint(cleanup_graph)
      removes those. The rollback records the macro's input and output signature
      so re-creating restores the contract; the BODY is not restored and the
      result says so. Params: assetPath (or path), macroName
  blueprint.read_enum:
    class_path: ue-mcp.builtin/blueprint.read_enum
    group: blueprint
    description: >-
      Read a UserDefinedEnum's whole definition: description, the bitflags
      switch, and every enumerator with its index, authored short name, editable
      display name, numeric value and tooltip. asset(list_enum_values) reports
      the first four columns; this adds the tooltips, the bitflags state and the
      description, which nothing else could read. Works on native UEnums too,
      reporting isUserDefined=false. Returns objectPath, because EnumDescription
      is an ordinary UPROPERTY and belongs to asset(set_property) rather than to
      a setter here. Params: assetPath (or path)
  blueprint.reorder_enum_values:
    class_path: ue-mcp.builtin/blueprint.reorder_enum_values
    group: blueprint
    description: >-
      Reorder a UserDefinedEnum's enumerators. Enumerator order is authored data
      with no property behind it, so nothing else could change it. order is the
      COMPLETE list by display name, authored name or index; a partial list, an
      unknown entry or a repeat is refused before anything moves, naming the
      valid values. Idempotent: an order that already holds reports unchanged.
      The rollback replays the previous order by authored name, which survives
      further reordering. Params: assetPath (or path), order
  blueprint.set_enum_metadata:
    class_path: ue-mcp.builtin/blueprint.set_enum_metadata
    group: blueprint
    description: >-
      Set a UserDefinedEnum's bitflags switch and its per-enumerator tooltips.
      The bitflags state is a class metadata key and a tooltip is package
      metadata keyed by enumerator index, so neither is reachable by a property
      write. entries is [{name or index, tooltip}] and every entry is resolved
      before the first write, so a bad entry at position nine leaves the first
      eight untouched. Idempotent, with a rollback carrying the previous
      bitflags state and the previous tooltip text keyed by authored name. The
      enum's own description is a UPROPERTY: use asset(set_property) with
      propertyName='EnumDescription'. Params: assetPath (or path), bitflags?,
      entries?
  blueprint.read_struct:
    class_path: ue-mcp.builtin/blueprint.read_struct
    group: blueprint
    description: >-
      Read a UserDefinedStruct's whole definition: compile status, validity
      including the recursion check, the struct tooltip, and per field the
      display name, GUID, type, default value, tooltip, editableOnInstance,
      saveGame, multiLineText, widget3D and metadata. asset(list_struct_fields)
      reports name, GUID and a display label; everything else here had no
      reader. Two fields earn their place on their own. type is a
      round-trippable spec (int[], set<Name>, map<Name,int>,
      struct:/Script/CoreUObject.Vector) that can be handed back to a write.
      propertyName is the generated FProperty name (<name>_<n>_<guid>), which is
      what a DataTable row and any exported default actually carry, and it is a
      different thing from the display name; nameMatchesProperty reports whether
      the two still agree, so after a rename you can see whether the storage key
      still carries the old spelling. That divergence is the visible cost of a
      GUID-preserving rename, which is what lets existing pins and rows survive
      one at all. Params: assetPath (or path)
  blueprint.set_struct_field_default:
    class_path: ue-mcp.builtin/blueprint.set_struct_field_default
    group: blueprint
    description: >-
      Set a UserDefinedStruct member's default value. A member is an
      FStructVariableDescription inside the struct's editor data, not a
      UPROPERTY on the asset, so asset(set_property) cannot reach it; the engine
      call also parses the text against the member's real property and
      recompiles the struct so every dependent default is repaired, which a raw
      write would skip. defaultValue is Unreal export text ('5', 'true',
      '(X=1.000000,Y=2.000000,Z=0.000000)'); an empty string clears it. Resolve
      the field by fieldName (display or internal name) or fieldGuid.
      Idempotent, with a rollback carrying the previous value. Params: assetPath
      (or path), defaultValue, fieldName?, fieldGuid?
  blueprint.reorder_struct_fields:
    class_path: ue-mcp.builtin/blueprint.reorder_struct_fields
    group: blueprint
    description: >-
      Reorder a UserDefinedStruct's members. Member order decides the
      details-panel layout and the DataTable column order and is authored data
      with no property behind it. order is the COMPLETE list by display name,
      internal name or GUID; a partial list, an unknown entry or a repeat is
      refused before anything moves. Idempotent. A move the engine refuses
      mid-sequence is reported with complete=false and the count that landed,
      never as a plain success, and the rollback restores the original order by
      GUID. Params: assetPath (or path), order
  blueprint.edit_struct_metadata:
    class_path: ue-mcp.builtin/blueprint.edit_struct_metadata
    group: blueprint
    description: >-
      Set a UserDefinedStruct's tooltip and its per-member tooltip,
      editableOnInstance, saveGame, multiLineText, widget3D and arbitrary
      metadata, in one batched call. All of these live in the struct's editor
      data rather than as UPROPERTYs, and each has an engine setter that
      recompiles the struct. fields is [{fieldName or fieldGuid, tooltip?,
      editableOnInstance?, saveGame?, multiLineText?, widget3D?, metadata?}].
      Every member is resolved and every type-gated switch is checked
      (multiLineText needs a text-like member, widget3D a Vector or Transform)
      BEFORE the first write, so a refusal on entry nine leaves entries one
      through eight untouched. Idempotent; the rollback restores every value by
      GUID, and states the one thing it cannot: a metadata key that did not
      exist before is restored to an empty string rather than removed. Params:
      assetPath (or path), tooltip?, fields?
  blueprint.epic_add_component_bound_event:
    class_path: ue-mcp.builtin/blueprint.epic_add_component_bound_event
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Creates a
      component bound event node in the event graph. Params: component,
      event_name, graph
  blueprint.epic_add_event:
    class_path: ue-mcp.builtin/blueprint.epic_add_event
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Adds an event node
      to the Blueprint's event graph. If event_name matches an inherited
      overridable event, the new node is an override of that event. Otherwise a
      new custom event with the given name is created. Idempotent - if an event
      node with that name already exists, that node is returned. Params:
      blueprint, event_name, position?
  blueprint.epic_add_event_dispatcher:
    class_path: ue-mcp.builtin/blueprint.epic_add_event_dispatcher
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Adds an event
      dispatcher to a Blueprint. Params: blueprint, name
  blueprint.epic_add_function_graph:
    class_path: ue-mcp.builtin/blueprint.epic_add_function_graph
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Adds a function
      graph to the Blueprint. If graph_name matches an inherited overridable
      function, the new graph is a function-graph override of that function.
      Idempotent - if a graph with that name already exists, that graph is
      returned. Params: blueprint, graph_name
  blueprint.epic_add_function_param:
    class_path: ue-mcp.builtin/blueprint.epic_add_function_param
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Adds an input or
      output to a function or event dispatcher Params: graph, param_name,
      param_type, input_param, container_type?
  blueprint.epic_add_node_pin:
    class_path: ue-mcp.builtin/blueprint.epic_add_node_pin
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Adds a pin to a
      node that supports dynamic pin addition. Works for Switch nodes (adds one
      case pin), Sequence nodes (adds one Then output), commutative binary
      operators like Add/Multiply (adds one input), Make Array nodes, etc.
      Params: node
  blueprint.epic_add_object_function_param:
    class_path: ue-mcp.builtin/blueprint.epic_add_object_function_param
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Adds an object
      reference input or output to a function or event dispatcher. Params:
      graph, param_name, object_class, input_param, container_type?
  blueprint.epic_add_object_variable:
    class_path: ue-mcp.builtin/blueprint.epic_add_object_variable
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Adds a member or
      local variable that holds an object reference to a Blueprint. Params:
      blueprint, name, object_class, graph?, container_type?
  blueprint.epic_add_struct_function_param:
    class_path: ue-mcp.builtin/blueprint.epic_add_struct_function_param
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Adds a struct
      input or output to a function or event dispatcher. Params: graph,
      param_name, struct_type, input_param, container_type?
  blueprint.epic_add_struct_variable:
    class_path: ue-mcp.builtin/blueprint.epic_add_struct_variable
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Adds a member or
      local variable of a struct type to a Blueprint. Use this to add variables
      of any UStruct type, including custom structs and engine structs not in
      the basic list supported by add_variable (e.g. HitResult, GameplayTag).
      Params: blueprint, name, struct_type, graph?, container_type?
  blueprint.epic_add_variable:
    class_path: ue-mcp.builtin/blueprint.epic_add_variable
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Adds a member or
      local variable to a Blueprint. Supported type names: Primitives: 'bool',
      'int', 'float', 'byte', 'string', 'name', 'text' Structs: 'Vector',
      'Rotator', 'Transform', 'Vector2D', 'LinearColor' Params: blueprint, name,
      type_name, graph?, container_type?
  blueprint.epic_arrange_nodes:
    class_path: ue-mcp.builtin/blueprint.epic_arrange_nodes
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Arranges a list of
      nodes in a readable left-to-right layout. Organizes nodes into columns
      based on data/execution flow, with producer nodes to the left of the nodes
      they feed into. Call this after building a graph to avoid nodes
      overlapping. Connections to nodes outside the list are used as anchors so
      the arranged nodes integrate cleanly with the rest of the graph. Params:
      nodes
  blueprint.epic_break_pins:
    class_path: ue-mcp.builtin/blueprint.epic_break_pins
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Breaks the
      connection between two pins. Params: output_pin, input_pin
  blueprint.epic_compile_blueprint:
    class_path: ue-mcp.builtin/blueprint.epic_compile_blueprint
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Compiles the given
      Blueprint. Blueprints should be compiled after all graph modifications are
      complete. Params: blueprint, warnings_as_errors?
  blueprint.epic_connect_pins:
    class_path: ue-mcp.builtin/blueprint.epic_connect_pins
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Makes a connection
      between source (output) and dest (input) pins. Params: output_pin,
      input_pin
  blueprint.epic_create:
    class_path: ue-mcp.builtin/blueprint.epic_create
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Creates a new
      Blueprint asset in the project. Params: folder_path, asset_name,
      asset_type
  blueprint.epic_create_node:
    class_path: ue-mcp.builtin/blueprint.epic_create_node
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Adds a new node to
      the graph. Params: graph, type_id, pos, declaring_class?
  blueprint.epic_delete_node:
    class_path: ue-mcp.builtin/blueprint.epic_delete_node
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Deletes the node
      from its graph. Params: node
  blueprint.epic_find_node_categories:
    class_path: ue-mcp.builtin/blueprint.epic_find_node_categories
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Retrieves a list
      of available node categories in a Blueprint graph, optionally filtered by
      compatible input and/or output pin types Params: graph, category_filter,
      context_pins
  blueprint.epic_find_node_types:
    class_path: ue-mcp.builtin/blueprint.epic_find_node_types
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Finds node types
      that can be created in a particular graph meeting the search criteria.
      Params: graph, type_id_filter, context_pins
  blueprint.epic_find_nodes:
    class_path: ue-mcp.builtin/blueprint.epic_find_nodes
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Finds nodes in a
      graph by title, class, and/or execution role. All filters are optional and
      ANDed together. Useful for locating specific event chains in large graphs
      like EventGraph before reading them with get_connected_subgraph. Params:
      graph, title, node_class?, entry_points_only?
  blueprint.epic_get_connected_subgraph:
    class_path: ue-mcp.builtin/blueprint.epic_get_connected_subgraph
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Returns detailed
      information for all nodes connected to the given node. Use this alongside
      find_nodes to read a single event chain from a large graph (like Event
      Graph) without reading the entire graph. Params: node
  blueprint.epic_get_create_event_function:
    class_path: ue-mcp.builtin/blueprint.epic_get_create_event_function
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Returns the
      function currently bound to a Create Event node. Params: node
  blueprint.epic_get_default_object:
    class_path: ue-mcp.builtin/blueprint.epic_get_default_object
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Returns the Class
      Default Object (CDO) for a Blueprint's. ObjectTools list/set/get property
      will get the CDO automatically, so this should primarily be used before
      calling tools that want to operate on the object inside the blueprint
      (like ActorTools). Params: blueprint
  blueprint.epic_get_graph:
    class_path: ue-mcp.builtin/blueprint.epic_get_graph
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Retrieves a
      specific graph from a Blueprint asset by name. Params: blueprint,
      graph_name
  blueprint.epic_get_graph_dsl_docs:
    class_path: ue-mcp.builtin/blueprint.epic_get_graph_dsl_docs
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Returns the full
      syntax reference for write_graph_dsl. Call this before using
      write_graph_dsl for the first time. Params: none
  blueprint.epic_get_node_infos:
    class_path: ue-mcp.builtin/blueprint.epic_get_node_infos
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Retrieves detailed
      information for a list of Blueprint graph nodes. Params: nodes
  blueprint.epic_get_node_type_pins:
    class_path: ue-mcp.builtin/blueprint.epic_get_node_type_pins
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Returns the pin
      names and types for a node type. Params: graph, type_id
  blueprint.epic_get_parent:
    class_path: ue-mcp.builtin/blueprint.epic_get_parent
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Returns the parent
      class of a Blueprint. Params: blueprint
  blueprint.epic_get_pin_value:
    class_path: ue-mcp.builtin/blueprint.epic_get_pin_value
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Gets the value of
      a Blueprint graph pin. Params: pin
  blueprint.epic_get_variable_category:
    class_path: ue-mcp.builtin/blueprint.epic_get_variable_category
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Gets the
      user-defined category of a Blueprint member variable. Categories group
      variables in the My Blueprint panel. Variables with no explicit category
      default to the Blueprint's name in the UI. Params: blueprint,
      variable_name
  blueprint.epic_get_variable_replication:
    class_path: ue-mcp.builtin/blueprint.epic_get_variable_replication
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Gets the
      replication mode of a Blueprint member variable. Params: blueprint,
      variable_name
  blueprint.epic_list_compatible_event_functions:
    class_path: ue-mcp.builtin/blueprint.epic_list_compatible_event_functions
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Lists functions
      that can be bound to a Create Event node. Params: node
  blueprint.epic_list_component_events:
    class_path: ue-mcp.builtin/blueprint.epic_list_component_events
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Lists the bindable
      delegate events available on a component. Params: component
  blueprint.epic_list_event_dispatchers:
    class_path: ue-mcp.builtin/blueprint.epic_list_event_dispatchers
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Lists all event
      dispatchers defined on a Blueprint. Params: blueprint
  blueprint.epic_list_events:
    class_path: ue-mcp.builtin/blueprint.epic_list_events
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Lists all events
      visible on the Blueprint - locally defined custom events plus inheritable
      events from the parent class chain and implemented interfaces. Params:
      blueprint
  blueprint.epic_list_functions:
    class_path: ue-mcp.builtin/blueprint.epic_list_functions
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Lists all
      functions visible on the Blueprint - locally defined plus inheritable ones
      from the parent class chain and implemented interfaces. Params: blueprint
  blueprint.epic_list_graphs:
    class_path: ue-mcp.builtin/blueprint.epic_list_graphs
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Lists all graphs
      in the Blueprint. Params: blueprint
  blueprint.epic_list_variables:
    class_path: ue-mcp.builtin/blueprint.epic_list_variables
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Lists member or
      local variables defined on a Blueprint. Params: blueprint, graph?
  blueprint.epic_read_graph_dsl:
    class_path: ue-mcp.builtin/blueprint.epic_read_graph_dsl
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Reads a Blueprint
      graph and returns a DSL script. The returned code uses the same syntax
      that write_graph_dsl accepts and can be edited and passed back to
      write_graph_dsl to modify the graph. Call get_graph_dsl_docs() for the
      full syntax reference. Params: graph
  blueprint.epic_remove_function_graph:
    class_path: ue-mcp.builtin/blueprint.epic_remove_function_graph
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Removes a function
      graph or event dispatcher from the Blueprint. Params: blueprint,
      graph_name
  blueprint.epic_remove_function_param:
    class_path: ue-mcp.builtin/blueprint.epic_remove_function_param
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Removes an input
      or output from a function or event dispatcher. Params: graph, param_name,
      input_param
  blueprint.epic_remove_node_pin:
    class_path: ue-mcp.builtin/blueprint.epic_remove_node_pin
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Removes a specific
      pin from a node that supports dynamic pin removal. Works for Switch nodes
      (removes one case pin), Sequence nodes (removes one Then output),
      commutative binary operators like Add/Multiply (removes one input), Make
      Array nodes, etc. Params: node, pin
  blueprint.epic_remove_variable:
    class_path: ue-mcp.builtin/blueprint.epic_remove_variable
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Removes a member
      or local variable from a Blueprint. Params: blueprint, name, graph?
  blueprint.epic_retarget_node_class:
    class_path: ue-mcp.builtin/blueprint.epic_retarget_node_class
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Replaces a node's
      baked-in class reference from old_class to new_class in place. If the
      node's current class reference matches old_class it is replaced with
      new_class and the node is reconstructed so its pins reflect the new type.
      If the node already references new_class the call is a no-op. When a
      Blueprint is duplicated, nodes in the copied graph retain class references
      pointing to the original Blueprint. Calling this on each node with the
      original and duplicate classes retargets them without manual
      delete-recreate-rewire cycles. Handles cast, function call, event, and
      multicast delegate nodes. The Blueprint must be compiled after all
      retargeting is complete. Params: node, old_class, new_class
  blueprint.epic_set_create_event_function:
    class_path: ue-mcp.builtin/blueprint.epic_set_create_event_function
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Binds a function
      to a Create Event node. Use list_compatible_event_functions to find valid
      function names. Params: node, function_name
  blueprint.epic_set_node_position:
    class_path: ue-mcp.builtin/blueprint.epic_set_node_position
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Sets a new
      position for the node. Params: node, pos
  blueprint.epic_set_parent:
    class_path: ue-mcp.builtin/blueprint.epic_set_parent
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Reparents a
      Blueprint to a new parent class. The Blueprint must be recompiled after
      reparenting. Params: blueprint, parent_class
  blueprint.epic_set_pin_value:
    class_path: ue-mcp.builtin/blueprint.epic_set_pin_value
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Sets the value of
      a Blueprint graph pin. Params: pin, value
  blueprint.epic_set_variable_category:
    class_path: ue-mcp.builtin/blueprint.epic_set_variable_category
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Sets the
      user-defined category on a Blueprint member variable. Categories group
      variables in the My Blueprint panel. Pass an empty string to reset to the
      default (the Blueprint's name). Params: blueprint, variable_name, category
  blueprint.epic_set_variable_instance_editable:
    class_path: ue-mcp.builtin/blueprint.epic_set_variable_instance_editable
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Sets whether a
      member variable is editable per-instance on actors placed in the level.
      Params: blueprint, variable_name, instance_editable
  blueprint.epic_set_variable_replication:
    class_path: ue-mcp.builtin/blueprint.epic_set_variable_replication
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Sets the
      replication mode on a Blueprint member variable. RepNotify will
      automatically create an OnRep_ function on the Blueprint if one does not
      already exist. Params: blueprint, variable_name, replication
  blueprint.epic_write_graph_dsl:
    class_path: ue-mcp.builtin/blueprint.epic_write_graph_dsl
    group: blueprint
    description: >-
      [Epic editor_toolset.toolsets.blueprint.BlueprintTools] Populates a
      Blueprint graph with nodes from a DSL script and compiles the Blueprint.
      Call get_graph_dsl_docs() for the full syntax reference and examples.
      Params: graph, code
  level.get_outliner:
    class_path: ue-mcp.builtin/level.get_outliner
    group: level
    description: >-
      List actors (each row includes editorHidden - hidden in the viewport but
      still rendering in game, and folderPath). classFilter is a case-sensitive
      SUBSTRING over the class name by default; pass exactClass=true to require
      the exact class instead. folderPath matches one World Outliner folder
      exactly and folderPathPrefix matches that folder and everything nested
      under it, so narrowing a folder to a single class no longer needs a
      get_actor_details round trip per entry (#911) (#717). Params:
      classFilter?, exactClass?, nameFilter?, folderPath?, folderPathPrefix?,
      editorHidden?, includeStreaming?, world?, pieInstance?, cursor?, limit?
  level.set_editor_visibility:
    class_path: ue-mcp.builtin/level.set_editor_visibility
    group: level
    description: >-
      Bulk set editor-only visibility (temporarily-hidden-in-editor) on actors.
      Targets actorLabels[] or all=true (#717). Params: hidden, actorLabels?,
      all?
  level.place_actor:
    class_path: ue-mcp.builtin/level.place_actor
    group: level
    description: >-
      Spawn actor. Pass world:pie to spawn into the running PIE world (#585).
      Params: actorClass, label?, onConflict?, location?, rotation?, scale?,
      staticMesh?, material?, world?, pieInstance?
  level.delete_actor:
    class_path: ue-mcp.builtin/level.delete_actor
    group: level
    description: >-
      Remove actor. A label matching several actors is refused with the
      candidates rather than deleting one of them (#983). Params: actorLabel?,
      actorPath?
  level.get_actor_details:
    class_path: ue-mcp.builtin/level.get_actor_details
    group: level
    description: >-
      Inspect actor. With includeProperties=true, a UPROPERTY declared as a
      C-style FIXED ARRAY (int32 Foo[3], one FProperty with ArrayDim 3) comes
      back as a JSON ARRAY of its elements plus arrayDim, instead of element 0
      presented as the whole value. That mattered on RecastNavMesh
      NavMeshResolutionParams, whose three entries are the Low, Default and High
      generation tiers, and where reporting only Low sent a user tuning cell
      sizes against numbers the engine was not using (#927). Params:
      actorLabel?, actorPath?, includeProperties?, propertyName?, world?,
      pieInstance?
  level.move_actor:
    class_path: ue-mcp.builtin/level.move_actor
    group: level
    description: >-
      Transform actor. Pass world:pie to move a live PIE actor (resolves
      labels/names from get_outliner {world:pie}) (#586). Params: actorLabel?,
      actorPath?, location?, rotation?, scale?, world?, pieInstance?
  level.aim_actor_at:
    class_path: ue-mcp.builtin/level.aim_actor_at
    group: level
    description: >-
      Rotate an actor so its forward (+X) points at a target (#566/#983).
      Params: actorLabel?, actorPath?, targetPoint?, targetActor?,
      targetActorPath?, roll?, world?, pieInstance?
  level.nav_project_point:
    class_path: ue-mcp.builtin/level.nav_project_point
    group: level
    description: >-
      Project a world point onto the navmesh. Returns onNavMesh +
      projectedLocation (#585). Params: point, extent?, world?, pieInstance?
  level.select:
    class_path: ue-mcp.builtin/level.select
    group: level
    description: >-
      Select actors. A label naming several actors selects all of them;
      selectedPaths reports exactly which (#983). Params: at least one of
      actorLabels/actorPaths
  level.get_selected:
    class_path: ue-mcp.builtin/level.get_selected
    group: level
    description: 'Get selection. Params: none'
  level.add_component:
    class_path: ue-mcp.builtin/level.add_component
    group: level
    description: >-
      Add component to actor. Params: actorLabel?, actorPath?, componentClass,
      componentName, onConflict?
  level.remove_component:
    class_path: ue-mcp.builtin/level.remove_component
    group: level
    description: >-
      Remove instance component from a level actor by name. Idempotent: returns
      alreadyDeleted=true if no matching component exists (#426). Params:
      actorLabel?, actorPath?, componentName
  level.set_component_property:
    class_path: ue-mcp.builtin/level.set_component_property
    group: level
    description: >-
      Set component prop. A C-style FIXED ARRAY element is addressed by index in
      the dotted path ('Foo[2].Bar'); without an index every write lands on
      element 0 (#927). Pass value=null to clear a
      TObjectPtr/SoftObject/WeakObject/UClass/Interface reference (#420).
      Resolves inherited/SCS components on placed Blueprint instances
      case-insensitively, and refreshes the scene transform after
      RelativeLocation/RelativeRotation/RelativeScale3D writes (#539). Pass
      world='pie' (with optional pieInstance) to write to a LIVE PIE component
      rather than the editor one (#763). Params: actorLabel?, actorPath?,
      componentName?, propertyName, value, world?, pieInstance?
  level.nudge_component:
    class_path: ue-mcp.builtin/level.nudge_component
    group: level
    description: >-
      Adjust an exact named SceneComponent using frame-relative translation,
      quaternion rotation, or uniform relative scale. frame=parent uses the
      parent COMPONENT transform; the socket is reported separately.
      axisRotation and viewRotation are mutually exclusive. viewRotation is
      observer-relative to the selected frame, not a player camera:
      clockwise/counterclockwise is resolved using Unreal screen basis and
      returned as signed degrees. dryRun=false by default; dryRun returns
      current spatial inspection plus requested world location/rotation and
      relative scale without a transaction, modification, setter, dirtiness, or
      rollback. The rollback it emits is a level(restore_component_transform)
      call. Params: actorLabel OR actorPath, componentName, frame?,
      translationDelta?, axisRotation?, viewRotation?, scaleMultiplier?,
      dryRun?, world?, pieInstance?
  level.restore_component_transform:
    class_path: ue-mcp.builtin/level.restore_component_transform
    group: level
    description: >-
      Put an exact named SceneComponent back to a relative transform: the
      relativeTransform nudge_component records in its rollback, so a nudge can
      be undone by hand as well as by the flow runner. The quaternion is what is
      applied. A component already at that transform is reported unchanged.
      Params: actorLabel OR actorPath, componentName, relativeTransform, world?,
      pieInstance?
  level.get_component_details:
    class_path: ue-mcp.builtin/level.get_component_details
    group: level
    description: >-
      Read a placed actor's component transforms. With componentName returns
      that component's relative+world location/rotation/scale, class, and attach
      parent; without it lists every component. With includeValues=true also
      dumps arbitrary UPROPERTY values (custom fields, CharacterMovement
      MaxWalkSpeed, etc.); world='pie' reads the live PIE instance (#539/#584).
      Params: actorLabel?, actorPath?, componentName?, includeValues?,
      propertyNames?, world?, pieInstance?
  level.get_current:
    class_path: ue-mcp.builtin/level.get_current
    group: level
    description: 'Get current level name and path. Params: none'
  level.load:
    class_path: ue-mcp.builtin/level.load
    group: level
    description: 'Load level. Params: levelPath'
  level.clear_level_script:
    class_path: ue-mcp.builtin/level.clear_level_script
    group: level
    description: >-
      Preview or remove every node and member variable from the currently loaded
      persistent level's Level Blueprint. Defaults to dryRun=true. Actors are
      untouched; save=true saves only the current level after a successful
      compile. Params: dryRun?, save?
  level.save:
    class_path: ue-mcp.builtin/level.save
    group: level
    description: >-
      Save the level currently being edited, and say what happened to each
      package. Takes the same package path editor(save_dirty) uses, so the two
      can no longer disagree about whether one package was written: the old
      action returned a bare {success:false, error:'Failed to save current
      level'} on a map that save_dirty then wrote seconds later, and a false
      failure makes an agent redo work that was already on disk (#964). On a
      World Partition or one-file-per-actor map the actors live in their own
      packages, so those are saved too and each is reported separately. A
      package that was already clean is reported as skipped, not as a failure.
      On failure the error names the package, the resolved file, whether that
      file exists and is read-only, the engine's ESavePackageResult and the
      error/warning lines the save itself emitted. Saving during PIE is refused
      by name rather than failing silently. With commitDeletes=true it goes
      through the editor's own dirty-package save instead, which deletes the
      external package of a deleted World Partition actor (a direct save fails
      on it with 'SavePackage returned false') and saves every other dirty map
      and content package, reporting written, deleted and stillDirty per package
      (#1156). Params: force?, includeExternalActors?, commitDeletes?
  level.list:
    class_path: ue-mcp.builtin/level.list
    group: level
    description: >-
      List levels: the persistent level first, then every streaming level with
      its loaded and visible state, in the world's own streaming order. Params:
      cursor?, limit?
  level.create:
    class_path: ue-mcp.builtin/level.create
    group: level
    description: >-
      Create a new level at a path and open it. levelPath is validated before
      the engine is asked: an omitted or malformed path is refused outright,
      because NewLevel("") logs an engine error and lands the editor on an
      untitled map that cannot then be saved (#833). Params: levelPath,
      templateLevel?, onConflict?
  level.spawn_volume:
    class_path: ue-mcp.builtin/level.spawn_volume
    group: level
    description: >-
      Place volume. Params: volumeType, onConflict?, label?, location?, extent?,
      graphPath?
  level.list_volumes:
    class_path: ue-mcp.builtin/level.list_volumes
    group: level
    description: >-
      List volumes, sorted by actor path so a page boundary is stable. Params:
      volumeType?, cursor?, limit?
  level.set_volume_properties:
    class_path: ue-mcp.builtin/level.set_volume_properties
    group: level
    description: 'Edit volume. Params: actorLabel?, actorPath?, properties'
  level.spawn_light:
    class_path: ue-mcp.builtin/level.spawn_light
    group: level
    description: >-
      Place light (#331/#310). Params: lightType, onConflict?, label?,
      location?, rotation?, intensity?, color?, mobility?, attenuationRadius?
  level.set_light_properties:
    class_path: ue-mcp.builtin/level.set_light_properties
    group: level
    description: >-
      Edit a light OR SkyLight (intensity/color now work on SkyLight too, #608).
      Params: actorLabel?, actorPath?, intensity?, color?, rotation?, mobility?,
      recaptureSky?, volumetricScatteringIntensity?, sourceRadius?,
      innerConeAngle?, outerConeAngle?
  level.set_fog_properties:
    class_path: ue-mcp.builtin/level.set_fog_properties
    group: level
    description: >-
      Edit ExponentialHeightFog incl. volumetric fog (#608). Params:
      actorLabel?, actorPath?, world?, pieInstance?, fogDensity?,
      fogHeightFalloff?, startDistance?, fogInscatteringColor? (or color),
      enableVolumetricFog?, volumetricFogScatteringDistribution?,
      volumetricFogExtinctionScale?, volumetricFogDistance?,
      volumetricFogAlbedo?
  level.get_actors_by_class:
    class_path: ue-mcp.builtin/level.get_actors_by_class
    group: level
    description: >-
      List actors by class. Matches Blueprint subclasses of a native base via
      IsChildOf when className resolves to a UClass (short name, /Script path,
      or BP class path), else falls back to name-substring. Each actor includes
      location/rotation/scale, live when world=pie. labelPrefix narrows to
      actors whose editor label starts with it (case-sensitive), and with it
      className may be omitted to match every class (#1113) (#675). Params:
      className?, labelPrefix?, world?, pieInstance?, matchSubclasses?,
      includeTransforms?
  level.get_actors_by_component_class:
    class_path: ue-mcp.builtin/level.get_actors_by_component_class
    group: level
    description: >-
      List actors that own a component of a given class (exact or substring
      match). Returns each actor plus its matchedComponents. For a whole-map
      question use level(query_components), which filters and counts in the
      editor instead of returning every candidate (#582). Params: componentClass
      (or className), world?, pieInstance?
  level.query_components:
    class_path: ue-mcp.builtin/level.query_components
    group: level
    description: >-
      Ask one level-wide question about components and get the answer, not the
      candidates. Selection, projection, predicates, grouping and counts all
      evaluate in the editor, so a 4,000 actor map costs one call instead of
      thousands. Computed (not raw) values: shadow.effectiveCastShadow crosses
      CastShadow with visibility, bHiddenInGame, owner hidden and
      bCastHiddenShadow, so a hidden debug marker with CastShadow=true is
      correctly NOT a shadow caster; every mobility and collision enum comes
      back as a clean name (Movable, QueryAndPhysics), never as
      EComponentMobility.MOVABLE; navigation.effectiveNavRelevant crosses
      bCanEverAffectNavigation with collision and custom navigable geometry.
      Never writes, and reports dirtiedPackages so you can see that. Field
      groups for 'fields' and for dot paths: transform, bounds, localBounds
      (unscaled, includes UBoxComponent BoxExtent), shadow, nanite, navigation,
      tick, materials (per slot: effective path, componentOverride vs
      meshDefault, slot name/index, isNull, isWorldGrid), mesh (adds
      instanceCount + hierarchical for an ISM/HISM, #986), decal, health
      (roll-up incl. suspect). A dot path used in where/groupBy/countBy turns
      its own group on. groupBy and countBy COUNT COMPONENTS, not instances: one
      HISM holding 5,000 instances counts as 1, so for per-mesh placement totals
      use level(summarize_static_mesh_usage), which sums instances and counts
      distinct actors. duplicateTransformTolerance reports
      duplicateTransformGroups. levelPath temporarily opens another map: it
      refuses if anything is dirty and restores the map that was open
      (#910/#943/#912). Params: componentClass?, actorClass?, matchSubclasses?,
      componentNameContains?, actorLabelPrefix?, actorLabelContains?, actorTag?,
      folderPath?, folderPathPrefix?, fields?, propertyNames?, where?,
      whereMode?, suspectOnly?, groupBy?, countBy?, sampleLimit?, countOnly?,
      limit?, startIndex?, duplicateTransformTolerance?, levelPath?, world?,
      pieInstance?
  level.count_actors_by_class:
    class_path: ue-mcp.builtin/level.count_actors_by_class
    group: level
    description: >-
      Histogram of actor classes in the level (sorted desc) (#146). Params:
      world?, pieInstance?, topN?
  level.get_runtime_virtual_texture_summary:
    class_path: ue-mcp.builtin/level.get_runtime_virtual_texture_summary
    group: level
    description: >-
      List RuntimeVirtualTextureVolume actors + their bound VirtualTexture
      assets (#150). Params: world?, pieInstance?
  level.set_water_body_property:
    class_path: ue-mcp.builtin/level.set_water_body_property
    group: level
    description: >-
      Set a property on an actor's WaterBodyComponent (ShapeDilation,
      WaterLevel, etc.). Requires Water plugin. For spline edits use
      level(set_spline_points) (#151). A deprecated property
      (TessellatedWaterMeshExtent in 5.8) is not serialized: the write comes
      back with a warning, and TessellatedWaterMeshExtent, which is not on the
      body at all, is refused with the supported route,
      level(rebuild_water_zone) (#1156). Params: actorLabel?, actorPath?,
      propertyName, value
  level.build_lighting:
    class_path: ue-mcp.builtin/level.build_lighting
    group: level
    description: 'Build lights. Params: quality?'
  level.rebuild_water_zone:
    class_path: ue-mcp.builtin/level.rebuild_water_zone
    group: level
    description: >-
      Rebuild a WaterZone's water mesh and water info, repeating until the
      WaterMesh QuadTreeResolution stops changing. The grid is sized from the
      extent seen on the previous rebuild, so a single rebuild after a
      ZoneExtent or TileSize change reports a stale grid. Optionally sets
      zoneExtent and/or the WaterMesh tileSize first, which is the supported
      replacement for the deprecated TessellatedWaterMeshExtent. Returns
      zoneExtent, tileSize, quadTreeResolution, passes and stable per zone.
      Without actorLabel/actorPath every zone in the world is rebuilt. Requires
      Water plugin (#1156). Params: actorLabel?, actorPath?, zoneExtent?,
      tileSize?, maxPasses?
  level.get_water_state:
    class_path: ue-mcp.builtin/level.get_water_state
    group: level
    description: >-
      One structured read of every WaterZone and WaterBody. Zones: ZoneExtent,
      RenderTargetResolution, OverlapPriority, local tessellation settings,
      OwnedWaterBodies, and waterMesh TileSize, QuadTreeResolution,
      TessellationFactor, LODScale and the far-distance mesh settings. Bodies:
      OceanExtents, CollisionExtents, WaterZoneOverride, OwningWaterZone,
      bAffectsLandscape, ShapeDilation and every water material. Properties
      absent on the running engine are omitted, and deprecated fields such as
      TessellatedWaterMeshExtent are flagged under deprecatedProperties.
      Requires Water plugin (#1156). Params: actorLabel?, actorPath?
  level.get_spline_info:
    class_path: ue-mcp.builtin/level.get_spline_info
    group: level
    description: >-
      Read a spline component's points, closedLoop, length, and per-point
      tangents/types. Works in editor or PIE (#553). componentName picks a
      specific (custom) spline; projectPoint returns the closest location,
      inputKey, distanceAlongSpline, distanceToSpline, and tangent (#555).
      Params: actorLabel OR actorPath, componentName?, projectPoint?, world?,
      pieInstance?
  level.set_spline_points:
    class_path: ue-mcp.builtin/level.set_spline_points
    group: level
    description: >-
      Set spline points. A point is either a bare {x,y,z} or the typed form,
      which keeps what a position alone loses: pointType, arriveTangent,
      leaveTangent, rotation and scale. The whole batch is validated before any
      existing geometry is cleared, so a malformed request leaves the spline as
      it was, and the edit goes through an editor transaction so Undo reaches
      it. componentName picks one spline on an actor carrying several (#1029).
      Params: actorLabel OR actorPath, points, componentName?, closedLoop?,
      loopPosition?, loopPositionOverride?
  level.set_actor_material:
    class_path: ue-mcp.builtin/level.set_actor_material
    group: level
    description: >-
      Set material on actor. Params: actorLabel?, actorPath?, materialPath,
      slotIndex?
  level.get_world_settings:
    class_path: ue-mcp.builtin/level.get_world_settings
    group: level
    description: 'Read world settings (GameMode, KillZ, gravity, etc.). Params: none'
  level.set_world_settings:
    class_path: ue-mcp.builtin/level.set_world_settings
    group: level
    description: >-
      Set world settings. Params: defaultGameMode?, killZ?, globalGravityZ?,
      enableWorldBoundsChecks?
  level.get_actor_bounds:
    class_path: ue-mcp.builtin/level.get_actor_bounds
    group: level
    description: >-
      Get actor AABB. Returns origin + extent (#188). Params: actorLabel?,
      actorPath?, onlyColliding?, world?, pieInstance?
  level.get_component_tree:
    class_path: ue-mcp.builtin/level.get_component_tree
    group: level
    description: >-
      Deep component-tree dump for an actor. Returns per-component: name, class,
      attachParent, attachSocket, mobility, visibility, relative+world
      transforms, tags. For PrimitiveComponents adds
      collisionProfile/collisionEnabled/bounds/castShadow. For
      StaticMeshComponent adds staticMesh + materials[], and for an ISM/HISM
      also instanceCount plus instanced{hierarchical,numCustomDataFloats} - the
      number you need before deciding whether to touch an ISM at all, since a
      component holding three instances and one holding three hundred thousand
      were otherwise the same row (#986). For SkeletalMeshComponent adds
      skeletalMesh + skeleton + materials[]. For NiagaraComponent adds
      niagara{asset,active,visible} and for AudioComponent audio{sound,playing}
      - runtime FX state in PIE (#581) (#240/#241/#302/#320/#370/#353/#581).
      Params: actorLabel?, actorPath?, includeProperties?, componentClass?,
      componentName?, world?, pieInstance?
  level.get_relative_transform:
    class_path: ue-mcp.builtin/level.get_relative_transform
    group: level
    description: >-
      Compute target's transform in reference's local space
      (location/rotation/scale). Common dungeon/calibration workflow
      (#386/#387/#983). Params: targetLabel? (or target), targetPath?,
      referenceLabel? (or reference), referencePath?, world?, pieInstance?
  level.resolve_actor:
    class_path: ue-mcp.builtin/level.resolve_actor
    group: level
    description: >-
      Resolve internal/runtime actor name to editor label. internalName is e.g.
      StaticMeshActor_141. Returns actorLabel, actorPath, className, location
      (#178). Params: internalName
  level.set_actor_property:
    class_path: ue-mcp.builtin/level.set_actor_property
    group: level
    description: >-
      Set per-instance UPROPERTY on a level actor. 'WorldSettings' as the
      actorLabel targets the world settings actor. propertyName takes dotted
      paths like 'Foo.Bar', and a C-style FIXED ARRAY element is addressed by
      index: 'NavMeshResolutionParams[1].CellSize' reaches the Default tier
      rather than always writing element 0 (#927). value is
      string/number/bool/object/array; a label string resolves to an AActor*
      ref, and a JSON array of labels populates a TArray of actor refs (#538)
      (#202/#230). Params: actorLabel?, actorPath?, propertyName, value, force?,
      world?, pieInstance?
  level.read_actor_motion:
    class_path: ue-mcp.builtin/level.read_actor_motion
    group: level
    description: >-
      Snapshot motion telemetry for one or many actors: location, rotation,
      velocity, scale, angularVelocity (when simulating physics), grounded +
      distanceToGround (downward 200u trace). Defaults to the PIE world with
      editor fallback. Loop at your sample interval for long telemetry probes
      (#453). Params: actorLabel?, actorLabels?, actorPath?, actorPaths?,
      world?, pieInstance?
  level.add_hismc_instances:
    class_path: ue-mcp.builtin/level.add_hismc_instances
    group: level
    description: >-
      Bulk-add transforms to a HISMC / ISMC component on an actor (Python
      add_instance crashes on UE 5.7; this is the C++ path). Each transforms
      entry is {location: {x,y,z}, rotation?: {pitch,yaw,roll}, scale?:
      {x,y,z}}; componentName defaults to the first ISMC/HISMC found (#434).
      Params: actorLabel?, actorPath?, componentName?, transforms, worldSpace?
  level.get_instance_transforms:
    class_path: ue-mcp.builtin/level.get_instance_transforms
    group: level
    description: >-
      Read every instance transform on an actor's ISMC/HISMC; componentName
      defaults to the first. Returns instances[{index, location, rotation,
      scale}] (#697). Params: actorLabel?, actorPath?, componentName?,
      worldSpace?
  level.update_instance_transform:
    class_path: ue-mcp.builtin/level.update_instance_transform
    group: level
    description: >-
      Update a single ISMC/HISMC instance by index; unspecified
      location/rotation/scale are preserved (#697). Params: actorLabel?,
      actorPath?, componentName?, index, worldSpace?, location?, rotation?,
      scale?
  level.remove_instance:
    class_path: ue-mcp.builtin/level.remove_instance
    group: level
    description: >-
      Remove a single ISMC/HISMC instance by index (#697). Params: actorLabel?,
      actorPath?, componentName?, index
  level.set_nanite_settings:
    class_path: ue-mcp.builtin/level.set_nanite_settings
    group: level
    description: >-
      Enable/disable + force-build Nanite on a UStaticMesh asset (rebuilds
      render data immediately, not on next cook) (#696). Params: assetPath (or
      meshPath), enabled?, positionPrecision?
  level.get_nanite_info:
    class_path: ue-mcp.builtin/level.get_nanite_info
    group: level
    description: >-
      Read a UStaticMesh's Nanite state (naniteEnabled, positionPrecision,
      numLODs) (#696). Params: assetPath (or meshPath)
  level.add_post_process_blendable:
    class_path: ue-mcp.builtin/level.add_post_process_blendable
    group: level
    description: >-
      Add a material blendable (post-process material or MID, e.g. a
      toon/outline pass) to a PostProcessVolume's WeightedBlendables (#666).
      Params: actorLabel?, actorPath?, materialPath (or material), weight?
  level.set_post_process_settings:
    class_path: ue-mcp.builtin/level.set_post_process_settings
    group: level
    description: >-
      Write post-process settings AND enable the bOverride_<Name> flag for every
      key given. Inside FPostProcessSettings each value is gated by its own
      override bit, so writing AutoExposureMinBrightness through the generic
      property setter stores the number, leaves the bit off, and the engine
      keeps using the default while the details panel shows the value you asked
      for. Nothing errors. That is the trap this closes: the auto-enable IS the
      action. Works off the struct's reflected fields, so every setting is
      reachable, not just exposure, and a key that has no override bit
      (WeightedBlendables) says so instead of implying one was enabled. Every
      key is resolved BEFORE anything is written, so a typo fails the call
      rather than half-applying it, and each key reports previousValue,
      newValue, overrideWasEnabled and overrideEnabled read back from the
      struct. Finds the settings on the actor or on one of its components; a
      camera with several camera components needs componentName (or
      propertyName) and is refused by listing the candidates rather than by
      picking one. The level is left dirty and is NOT saved (#950). Params:
      actorLabel?, actorPath?, componentName?, propertyName?, settings,
      enableOverrides?
  level.get_post_process_settings:
    class_path: ue-mcp.builtin/level.get_post_process_settings
    group: level
    description: >-
      Read post-process settings with the override bit that decides whether each
      one applies. onlyOverridden answers 'is this volume actually overriding
      exposure' directly, instead of dumping the whole FPostProcessSettings as
      one ExportText blob to parse. Each row is name, type, value, overridden
      (the bOverride_<Name> bit) and hasOverrideFlag; the bits themselves are
      not listed as settings of their own, because a caller who writes the bit
      without the value has changed nothing. Also returns totalSettings and
      overriddenCount, so 'nothing is overridden here' is a fact rather than an
      empty list (#950). Params: actorLabel?, actorPath?, componentName?,
      propertyName?, onlyOverridden?, nameContains?, names?
  level.set_fixed_exposure:
    class_path: ue-mcp.builtin/level.set_fixed_exposure
    group: level
    description: >-
      Pin exposure on a post-process volume or camera in one call. Writes the
      same value to AutoExposureMinBrightness and AutoExposureMaxBrightness,
      which is how the engine disables eye adaptation, and enables both override
      flags so the values actually apply (#950). Params: actorLabel?,
      actorPath?, componentName?, propertyName?, exposure (or brightness), bias?
  level.export_actor_fbx:
    class_path: ue-mcp.builtin/level.export_actor_fbx
    group: level
    description: >-
      Export an actor's skeletal/static mesh to FBX and write a metadata sidecar
      JSON (actor transform, mesh, materials, skeleton) for a downstream bridge
      (e.g. MetaTailor). Returns fbx + metadata paths (#637). Params:
      actorLabel?, actorPath?, outputPath (or filePath)
  level.spawn_skeletal_mesh_actor:
    class_path: ue-mcp.builtin/level.spawn_skeletal_mesh_actor
    group: level
    description: >-
      Spawn a SkeletalMeshActor for visual/deform verification. Optional
      per-slot COMPONENT material overrides (they write the component's
      OverrideMaterials, not the mesh ASSET's slots, which
      material(build_material) writes) and single-node animation preview
      (animSequence + loop). Each entry in materials[] comes back with ok, and a
      path that does not load or a slot index past the mesh's slot count is
      reported rather than silently dropped, because a silently dropped
      assignment reads as one that worked. To dress an actor that is already
      placed, or to put one material on every slot, use
      level(set_component_materials) (#946). Returns actorLabel + boxExtent +
      materialSlotCount. The animSequence is written to the component's editable
      AnimationData, so it persists across a level save/reload instead of only
      driving the runtime preview and coming back in A-pose (#790) (#679/#677).
      Params: skeletalMesh OR meshPath, label?, onConflict?, transform?,
      location?, rotation?, scale?, materials?, animSequence?, loop?
  level.delete_actors:
    class_path: ue-mcp.builtin/level.delete_actors
    group: level
    description: >-
      Bulk-delete actors. The filter names say exactly what they match, because
      two level actions taking similar-sounding filters with different semantics
      is how a caller ends up trusting a wrong zero (#963): labelPrefix is a
      CASE-SENSITIVE PREFIX over the EDITOR LABEL, labelContains a
      case-insensitive SUBSTRING over the label, nameContains a case-insensitive
      substring over the INTERNAL name, className a case-sensitive substring
      over the class name. get_outliner's nameFilter is looser than any of them
      (label OR internal name, substring), so a string that selects a set there
      can select a different set here. When nothing matches, the response
      explains it rather than returning a bare zero: zeroMatchHint reports how
      many actors the same string WOULD have matched under the other semantics
      with samples, and a World Partition map says that only loaded actors were
      enumerated. classPathContains is a case-insensitive substring of the
      generated UClass path (e.g. /SurvivalGameKitV2/), so a whole vendor folder
      can be selected without listing every Blueprint class, and
      classPathContainsAny is the same match against any of several substrings
      (#924). dryRun previews. Returns matched/deleted/labels/classPaths
      (#220/#924/#963). Params: at least one of
      labelPrefix/labelContains/nameContains/className/tag/classPathContains/classPathContainsAny,
      dryRun?
  level.delete_exact_labeled_actors_in_levels:
    class_path: ue-mcp.builtin/level.delete_exact_labeled_actors_in_levels
    group: level
    description: >-
      Delete actors by EXACT label across several map packages in one call,
      without leaving the maps open or dirty. Previews by default (dryRun
      defaults to TRUE, the opposite of delete_actors), and every level is
      loaded and preflighted before anything is deleted, so a bad label in the
      last map cannot half-commit the first. Refuses the whole request on
      duplicate labels, a class that does not match expectedClassPath, actors
      living in a streaming sublevel, WorldSettings/default brush/level
      blueprint, World Partition maps, a read-only .umap, or an editor that is
      already dirty. Saves only the maps it actually changed, then returns to
      the map that was open. Limits: 16 levels, 256 labels per level.
      onMissing=ignore makes a replay idempotent. Params: levels, dryRun?,
      onMissing?, restoreOriginalLevel?
  level.list_actor_descs:
    class_path: ue-mcp.builtin/level.list_actor_descs
    group: level
    description: >-
      World Partition ONLY: list on-disk actor descriptors, including actors
      whose cell is not loaded and which every other actor query therefore
      reports as absent. Returns guid/label/class/bounds/runtimeGrid/dataLayers
      plus a loaded flag, and separate loadedMatches/unloadedMatches counts so
      'not streamed in' is distinguishable from 'does not exist'. Needs UE 5.5
      or newer (#746). Params: filter?, className?, guids?, bounds?,
      loadedOnly?, unloadedOnly?, cursor?, limit?
  level.load_actor_descs:
    class_path: ue-mcp.builtin/level.load_actor_descs
    group: level
    description: >-
      World Partition ONLY: pin matched actors so they become resident and the
      normal actor actions can reach them, or unpin to release. Pinning is used
      rather than transient streaming because a transient load is dropped again
      by the streaming system mid-measurement. Takes the same filters as
      list_actor_descs and refuses to act on more than maxActors (default 256)
      so an unfiltered call cannot pin a whole map by accident. Reports
      residentAfter, read back from the world rather than assumed. Needs UE 5.5
      or newer (#746). Params: mode?, filter?, className?, guids?, bounds?,
      loadedOnly?, unloadedOnly?, maxActors?, dryRun?
  level.get_world_partition_settings:
    class_path: ue-mcp.builtin/level.get_world_partition_settings
    group: level
    description: >-
      World Partition ONLY: the streaming knobs on the open map, plus the
      runtime cell transformer stack. Returns the world partition and runtime
      hash classes, whether streaming is enabled, the default HLOD layer, and
      grids[] with each grid's name, CellSize, LoadingRange and a dotted path
      rooted at the world partition. Grids are found by REFLECTION rather than
      against a fixed class, so this answers for the RuntimeHashSet layout and
      the older spatial hash alike. cellTransformers[] lists each stack entry
      with its class, its instancePath and the current values of the instanced
      transformer object's editable properties, which no read exposed (#985).
      Params: none
  level.set_world_partition_settings:
    class_path: ue-mcp.builtin/level.set_world_partition_settings
    group: level
    description: >-
      World Partition ONLY: write the streaming knobs. cellSize and loadingRange
      are the shorthand for the primary tuning pair and pick the map's only grid
      automatically, or name one with grid (its name) or gridPath (the dotted
      path from get_world_partition_settings). settings takes any dotted path
      rooted at the world partition, which is how the INSTANCED runtime cell
      transformer object is configured
      ('RuntimeCellsTransformerStack[0].Instance.SomeProperty') - that object is
      read-only through Python and was previously set by hand in the editor UI.
      Every path is resolved BEFORE anything is written, so a bad path fails the
      call rather than leaving the map streaming on a mixture nobody asked for,
      and each write reports previousValue and the value read back. Streaming
      settings only apply to cells generated after the change, so rebuild the
      streaming data before measuring. The map package is left dirty and is NOT
      saved (#985). Params: at least one of cellSize/loadingRange/settings,
      grid?, gridPath?
  level.add_runtime_cell_transformer:
    class_path: ue-mcp.builtin/level.add_runtime_cell_transformer
    group: level
    description: >-
      World Partition ONLY: append a WorldPartitionRuntimeCellTransformer to
      RuntimeCellsTransformerStack and configure its instanced object in the
      same call. Adding the entry without being able to write the instance would
      leave the manual editor step exactly where it was, so the instance is
      created here and properties are applied to it. skipIfPresent (default
      true) makes a rerun a no-op that reports the existing index instead of
      stacking duplicates. position inserts at an index rather than appending,
      because the stack is ordered (#985). Params: transformerClass (or
      className), properties?, position?, skipIfPresent?
  level.set_actor_hlod_layer:
    class_path: ue-mcp.builtin/level.set_actor_hlod_layer
    group: level
    description: >-
      Assign (or clear) the per-actor HLODLayer override across every actor a
      selector picks. Assigning one across 295 InstancedFoliageActors was a
      Python loop. Goes through the engine's own AActor::SetHLODLayer rather
      than writing the private property directly, so the result behaves like an
      edit made in the details panel. hlodLayer=null clears the override. An
      actor already carrying the requested layer is reported as unchanged rather
      than counted as an update, so a rerun is readable. Optionally sets
      bEnableAutoLODGeneration in the same pass, since the layer only matters
      when the actor is allowed to build HLODs at all. On a World Partition map
      this dirties one package per actor and does NOT save (#985). Params:
      hlodLayer, at least one of
      actorLabels/labelPrefix/labelContains/tag/classFilter/folderPath/folderPathPrefix,
      matchSubclasses?, enableAutoLODGeneration?, dryRun?, transactionLabel?
  level.set_actor_folder_path:
    class_path: ue-mcp.builtin/level.set_actor_folder_path
    group: level
    description: >-
      Assign World Outliner folder paths in bulk. Filter with actorLabels
      (exact), labelPrefix, className or tag; pass an empty folderPath to move
      actors back to the root. Runs in one transaction so the whole move is a
      single undo, reads each write back (verified), and reports missingLabels
      for names that matched no actor. Editor-only organisation: the level is
      left dirty and is NOT saved (#767). Params: folderPath, at least one of
      actorLabels/labelPrefix/className/tag, dryRun?, transactionLabel?
  level.add_actor_tag:
    class_path: ue-mcp.builtin/level.add_actor_tag
    group: level
    description: >-
      Append a tag to an actor's Tags array (#219). Params: actorLabel?,
      actorPath?, tag
  level.remove_actor_tag:
    class_path: ue-mcp.builtin/level.remove_actor_tag
    group: level
    description: >-
      Remove a tag from an actor's Tags array (#219). Params: actorLabel?,
      actorPath?, tag
  level.set_actor_tags:
    class_path: ue-mcp.builtin/level.set_actor_tags
    group: level
    description: >-
      Replace an actor's Tags array (#219). Params: actorLabel?, actorPath?,
      tags
  level.list_actor_tags:
    class_path: ue-mcp.builtin/level.list_actor_tags
    group: level
    description: >-
      List an actor's Tags, in the order they are authored on the actor
      (#219/#983). Params: actorLabel?, actorPath?, cursor?, limit?
  level.attach_actor:
    class_path: ue-mcp.builtin/level.attach_actor
    group: level
    description: >-
      Attach actor as child (#205). Params: childLabel?, childPath?,
      parentLabel?, parentPath?, attachRule?, socketName?
  level.detach_actor:
    class_path: ue-mcp.builtin/level.detach_actor
    group: level
    description: 'Detach actor from parent (#205/#983). Params: childLabel?, childPath?'
  level.attach_component:
    class_path: ue-mcp.builtin/level.attach_component
    group: level
    description: >-
      Attach an actor root or exact named child SceneComponent to an actor root
      or exact named parent SceneComponent. A non-root child changes only
      component hierarchy, not actor parentage. An already-matching attachment
      is a no-op and does not reapply transform rules. Returns verified resolved
      component and socket details; native attachment failure is an error.
      Params: childLabel?, childPath?, parentLabel?, parentPath?,
      childComponentName?, parentComponentName?, attachRule?,
      weldSimulatedBodies?, socketName?
  level.detach_component:
    class_path: ue-mcp.builtin/level.detach_component
    group: level
    description: >-
      Detach an actor root or exact named child SceneComponent while preserving
      world transform. Omitted childComponentName selects the actor root. An
      already-detached component is a verified no-op. Returns previous parent
      component/socket details plus alreadyDetached and detachmentChanged.
      Params: childLabel?, childPath?, childComponentName?
  level.set_actor_mobility:
    class_path: ue-mcp.builtin/level.set_actor_mobility
    group: level
    description: >-
      Set actor root component Mobility (#205). Params: actorLabel?, actorPath?,
      mobility
  level.get_current_edit_level:
    class_path: ue-mcp.builtin/level.get_current_edit_level
    group: level
    description: 'Read the active edit-target sub-level (#204). Params: none'
  level.set_current_edit_level:
    class_path: ue-mcp.builtin/level.set_current_edit_level
    group: level
    description: >-
      Set the active edit-target sub-level so subsequent spawns land in it
      (#204). Params: levelName (or levelPath)
  level.list_streaming_sublevels:
    class_path: ue-mcp.builtin/level.list_streaming_sublevels
    group: level
    description: >-
      List streaming sub-levels with transform + initially-loaded/visible flags
      (#206). Params: none
  level.add_streaming_sublevel:
    class_path: ue-mcp.builtin/level.add_streaming_sublevel
    group: level
    description: >-
      Add a streaming sub-level (#206). Params: levelPath, streamingClass?,
      location?, initiallyLoaded?, initiallyVisible?
  level.remove_streaming_sublevel:
    class_path: ue-mcp.builtin/level.remove_streaming_sublevel
    group: level
    description: 'Remove a streaming sub-level (#206). Params: levelName (or levelPath)'
  level.set_streaming_sublevel_properties:
    class_path: ue-mcp.builtin/level.set_streaming_sublevel_properties
    group: level
    description: >-
      Update sub-level transform/visibility flags (#206). Params: levelName (or
      levelPath), initiallyLoaded?, initiallyVisible?, location?, editorVisible?
  level.spawn_grid:
    class_path: ue-mcp.builtin/level.spawn_grid
    group: level
    description: >-
      Batch-spawn StaticMeshActors on a grid (#203). Params: staticMesh, min,
      max, countX?, countY?, countZ?, jitter?, labelPrefix?
  level.batch_translate:
    class_path: ue-mcp.builtin/level.batch_translate
    group: level
    description: >-
      Translate a set of actors by an offset (#203/#983). Params: offset, at
      least one of actorLabels/actorPaths/tag
  level.place_actors_batch:
    class_path: ue-mcp.builtin/level.place_actors_batch
    group: level
    description: >-
      Bulk-spawn StaticMeshActors with per-instance mesh + transform. Mesh loads
      cached per path. Returns spawned/failedMesh/failedSpawn counts + labels
      (#264). Params: actors
  level.batch_set_properties:
    class_path: ue-mcp.builtin/level.batch_set_properties
    group: level
    description: >-
      Set the same properties on every actor an editor-side SELECTOR picks.
      batch_translate needs an explicit label list, which for auto-numbered
      labels is a payload you have to generate first; this takes tag /
      classFilter / labelPrefix / labelContains / folderPath instead, so '190
      SpotLights tagged LichtTest' is one call. Property writes delegate to
      set_actor_property, so dotted paths, actor-label object references and
      TArray-of-actor-labels all behave identically to the single-actor action.
      The whole batch is ONE undo transaction. dryRun resolves every property
      against every matched actor's class and reports currentValue without
      writing. The level is left dirty and is NOT saved. Pass at least one
      selector: actorLabels, labelPrefix, labelContains, tag, classFilter,
      folderPath or folderPathPrefix (#984). Params: properties, actorLabels?,
      labelPrefix?, labelContains?, tag?, classFilter?, folderPath?,
      folderPathPrefix?, matchSubclasses?, dryRun?, force?, transactionLabel?
  level.bulk_set_component_property:
    class_path: ue-mcp.builtin/level.bulk_set_component_property
    group: level
    description: >-
      Set one property on the SAME NAMED COMPONENT across every actor a selector
      picks (the real case: NavModifierComponent.AreaClass on dozens of placed
      StaticMeshActors). Delegates to set_component_property per actor, so value
      semantics match exactly, including JSON null to clear an object reference.
      An actor that has no component of that name is reported as
      no_such_component rather than counted as a failure or silently skipped.
      One undo transaction. The level is left dirty and is NOT saved (#941).
      Params: componentName, propertyName, value, at least one of
      actorLabels/labelPrefix/labelContains/tag/classFilter/folderPath/folderPathPrefix,
      matchSubclasses?, dryRun?, transactionLabel?
  level.remove_components_by_class:
    class_path: ue-mcp.builtin/level.remove_components_by_class
    group: level
    description: >-
      Remove every instance component of a class across the actors a selector
      picks. remove_component takes one name at a time, which cannot reach 230
      orphaned SplineMeshComponents whose names are auto-generated
      (SplineMeshComponent_0, _1, ...). dryRun DEFAULTS TO TRUE here, unlike
      delete_actors: this deletes components you cannot enumerate by name, so
      you see the list first. Only INSTANCE components are removed; a native or
      SCS component belongs to the class and is reported under
      skippedNonInstanceComponents rather than destroyed, because destroying it
      would come back on the next construction rerun. Omitting every actor
      selector means every loaded actor, which is a legitimate request and the
      reason for the dryRun default. One undo transaction. Pass componentClass
      and at least one selector (#907). Params: componentClass,
      matchComponentSubclasses?, componentNameContains?, actorLabels?,
      labelPrefix?, labelContains?, tag?, classFilter? (or actorClassFilter),
      folderPath?, folderPathPrefix?, matchSubclasses?, dryRun?, save?,
      transactionLabel?
  level.spawn_actors_batch:
    class_path: ue-mcp.builtin/level.spawn_actors_batch
    group: level
    description: >-
      Bulk-spawn actors of ANY class with per-instance properties, from explicit
      transforms or from positions DERIVED in the editor. place_actors_batch is
      StaticMeshActor only and spawn_light takes one position. Exactly one
      source: instances[]; fromComponents, which places one actor per matched
      component at boundsOrigin + boxExtent*extentFraction + offset; or
      alongSpline, which scatters by distance. fromComponents defaults to
      space='local' on purpose: a component's WORLD bounds are axis-aligned, so
      'the top of the mesh' computed from them is not on a rotated lamp post,
      while local bounds carry the component's own orientation. That is what
      makes 'a SpotLight at 72 percent of each of 190 lamp posts' one call
      instead of 190 bounds reads and 190 spawns. properties applies to every
      spawn and per-instance properties win. dryRun returns every computed
      transform without spawning. maxSpawn (default 500) refuses a plan bigger
      than you meant. The level is left dirty and is NOT saved (#987). Params:
      actorClass, instances OR fromComponents OR alongSpline, properties?,
      labelPrefix?, dryRun?, maxSpawn?, transactionLabel?
  level.set_component_skeletal_mesh:
    class_path: ue-mcp.builtin/level.set_component_skeletal_mesh
    group: level
    description: >-
      Swap the mesh on a skinned mesh component of an actor that is already
      placed, through SetSkinnedAssetAndUpdate. Writing SkeletalMeshAsset or
      SkinnedAsset as a raw property leaves the pose buffers sized for the old
      skeleton and crashes the editor on the next pose evaluation, so
      set_property, set_actor_property and set_component_property route those
      names through the same setter. Returns previousValue, value,
      materialSlotCount and materialSlotNames (slot layouts differ per mesh).
      One undo transaction; the level is dirtied and NOT saved (#1099). Params:
      actorLabel OR actorPath, skeletalMesh, componentName?, world?,
      pieInstance?
  level.set_component_materials:
    class_path: ue-mcp.builtin/level.set_component_materials
    group: level
    description: >-
      Set per-slot COMPONENT material overrides on placed actors. This is the
      other half of material assignment and the half that had no action:
      material(build_material) and asset(set_property) write the mesh ASSET's
      slots, while a placed actor usually needs the instance override the
      details panel edits (OverrideMaterials). set_actor_material does one slot
      on whichever primitive component it finds first, so dressing a placed
      skeletal mesh meant a Python loop over get_num_materials(). Exactly one
      of: materials[] (index = slot; a null or empty entry clears just that
      slot's override), material (one path applied to EVERY slot),
      clearOverrides=true (drop every override so the asset's own slots show
      through). Every slot comes back with its previous and new path AND whether
      each is a componentOverride or the meshDefault, read back rather than
      echoed. Every material path is resolved before anything is written, so a
      bad path fails the call instead of half-applying it. Works on any
      UMeshComponent (static or skeletal). One undo transaction; the LEVEL is
      dirtied and NOT saved, the mesh asset is untouched (#946). Params: at
      least one of
      actorLabels/labelPrefix/labelContains/tag/classFilter/folderPath/folderPathPrefix,
      matchSubclasses?, componentName?, materials OR material OR clearOverrides,
      dryRun?, transactionLabel?
  level.spawn_transient_actor:
    class_path: ue-mcp.builtin/level.spawn_transient_actor
    group: level
    description: >-
      Spawn an actor for VERIFICATION that cannot be saved into the map.
      Checking anything that only exists on a live actor needs a subject, and
      spawning a normal one and forgetting to delete it is how a SceneCapture2D
      ended up committed to source control. So this actor is transient by
      construction: RF_Transient (the package serializer skips it),
      bTemporaryEditorActor (an editor preview actor, kept out of the level's
      persistent actor list), no external actor package on a World Partition
      map, and its label is set with bMarkDirty=false because SetActorLabel
      dirties the map by default. It carries a UEMCP_TransientVerification tag
      so it can be listed and so destroy refuses anything it did not create, and
      the response reports dirtiedPackages rather than promising nothing was
      dirtied. initialize controls how far towards a running state it is taken,
      because the EDITOR WORLD HAS NOT BEGUN PLAY and a spawned actor therefore
      gets neither InitializeComponent nor BeginPlay: 'none' spawns only,
      'construction' (default) reruns construction scripts, 'beginPlay' also
      registers components and dispatches the begin-play cycle on this actor,
      which is what a component doing its setup in BeginPlay (a GAS ability
      system component's attribute-set scan, for one) needs before it can be
      read. Each returned component reports registered and initialized so the
      caller can see what actually happened. Destroy it with
      destroy_transient_actor. properties (propertyName -> value) are written
      through set_actor_property before construction and BeginPlay, so gameplay
      tags, tag containers, structs and object references take the same forms
      they take there; each comes back in properties[] with ok, the value read
      back after initialization, or its error, and any failure fails the call
      (#1103) (#956). Params: world?, pieInstance?, actorClass, location?,
      rotation?, scale?, label?, hideFromOutliner?, initialize?, properties?
  level.destroy_transient_actor:
    class_path: ue-mcp.builtin/level.destroy_transient_actor
    group: level
    description: >-
      Destroy an actor created by spawn_transient_actor. It will ONLY destroy an
      actor carrying the UEMCP_TransientVerification tag and RF_Transient: a
      label or path that resolves to a real level actor is refused by name
      rather than deleted, because this is the cleanup call and a mistyped label
      at cleanup time is how real work disappears. Use delete_actor or
      delete_actors for a real level actor (#956). Params: world?, pieInstance?,
      actorPath?, actorLabel?, all?
  level.list_transient_actors:
    class_path: ue-mcp.builtin/level.list_transient_actors
    group: level
    description: >-
      List the verification actors spawned by spawn_transient_actor that are
      still in the world, so nothing is left behind by accident. They cannot be
      saved into the map and do not survive a map reload, but they are live
      until destroyed (#956). Params: world?, pieInstance?, cursor?, limit?
  level.convert_brushes_to_static_mesh:
    class_path: ue-mcp.builtin/level.convert_brushes_to_static_mesh
    group: level
    description: >-
      Convert BSP brushes into StaticMeshActors via
      UEditorActorSubsystem::ConvertActors, generating the static meshes into
      destinationPath. Finishing a blockout pass otherwise meant doing it by
      hand. dryRun DEFAULTS TO TRUE, because conversion DESTROYS the source
      brushes and there is no way back to a builder brush once the map is saved.
      Every candidate the selector picked comes back with a verdict, so nothing
      is silently dropped: the default builder brush, brush shapes, volumes
      (both derive from ABrush and neither is geometry a player sees) and
      subtractive brushes (they carve space and have no surface, so converting
      one yields an empty mesh that looks like success) are all excluded unless
      you opt in by name. classFilter is EXACT by default here. Reports
      convertedFrom (recorded before the call, since the actors are gone after
      it), newActorLabels and newStaticMeshes (#911). Params: at least one of
      actorLabels/folderPath, recursiveFolder?, classFilter?, exactClass?,
      destinationPath?, dryRun?, allowSubtractive?, includeVolumes?
  level.rerun_construction:
    class_path: ue-mcp.builtin/level.rerun_construction
    group: level
    description: >-
      Re-run the construction script on PLACED actor instances, so an SCS or
      construction-script change reaches the copies already in the level instead
      of only new ones. blueprint(run_construction_script) builds a TEMPORARY
      actor and throws it away, and Python cannot do this at all because
      Actor.rerun_construction_scripts() is missing from the wrapper. Requires
      actorLabels or className: this destroys and rebuilds every generated
      component on each match, so it will not run against a whole level
      implicitly. Reports reran, failed[], samples[], and how many matches have
      no user construction script (their generated components are still rebuilt,
      but a caller expecting a script change to land needs to know). Leaves the
      level dirty and does NOT save (#944). Params: at least one of
      actorLabels/className, matchSubclasses?, world?, pieInstance?
  level.recreate_physics_state:
    class_path: ue-mcp.builtin/level.recreate_physics_state
    group: level
    description: >-
      Rebuild the physics and collision state on the components a selector
      picks, after the mesh data underneath them changed. Stale collision makes
      line_trace report a MISS through solid geometry, which is the worst kind
      of wrong answer because nothing about it looks wrong. dryRun DEFAULTS TO
      TRUE and is the preflight: it lists which components would be rebuilt and
      what their collision enabled state and profile are right now. Requires at
      least one bound and never refreshes a whole world implicitly. Returns
      per-component before/after collision state plus a post-refresh
      collisionSummary histogram (#915). Params: at least one of
      actorLabels/labelPrefix/tag/classFilter/componentClass/componentNameContains,
      dryRun?, maxComponents?, world?, pieInstance?
  level.test_component_overlap:
    class_path: ue-mcp.builtin/level.test_component_overlap
    group: level
    description: >-
      Do two placed components overlap? Returns the boolean plus both sides'
      local bounds, world bounds and world transforms, and separation (when
      apart) or penetration depth (when overlapping). For a UBoxComponent it
      also returns boxExtentUnscaled, the authored BoxExtent the details panel
      shows, which no other read exposed. method=OBB (default) runs a
      separating-axis test on the components' oriented local bounds, so a
      rotated box is tested as a rotated box; method=AABB compares the
      axis-aligned world bounds and adds a per-axis gap. Deliberately geometric
      rather than a physics overlap query: a physics answer depends on collision
      state, and stale collision state is what makes a trace lie (see
      recreate_physics_state). Omitting a componentName selects that actor's
      root component (#914). Params: actorLabelA?, actorPathA?, actorLabelB?,
      actorPathB?, componentNameA?, componentNameB?, method?, world?,
      pieInstance?
  level.line_trace:
    class_path: ue-mcp.builtin/level.line_trace
    group: level
    description: >-
      Line trace. world selects which world is traced: 'editor' (default) or
      'pie' for the LIVE running PIE world, which is the only way to check
      geometry that exists once play has begun (#933). Traces simple collision
      by default, the same as a gameplay trace, so the result matches what the
      running game hits; pass traceComplex to trace per-triangle instead.
      channel picks the collision channel, including channels this project
      renamed in its collision settings. The response echoes traceComplex,
      channel and the world that actually answered, and faceIndex is only
      present on a complex hit. Returns hit +
      actorLabel/actorClass/componentName/componentClass/location/impactPoint/normal/distance/faceIndex/boneName/physicalMaterial
      (#420, #807, #933). Params: start?, end?, direction?, distance?,
      traceComplex?, channel?, ignoreActors?, world?, pieInstance?
  level.bulk_line_trace:
    class_path: ue-mcp.builtin/level.bulk_line_trace
    group: level
    description: >-
      Batch of line traces. Each traces[] item uses the same semantics as
      line_trace (start + end or direction+distance, simple collision by
      default, optional traceComplex/channel/ignoreActors). The top-level world
      applies to the WHOLE batch, so one call cannot straddle the editor and PIE
      worlds and present the results as comparable. Caps at 256. Returns
      results[] in traces[] order, one per item, each with the same fields as
      line_trace (or success=false + error for that item) (#933). Params:
      traces, world?, pieInstance?
  level.snap_instances_to_surface:
    class_path: ue-mcp.builtin/level.snap_instances_to_surface
    group: level
    description: >-
      Project ISMC/HISMC instances down onto surface geometry, preserving each
      instance's rotation and scale. Dry-run by default: preflights every
      requested instance and reports what would move before anything does, then
      applies successful projections in one transaction with rollback. Filter
      the surfaces traced against with surfaceActorClass/surfaceActorLabels so
      instances do not snap onto each other. onMiss controls whether a miss
      aborts the batch or is skipped. Does not save packages (#905). Params:
      actorLabel?, actorPath?, componentName?, instanceIndices?, maxInstances?,
      direction?, traceStartOffset?, traceDistance?, surfaceOffset?, onMiss?,
      surfaceActorClass?, surfaceActorLabels?, channel?, traceComplex?, dryRun?
  level.summarize_static_mesh_usage:
    class_path: ue-mcp.builtin/level.summarize_static_mesh_usage
    group: level
    description: >-
      Read-only inventory of which static meshes are actually placed in the
      loaded world, aggregated in one game-thread scan instead of walking every
      actor and component. This is the action for placement counts, and
      query_components is not a substitute for it: grouping there only
      increments, so one HISM holding 5,000 instances counts as 1, while this
      SUMS real ISM/HISM instances and counts distinct actors per mesh, and it
      sorts every aggregate before truncating so the top N is the true top N
      with an exact totalUniqueMeshes. Distinguishes actors, components and
      placements. Results are bounded; full-scan totals are preserved alongside
      the truncated rows. Loads nothing and saves nothing (#903). Params:
      world?, pieInstance?, maxResults?, includeOccurrences?, maxOccurrences?
  level.snap_actor_to_floor:
    class_path: ue-mcp.builtin/level.snap_actor_to_floor
    group: level
    description: >-
      Snap an actor's bounds-bottom to the first downward line-trace hit.
      Equivalent of the End-key shortcut, works on arbitrary geometry (not just
      Landscape). The actor lookup and the downward trace both run in the world
      named by world, so a PIE snap measures against PIE geometry (#933) (#419,
      #933). Params: actorLabel?, actorPath?, floorOffset?, maxDistance?,
      world?, pieInstance?
  level.epic_add_component:
    class_path: ue-mcp.builtin/level.epic_add_component
    group: level
    description: >-
      [Epic editor_toolset.toolsets.actor.ActorTools] Adds a component to an
      actor instance or blueprint. Params: owner, component_type, name
  level.epic_add_cone:
    class_path: ue-mcp.builtin/level.epic_add_cone
    group: level
    description: >-
      [Epic editor_toolset.toolsets.primitive.PrimitiveTools] Adds a cone-shaped
      StaticMeshComponent to an actor. Params: actor, name, radius?, height?,
      local_transform?
  level.epic_add_cube:
    class_path: ue-mcp.builtin/level.epic_add_cube
    group: level
    description: >-
      [Epic editor_toolset.toolsets.primitive.PrimitiveTools] Adds a cube-shaped
      StaticMeshComponent to an actor. Params: actor, name, dimensions?,
      local_transform?
  level.epic_add_cylinder:
    class_path: ue-mcp.builtin/level.epic_add_cylinder
    group: level
    description: >-
      [Epic editor_toolset.toolsets.primitive.PrimitiveTools] Adds a
      cylinder-shaped StaticMeshComponent to an actor. Params: actor, name,
      radius?, height?, local_transform?
  level.epic_add_sphere:
    class_path: ue-mcp.builtin/level.epic_add_sphere
    group: level
    description: >-
      [Epic editor_toolset.toolsets.primitive.PrimitiveTools] Adds a
      sphere-shaped StaticMeshComponent to an actor. Params: actor, name,
      radius?, local_transform?
  level.epic_add_tag:
    class_path: ue-mcp.builtin/level.epic_add_tag
    group: level
    description: >-
      [Epic editor_toolset.toolsets.actor.ActorTools] Adds a tag to an actor.
      Params: actor, tag
  level.epic_add_to_scene_from_asset:
    class_path: ue-mcp.builtin/level.epic_add_to_scene_from_asset
    group: level
    description: >-
      [Epic editor_toolset.toolsets.scene.SceneTools] Creates a new actor in the
      scene from an asset. Params: asset_path, name, xform, parent?,
      snap_to_ground?
  level.epic_add_to_scene_from_class:
    class_path: ue-mcp.builtin/level.epic_add_to_scene_from_class
    group: level
    description: >-
      [Epic editor_toolset.toolsets.scene.SceneTools] Creates a new instance of
      the specified object at the specified transform. Params: actor_type, name,
      xform, parent?, snap_to_ground?
  level.epic_can_edit:
    class_path: ue-mcp.builtin/level.epic_can_edit
    group: level
    description: >-
      [Epic editor_toolset.toolsets.scene.SceneTools] Checks whether an actor
      can be edited. Params: actor
  level.epic_commit_level_instance:
    class_path: ue-mcp.builtin/level.epic_commit_level_instance
    group: level
    description: >-
      [Epic editor_toolset.toolsets.scene.SceneTools] Saves or discards edits to
      a level instance and exits edit mode. Params: level_instance, discard?
  level.epic_create_level_instance:
    class_path: ue-mcp.builtin/level.epic_create_level_instance
    group: level
    description: >-
      [Epic editor_toolset.toolsets.scene.SceneTools] Creates a Level Instance
      actor in the scene referencing an existing level asset. Params:
      level_path, name, xform, parent?
  level.epic_delete_folder:
    class_path: ue-mcp.builtin/level.epic_delete_folder
    group: level
    description: >-
      [Epic editor_toolset.toolsets.scene.SceneTools] Deletes a folder from the
      outliner. Actors directly in the folder are moved to the parent folder.
      Sub-folders and their actors are preserved by re-rooting them under the
      parent. For example, deleting 'Lighting' with a sub-folder
      'Lighting/Spotlights' leaves 'Spotlights' intact under the parent. Params:
      folder_path
  level.epic_edit_level_instance:
    class_path: ue-mcp.builtin/level.epic_edit_level_instance
    group: level
    description: >-
      [Epic editor_toolset.toolsets.scene.SceneTools] Opens a level instance for
      editing. While in edit mode, scene tools such as add_to_scene_from_class
      and remove_from_scene operate within the level instance's sub-level. Only
      one level instance can be in edit mode at a time. Call
      commit_level_instance when done to save or discard changes. Params:
      level_instance
  level.epic_find_actors:
    class_path: ue-mcp.builtin/level.epic_find_actors
    group: level
    description: >-
      [Epic editor_toolset.toolsets.scene.SceneTools] Searches the scene for
      actors that match specific criteria. Params: root?, name, actor_type?,
      tag, bounds?, collision_channels
  level.epic_get_actor_bounds:
    class_path: ue-mcp.builtin/level.epic_get_actor_bounds
    group: level
    description: >-
      [Epic editor_toolset.toolsets.actor.ActorTools] Returns the bounding box
      of an actor. Params: actor
  level.epic_get_actor_transform:
    class_path: ue-mcp.builtin/level.epic_get_actor_transform
    group: level
    description: >-
      [Epic editor_toolset.toolsets.actor.ActorTools] Returns the position,
      rotation, and scale of an actor. Params: actor
  level.epic_get_actors_in_folder:
    class_path: ue-mcp.builtin/level.epic_get_actors_in_folder
    group: level
    description: >-
      [Epic editor_toolset.toolsets.scene.SceneTools] Returns the actors in the
      specified outliner folder. Params: folder_path, recursive?
  level.epic_get_collision_channels:
    class_path: ue-mcp.builtin/level.epic_get_collision_channels
    group: level
    description: >-
      [Epic editor_toolset.toolsets.scene.SceneTools] Returns all available
      collision channels for use with find_actors. Params: none
  level.epic_get_component_actor:
    class_path: ue-mcp.builtin/level.epic_get_component_actor
    group: level
    description: >-
      [Epic editor_toolset.toolsets.actor.ActorTools] Returns the actor that
      owns the specified component. Params: component
  level.epic_get_components:
    class_path: ue-mcp.builtin/level.epic_get_components
    group: level
    description: >-
      [Epic editor_toolset.toolsets.actor.ActorTools] Returns the components
      that an actor contains. Params: actor, component_type?
  level.epic_get_current_level:
    class_path: ue-mcp.builtin/level.epic_get_current_level
    group: level
    description: >-
      [Epic editor_toolset.toolsets.scene.SceneTools] Returns the path to the
      current level asset. Params: none
  level.epic_get_folders:
    class_path: ue-mcp.builtin/level.epic_get_folders
    group: level
    description: >-
      [Epic editor_toolset.toolsets.scene.SceneTools] Returns all folder paths
      currently in use in the outliner. Includes all intermediate parent paths.
      For example, if an actor is assigned to 'Lighting/Spotlights', both
      'Lighting' and 'Lighting/Spotlights' are returned. Params: none
  level.epic_get_label:
    class_path: ue-mcp.builtin/level.epic_get_label
    group: level
    description: >-
      [Epic editor_toolset.toolsets.actor.ActorTools] Returns the actor's human
      friendly name as it appears in the editor. Params: actor
  level.epic_get_parent_component:
    class_path: ue-mcp.builtin/level.epic_get_parent_component
    group: level
    description: >-
      [Epic editor_toolset.toolsets.actor.ActorTools] Returns the parent
      component that this component is attached to, if any. Params: component
  level.epic_get_root_component:
    class_path: ue-mcp.builtin/level.epic_get_root_component
    group: level
    description: >-
      [Epic editor_toolset.toolsets.actor.ActorTools] Returns the root component
      of an actor, if any. Params: actor
  level.epic_get_tags:
    class_path: ue-mcp.builtin/level.epic_get_tags
    group: level
    description: >-
      [Epic editor_toolset.toolsets.actor.ActorTools] Returns the list of tags
      on an actor. Params: actor
  level.epic_has_tag:
    class_path: ue-mcp.builtin/level.epic_has_tag
    group: level
    description: >-
      [Epic editor_toolset.toolsets.actor.ActorTools] Returns whether an actor
      has a specific tag. Params: actor, tag
  level.epic_is_checked_out:
    class_path: ue-mcp.builtin/level.epic_is_checked_out
    group: level
    description: >-
      [Epic editor_toolset.toolsets.scene.SceneTools] Checks whether an actor is
      checked out by the current user. Params: actor
  level.epic_load_level:
    class_path: ue-mcp.builtin/level.epic_load_level
    group: level
    description: >-
      [Epic editor_toolset.toolsets.scene.SceneTools] Loads a level in the
      editor. Params: level_path
  level.epic_look_at:
    class_path: ue-mcp.builtin/level.epic_look_at
    group: level
    description: >-
      [Epic editor_toolset.toolsets.actor.ActorTools] Rotates an actor so its
      forward vector points at a world-space position. Params: actor, target
  level.epic_merge_actors:
    class_path: ue-mcp.builtin/level.epic_merge_actors
    group: level
    description: >-
      [Epic editor_toolset.toolsets.scene.SceneTools] Merges multiple StaticMesh
      actors into a single mesh asset and actor. Params: actors, output_path,
      name, destroy_source_actors?
  level.epic_remove_component:
    class_path: ue-mcp.builtin/level.epic_remove_component
    group: level
    description: >-
      [Epic editor_toolset.toolsets.actor.ActorTools] Removes a component from
      an actor instance or blueprint. Params: component
  level.epic_remove_from_scene:
    class_path: ue-mcp.builtin/level.epic_remove_from_scene
    group: level
    description: >-
      [Epic editor_toolset.toolsets.scene.SceneTools] Deletes an actor from the
      scene. Params: actor
  level.epic_remove_tag:
    class_path: ue-mcp.builtin/level.epic_remove_tag
    group: level
    description: >-
      [Epic editor_toolset.toolsets.actor.ActorTools] Removes a tag from an
      actor. Params: actor, tag
  level.epic_rename_folder:
    class_path: ue-mcp.builtin/level.epic_rename_folder
    group: level
    description: >-
      [Epic editor_toolset.toolsets.scene.SceneTools] Renames a folder in the
      outliner. Updates the folder path for all actors in the folder and any
      sub-folders. For example, renaming 'Lighting' to 'Lights' also updates
      actors in 'Lighting/Spotlights' to 'Lights/Spotlights'. If the new path
      already exists then the affected actors will be merged into it. Params:
      old_path, new_path
  level.epic_save_actor:
    class_path: ue-mcp.builtin/level.epic_save_actor
    group: level
    description: >-
      [Epic editor_toolset.toolsets.scene.SceneTools] Saves the actor to disk.
      Params: actor
  level.epic_set_actor_folder:
    class_path: ue-mcp.builtin/level.epic_set_actor_folder
    group: level
    description: >-
      [Epic editor_toolset.toolsets.scene.SceneTools] Assigns an actor to the
      specified folder in the outliner. Creates the folder implicitly if it does
      not already exist. Pass an empty string to move the actor to the root of
      the outliner. Params: actor, folder_path
  level.epic_set_actor_transform:
    class_path: ue-mcp.builtin/level.epic_set_actor_transform
    group: level
    description: >-
      [Epic editor_toolset.toolsets.actor.ActorTools] Updates the position,
      rotation, and/or scale of an actor. Params: actor, xform, worldspace?
  level.epic_set_label:
    class_path: ue-mcp.builtin/level.epic_set_label
    group: level
    description: >-
      [Epic editor_toolset.toolsets.actor.ActorTools] Sets the human-friendly
      name of the actor. Params: actor, label
  level.epic_set_parent_component:
    class_path: ue-mcp.builtin/level.epic_set_parent_component
    group: level
    description: >-
      [Epic editor_toolset.toolsets.actor.ActorTools] Sets the parent for the
      specified scene component. For blueprint actors, passing a component as
      the parent of the root promotes it to the scene root, making the current
      root a child of it. If the current root is a DefaultSceneRoot, Unreal will
      automatically remove it. Params: component, parent?
  level.epic_trace_world:
    class_path: ue-mcp.builtin/level.epic_trace_world
    group: level
    description: >-
      [Epic editor_toolset.toolsets.scene.SceneTools] Traces a line through the
      world and returns the distance to the first hit. Params: start, end
  material.read:
    class_path: ue-mcp.builtin/material.read
    group: material
    description: >-
      Read material structure. Accepts a Material or a MaterialInstance; an
      instance answers with its lineage, shading setup and resolved parameters
      instead of a graph (#952). Params: assetPath (or path, or materialPath)
  material.list_parameters:
    class_path: ue-mcp.builtin/material.list_parameters
    group: material
    description: >-
      List parameters. On a MaterialInstance each entry carries the resolved
      value, the parent's defaultValue and whether this instance overrides it
      (#952). Params: assetPath (or path, or materialPath)
  material.set_parameter:
    class_path: ue-mcp.builtin/material.set_parameter
    group: material
    description: >-
      Set parameter on MaterialInstance. parameterType (scalar|vector|texture)
      is auto-detected when omitted. A vector/colour value may be passed as
      value OR color, shaped {r,g,b,a}, [r,g,b,a] or '(R=..,G=..,B=..,A=..)'.
      Saves the instance and returns readBack + saved so a set/verify round trip
      needs no second call (#952). Params: assetPath (or path), parameterName,
      parameterType?, at least one of value/color (or colour)/texturePath,
      association?
  material.read_instance:
    class_path: ue-mcp.builtin/material.read_instance
    group: material
    description: >-
      Read any MaterialInstance (Constant or Dynamic): parentChain up to the
      base material, the overrides it holds, and the effective
      scalar/vector/texture parameter values it renders with (value, parent
      defaultValue, overridden). To read the material actually on a placed
      component, including a transient MaterialInstanceDynamic created at
      runtime, pass actorLabel or actorPath instead of assetPath; world defaults
      to auto (PIE when running, else editor) (#1114). Params: assetPath (or
      path, or materialPath) OR actorLabel OR actorPath, componentName?,
      slotIndex?, slotName?, world?, pieInstance?
  material.read_mpc:
    class_path: ue-mcp.builtin/material.read_mpc
    group: material
    description: >-
      Read a MaterialParameterCollection: every scalar and vector parameter with
      its stored defaultValue and id. Pass world to also read the live
      collection instance in that world (liveValue, differsFromDefault), which
      is what materials sample and what Blueprint writes change (#1116). Params:
      assetPath (or path), world?, pieInstance?
  material.set_instance_parent:
    class_path: ue-mcp.builtin/material.set_instance_parent
    group: material
    description: >-
      Set a MaterialInstanceConstant parent. Params: assetPath (or path, or
      materialPath), newParentPath (or parentPath)
  material.batch_set_instances:
    class_path: ue-mcp.builtin/material.batch_set_instances
    group: material
    description: >-
      Batch reparent + reassign parameters across many Material Instances in one
      call. Returns per-instance results (#594). Params: instances
  material.clear_instance_parameters:
    class_path: ue-mcp.builtin/material.clear_instance_parameters
    group: material
    description: >-
      Clear all MaterialInstanceConstant parameter overrides. Params: assetPath
      (or path, or materialPath)
  material.list_static_switches:
    class_path: ue-mcp.builtin/material.list_static_switches
    group: material
    description: >-
      List static switch parameters on a Material or MaterialInstance. Params:
      assetPath (or path, or materialPath)
  material.set_static_switch:
    class_path: ue-mcp.builtin/material.set_static_switch
    group: material
    description: >-
      Set a MaterialInstanceConstant static switch parameter. value is a
      boolean. Params: assetPath (or path, or materialPath), parameterName,
      value, association?, parameterIndex?
  material.set_expression_value:
    class_path: ue-mcp.builtin/material.set_expression_value
    group: material
    description: >-
      Set a value on an expression node. Common typed knobs: value
      (constant/param default), texturePath
      (TextureSample/TextureSampleParameter2D default texture).
      Constant2Vector/3Vector/4Vector and VectorParameter all take value (or
      color) as {r,g,b,a}, {x,y,z,w}, [r,g,b,a] or '(R=..,G=..)';
      Constant2Vector reads the first two components (#979). Saves the material
      and reports saved. A TextureCoordinate node takes uTiling, vTiling and
      coordinateIndex, which are separate top-level keys rather than anything
      inside `value`. For any OTHER UPROPERTY on the expression (e.g.
      SamplerType, SamplerSource, Group), pass propertyName + value to hit the
      generic reflection setter. Reports previousValue and rolls back to it
      where the previous value can be expressed in this action's own vocabulary.
      Pass functionPath instead of materialPath to edit a node inside a
      MaterialFunction (index from list_function_expressions); the function is
      then updated so every material using it recompiles (#1138, #663). Params:
      materialPath (or path, or assetPath) OR functionPath (or
      materialFunctionPath), expressionIndex, value?, color? (or colour), x?,
      y?, parameterName?, texturePath?, uTiling?, vTiling?, coordinateIndex?,
      propertyName?
  material.set_custom_expression:
    class_path: ue-mcp.builtin/material.set_custom_expression
    group: material
    description: >-
      Read/write a MaterialExpressionCustom (HLSL) node: code, named inputs[]
      (rebuilds input pins; wire them with connect_expressions
      targetInput=<name>), outputType
      (float1|float2|float3|float4|materialAttributes), description. Omit
      code/inputs to read. Add the node first via add_expression
      expressionType=Custom, or add_function_expression inside a
      MaterialFunction (then pass functionPath, #1138) (#617). Params:
      materialPath (or path, or assetPath) OR functionPath (or
      materialFunctionPath), expressionIndex, code?, inputs?, outputType?,
      description?
  material.disconnect_property:
    class_path: ue-mcp.builtin/material.disconnect_property
    group: material
    description: >-
      Disconnect a material property input. Params: materialPath (or assetPath),
      property
  material.create_instance:
    class_path: ue-mcp.builtin/material.create_instance
    group: material
    description: >-
      Create material instance. Idempotent by path: an existing instance is
      reported rather than replaced. Params: parentPath, name, packagePath?,
      onConflict?
  material.create:
    class_path: ue-mcp.builtin/material.create
    group: material
    description: >-
      Create material. Idempotent by path: an existing material is reported
      rather than replaced. Params: name, packagePath?, onConflict?
  material.create_function:
    class_path: ue-mcp.builtin/material.create_function
    group: material
    description: >-
      Create a MaterialFunction asset (#463). Params: name, packagePath?,
      onConflict?, description?
  material.add_function_expression:
    class_path: ue-mcp.builtin/material.add_function_expression
    group: material
    description: >-
      Add an expression node to a MaterialFunction graph. inputName and
      inputType apply to a FunctionInput, outputName to a FunctionOutput (#463).
      name labels any node, so connect_function_expressions can address it by
      that name. Params: functionPath (or materialFunctionPath), expressionType,
      positionX?, positionY?, inputName?, inputType?, outputName?, name?
  material.connect_function_expressions:
    class_path: ue-mcp.builtin/material.connect_function_expressions
    group: material
    description: >-
      Wire two expressions inside a MaterialFunction; each expression is named
      or indexed. The result lists sourceOutputs (the source node's output names
      by index; an empty name is the default output an omitted sourceOutput
      selects) and connectedOutputName (#463). Params: functionPath (or
      materialFunctionPath), sourceExpression, sourceOutput?, targetExpression,
      targetInput?
  material.list_function_expressions:
    class_path: ue-mcp.builtin/material.list_function_expressions
    group: material
    description: >-
      List expression nodes inside a MaterialFunction (#463). Params:
      functionPath (or materialFunctionPath)
  material.build_material:
    class_path: ue-mcp.builtin/material.build_material
    group: material
    description: >-
      Build a PBR material from a texture set in one call: creates a
      TextureSample per entry, picks each sampler type FROM THE TEXTURE (a
      virtual/UDIM texture silently loses its material connection on recompile
      unless it samples through the Virtual* variant), wires them, recompiles,
      saves, and reports which connections survived the recompile. name (+
      packagePath) creates the material; materialPath builds into an existing
      one. assignToMesh puts the result on a StaticMesh or SkeletalMesh (#946).
      Params: materialPath (or assetPath) OR name, packagePath?, textures,
      samplerTypes?, clearExisting?, assignToMesh? (or meshPath), meshSlots?
  material.create_simple:
    class_path: ue-mcp.builtin/material.create_simple
    group: material
    description: >-
      Single-call simple material with optional constants and usages[] (e.g.
      InstancedStaticMeshes, Nanite, NiagaraSprites). Recompiles + saves in one
      shot (#225). Params: name, packagePath?, onConflict?, baseColor?,
      metallic?, specular?, roughness?, emissive?, usages?
  material.get_usage:
    class_path: ue-mcp.builtin/material.get_usage
    group: material
    description: >-
      Read the EMaterialUsage flags on a material. `usages[]` carries every flag
      this engine build defines with its `enabled` state and the bUsedWith*
      `propertyName` behind it, and `enabled[]` is just the ones that are on.
      Pass a material INSTANCE and the flags come from the base material it
      resolves to, which is the shader map it renders through: `materialPath`
      names that material and `inherited` is true (#1004). Params: assetPath (or
      path)
  material.set_usage:
    class_path: ue-mcp.builtin/material.set_usage
    group: material
    description: >-
      Turn on EMaterialUsage flag(s) for a material, then recompile and save.
      Flag names come from this engine own EMaterialUsage reflection, so every
      usage the build defines is accepted (VolumetricCloud, Voxels, MeshDeformer
      and the rest included) and `unknown` names only what it truly could not
      resolve. This only ever turns flags ON: it routes each one through
      UMaterial::SetMaterialUsage, which is an ensure rather than a write, so a
      replay also repairs a material whose bit is set but whose shaders were
      never built. `applied` names the flags this call turned on and
      `alreadySet` those that were on already. To CLEAR a flag, write its
      reflected property with editor(set_property): every usage this action
      recognises is backed by a bUsedWith* UPROPERTY on the material, and the
      response returns the exact {objectPath, propertyName, value} arguments per
      flag under `clearCalls`. Clearing a flag does not discard the shader
      permutations that were compiled for it (#225). Params: assetPath (or path,
      or materialPath), at least one of usages/usage
  material.set_shading_model:
    class_path: ue-mcp.builtin/material.set_shading_model
    group: material
    description: 'Set shading model. Params: assetPath (or path), shadingModel'
  material.set_blend_mode:
    class_path: ue-mcp.builtin/material.set_blend_mode
    group: material
    description: 'Set blend mode. Params: assetPath (or path), blendMode'
  material.set_domain:
    class_path: ue-mcp.builtin/material.set_domain
    group: material
    description: >-
      Set material domain. Required for post-process / decal / UI authoring
      (#299/#356). Params: assetPath (or path), materialDomain (or domain)
  material.set_base_color:
    class_path: ue-mcp.builtin/material.set_base_color
    group: material
    description: 'Set base color. Params: assetPath (or path), color'
  material.connect_texture:
    class_path: ue-mcp.builtin/material.connect_texture
    group: material
    description: >-
      Connect texture to property. Params: materialPath (or path, or assetPath),
      texturePath, property? (or materialProperty)
  material.add_expression:
    class_path: ue-mcp.builtin/material.add_expression
    group: material
    description: >-
      Add expression node (#318). Params: materialPath (or path, or assetPath),
      expressionType, name? (or expressionName), parameterName?, group?,
      sortPriority?, defaultValue?, value?, channels?, positionX?, positionY?
  material.connect_expressions:
    class_path: ue-mcp.builtin/material.connect_expressions
    group: material
    description: >-
      Wire two expressions. Params: materialPath (or path, or assetPath),
      sourceExpression, sourceOutput?, targetExpression, targetInput?
  material.connect_to_property:
    class_path: ue-mcp.builtin/material.connect_to_property
    group: material
    description: >-
      Wire expression to material output. Params: materialPath (or path, or
      assetPath), expressionName, outputName?, property
  material.list_expressions:
    class_path: ue-mcp.builtin/material.list_expressions
    group: material
    description: >-
      List expression nodes, in the material's own stored order, which is what
      nodeId indexes into. Set includeInputs to include each node's input wiring
      (default false). Paged with cursor/limit. Params: materialPath (or path,
      or assetPath), includeInputs?, cursor?, limit?
  material.read_graph:
    class_path: ue-mcp.builtin/material.read_graph
    group: material
    description: >-
      Read the stored material expression graph without creating an editor
      graph. Returns the same paged expressions as list_expressions, with inputs
      carrying inputIndex, inputName, connectedExpressionIndex,
      connectedOutputIndex, connectedExpressionClass and
      connectedExpressionDescription, plus every root material input under
      connections (expressionIndex, outputIndex, expressionClass,
      expressionDescription; null when disconnected). MaterialAttributes is
      listed only when the material uses material attributes. Pass
      expressionIndex (a nodeId) to read just that node and the source
      expressions its inputs link to, unpaged. Params: materialPath (or path, or
      assetPath), expressionIndex?, cursor?, limit?
  material.delete_expression:
    class_path: ue-mcp.builtin/material.delete_expression
    group: material
    description: >-
      Remove expression. expressionName matches a description, class, parameter
      name, FunctionInput/FunctionOutput name, index or engine name. Pass
      functionPath instead of materialPath to remove it from a MaterialFunction
      (#1138). Params: materialPath (or path, or assetPath) OR functionPath (or
      materialFunctionPath), expressionName
  material.list_expression_types:
    class_path: ue-mcp.builtin/material.list_expression_types
    group: material
    description: >-
      List available expression types, in the curated order they are grouped in.
      Paged with cursor/limit. Params: cursor?, limit?
  material.recompile:
    class_path: ue-mcp.builtin/material.recompile
    group: material
    description: >-
      Recompile material. Pass recompileChildren=true to cascade to every
      MaterialInstanceConstant whose parent chain reaches this material (#421).
      Params: materialPath (or path, or assetPath), recompileChildren?
  material.duplicate:
    class_path: ue-mcp.builtin/material.duplicate
    group: material
    description: 'Duplicate material asset. Params: sourcePath, destinationPath'
  material.validate:
    class_path: ue-mcp.builtin/material.validate
    group: material
    description: >-
      Validate material graph - find orphans, broken refs. Params: assetPath (or
      materialPath)
  material.get_shader_stats:
    class_path: ue-mcp.builtin/material.get_shader_stats
    group: material
    description: >-
      Shader compile stats, sampler+param counts. Params: assetPath (or
      materialPath)
  material.export_graph:
    class_path: ue-mcp.builtin/material.export_graph
    group: material
    description: 'Export material graph as JSON. Params: assetPath (or materialPath)'
  material.import_graph:
    class_path: ue-mcp.builtin/material.import_graph
    group: material
    description: >-
      Rebuild graph from JSON. Params: assetPath (or materialPath), nodes,
      propertyConnections?
  material.build_graph:
    class_path: ue-mcp.builtin/material.build_graph
    group: material
    description: >-
      Build graph from spec. Params: assetPath (or materialPath), nodes,
      propertyConnections?
  material.render_preview:
    class_path: ue-mcp.builtin/material.render_preview
    group: material
    description: >-
      Render preview PNG. Params: assetPath (or materialPath), outputPath,
      width?, height?
  material.begin_transaction:
    class_path: ue-mcp.builtin/material.begin_transaction
    group: material
    description: 'Begin undo transaction. Params: label?'
  material.end_transaction:
    class_path: ue-mcp.builtin/material.end_transaction
    group: material
    description: 'End undo transaction. Params: none'
  material.create_rvt:
    class_path: ue-mcp.builtin/material.create_rvt
    group: material
    description: >-
      Create a RuntimeVirtualTexture asset. materialType is validated against
      RuntimeVirtualTexture::IsMaterialTypeSupported, which is the reason it is
      a parameter rather than a follow-up property write: a project can disable
      individual material types to cut shader permutations, and set_property
      would happily store one that then compiles to nothing. Everything else
      (tileCount, tileSize, tileBorderSize, compression, adaptive/private/packed
      page table, continuous update, LOD group) is a plain UPROPERTY: write it
      with asset(set_property) at the returned objectPath. Reads back the
      DERIVED layout - size, pageTableSize, layer count and per-layer pixel
      format and colour space - which no property read produces. Idempotent by
      path; rollback deletes the asset. Params: name, packagePath?,
      materialType?, onConflict?
  material.read_rvt:
    class_path: ue-mcp.builtin/material.read_rvt
    group: material
    description: >-
      Read a RuntimeVirtualTexture and its whole reference graph: the derived
      layout (size, pageTableSize, per-layer pixel format, sRGB and YCoCg),
      every volume bound to it with its transform, every primitive and landscape
      that writes into it, and every material sample node that reads it.
      problems[] names the failures that otherwise only show up visually - no
      volume (so no world bounds), no writer (so every page renders empty), a
      disabled material type, and the classic one: a sample node whose
      materialType disagrees with the asset, which decodes the wrong channels
      and still compiles. level(get_runtime_virtual_texture_summary) answers the
      level-side question; this answers the asset-side one. Params: rvtPath (or
      assetPath)
  material.add_rvt_volume:
    class_path: ue-mcp.builtin/material.add_rvt_volume
    group: material
    description: >-
      Spawn the RuntimeVirtualTextureVolume that gives an RVT its world bounds,
      bind the asset through the engine's SetVirtualTexture (which re-registers
      the render state, unlike a raw property write), and fit the volume to what
      actually writes into the texture. An unfitted volume sits at the origin at
      unit scale and renders a 100cm cube of the world, so the fit is the point.
      Idempotent BY BINDING rather than by label: two volumes on one RVT is a
      real misconfiguration (one wins, the other renders nothing) and an
      existing binding is reported rather than duplicated. When nothing writes
      into the RVT yet there is nothing to fit to, and the response says so in
      boundsFitNote rather than reporting a fit that did not happen. Rollback
      deletes the actor. Params: rvtPath (or assetPath), actorLabel?,
      boundsMode?, boundsAlignActor?
  material.set_rvt_volume_bounds:
    class_path: ue-mcp.builtin/material.set_rvt_volume_bounds
    group: material
    description: >-
      Refit an RVT volume to the world, which is the Set Bounds button and is
      not a property write: it DERIVES a transform from what is in the level.
      boundsMode='writers' covers every primitive whose RuntimeVirtualTextures
      array names this RVT; boundsMode='alignActor' matches one actor's box and
      rotation, which is what a landscape wants because the volume's axes have
      to be the terrain's axes. The volume's own local extent is read back
      through CalcBounds and solved against the target box rather than assumed
      to be a unit cube, so the fit survives engine changes. Honest limitation:
      it does NOT perform the landscape texel snap (that lives in a module the
      bridge does not link) and says so when bSnapBoundsToLandscape is set.
      Rollback restores the previous transform exactly. Params: rvtPath (or
      assetPath) OR actorLabel OR actorPath, boundsMode?, boundsAlignActor?
  material.add_rvt_sampler:
    class_path: ue-mcp.builtin/material.add_rvt_sampler
    group: material
    description: >-
      Add or rebind the RuntimeVirtualTextureSample node that READS an RVT in a
      material, then call the engine's InitVirtualTextureDependentSettings,
      which is the one step add_expression + set_expression_value cannot do: it
      copies the asset's material type and packed/adaptive page-table flags onto
      the node and rebuilds its output pins. Setting VirtualTexture alone leaves
      those stale, which compiles cleanly and decodes the wrong channels.
      Optionally connects each output pin to the material property of the same
      name and reports the pins that have no counterpart (WorldHeight, Mask,
      Mask4, Displacement) rather than dropping them silently. Idempotent by
      expressionName. MipValueMode, TextureAddressMode and bEnableFeedback stay
      editor(set_property) territory at the returned expressionObjectPath.
      Params: materialPath (or assetPath), rvtPath, expressionName?,
      connectOutputs?, positionX?, positionY?, recompile?
  material.add_rvt_output:
    class_path: ue-mcp.builtin/material.add_rvt_output
    group: material
    description: >-
      Add the RuntimeVirtualTextureOutput node that makes a material WRITE into
      an RVT, and mirror the material's existing BaseColor / Normal / Roughness
      / Specular / Opacity connections into it, which by hand is one
      connect_expressions call per channel with each source expression and
      output index looked up by eye. Reads the node's inputs by NAME through the
      same GetInput/GetInputName pair connect_expressions uses, so a channel
      added by an engine version is picked up rather than mis-wired. Inputs with
      no material counterpart are reported with the call that wires them.
      Idempotent by expressionName. Note this does not choose WHICH RVT: that is
      the primitive's RuntimeVirtualTextures array (assign_rvt_to_landscape, or
      editor(set_property) on a mesh component). Params: materialPath (or
      assetPath), expressionName?, mirrorProperties?, positionX?, positionY?,
      recompile?
  material.assign_rvt_to_landscape:
    class_path: ue-mcp.builtin/material.assign_rvt_to_landscape
    group: material
    description: >-
      Assign RVTs to a landscape across EVERY proxy that shares its
      ULandscapeInfo, not just the actor named. A streaming or World Partition
      landscape is many ALandscapeStreamingProxy actors, and writing
      RuntimeVirtualTextures on one of them with set_property leaves the rest
      rendering nothing into the RVT, which is invisible until the pages come
      back empty. Also calls PostEditChange plus MarkComponentsRenderStateDirty
      per proxy, without which the change does not take effect, and checks the
      two things that make an assignment useless anyway: a landscape material
      with no RuntimeVirtualTextureOutput node, and an RVT whose material type
      is disabled for the project. assignMode='set' with an empty list clears
      the assignment. Rollback replays the named landscape's previous list, with
      previousPerProxy carrying the exact per-proxy state. Params: actorLabel OR
      actorPath, rvtPaths?, rvtPath?, assignMode?
  material.create_designer:
    class_path: ue-mcp.builtin/material.create_designer
    group: material
    description: >-
      Create a Material Designer material: a DynamicMaterialInstance asset WITH
      its Material Designer model, through the plugin's own
      DynamicMaterialInstanceFactory (asset(create_asset_by_class) leaves the
      model empty). Seeds a Base Color slot when the new model has none,
      requests a build and saves. Returns path, modelPath, slotCount and a
      delete_asset rollback. Needs the Material Designer plugin (#1131). Params:
      name, packagePath?, onConflict?
  material.read_designer:
    class_path: ue-mcp.builtin/material.read_designer
    group: material
    description: >-
      Read a Material Designer (DynamicMaterial) model: material settings
      (domain, blend mode, shading model, flags), materialProperties with their
      enabled state and designerSlot, and every slot's layer stack. Each layer
      carries name, bEnabled, MaterialProperty, blendMode, effectStack and its
      stages (stageType Base or Mask) with sources, inputs, sub-stages, values,
      texture UVs and text renderers described recursively; every component
      reports objectPath, componentPath and writableProperties for
      set_designer_value. Target a Motion Design shape with actorLabel/actorPath
      (the first material slot holding a DynamicMaterialInstance, or
      componentName?/slotIndex?/slotName?), or pass assetPath (a
      DynamicMaterialInstance, a DynamicMaterialModel, or any object inside
      one). designerSlot and layerIndex narrow the read. Needs the Material
      Designer plugin (#1131). Params: assetPath OR actorLabel OR actorPath,
      componentName?, slotIndex?, slotName?, world?, pieInstance?,
      designerSlot?, layerIndex?, maxDepth?
  material.set_designer_value:
    class_path: ue-mcp.builtin/material.set_designer_value
    group: material
    description: >-
      Set one property on a Material Designer component (a layer, stage, value,
      texture UV, text renderer, the editor-only data's settings) by reflection.
      Uses the component's own setter when it has one (SetValue, SetOffset,
      SetTiling, SetText, SetEnabled, SetLayerName) so the model updates the way
      the Material Designer UI does; otherwise writes the property, calls
      PostEditChangeProperty and Update, and requests a material build. Address
      the component by objectPath or componentPath (both reported by
      read_designer), or by designerSlot? + layerIndex/layerName (+ stage?
      base|mask|index); componentPath and the layer forms also need assetPath or
      actorLabel/actorPath. Returns previousValue and a rollback (#1131).
      Params: propertyName, value, objectPath OR componentPath OR layerIndex OR
      layerName, stage?, assetPath?, actorLabel?, actorPath?, componentName?,
      slotIndex?, slotName?, world?, pieInstance?, designerSlot?, rebuild?
  material.add_designer_layer:
    class_path: ue-mcp.builtin/material.add_designer_layer
    group: material
    description: >-
      Add a default layer to a Material Designer slot through
      UDMMaterialSlot::AddDefaultLayer, optionally naming it, then request a
      material build. Returns the new layer as read_designer describes it; its
      stages are then set with set_designer_value. designerSlot defaults to the
      slot mapped to materialProperty (#1131). Params: assetPath OR actorLabel
      OR actorPath, componentName?, slotIndex?, slotName?, world?, pieInstance?,
      designerSlot?, materialProperty?, layerName?
  material.remove_designer_layer:
    class_path: ue-mcp.builtin/material.remove_designer_layer
    group: material
    description: >-
      Remove a layer from a Material Designer slot through
      UDMMaterialSlot::RemoveLayer, after CanRemoveLayer agrees (a slot keeps
      its base layer). Address it by objectPath, or by layerIndex or layerName
      in a target's slot. Runs in an editor transaction; the rollback is one
      editor undo (#1131). Params: objectPath OR assetPath OR actorLabel OR
      actorPath, componentName?, slotIndex?, slotName?, world?, pieInstance?,
      designerSlot?, layerIndex?, layerName?
  material.epic_add_expression:
    class_path: ue-mcp.builtin/material.epic_add_expression
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Adds a new
      expression node to a Material or MaterialFunction graph. Use
      list_expression_classes to discover available types. Params:
      material_or_function, expression_class, x?, y?
  material.epic_clear_parameters:
    class_path: ue-mcp.builtin/material.epic_clear_parameters
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material_instance.MaterialInstanceTools]
      Clears all parameter overrides on a material instance, reverting to parent
      defaults. Params: instance
  material.epic_connect_expressions:
    class_path: ue-mcp.builtin/material.epic_connect_expressions
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Connects an
      expression node's output pin to another expression node's input pin.
      Params: from_expression, from_output_name, to_expression, to_input_name
  material.epic_connect_to_output:
    class_path: ue-mcp.builtin/material.epic_connect_to_output
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Connects an
      expression node's output to one of the material's output properties.
      Params: expression, output_name, material_property
  material.epic_create:
    class_path: ue-mcp.builtin/material.epic_create
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material_instance.MaterialInstanceTools]
      Creates a new MaterialInstanceConstant asset derived from a parent
      material. Material instances expose the parent's parameters without
      triggering a full shader recompile when parameter values change. Params:
      folder_path, asset_name, parent
  material.epic_create_function:
    class_path: ue-mcp.builtin/material.epic_create_function
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Creates a new empty
      MaterialFunction asset. Params: folder_path, asset_name
  material.epic_create_material:
    class_path: ue-mcp.builtin/material.epic_create_material
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Creates a new empty
      Material asset. Warning: Each new Material increases shader compile times.
      Prefer creating a MaterialInstance from an existing Material where
      possible. Params: folder_path, asset_name
  material.epic_create_parameter_collection:
    class_path: ue-mcp.builtin/material.epic_create_parameter_collection
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Creates a new empty
      MaterialParameterCollection (MPC) asset. An MPC holds named Scalar and
      Vector parameters with default values that materials can reference at
      runtime without recompiling shaders. Params: folder_path, asset_name
  material.epic_delete_expression:
    class_path: ue-mcp.builtin/material.epic_delete_expression
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Removes an
      expression node from a Material or MaterialFunction graph. Params:
      material_or_function, expression
  material.epic_delete_parameter_group:
    class_path: ue-mcp.builtin/material.epic_delete_parameter_group
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Removes a parameter
      group, ungrouping all parameters that belong to it. The parameter
      expressions themselves are not deleted - only their group assignment is
      cleared. Params: material_or_function, group_name
  material.epic_delete_unused_expressions:
    class_path: ue-mcp.builtin/material.epic_delete_unused_expressions
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Deletes all
      expression nodes not connected to any material output. Useful for cleaning
      up a material graph after reorganising or after the AI has added
      experimental nodes that were later abandoned. Params: material
  material.epic_disconnect_expressions:
    class_path: ue-mcp.builtin/material.epic_disconnect_expressions
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Disconnects the
      input pin of an expression node, removing whatever is connected to it.
      Params: to_expression, to_input_name
  material.epic_disconnect_from_output:
    class_path: ue-mcp.builtin/material.epic_disconnect_from_output
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Disconnects the
      expression currently connected to a material output property. Params:
      material, material_property
  material.epic_get_expression_input_names:
    class_path: ue-mcp.builtin/material.epic_get_expression_input_names
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Returns the names of
      all input pins on a material expression node. Use these names as
      to_input_name when calling connect_expressions. Params: expression
  material.epic_get_expression_inputs:
    class_path: ue-mcp.builtin/material.epic_get_expression_inputs
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Returns the current
      wiring of each input pin on a material expression. Use after building or
      modifying a graph to verify the wiring matches expectations. Params:
      material_or_function, expression
  material.epic_get_expression_output_names:
    class_path: ue-mcp.builtin/material.epic_get_expression_output_names
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Returns the names of
      all output pins on a material expression node. Use these names as
      from_output_name when calling connect_expressions or connect_to_output.
      The empty string represents the default (first) output of nodes that
      expose only an unnamed output. Params: expression
  material.epic_get_expressions:
    class_path: ue-mcp.builtin/material.epic_get_expressions
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Returns all
      expression nodes in a Material or MaterialFunction graph. Params:
      material_or_function
  material.epic_get_property_input:
    class_path: ue-mcp.builtin/material.epic_get_property_input
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Returns the
      expression and output pin feeding a material output property. Use to
      inspect what drives MP_EmissiveColor, MP_Opacity, MP_BaseColor, etc.
      Params: material, material_property
  material.epic_get_referencing_materials:
    class_path: ue-mcp.builtin/material.epic_get_referencing_materials
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Returns asset data
      for all Materials that reference this MaterialFunction. Params:
      material_function
  material.epic_get_scalar_parameter:
    class_path: ue-mcp.builtin/material.epic_get_scalar_parameter
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material_instance.MaterialInstanceTools]
      Gets the current value of a scalar parameter on a material instance.
      Params: instance, name
  material.epic_get_static_switch_parameter:
    class_path: ue-mcp.builtin/material.epic_get_static_switch_parameter
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material_instance.MaterialInstanceTools]
      Gets the value of a static switch parameter on a material instance.
      Params: instance, name
  material.epic_get_texture_parameter:
    class_path: ue-mcp.builtin/material.epic_get_texture_parameter
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material_instance.MaterialInstanceTools]
      Gets the texture assigned to a texture parameter on a material instance.
      Params: instance, name
  material.epic_get_vector_parameter:
    class_path: ue-mcp.builtin/material.epic_get_vector_parameter
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material_instance.MaterialInstanceTools]
      Gets the current value of a vector parameter on a material instance.
      Params: instance, name
  material.epic_layout_expressions:
    class_path: ue-mcp.builtin/material.epic_layout_expressions
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Automatically
      arranges all expression nodes in a Material or MaterialFunction graph.
      Params: material_or_function
  material.epic_list_expression_classes:
    class_path: ue-mcp.builtin/material.epic_list_expression_classes
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Returns
      MaterialExpression subclasses valid for the given context. Use the results
      with add_expression. Pass a search string to filter by name, e.g.
      'Multiply' or 'Parameter'. Params: material_or_function, search
  material.epic_list_parameter_groups:
    class_path: ue-mcp.builtin/material.epic_list_parameter_groups
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Returns the unique
      parameter group names defined in a Material or MaterialFunction.
      Parameters are organised into groups in the Material Instance editor. This
      returns the distinct set of group names found across all parameter
      expressions in the graph. The empty string represents parameters that have
      not been assigned to a named group. Params: material_or_function
  material.epic_list_parameters:
    class_path: ue-mcp.builtin/material.epic_list_parameters
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material_instance.MaterialInstanceTools]
      Returns all parameters exposed by a material or instance, with their names
      and types. Params: material
  material.epic_recompile:
    class_path: ue-mcp.builtin/material.epic_recompile
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Recompiles a
      Material or MaterialFunction after edits. For Materials, raises if the
      shader fails to compile. For MaterialFunctions, also recompiles any
      Materials that reference the function. Call this once after a set of graph
      modifications is complete - after adding or deleting expressions, making
      connections, or changing expression properties such as parameter names or
      default values. Params: material_or_function
  material.epic_rename_parameter_group:
    class_path: ue-mcp.builtin/material.epic_rename_parameter_group
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material.MaterialTools] Renames a parameter
      group across all parameter expressions in a Material or MaterialFunction.
      All parameters currently in old_name will be moved to new_name. If
      new_name already exists, the parameters are merged into it. Params:
      material_or_function, old_name, new_name
  material.epic_set_parameter_override:
    class_path: ue-mcp.builtin/material.epic_set_parameter_override
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material_instance.MaterialInstanceTools]
      Enables or disables a parameter override on a material instance. Enabling
      sets the override to the current effective value. Disabling reverts to the
      parent. For non-static parameter types, disabling also discards the prior
      override value; re-enabling later restores the parent value, not the prior
      override. Static switches and static component masks preserve their value
      across toggle. Params: instance, name, override
  material.epic_set_parent:
    class_path: ue-mcp.builtin/material.epic_set_parent
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material_instance.MaterialInstanceTools]
      Changes the parent of a material instance. Params: instance, parent
  material.epic_set_scalar_parameter:
    class_path: ue-mcp.builtin/material.epic_set_scalar_parameter
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material_instance.MaterialInstanceTools]
      Sets the value of a scalar parameter on a material instance. Params:
      instance, name, value
  material.epic_set_static_switch_parameter:
    class_path: ue-mcp.builtin/material.epic_set_static_switch_parameter
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material_instance.MaterialInstanceTools]
      Sets the value of a static switch parameter on a material instance.
      Params: instance, name, value
  material.epic_set_texture_parameter:
    class_path: ue-mcp.builtin/material.epic_set_texture_parameter
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material_instance.MaterialInstanceTools]
      Assigns a texture to a texture parameter on a material instance. Params:
      instance, name, value
  material.epic_set_vector_parameter:
    class_path: ue-mcp.builtin/material.epic_set_vector_parameter
    group: material
    description: >-
      [Epic editor_toolset.toolsets.material_instance.MaterialInstanceTools]
      Sets the value of a vector parameter on a material instance. Params:
      instance, name, value
  animation.read_anim_blueprint:
    class_path: ue-mcp.builtin/animation.read_anim_blueprint
    group: animation
    description: 'Read AnimBP structure. Params: assetPath (or path)'
  animation.read_montage:
    class_path: ue-mcp.builtin/animation.read_montage
    group: animation
    description: >-
      Read montage: sections, slot tracks and notifies. Each notify and notify
      state carries objectPath (the placed instance) and properties (its
      editable reflected properties as export text), so an existing one can be
      edited in place with editor(set_property, objectPath, propertyName,
      value). notifyStates lists the windowed notifies the way add_notify_state
      reports them. Params: assetPath (or path)
  animation.read_sequence:
    class_path: ue-mcp.builtin/animation.read_sequence
    group: animation
    description: >-
      Read anim sequence: length, rate scale, frames, root motion, curves and
      notifies. Each notify carries triggerTime and duration in seconds,
      trackIndex and trackName, and for a notify state its notifyStateClass and
      endTime. Resolves the same path forms asset(read) does. Batch: pass
      assetPaths (up to 1000) or directory (with recursive? and nameFilter?, a
      case-insensitive substring or * ? wildcard on the asset name) instead of
      assetPath to get one row per sequence in 'sequences', paged (default 50,
      max 200). A sequence that fails to load is its own row with success false
      and error; the call still succeeds and reports failedCount. fields selects
      the columns (assetPath is always kept); batch rows default to name,
      sequenceLength, rateScale, numberOfFrames, samplingFrameRate,
      rootMotionEnabled, notifyCount. Params: assetPath? (or path), assetPaths?,
      directory?, recursive?, nameFilter?, fields?, cursor?, limit?
  animation.scan_animation_tracks:
    class_path: ue-mcp.builtin/animation.scan_animation_tracks
    group: animation
    description: >-
      Scan AnimSequence bone-track counts. Params: directory?, recursive?,
      assetPaths?, skeletonPath?, targetTrackCount?, includeTrackNames?
  animation.read_blendspace:
    class_path: ue-mcp.builtin/animation.read_blendspace
    group: animation
    description: 'Read blendspace. Params: assetPath (or path)'
  animation.add_blend_sample:
    class_path: ue-mcp.builtin/animation.add_blend_sample
    group: animation
    description: >-
      Append a sample to a BlendSpace (#248). Params: assetPath (or path),
      animation, position?, x?, y?
  animation.set_blend_sample:
    class_path: ue-mcp.builtin/animation.set_blend_sample
    group: animation
    description: >-
      Move an existing BlendSpace sample or swap its animation (#272). Params:
      assetPath (or path), sampleIndex, at least one of position/x/y/animation
  animation.list:
    class_path: ue-mcp.builtin/animation.list
    group: animation
    description: >-
      List anim assets (AnimSequence, AnimMontage, AnimBlueprint, BlendSpace).
      directory scopes the read to one folder and is now honoured; it was
      advertised and ignored, so a scoped call used to get the whole project
      back. Params: directory?, recursive?, cursor?, limit?
  animation.create_montage:
    class_path: ue-mcp.builtin/animation.create_montage
    group: animation
    description: 'Create montage. Params: name, animSequencePath, packagePath?, onConflict?'
  animation.author_montages_batch:
    class_path: ue-mcp.builtin/animation.author_montages_batch
    group: animation
    description: >-
      Batch-author montages in one call: idempotent create, slot name,
      blend/rate/length properties, sections and notifies, then save. Every item
      reports success plus the failing stage
      (validate|create|slot|properties|sections|notifies|save) and error, so one
      bad item does not hide the rest. Newly created montages come back as a
      delete_asset_batch rollback. Each montage still holds the single segment
      create_montage builds. Params: items
  animation.create_anim_blueprint:
    class_path: ue-mcp.builtin/animation.create_anim_blueprint
    group: animation
    description: >-
      Create AnimBP. Params: name, skeletonPath, packagePath?, parentClass?,
      onConflict?
  animation.create_blendspace:
    class_path: ue-mcp.builtin/animation.create_blendspace
    group: animation
    description: >-
      Create blendspace (2D). Params: name, skeletonPath, packagePath?,
      axisHorizontal?, axisVertical?, horizontalMin?, horizontalMax?,
      verticalMin?, verticalMax?, onConflict?
  animation.create_blendspace_1d:
    class_path: ue-mcp.builtin/animation.create_blendspace_1d
    group: animation
    description: >-
      Create BlendSpace1D (#459). Params: name, skeletonPath, packagePath?,
      axisName?, axisMin?, axisMax?, gridNum?, onConflict?
  animation.populate_blendspace:
    class_path: ue-mcp.builtin/animation.populate_blendspace
    group: animation
    description: >-
      One-call axis params + samples authoring for BlendSpace 1D/2D. Axis params
      come from axis (with axisIndex), the per-axis blendspaceAxes list, or the
      flat create_blendspace keys (#459). Params: assetPath (or path), axis?,
      axisIndex?, blendspaceAxes?, axisHorizontal?, horizontalMin?,
      horizontalMax?, gridNumHorizontal?, axisVertical?, verticalMin?,
      verticalMax?, gridNumVertical?, samples?, clearExisting?
  animation.add_notify:
    class_path: ue-mcp.builtin/animation.add_notify
    group: animation
    description: >-
      Add notify. For PlayMontageNotify the notifyName is also written onto the
      spawned notify object so OnPlayMontageNotifyBegin broadcasts it (not
      'None'), and montage branching-point markers refresh (#528/#880). On a
      montage the PlayMontageNotify classes are added as BRANCHING POINT
      notifies, which is the only tick type
      UAnimNotify_PlayMontageNotify::BranchingPointNotify runs at, so
      OnPlayMontageNotifyBegin broadcasts without a montage reload; pass
      branchingPoint to force it either way, and read branchingPointMarkerCount
      in the response to see what the montage cached. notifyProperties writes
      EditAnywhere fields onto the spawned notify object and therefore requires
      a notifyClass that resolves. Params: assetPath (or path), notifyName,
      triggerTime, notifyClass?, notifyProperties?, branchingPoint?
  animation.remove_notify:
    class_path: ue-mcp.builtin/animation.remove_notify
    group: animation
    description: >-
      Remove notify(s) by name and/or class (#471). Pass at least one of
      notifyName/notifyClass; both filters AND. Idempotent: alreadyDeleted=true
      if no match. Params: assetPath (or path), notifyName?, notifyClass?
  animation.get_skeleton_info:
    class_path: ue-mcp.builtin/animation.get_skeleton_info
    group: animation
    description: 'Read skeleton. Params: assetPath (or path)'
  animation.list_sockets:
    class_path: ue-mcp.builtin/animation.list_sockets
    group: animation
    description: 'List sockets. Params: assetPath (or path)'
  animation.list_skeletal_meshes:
    class_path: ue-mcp.builtin/animation.list_skeletal_meshes
    group: animation
    description: >-
      List skeletal meshes. directory scopes the read to one folder and is now
      honoured; it was advertised and ignored, so a scoped call used to get the
      whole project back. Params: directory?, recursive?, cursor?, limit?
  animation.get_physics_asset:
    class_path: ue-mcp.builtin/animation.get_physics_asset
    group: animation
    description: 'Read physics asset. Params: assetPath (or path)'
  animation.create_sequence:
    class_path: ue-mcp.builtin/animation.create_sequence
    group: animation
    description: >-
      Create blank AnimSequence. Params: name, skeletonPath, packagePath?,
      numFrames?, frameRate?, onConflict?
  animation.set_bone_keyframes:
    class_path: ue-mcp.builtin/animation.set_bone_keyframes
    group: animation
    description: >-
      Set bone transform keyframes. Params: assetPath (or path), boneName,
      keyframes
  animation.bake_keyframes_batch:
    class_path: ue-mcp.builtin/animation.bake_keyframes_batch
    group: animation
    description: >-
      Bake per-bone keyframe arrays for many bones into an AnimSequence in one
      call. Auto-creates each bone track first (set_bone_keyframes silently
      leaves a T-pose if the track is missing), wraps the batch in one
      transaction, and raises if any bone fails instead of reporting hollow
      success (#540). Params: assetPath (or path), tracks, save?
  animation.reverse_sequence:
    class_path: ue-mcp.builtin/animation.reverse_sequence
    group: animation
    description: >-
      Create a time-reversed copy of an AnimSequence, or reverse it in place
      with inPlace=true. Bone tracks are rewritten through the animation data
      controller, float and transform curves are mirrored with their tangents,
      notifies move to length - time (a notify state to length - time -
      duration) and sync markers mirror the same way. A blendspace sample with
      RateScale -1 is not a substitute: it freezes under the non-legacy sample
      length calculation. cycleOffsetFrames or cycleOffsetSeconds (rounded to
      whole frames) then rotates the reversed loop so it starts that far in; the
      last key is rewritten to repeat the new first key. The destination is
      destinationPath, or name (default <Source>_Reversed) in packagePath
      (default the source's folder). onConflict=skip (default) returns an
      existing destination untouched, error refuses; it never overwrites.
      Returns path, numFrames, numKeys, frameRate, the applied cycle offset,
      reversed counts {boneTracks, floatCurves, transformCurves, notifies,
      notifyStates, syncMarkers}, and a delete_asset rollback, or for inPlace a
      reverse_sequence replay that restores it (#1162). Params: sourcePath,
      destinationPath?, name?, packagePath?, inPlace?, cycleOffsetFrames?,
      cycleOffsetSeconds?, onConflict?
  animation.get_bone_transforms:
    class_path: ue-mcp.builtin/animation.get_bone_transforms
    group: animation
    description: >-
      Read reference pose transforms for one, many, or ALL bones. Omit boneNames
      to return every bone with index/parentIndex/location/rotation/scale. With
      boneNames, returns only the named bones (#245). Params: skeletonPath (or
      assetPath, or path), boneNames?, space?
  animation.inspect_anim_nodes:
    class_path: ue-mcp.builtin/animation.inspect_anim_nodes
    group: animation
    description: >-
      Deep-dump the FAnimNode_* struct of anim graph nodes (PoseDriver
      PoseTargets/PoseAsset/RBF params/source bones, etc.) that read_anim_graph
      omits because it skips the 'Node' property (#657). Params: assetPath (or
      path), graphName?, nodeClass?
  animation.compare_curves_to_morph_targets:
    class_path: ue-mcp.builtin/animation.compare_curves_to_morph_targets
    group: animation
    description: >-
      Compare an AnimSequence/PoseAsset's curve names against a SkeletalMesh's
      morph target names. Returns curves[], morphTargets[], matched[],
      curvesWithoutMorph[], morphsWithoutCurve[] - verify authored curves drive
      morphs without Python (#656). Params: animPath (or assetPath),
      skeletalMeshPath (or meshPath)
  animation.set_montage_sequence:
    class_path: ue-mcp.builtin/animation.set_montage_sequence
    group: animation
    description: >-
      Replace the animation sequence in a montage slot. With segmentIndex,
      replaces only that one segment; without it, replaces every segment in the
      slot (#626). Params: assetPath (or path), animSequencePath, slotIndex?,
      segmentIndex?
  animation.set_montage_properties:
    class_path: ue-mcp.builtin/animation.set_montage_properties
    group: animation
    description: >-
      Set montage properties. Params: assetPath (or path), sequenceLength?,
      rateScale?, blendIn?, blendOut?
  animation.create_state_machine:
    class_path: ue-mcp.builtin/animation.create_state_machine
    group: animation
    description: >-
      Create state machine in AnimBP. Params: assetPath (or path), name?,
      graphName?
  animation.add_state:
    class_path: ue-mcp.builtin/animation.add_state
    group: animation
    description: >-
      Add state to a state machine. Params: assetPath (or path),
      stateMachineName, stateName, onConflict?
  animation.add_transition:
    class_path: ue-mcp.builtin/animation.add_transition
    group: animation
    description: >-
      Add directed transition between states. blendDuration and blendLogic are
      applied to the new transition as set_transition_blend applies them, and
      the result echoes the effective blendDuration and blendLogic. An existing
      transition is returned unchanged, with a warning when the requested blend
      differs. Params: assetPath (or path), stateMachineName, fromState,
      toState, blendDuration?, blendLogic?
  animation.set_state_animation:
    class_path: ue-mcp.builtin/animation.set_state_animation
    group: animation
    description: >-
      Assign anim asset to state. Params: assetPath (or path), stateMachineName,
      stateName, animAssetPath
  animation.set_transition_blend:
    class_path: ue-mcp.builtin/animation.set_transition_blend
    group: animation
    description: >-
      Set blend type/duration on transition. Params: assetPath (or path),
      stateMachineName, fromState, toState, blendDuration?, blendLogic?
  animation.set_transition_condition:
    class_path: ue-mcp.builtin/animation.set_transition_condition
    group: animation
    description: >-
      Set a transition's 'can enter transition' condition from a bool variable,
      keyed by transition (not graph name - every rule graph is named
      'Transition' so blueprint graph tools can only reach the first). Wires
      VariableGet(bool) -> bCanEnterTransition, replacing any prior condition.
      Identify the transition by transitionGuid (from
      add_transition/read_state_machine) OR fromState+toState (#707). Params:
      assetPath (or path), stateMachineName, variableName, transitionGuid?,
      fromState?, toState?, negate?
  animation.read_state_machine:
    class_path: ue-mcp.builtin/animation.read_state_machine
    group: animation
    description: 'Read state machine topology. Params: assetPath (or path), stateMachineName'
  animation.set_state_machine_entry:
    class_path: ue-mcp.builtin/animation.set_state_machine_entry
    group: animation
    description: >-
      Point the state machine's ENTRY node at a state, which is the only thing
      that gives a machine an initial state. create_state_machine and add_state
      never wired it, so a machine authored through the bridge compiled with no
      entry and produced the reference pose at runtime. There is no property
      behind this: it is the pin link from
      UAnimationStateMachineGraph::EntryNode to the state's input pin. An
      omitted or empty stateName clears the link instead, so set and clear are
      one pair. Reports previousEntryState, and unchanged=true on a replay.
      Params: assetPath (or path), stateMachineName, stateName?
  animation.remove_state:
    class_path: ue-mcp.builtin/animation.remove_state
    group: animation
    description: >-
      Remove a state from a state machine, together with every transition that
      touched it and the graphs they own - a transition whose endpoint is gone
      fails the blueprint compile. Returns removedTransitions so they can be
      replayed, and warns when the removed state was the entry state.
      Idempotent: alreadyDeleted=true when the state is not there. Params:
      assetPath (or path), stateMachineName, stateName
  animation.remove_transition:
    class_path: ue-mcp.builtin/animation.remove_transition
    group: animation
    description: >-
      Remove a transition and its rule graph. Address it by transitionGuid (from
      add_transition or read_state_machine) or by fromState plus toState, which
      can match several and removes all of them. A rule graph SHARED with
      another transition is left in place and counted in sharedRuleGraphsKept.
      Idempotent: alreadyDeleted=true when nothing matched. Params: assetPath
      (or path), stateMachineName, transitionGuid?, fromState?, toState?
  animation.remove_state_machine:
    class_path: ue-mcp.builtin/animation.remove_state_machine
    group: animation
    description: >-
      Remove a state machine node and everything inside it: its states, its
      transitions, each of their bound graphs, and the machine's own graph.
      Leaving a bound graph behind after its node is gone is what makes the next
      compile assert, so the teardown is explicit rather than left to the node.
      Idempotent: alreadyDeleted=true when the machine is not there. Params:
      assetPath (or path), stateMachineName
  animation.read_anim_graph:
    class_path: ue-mcp.builtin/animation.read_anim_graph
    group: animation
    description: >-
      Read AnimBP AnimGraph nodes with properties & pins. Params: assetPath (or
      path), graphName?
  animation.add_curve:
    class_path: ue-mcp.builtin/animation.add_curve
    group: animation
    description: 'Add float curve to AnimSequence. Params: assetPath (or path), curveName'
  animation.remove_curve:
    class_path: ue-mcp.builtin/animation.remove_curve
    group: animation
    description: >-
      Remove a float curve from an AnimSequence through the animation data
      controller, so the model, the compressed data and the editor stay in step.
      Reports removedKeyCount, which is what the rollback cannot restore:
      add_curve puts back an empty curve of the same name and the keys have to
      be replayed with set_anim_curve_keys. Idempotent: alreadyDeleted=true when
      there is no such curve, and the miss lists the curves that do exist.
      Params: assetPath (or path), curveName
  animation.set_anim_curve_keys:
    class_path: ue-mcp.builtin/animation.set_anim_curve_keys
    group: animation
    description: >-
      Set float-curve key VALUES on an AnimSequence (add_curve only creates an
      empty named curve - it cannot set keyframe values). Adds the curve if
      missing, then replaces its keys. Use for authoring Distance/Speed/any
      float curve directly (#712). Params: assetPath (or path), curveName, keys,
      interpolation?
  animation.apply_animation_modifier:
    class_path: ue-mcp.builtin/animation.apply_animation_modifier
    group: animation
    description: >-
      Instantiate a UAnimationModifier subclass and run it on an AnimSequence.
      Headline use: modifierClass='DistanceCurveModifier' bakes a Distance curve
      from the clip's root motion for distance matching (needs root motion baked
      first - see bake_root_motion_from_bone). Registers the modifier on the
      sequence so it re-applies on reimport. props sets the modifier's
      EditAnywhere fields (e.g. DistanceCurveModifier: {CurveName,
      Axis:'XY'|'X'|..., bStopAtEnd, StopSpeedThreshold, SampleRate}). Note:
      DistanceCurveModifier ships in the 'Animation Locomotion Library' plugin
      (off by default) - enable it first (#712). Params: assetPath (or path),
      modifierClass (or modifier), props?
  animation.set_montage_slot:
    class_path: ue-mcp.builtin/animation.set_montage_slot
    group: animation
    description: >-
      Set slot name on a montage track. Params: assetPath (or path), slotName,
      trackIndex?
  animation.remove_montage_section:
    class_path: ue-mcp.builtin/animation.remove_montage_section
    group: animation
    description: >-
      Remove a composite section from a montage through
      UAnimMontage::DeleteAnimCompositeSection, then clear every OTHER section
      whose next-section link pointed at it, because a montage that jumps to a
      section which no longer exists stops dead. The cleared ones come back in
      clearedNextLinks so they can be re-pointed with asset(set_property) on
      CompositeSections[i].NextSectionName. Idempotent: alreadyDeleted=true when
      there is no such section, and the miss lists the sections that exist.
      Params: assetPath (or path), sectionName
  animation.add_notify_state:
    class_path: ue-mcp.builtin/animation.add_notify_state
    group: animation
    description: >-
      Add a windowed notify (a UAnimNotifyState) to a sequence or montage: the
      form that spans a duration and fires NotifyBegin, NotifyTick and
      NotifyEnd, which is what a combo window, a hit window or a timed particle
      effect is built from. add_notify only ever writes the instant form, so
      this was unreachable. notifyStateClass takes a class name, a bare suffix
      ('TimedParticleEffect' resolves AnimNotifyState_TimedParticleEffect), or a
      full path, and an unresolved one is refused rather than silently dropped.
      notifyProperties are validated against the class before anything is
      written. Returns objectPath for further editor(set_property) writes, and
      the full notifyStates list on the asset. Params: assetPath (or path),
      notifyName, notifyStateClass, triggerTime, duration, notifyProperties?,
      branchingPoint?
  animation.remove_notify_state:
    class_path: ue-mcp.builtin/animation.remove_notify_state
    group: animation
    description: >-
      Remove windowed notifies by name and/or class; both filters apply together
      and at least one is required. This is a separate action rather than a flag
      on remove_notify because that handler's class filter only ever inspects
      FAnimNotifyEvent::Notify, so a notify STATE is invisible to it.
      Idempotent: alreadyDeleted=true when nothing matched. Params: assetPath
      (or path), notifyName?, notifyStateClass?
  animation.set_sync_markers:
    class_path: ue-mcp.builtin/animation.set_sync_markers
    group: animation
    description: >-
      Author an AnimSequence's sync markers: apply the list, refresh the
      sequence's marker index, register the names on the skeleton, then read
      back what actually landed. A plain property write reaches
      AuthoredSyncMarkers and leaves it inert, because the runtime reads
      UniqueMarkerNames and the index built by
      RefreshSyncMarkerDataFromAuthored, and the editor only offers marker names
      the skeleton has seen. markerMode 'replace' (default) makes the array the
      whole list, so an empty array clears them; 'merge' adds or moves only the
      named ones. The whole batch is validated against the clip length before
      anything is written. Params: assetPath (or path), at least one of
      markers/removeMarkers, markerMode?
  animation.add_montage_section:
    class_path: ue-mcp.builtin/animation.add_montage_section
    group: animation
    description: >-
      Add composite section to montage. Pass segmentIndex (with slotName or
      slotIndex) to anchor the section to a specific segment: its startTime is
      taken from that segment and it stays linked, so inserting a segment ahead
      of it moves the marker with its animation. Without segmentIndex the
      section is a bare absolute-time marker (#826). Params: assetPath (or
      path), sectionName, startTime?, linkedSection?, segmentIndex?, slotName?,
      slotIndex?, onConflict?
  animation.add_montage_segment:
    class_path: ue-mcp.builtin/animation.add_montage_segment
    group: animation
    description: >-
      Append (or insert) an animation segment into a montage slot's anim track.
      This is the only way to get more than one animation into a montage:
      create_montage builds exactly one segment, set_montage_sequence replaces
      rather than appends, and add_montage_section only writes a time marker
      with no animation behind it. Creates the named slot when it does not
      exist. Validates that the source shares the montage's skeleton and matches
      the track's additive type, then relays out the segments, refreshes linked
      sections and notifies, and rewrites the montage length (#826). Params:
      assetPath (or path), animSequencePath, slotName?, slotIndex?, startPos?,
      endPos?, playRate?, loopCount?, insertIndex?
  animation.remove_montage_segment:
    class_path: ue-mcp.builtin/animation.remove_montage_segment
    group: animation
    description: >-
      Remove a segment from a montage slot by index, then relay out the
      remaining segments and rewrite the montage length. Idempotent:
      alreadyDeleted=true when the slot already holds no segments (#826).
      Params: assetPath (or path), segmentIndex, slotName?, slotIndex?
  animation.list_montage_segments:
    class_path: ue-mcp.builtin/animation.list_montage_segments
    group: animation
    description: >-
      List every slot's segments on a montage so a caller can address them by
      index: animation path, startPos/endPos trim, playRate, loopCount, track
      position and length per segment, plus the sections with the slot and
      segment each one links to (#826). Params: assetPath (or path), slotName?
  animation.create_ik_rig:
    class_path: ue-mcp.builtin/animation.create_ik_rig
    group: animation
    description: >-
      Create IKRigDefinition asset, optionally with retargetRoot + chains[].
      Params: name, skeletalMeshPath, packagePath?, retargetRoot?, chains?,
      onConflict?
  animation.read_ik_rig:
    class_path: ue-mcp.builtin/animation.read_ik_rig
    group: animation
    description: >-
      Read an IK Rig's preview mesh, skeleton roots/bones, ancestry-validated
      chains and goal assignments, concrete goals, exclusions, and structured
      solver/FBIK effector state. Params: assetPath (or path)
  animation.configure_ik_rig:
    class_path: ue-mcp.builtin/animation.configure_ik_rig
    group: animation
    description: >-
      UE 5.8 only. Author an existing IK Rig through UIKRigController with
      strict bone, ancestry, goal, and setting validation, native readback, one
      transaction, and checked save; older engines return
      unsupported_engine_version. autoSetup='retarget' installs the native
      retarget definition; 'full_body' installs the retarget definition then
      Full Body IK before requested desired-state upserts. Params: rigPath, at
      least one of
      autoSetup/retargetRoot/rootMotionBone/chains/fullBodyIK/exclusions
  animation.create_control_rig:
    class_path: ue-mcp.builtin/animation.create_control_rig
    group: animation
    description: >-
      Create a Control Rig Blueprint from a skeletal mesh or a skeleton through
      the engine's Control Rig factory, the same path as the Content Browser's
      Create Control Rig: the source's bone hierarchy is imported and the
      preview mesh set. Pass exactly one source. name defaults to
      '<Source>_CtrlRig' and packagePath to the source's folder. onConflict=skip
      (default) returns the existing asset, error refuses; it never overwrites.
      Returns a delete_asset rollback (#1133). Params: skeletalMeshPath?,
      skeletonPath?, name?, packagePath?, onConflict?
  animation.list_control_rig_variables:
    class_path: ue-mcp.builtin/animation.list_control_rig_variables
    group: animation
    description: 'List ControlRig variables and hierarchy. Params: assetPath (or path)'
  animation.read_control_rig_graph:
    class_path: ue-mcp.builtin/animation.read_control_rig_graph
    group: animation
    description: >-
      Read a Control Rig's RigVM models: every graph with its nodes (name, node
      path, class), each node's pins (name, pin path, cppType, direction,
      execute flag, default value, nested sub-pins) and the links between them,
      plus full member-variable metadata (type, subtype, array-ness, default,
      public/read-only). list_control_rig_variables only ever reported a node
      COUNT, which is not enough to verify solver wiring (#774). Params:
      assetPath (or path), graphName?, includePins?, includeDefaults?,
      includeLinks?, limit?
  animation.read_control_rig_hierarchy:
    class_path: ue-mcp.builtin/animation.read_control_rig_hierarchy
    group: animation
    description: >-
      Read a Control Rig's per-element hierarchy metadata: each element's name,
      type (Bone|Control|Null|Curve...), index, and parent (#619). Params:
      assetPath (or path)
  animation.begin_control_rig_edit:
    class_path: ue-mcp.builtin/animation.begin_control_rig_edit
    group: animation
    description: >-
      UE 5.8 only. Create a Sequencer Control Rig editing session over a source
      AnimSequence; native returns unsupported_engine_version on older engines.
      Baseline first: before this call, reuse or create a Control Rig for the
      target character, bind/import the exact target skeleton, add the intended
      controls, author Forward Solve, add Backward/Inverse Solve, verify it with
      read_control_rig_hierarchy/read_control_rig_graph, and pass an unchanged
      source round-trip. For a new baseline, the Unreal 5.8 ControlRig toolset
      (wrapped on this category, or through epic(call_tool)) creates the rig,
      imports the skeleton bones, adds controls and adds a backward solve graph;
      a newly created rig alone is not usable. There is no silent fallback to
      raw bone-key authoring. rigMode='fk' uses UFKControlRig only when
      generated FK controls are sufficient; rigMode='asset' requires the
      verified controlRigPath and rejects rigs without inverse execution.
      bindingTag is the stable natural key for replay. onConflict is skip|error
      (default error); existing sessions are never modified. layered defaults
      false. startFrame is inclusive and endFrame is exclusive. Returns the
      resolved bindingTag/binding GUID, rig, frame range, controls and
      created/existed status. Params: sequencePath, skeletalMeshPath,
      sourceAnimationPath, rigMode?, controlRigPath?, layered?, startFrame?,
      endFrame?, displayRate?, bindingTag?, onConflict?
  animation.read_control_rig_edit:
    class_path: ue-mcp.builtin/animation.read_control_rig_edit
    group: animation
    description: >-
      UE 5.8 only. Read transform, bool, float/scale-float, and integer/enum
      controls from a Control Rig editing session without changing editor state;
      native returns unsupported_engine_version on older engines and has no
      silent fallback. Scalar samples return value instead of transform. Control
      metadata includes native controlType, animatable, and enum path/options
      where applicable. Returns session identity, layered mode, range/rate,
      filtered control metadata, and requested frame samples. Params:
      sequencePath, bindingTag, controlNames?, frame?, frames?, space?
  animation.capture_control_rig_pose:
    class_path: ue-mcp.builtin/animation.capture_control_rig_pose
    group: animation
    description: >-
      UE 5.8 only. Capture current live local UControlRig values without
      opening, scrubbing, refreshing, or evaluating Sequencer; native returns
      unsupported_engine_version on older engines and has no silent fallback.
      The addressed LevelSequence must already be focused. Omit controlNames to
      capture the current Control Rig selection. Returns an immutable
      captureVersion=1 snapshot with sequence, binding, track, section,
      rig-object, current-frame, selection, control-type, and typed-value
      identity for later propagate_pose validation. Params: sequencePath,
      bindingTag, controlNames?
  animation.apply_control_rig_edits:
    class_path: ue-mcp.builtin/animation.apply_control_rig_edits
    group: animation
    description: >-
      UE 5.8 only. Apply typed Control Rig edits in one transaction; native
      returns unsupported_engine_version on older engines. There is no silent
      fallback to raw bone tracks. set_keys writes strictly ordered full
      per-frame transforms from normalized quaternions and preserves
      shortest-arc quaternion continuity. A set operation writes one full
      absolute transform at frame or frames. An offset operation applies
      translation/rotation/scale deltas across an inclusive frame range with
      optional edge blends. propagate_pose validates caller-held baseline and
      accepted live snapshots from the same session, exact rig instance, frame,
      and complete control set, then keys only controls whose values changed
      across each control's explicit original donorFrames. Snapshot selection is
      provenance metadata; the explicit propagation controls are authoritative.
      mode='fixed' copies the accepted changed channels; mode='local_delta'
      preserves donor motion while applying the captured local delta. Bool,
      enum, and int controls support fixed only. contact_lock densely constrains
      a translatable driver control, or an optional driven bone/socket
      reference, to a fixed component-space target with smooth edge blends and
      optional pole/control stabilization. Driver and stabilizer keys are read
      back transactionally. A drivenReference contact returns
      verification='bake_and_analyze_required'; bake it and analyze every
      constrained frame before accepting the bone/socket result. set_bool,
      set_float, and set_int key matching scalar controls; enum controls use
      set_int with one of the integer values reported in enumOptions.
      Sequencer's current interpolation mode is retained. Returns per-operation
      counts, affected controls/frames and changedChannels; a failed
      key/readback batch is undone. Params: sequencePath, bindingTag, operations
  animation.bake_control_rig_edit:
    class_path: ue-mcp.builtin/animation.bake_control_rig_edit
    group: animation
    description: >-
      UE 5.8 only. Bake the evaluated Control Rig session to a new AnimSequence
      asset; native returns unsupported_engine_version on older engines and has
      no raw-track fallback. outputAssetPath is the output natural key;
      onConflict is skip|error (default error), never overwrite. createLink=true
      links the AnimSequence and the LevelSequence through the engine's export
      and saves the LevelSequence, which is otherwise unchanged. Returns output
      asset metadata, frame/rate counts, createdLink, sequenceModified, and
      delete-created-asset rollback. Params: sequencePath, bindingTag,
      outputAssetPath, frameRate?, createLink?, onConflict?
  animation.analyze_animation:
    class_path: ue-mcp.builtin/animation.analyze_animation
    group: animation
    description: >-
      Cross-version, data-driven AnimSequence inspection using the native
      animation APIs available in the compiled engine. Samples an AnimSequence
      and reports deterministic numeric motion diagnostics without Python or
      viewport inference. Returns source/rate/range metadata, sampled
      local/component transforms, root-motion and continuity metrics, and any
      written analysis artifacts. facingBones samples the component-space vector
      from boneA to boneB at every sampled frame, rotates it into the root
      bone's frame, and reports its yaw per sample (facingYawDegrees; 0 is root
      +X, 90 is root +Y) and over the clip in summary.facing: averageYawDegrees
      (circular mean), minYawDegrees, maxYawDegrees, spreadDegrees,
      resultantLength and degenerateSampleCount for samples where the vector is
      vertical. Params: assetPath (or path), skeletalMeshPath?, boneNames?,
      frames?, sampleRate?, loop?, facingBones?, outputDirectory?
  animation.set_root_motion:
    class_path: ue-mcp.builtin/animation.set_root_motion
    group: animation
    description: >-
      Set root motion settings on AnimSequence. Params: assetPath (or path),
      enableRootMotion?, forceRootLock?, useNormalizedRootMotionScale?,
      rootMotionRootLock?
  animation.begin_skeleton_edit:
    class_path: ue-mcp.builtin/animation.begin_skeleton_edit
    group: animation
    description: >-
      Open a batched bone-editing session over a skeletal mesh's reference
      skeleton. NOTHING is written until commit_skeleton_edit: a per-edit commit
      would re-derive the reference skeleton once per change and can leave a
      half-edited hierarchy, which is why this mirrors the begin/apply/bake
      lifecycle the Control Rig actions already use. sessionTag is the stable
      key every later call addresses and defaults to Skel_<MeshName>; reopening
      the same tag on the same mesh is idempotent. Returns the current bone
      list, the baseline bone count, and how many bones have skinned vertices.
      Params: skeletalMeshPath, sessionTag?
  animation.edit_skeleton_bones:
    class_path: ue-mcp.builtin/animation.edit_skeleton_bones
    group: animation
    description: >-
      Apply a whole batch of hierarchy edits to an open session, validating
      every entry against the state its predecessors leave BEFORE mutating
      anything, so a bad entry at position nine does not leave the first eight
      applied. Removing a bone that has children, or that mesh sections skin
      vertices to, is refused with the dependents listed unless removeChildren
      or force says otherwise; a reparent that would form a cycle names the
      offending bone. Returns a per-edit changed/alreadyApplied row and an
      inverse-edit rollback. Params: sessionTag?, skeletalMeshPath?, edits,
      force?
  animation.commit_skeleton_edit:
    class_path: ue-mcp.builtin/animation.commit_skeleton_edit
    group: animation
    description: >-
      Write the session's batched edits into the skeletal mesh and its skeleton
      in one transaction, and save both packages. This is the ONLY call that
      touches the assets. A session with no pending edits closes without
      dirtying anything. The rollback is flagged lossy on purpose: skin weights
      and dependent-asset fix-ups cannot be reversed by replaying inverse edits.
      Params: sessionTag?, skeletalMeshPath?
  animation.cancel_skeleton_edit:
    class_path: ue-mcp.builtin/animation.cancel_skeleton_edit
    group: animation
    description: >-
      Discard an open session's working copy without writing; the assets on disk
      are untouched. Cancelling a session that is not open reports alreadyClosed
      rather than failing, so replaying a rollback is safe. Returns the
      discarded edits so they can be re-sent after a fix. Params: sessionTag?,
      skeletalMeshPath?
  animation.set_bone_retargeting:
    class_path: ue-mcp.builtin/animation.set_bone_retargeting
    group: animation
    description: >-
      Set each bone's translation retargeting mode, which lives in the
      skeleton's private BoneTree and has no addressable UPROPERTY, so
      set_property cannot reach it. Omitting bones applies to every bone;
      includeChildren uses the engine's own recursive setter. Returns the prior
      and new mode per bone, and a per-bone restore rollback that replays
      through this same action. Params: skeletonPath, at least one of
      mode/restore, bones?, bone?, includeChildren?
  animation.author_blend_profile:
    class_path: ue-mcp.builtin/animation.author_blend_profile
    group: animation
    description: >-
      Create a blend profile if it is absent and write its per-bone scales. A
      UBlendProfile is a per-skeleton subobject, so asset(set_property) can
      neither create it nor address the per-bone map. remove deletes the profile
      and reports every entry it destroyed, so the inverse can rebuild it.
      Returns the full entry list plus the skeleton's profile names. Params:
      skeletonPath, profileName, operation?, newProfileName?, mode?, entries?,
      removeEntries?
  animation.edit_curve_metadata:
    class_path: ue-mcp.builtin/animation.edit_curve_metadata
    group: animation
    description: >-
      Author the skeleton curve metadata that compare_curves_to_morph_targets
      could only read, including the material and morph-target flags that drive
      curves into materials and morphs. The whole batch validates first, and
      every operation is idempotent: adding an existing curve or removing an
      absent one reports rather than errors. Returns the full curve metadata
      table after the edit. Params: skeletonPath, at least one of
      add/remove/rename/flags
  animation.register_compatible_skeleton:
    class_path: ue-mcp.builtin/animation.register_compatible_skeleton
    group: animation
    description: >-
      Register, or with remove=true unregister, another skeleton as compatible,
      so its animations are usable on this one. This closes the loop asset(diff)
      opens: diff two skeletons for the hierarchy delta, then act on it. The
      engine call has been exercised in this repo's tests for a long time and
      was simply never shipped as an action. Returns the compatible list before
      and after and, per entry, whether the engine's own editor compatibility
      check agrees plus the source's bone count. Params: skeletonPath, at least
      one of compatibleSkeletonPath/compatibleSkeletonPaths, remove?
  animation.add_virtual_bone:
    class_path: ue-mcp.builtin/animation.add_virtual_bone
    group: animation
    description: 'Add virtual bone. Params: skeletonPath, sourceBone, targetBone'
  animation.remove_virtual_bone:
    class_path: ue-mcp.builtin/animation.remove_virtual_bone
    group: animation
    description: 'Remove virtual bone. Params: skeletonPath, virtualBoneName'
  animation.create_composite:
    class_path: ue-mcp.builtin/animation.create_composite
    group: animation
    description: >-
      Create AnimComposite. Params: name, skeletonPath, packagePath?,
      onConflict?
  animation.list_modifiers:
    class_path: ue-mcp.builtin/animation.list_modifiers
    group: animation
    description: 'List applied animation modifiers. Params: assetPath (or path)'
  animation.create_ik_retargeter:
    class_path: ue-mcp.builtin/animation.create_ik_retargeter
    group: animation
    description: >-
      Create IKRetargeter asset and (default) initialize the UE 5.7 ops stack:
      assigns sourceRig+targetRig to all ops, runs AutoMapChains. Returns
      chainsMapped count (#246). Params: name, packagePath?, sourceRig?,
      targetRig?, autoMapChains?, onConflict?
  animation.read_ik_retargeter:
    class_path: ue-mcp.builtin/animation.read_ik_retargeter
    group: animation
    description: >-
      Read an IK Retargeter's source/target rigs and preview meshes, flattened
      and per-op chain mappings, typed op stack, and all named/current pose
      offsets when the compiled engine exposes them. Each op now carries its
      `settings` object in full, reflected off the op's own settings struct: the
      Root Motion op's RootMotionSource, the Pelvis Motion op's alphas and
      offsets, and the FK Chains op's per-chain RotationMode and
      TranslationMode. Those settings decide what a retarget actually does, and
      they were the part only Python could see (#1000) (#246). Params: assetPath
      (or path)
  animation.configure_ik_retargeter:
    class_path: ue-mcp.builtin/animation.configure_ik_retargeter
    group: animation
    description: >-
      UE 5.8 only. `ops` writes the per-op settings that decide what a retarget
      does and that nothing else could reach: pass {name or index, enabled?,
      settings?, chainSettings?}. `settings` writes properties on the op's own
      settings struct; `chainSettings` merges per-chain FK properties into the
      chain you name rather than replacing the whole ChainsToRetarget list, so
      setting one chain's RotationMode leaves the others alone. Every op write
      is validated before the transaction opens and applied inside it, so a bad
      property name changes nothing (#1000/#1034). Configure an existing IK
      Retargeter through UIKRetargeterController with the correct default-op and
      per-op rig assignment order, auto/manual chain mappings, named pose
      authoring, processor validation, native readback, transaction rollback,
      and checked save; older engines return unsupported_engine_version.
      Whole-pose auto-align resets that pose first: create a new pose or pass
      pose.reset=true to acknowledge replacement, then manual offsets are
      applied. Params: retargeterPath, sourceRig?, targetRig?,
      sourcePreviewMesh?, targetPreviewMesh?, ensureDefaultOps?, autoMapMode?,
      forceRemap?, chainMappings?, ops?, pose?
  animation.set_ik_rig_mesh:
    class_path: ue-mcp.builtin/animation.set_ik_rig_mesh
    group: animation
    description: >-
      Set the preview/source skeletal mesh on an EXISTING IK Rig (#701). Params:
      rigPath (or assetPath), meshPath (or skeletalMesh)
  animation.set_ik_retargeter_rig:
    class_path: ue-mcp.builtin/animation.set_ik_retargeter_rig
    group: animation
    description: >-
      Set the source or target IK Rig on an EXISTING IK Retargeter (#703).
      Params: retargeterPath (or assetPath), rigPath (or ikRig), side?
  animation.auto_align_retarget_pose:
    class_path: ue-mcp.builtin/animation.auto_align_retarget_pose
    group: animation
    description: >-
      Auto-align all bones of the source/target retarget pose (chain-to-chain) -
      fixes a retargeter that outputs a static reference pose (#701). Params:
      retargeterPath (or assetPath), side?
  animation.reset_retarget_pose:
    class_path: ue-mcp.builtin/animation.reset_retarget_pose
    group: animation
    description: >-
      Reset the current retarget pose (all bones) to the reference pose (#701).
      Params: retargeterPath (or assetPath), side?
  animation.batch_retarget_animations:
    class_path: ue-mcp.builtin/animation.batch_retarget_animations
    group: animation
    description: >-
      Bake validated source AnimSequences onto the target skeleton through an IK
      Retargeter (RunBatchRetarget), save every output, and roll back newly
      created outputs if the batch is incomplete or unsavable. An existing
      output name gets a unique one; nothing is overwritten. Returns mapping
      completeness and every unmapped target chain so partial retargets are
      explicit; pass requireCompleteMapping=true only when the target should
      have no intentional extra chains (#701). Params: retargeterPath (or
      assetPath), sourceMesh, targetMesh, animPaths, outputPath?, prefix?,
      suffix?, requireCompleteMapping?
  animation.set_anim_blueprint_skeleton:
    class_path: ue-mcp.builtin/animation.set_anim_blueprint_skeleton
    group: animation
    description: 'Set target skeleton on AnimBP. Params: assetPath, skeletonPath'
  animation.read_bone_track:
    class_path: ue-mcp.builtin/animation.read_bone_track
    group: animation
    description: >-
      Read bone transform samples from AnimSequence. Params: assetPath,
      boneName, frames?
  animation.create_pose_search_database:
    class_path: ue-mcp.builtin/animation.create_pose_search_database
    group: animation
    description: >-
      Create a PoseSearchDatabase asset (motion matching). Pass skeletonPath and
      it authors the matching PoseSearchSchema (<name>_Schema, default channels)
      alongside it, which is what makes the database indexable at all; pass
      schemaPath to reuse an existing one. A schema that cannot index (no
      skeleton, or no feature channels) is refused rather than assigned, because
      the editor then reports the DATABASE as the invalid asset. Without either,
      the database is created empty and unindexable and says so in note (#833).
      Params: name, packagePath?, schemaPath?, skeletonPath?, onConflict?
  animation.set_pose_search_schema:
    class_path: ue-mcp.builtin/animation.set_pose_search_schema
    group: animation
    description: >-
      Set the Schema on an existing PoseSearchDatabase. Params: assetPath (or
      path), schemaPath
  animation.add_pose_search_sequence:
    class_path: ue-mcp.builtin/animation.add_pose_search_sequence
    group: animation
    description: >-
      Append an AnimSequence/AnimComposite/AnimMontage/BlendSpace to a
      PoseSearchDatabase, with optional per-clip flags (#684). Params: assetPath
      (or path), sequencePath, mirror?, disableReselection?, sampleStart?,
      sampleEnd?, enabled?
  animation.set_pose_search_clips:
    class_path: ue-mcp.builtin/animation.set_pose_search_clips
    group: animation
    description: >-
      Author the whole clip list of a PoseSearchDatabase in one call (the
      'duplicate a stock PSD, swap its clips' pipeline step). Replaces the list
      by default. Each clip carries per-entry flags. Follow with
      build_pose_search_index (#684). Params: assetPath (or path), clips,
      clearExisting?
  animation.build_pose_search_index:
    class_path: ue-mcp.builtin/animation.build_pose_search_index
    group: animation
    description: 'Build (or rebuild) the search index. Params: assetPath (or path), wait?'
  animation.read_pose_search_database:
    class_path: ue-mcp.builtin/animation.read_pose_search_database
    group: animation
    description: >-
      Inspect a PoseSearchDatabase: schema, animation entries, cost biases,
      tags. Params: assetPath (or path)
  animation.set_pose_search_database_settings:
    class_path: ue-mcp.builtin/animation.set_pose_search_database_settings
    group: animation
    description: >-
      Tune a PoseSearchDatabase: cost biases, KD-tree neighbours, search mode,
      PCA components, normalization set. Params: assetPath (or path),
      continuingPoseCostBias?, baseCostBias?, loopingCostBias?,
      kdTreeQueryNumNeighbors?, numberOfPrincipalComponents?, poseSearchMode?,
      normalizationSetPath?
  animation.create_pose_search_schema:
    class_path: ue-mcp.builtin/animation.create_pose_search_schema
    group: animation
    description: >-
      Create a PoseSearchSchema (the feature definition a database indexes
      against). Binds a skeleton (and optional mirror table) and, by default,
      adds Trajectory+Pose default channels so the schema is immediately
      buildable. Refine with add_pose_search_schema_*_channel. Params: name,
      skeletonPath, packagePath?, mirrorDataTablePath?, sampleRate?,
      addDefaultChannels?, onConflict?
  animation.add_pose_search_schema_pose_channel:
    class_path: ue-mcp.builtin/animation.add_pose_search_schema_pose_channel
    group: animation
    description: >-
      Add a Pose feature channel to a schema (samples named bones for
      velocity/position/rotation/phase) (motion matching). Params: schemaPath
      (or assetPath), bones, weight?
  animation.add_pose_search_schema_trajectory_channel:
    class_path: ue-mcp.builtin/animation.add_pose_search_schema_trajectory_channel
    group: animation
    description: >-
      Add a Trajectory feature channel to a schema (past/future motion samples).
      Params: schemaPath (or assetPath), samples, weight?
  animation.read_pose_search_schema:
    class_path: ue-mcp.builtin/animation.read_pose_search_schema
    group: animation
    description: >-
      Inspect a PoseSearchSchema: skeleton(s), mirror table, sample rate,
      feature channels. Params: schemaPath (or assetPath)
  animation.create_mirror_data_table:
    class_path: ue-mcp.builtin/animation.create_mirror_data_table
    group: animation
    description: >-
      Create a MirrorDataTable for a skeleton (needed for mirrored poses in
      motion matching / mirror nodes). Auto-derives bone-pair rows from
      find/replace expressions (defaults to UE mannequin _l/_r suffix swap).
      Params: name, skeletonPath, packagePath?, expressions?, mirrorAxis?,
      mirrorRootMotion?, onConflict?
  animation.read_mirror_data_table:
    class_path: ue-mcp.builtin/animation.read_mirror_data_table
    group: animation
    description: >-
      Inspect a MirrorDataTable: skeleton and bone-pair rows (name ->
      mirroredName). Params: assetPath (or path)
  animation.create_pose_search_normalization_set:
    class_path: ue-mcp.builtin/animation.create_pose_search_normalization_set
    group: animation
    description: >-
      Create a PoseSearchNormalizationSet grouping databases so they normalize
      their cost space together (consistent blending across a locomotion set).
      Assign it via set_pose_search_database_settings(normalizationSetPath)
      (motion matching). Params: name, packagePath?, databases?, onConflict?
  animation.add_motion_matching_node:
    class_path: ue-mcp.builtin/animation.add_motion_matching_node
    group: animation
    description: >-
      Add a Motion Matching node to an AnimBP AnimGraph and point it at a
      PoseSearchDatabase (the runtime node that searches the database each
      frame). Connects its output to the Output Pose by default. For
      chooser-driven database selection, bind an anim-node function that calls
      SetDatabasesToSearch. Params: assetPath (or path), databasePath?,
      graphName?, connectToOutput?, blendTime?
  animation.add_pose_history_node:
    class_path: ue-mcp.builtin/animation.add_pose_history_node
    group: animation
    description: >-
      Add a Pose History (PoseSearchHistoryCollector) node to an AnimBP
      AnimGraph - the Motion Matching node needs it in the graph to query
      pose/trajectory history. Defaults to self-generated trajectory (no
      external trajectory pin needed) and inserts itself into the pose chain
      feeding the Output Pose. Params: assetPath (or path), graphName?,
      poseCount?, samplingInterval?, generateTrajectory?,
      trajectoryHistoryCount?, trajectoryPredictionCount?, insertBeforeOutput?
  animation.set_motion_matching_chooser:
    class_path: ue-mcp.builtin/animation.set_motion_matching_chooser
    group: animation
    description: >-
      Drive the Motion Matching node's Database from a ChooserTable so the
      database is selected at runtime by character state. Wires a thread-safe
      EvaluateChooser (result typed to PoseSearchDatabase) into the MM node's
      Database pin. contextSource selects what the chooser reads its columns
      from: 'self' (default, the anim instance - choosers branching on AnimBP
      variables) or 'pawn' (the owning pawn via TryGetPawnOwner - choosers
      branching on character/pawn state). Params: assetPath (or path),
      chooserPath (or table), graphName?, contextSource?
  animation.create_skeleton:
    class_path: ue-mcp.builtin/animation.create_skeleton
    group: animation
    description: >-
      Create a real USkeleton from a SkeletalMesh through the Unreal skeleton
      factory. The factory assigns the new skeleton to that mesh, then both
      packages are saved. An existing destination is an onConflict=skip
      idempotency hit only when the mesh already points at it and the reference
      skeleton has exactly the same bone count, names in index order, and parent
      indexes; reference-pose transforms are not compared. Otherwise the action
      refuses to repurpose it. If either save fails, it restores and saves the
      mesh's previous skeleton reference, then deletes the new skeleton when
      safe; an incomplete cleanup returns a machine-readable recovery
      descriptor. Returns the previous skeleton and a lossy rollback that
      restores the mesh association; delete the created skeleton separately only
      after confirming nothing references it. Params: name, skeletalMeshPath,
      packagePath?, onConflict?
  animation.add_sequence_evaluator:
    class_path: ue-mcp.builtin/animation.add_sequence_evaluator
    group: animation
    description: >-
      Add a Sequence Evaluator node (explicit-time player) to an AnimBP graph -
      the node distance matching drives by setting its ExplicitTime each frame.
      graphName can be the top-level AnimGraph or a state's inner graph (pass
      the state name). Defaults bTeleportToExplicitTime=false so time advances
      and root motion extracts. Connects to the Output Pose by default. Returns
      nodeGuid for bind_anim_node_function (#713). Params: assetPath (or path),
      sequencePath?, graphName?, explicitTime?, shouldLoop?,
      teleportToExplicitTime?, connectToOutput?
  animation.bind_anim_node_function:
    class_path: ue-mcp.builtin/animation.bind_anim_node_function
    group: animation
    description: >-
      Bind a thread-safe anim-node function to an anim graph node's update slot
      - the mechanism distance matching uses to advance a Sequence Evaluator's
      explicit time each frame (function calls
      AnimDistanceMatchingLibrary::DistanceMatchToTarget /
      AdvanceTimeByDistanceMatching). The function must already exist on the
      AnimBP (create it as a BlueprintThreadSafe function first). Identify the
      node by nodeGuid (from add_sequence_evaluator / add_*_node) (#713).
      Params: assetPath (or path), nodeGuid (or nodeId), functionName (or
      function), graphName?, binding?
  animation.set_sequence_properties:
    class_path: ue-mcp.builtin/animation.set_sequence_properties
    group: animation
    description: >-
      Batch-set properties on AnimSequence assets. If a path is a Montage and
      resolveFromMontages is true (default), resolves to its first AnimSequence.
      Params: assetPaths, properties, resolveFromMontages?
  animation.bake_root_motion_from_bone:
    class_path: ue-mcp.builtin/animation.bake_root_motion_from_bone
    group: animation
    description: >-
      Bake delta translation from a source bone (e.g. pelvis) onto the root bone
      across the whole sequence; compensates the source bone so world-space
      position is unchanged. Params: assetPath (or path), sourceBone, rootBone?,
      axes?, interpolation?
  animation.get_bone_transform:
    class_path: ue-mcp.builtin/animation.get_bone_transform
    group: animation
    description: >-
      Read a bone or socket transform on a live actor's SkeletalMeshComponent.
      Wraps GetBoneTransform / GetSocketTransform. Returns location, rotation,
      scale (#420). Params: actorLabel?, actorPath?, boneName, componentName?,
      world?, space?
  animation.list_bones:
    class_path: ue-mcp.builtin/animation.list_bones
    group: animation
    description: >-
      List bones in a live actor's SkeletalMeshComponent ref skeleton (name,
      index, parent), in reference-skeleton order so parents precede children
      (#420). Params: actorLabel?, actorPath?, componentName?, world?, cursor?,
      limit?
  animation.rebind_leader_pose:
    class_path: ue-mcp.builtin/animation.rebind_leader_pose
    group: animation
    description: >-
      Re-bind every secondary SkeletalMeshComponent on an actor to a body
      component (default CharacterMesh0 / Mesh). One-call fix for the 'character
      explodes after rotating the actor' failure mode (#419). Params:
      actorLabel?, actorPath?, bodyComponent?
  animation.sample_pose:
    class_path: ue-mcp.builtin/animation.sample_pose
    group: animation
    description: >-
      Evaluate an AnimSequence (or a BlendSpace at a blend position) and return
      COMPOSED bone transforms, which read_bone_track (raw local space) and
      get_bone_transforms (reference pose only) cannot give. Returns
      samples:[{frame, time, bones:[{name, location, rotation, scale}]}]. A
      montage is refused with a pointer to its segments, because a montage has
      no pose of its own (#923/#926/#922). Params: assetPath (or path),
      boneNames?, frames?, times?, space?, skeletalMeshPath?,
      incorporateRootMotion?, blendPosition?
  animation.get_live_bone_transforms:
    class_path: ue-mcp.builtin/animation.get_live_bone_transforms
    group: animation
    description: >-
      Read the EVALUATED pose off a live SkeletalMeshComponent in the editor
      world or PIE, for many bones at once. This is the read that tells
      'standing' from 'prone' when the reference pose cannot (#922). Also
      returns componentTransform and an evaluation block (animationMode,
      animInstanceClass, componentSpaceTransformCount) so a clean component
      transform sitting on a dead anim instance is visible in one call
      (#922/#926). Params: actorLabel?, actorPath?, componentName?, boneNames?,
      space?, world?
  animation.measure_natural_speed:
    class_path: ue-mcp.builtin/animation.measure_natural_speed
    group: animation
    description: >-
      Measure a locomotion clip's planted-foot speed, in cm/s, by evaluating the
      pose and tracking the lowest foot's horizontal travel while it is in
      contact. Every retarget changes natural speed by the target skeleton's
      leg-length ratio, so a BlendSpace built on retargeted clips has to
      re-measure per clip per character (#923). Returns naturalSpeed,
      plantedDistance, plantedTime, contactThreshold, per-foot breakdown.
      Params: assetPath (or path), footBones, contactThreshold?,
      skeletalMeshPath?, frames?, times?, blendPosition?
  animation.preview_animation:
    class_path: ue-mcp.builtin/animation.preview_animation
    group: animation
    description: >-
      Toggle bUpdateAnimationInEditor +
      VisibilityBasedAnimTickOption=AlwaysTickPoseAndRefreshBones on every
      SkeletalMeshComponent of an actor. Bypasses the 'cannot be edited on
      templates' guard for level instances (#419/#420). Params: actorLabel?,
      actorPath?, enabled?
  animation.set_live_post_process_anim_blueprint:
    class_path: ue-mcp.builtin/animation.set_live_post_process_anim_blueprint
    group: animation
    description: >-
      Set or clear a transient post-process AnimBP override on one live
      SkeletalMeshComponent in the editor world or PIE. Pass the
      AnimBlueprintGeneratedClass object path (for example
      /Game/Animations/ABP_Name.ABP_Name_C), not the AnimBlueprint asset path;
      pass clear=true to remove the component override and fall back to the
      skeletal mesh asset setting. Incompatible skeletons and the component's
      main AnimBP class are refused before mutation. Reads back the override,
      effective class, and live post-process instance. Repeating the active
      override is a no-op. This never edits or saves a mesh, Blueprint, or
      component template. Params: actorLabel?, actorPath?,
      animBlueprintClassPath?, clear?, componentName?, world?
  animation.epic_add_actors:
    class_path: ue-mcp.builtin/animation.epic_add_actors
    group: animation
    description: >-
