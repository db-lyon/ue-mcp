  gameplay.epic_set_capsule:
    class_path: ue-mcp.builtin/gameplay.epic_set_capsule
    group: gameplay
    description: >-
      [Epic PhysicsToolsets.PhysicsAssetToolset] Adds or replaces a capsule
      collision primitive on a body. If any shape with the given name already
      exists on the body it is removed first. The capsule's long axis is its
      local Z after applying Rotation. Params: physicsAsset, boneName,
      shapeName, center, rotation, radius, length
  gameplay.epic_set_constraint_limits:
    class_path: ue-mcp.builtin/gameplay.epic_set_constraint_limits
    group: gameplay
    description: >-
      [Epic PhysicsToolsets.PhysicsAssetToolset] Updates the angular limits for
      an existing constraint. Params: physicsAsset, info
  gameplay.epic_set_sphere:
    class_path: ue-mcp.builtin/gameplay.epic_set_sphere
    group: gameplay
    description: >-
      [Epic PhysicsToolsets.PhysicsAssetToolset] Adds or replaces a sphere
      collision primitive on a body. If any shape with the given name already
      exists on the body it is removed first. Params: physicsAsset, boneName,
      shapeName, center, radius
  gas.add_asc:
    class_path: ue-mcp.builtin/gas.add_asc
    group: gas
    description: 'Add AbilitySystemComponent. Params: blueprintPath, componentName?'
  gas.create_attribute_set:
    class_path: ue-mcp.builtin/gas.create_attribute_set
    group: gas
    description: 'Create AttributeSet BP. Params: name, packagePath?, onConflict?'
  gas.add_attribute:
    class_path: ue-mcp.builtin/gas.add_attribute
    group: gas
    description: 'Add attribute to set. Params: attributeSetPath, attributeName'
  gas.create_ability:
    class_path: ue-mcp.builtin/gas.create_ability
    group: gas
    description: 'Create GameplayAbility BP. Params: name, packagePath?, onConflict?'
  gas.set_ability_tags:
    class_path: ue-mcp.builtin/gas.set_ability_tags
    group: gas
    description: >-
      Set tags on ability. Each container passed is written whole, so the
      inverse is this same call carrying the tags that were in it; containers
      you do not pass are left alone and are not in the record. unchanged=true
      means the tags a written container ended up holding are the same set it
      already held, compared both ways, not merely that the caller passed
      nothing. Params: abilityPath, ability_tags?, cancel_abilities_with_tag?,
      block_abilities_with_tag?, activation_required_tags?,
      activation_blocked_tags?
  gas.create_effect:
    class_path: ue-mcp.builtin/gas.create_effect
    group: gas
    description: >-
      Create GameplayEffect BP. Params: name, packagePath?, onConflict?,
      durationPolicy?
  gas.set_effect_modifier:
    class_path: ue-mcp.builtin/gas.set_effect_modifier
    group: gas
    description: >-
      Add or update a modifier on a GameplayEffect, matched on attribute +
      operation. Overwriting an existing static magnitude rolls back to the
      value it held, qualified as SetName.Attribute so the inverse cannot land
      on another set's same-named attribute, and marked lossy because it comes
      back as a plain ScalableFloat constant. A magnitude that CHANGES WITH
      EFFECT LEVEL gets no record: it is probed at levels 1, 2 and 10, and one
      that moves is curve-table-backed, so writing a single constant would
      destroy the binding. APPENDING a new modifier has no inverse either,
      because no action removes a modifier from an effect; the response says
      rollbackPossible=false rather than offering a magnitude of zero as an
      undo. Params: effectPath, attribute, operation?, magnitude?
  gas.create_cue:
    class_path: ue-mcp.builtin/gas.create_cue
    group: gas
    description: 'Create GameplayCue. Params: name, packagePath?, onConflict?, cueType?'
  gas.get_info:
    class_path: ue-mcp.builtin/gas.get_info
    group: gas
    description: 'Inspect GAS setup. Params: blueprintPath'
  gas.set_asc_defaults:
    class_path: ue-mcp.builtin/gas.set_asc_defaults
    group: gas
    description: >-
      Wire an AttributeSet onto a Blueprint's ASC component
      (DefaultStartingData) so attributes exist at runtime. Idempotent: a set
      already wired reports existed. No inverse - nothing removes an entry from
      DefaultStartingData, and removing the whole component would undo more than
      this did, so the response says rollbackPossible=false. Run
      add_ability_system_component first. Params: blueprintPath, attributeSet
      (or attributeSetPath), componentName?, initDataTable?
  gas.apply_effect:
    class_path: ue-mcp.builtin/gas.apply_effect
    group: gas
    description: >-
      Apply a GameplayEffect to a live actor's ASC (agnostic stat/damage
      stimulus - uses the game's own effect). A duration or infinite effect
      comes back with an effectHandle and rolls back through gas(remove_effect)
      on that handle. When the effect STACKS - its StackingType is not None and
      one of its class was already on the ASC - no new active effect is created,
      the existing handle comes back with a higher stackCount, and the record
      removes exactly one stack so the stacks that predate the call survive
      (reported as stackedOntoExisting, marked lossy because the duration
      refresh does not come back). an instant effect executes into the attribute
      base values, leaves no handle, and says so through rollbackPossible=false.
      An effect the ASC refuses reports unchanged=true rather than a bare
      success. Pass actorLabel or actorPath. Params: actorLabel?, actorPath?,
      effectClass (or effectPath), level?, setByCaller?, world?, pieInstance?
  gas.remove_effect:
    class_path: ue-mcp.builtin/gas.remove_effect
    group: gas
    description: >-
      Take an active GameplayEffect back off a live actor's ASC - the inverse of
      apply_effect. Address it by effectHandle (what apply_effect returned, and
      the only way to remove exactly the effect one call added) or by
      effectClass, which removes every active effect of that class on the actor.
      Idempotent: a handle whose effect has already expired reports
      alreadyRemoved=true rather than failing, so a replayed rollback is safe.
      Removing exactly one effect rolls back to apply_effect at the level it
      held, marked lossy because duration, stack count and SetByCaller
      magnitudes do not survive removal. Instant effects have no handle and
      cannot be removed - their modifiers are already in the attribute base.
      Pass actorLabel or actorPath. Params: actorLabel?, actorPath?,
      effectHandle?, effectClass? (or effectPath), stacksToRemove?, world?,
      pieInstance?
  gas.set_attribute:
    class_path: ue-mcp.builtin/gas.set_attribute
    group: gas
    description: >-
      Set a gameplay attribute's base value on a live actor's ASC (recalculates
      CurrentValue through the aggregator). Reports unchanged=true when the base
      value did not move, including when the set's own clamping refused the
      write. Rolls back by writing the previous base value through the same
      path, which restores the current value with it because the modifiers are
      never touched; the record names the attribute QUALIFIED as
      SetName.Attribute, because a bare name resolves to whichever attribute set
      the class iterator reaches first and two sets can both declare Health.
      Pass actorLabel or actorPath. Params: actorLabel?, actorPath?, attribute,
      value, world?, pieInstance?
  gas.get_attribute:
    class_path: ue-mcp.builtin/gas.get_attribute
    group: gas
    description: >-
      Read gameplay attribute base + current values on a live actor's ASC. Omit
      attribute to list all. Pass actorLabel or actorPath. Params: actorLabel?,
      actorPath?, attribute?, world?, pieInstance?
  gas.init_asc:
    class_path: ue-mcp.builtin/gas.init_asc
    group: gas
    description: >-
      Initialize a live actor's ASC (InitAbilityActorInfo) and optionally
      instantiate an AttributeSet so attributes are live - the runtime setup
      step for testing a bridge-authored GAS actor. Reports unchanged=true when
      the ASC was already initialized for this actor and every set it needs was
      already registered. No inverse: nothing returns an ASC to uninitialized,
      and this is what BeginPlay would have done anyway, so the response says
      rollbackPossible=false and names any AttributeSet it had to CONSTRUCT.
      Pass actorLabel or actorPath. Params: actorLabel?, actorPath?,
      attributeSet?, world?, pieInstance?
  gas.get_asc_state:
    class_path: ue-mcp.builtin/gas.get_asc_state
    group: gas
    description: >-
      Introspect a live actor's ASC: granted ability specs (class, level,
      inputID, active, dynamicTags) + owned gameplay tags. Pass actorLabel or
      actorPath (#587). Params: actorLabel?, actorPath?, world?, pieInstance?
  gas.get_live_attribute_value:
    class_path: ue-mcp.builtin/gas.get_live_attribute_value
    group: gas
    description: >-
      Read the live value of one FGameplayAttributeData on the attribute set
      instance actually REGISTERED on an actor's AbilitySystemComponent -
      equivalent to ASC->GetSet<T>(), not the actor's own subobject pointer.
      Works in the editor world, where no set is registered yet, by first
      registering the actor's own sets the way BeginPlay would (set
      registerOwnerSets=false for a strict read). Returns currentValue and
      baseValue off the instance plus the aggregator's view of both, and the
      instance's object path so you can prove which object was read. Gated as a
      mutation because registering those sets changes the live world; the
      response reports unchanged=true when it registered nothing, and
      rollbackPossible=false either way, since nothing un-registers a set the
      engine would register again at BeginPlay. Pass actorLabel or actorPath
      (#956). Params: actorLabel?, actorPath?, attributeSet, attribute,
      registerOwnerSets?, world?, pieInstance?
  gas.set_live_attribute_value:
    class_path: ue-mcp.builtin/gas.set_live_attribute_value
    group: gas
    description: >-
      Write the live value of one FGameplayAttributeData on the REGISTERED
      attribute set instance on an actor's AbilitySystemComponent.
      valueType="current" (default) writes the attribute data in place, which is
      what staging a mid-combat state needs; valueType="base" writes through the
      ASC so the aggregator recomputes the current value, which is what a
      durable change needs. The set's PreAttributeChange may clamp, so the
      result reports what was actually stored alongside the previous values and
      the instance's object path. Reports unchanged=true when neither the value
      moved nor a set was registered, reading the stored value back because
      PreAttributeChange can clamp a write to what was already there. The
      inverse writes the overwritten value back through the same valueType, and
      is marked lossy when the call also had to register the actor's own
      attribute sets to reach the value, since that registration stays. Pass
      actorLabel or actorPath (#956). Params: actorLabel?, actorPath?,
      attributeSet, attribute, value, valueType?, registerOwnerSets?, world?,
      pieInstance?
  gas.grant_ability:
    class_path: ue-mcp.builtin/gas.grant_ability
    group: gas
    description: >-
      Grant a GameplayAbility to a live actor's ASC, which is what makes an
      authored ability activatable at all - an ability the ASC has never been
      given does nothing and logs nothing worth reading. Idempotent: granting a
      class that is already granted returns the existing spec with existed=true
      rather than a second handle for what the caller thinks of as one ability.
      Refused on a non-authoritative ASC, because GiveAbility only runs on the
      authority and would otherwise look like it worked. Returns the spec
      (handle, level, inputID, active) and a rollback that revokes it. Pass
      actorLabel or actorPath. Params: actorLabel?, actorPath?, abilityClass,
      level?, inputId?, world?, pieInstance?
  gas.revoke_ability:
    class_path: ue-mcp.builtin/gas.revoke_ability
    group: gas
    description: >-
      Remove a granted GameplayAbility from a live actor's ASC. Idempotent:
      revoking one that is not granted reports alreadyRevoked=true rather than
      failing, so replaying a rollback is safe. Pass actorLabel or actorPath.
      Params: actorLabel?, actorPath?, abilityClass, world?, pieInstance?
  gas.get_active_effects:
    class_path: ue-mcp.builtin/gas.get_active_effects
    group: gas
    description: >-
      List every GameplayEffect currently active on a live actor's ASC: effect
      class, stack count, level, total duration, time remaining, whether it is
      inhibited, the instigator that applied it, and the tags it grants. Plus
      the ASC's owned tags. Unfiltered on purpose - the caller is diagnosing,
      and a filter that hid the effect they were looking for would be the whole
      problem. Pass actorLabel or actorPath. Params: actorLabel?, actorPath?,
      world?, pieInstance?
  gas.add_loose_gameplay_tag:
    class_path: ue-mcp.builtin/gas.add_loose_gameplay_tag
    group: gas
    description: >-
      Add a loose gameplay tag to a live actor's ASC, so a test can arrange
      exactly one piece of tag state. count adds that many references, matching
      AddLooseGameplayTag. The tag must already be registered
      (reflection(create_tag) makes one). Loose tags are local to the ASC they
      are added on and are not replicated. Returns tagCount (the ASC's count for
      the tag afterwards) and previousTagCount; the rollback removes exactly the
      references this call added. Read the owned tags back with
      gas(get_asc_state). Pass actorLabel or actorPath. Params: actorLabel?,
      actorPath?, tag, count?, world?, pieInstance?
  gas.remove_loose_gameplay_tag:
    class_path: ue-mcp.builtin/gas.remove_loose_gameplay_tag
    group: gas
    description: >-
      Remove references to a loose gameplay tag from a live actor's ASC, never
      more than it holds. Loose and effect-granted tags share one counter, so
      the result reads the count back: tagCount above 0 means the tag is still
      owned. Idempotent: a tag the ASC does not own reports alreadyRemoved=true
      rather than failing, so a replayed rollback is safe. The rollback adds
      back exactly what was removed. Pass actorLabel or actorPath. Params:
      actorLabel?, actorPath?, tag, count?, world?, pieInstance?
  gas.trace_ability_activation:
    class_path: ue-mcp.builtin/gas.trace_ability_activation
    group: gas
    description: >-
      Answer why an ability will not activate, which GAS otherwise reports only
      to the log in a form nothing can read back. Checks in order: is it granted
      at all (the most common cause, and silent), is it already active without
      bRetriggerInstancedAbility, which tags it was refused over (the engine
      reports one relevant-tag set rather than separating 'blocked by' from
      'missing', so neither does this - compare them against the returned
      ownedTags), is it on cooldown (with seconds remaining), and is its cost
      unmet. Returns wouldActivate plus a blockedBy[] naming each reason. Pass
      activate=true to also call TryActivateAbility and prove it rather than
      predict it; a refusal with no blocker found means the ability's own
      CanActivateAbility override refused. Reports unchanged=true on every path
      where nothing fired. An activation has no inverse - the ability has
      already committed its cost, applied its cooldown and run its effects - so
      the response says rollbackPossible=false. Pass actorLabel or actorPath.
      Params: actorLabel?, actorPath?, abilityClass, activate?, world?,
      pieInstance?
  gas.bind_ability_input:
    class_path: ue-mcp.builtin/gas.bind_ability_input
    group: gas
    description: >-
      Bind a granted ability to an input id, which is how anything other than a
      direct TryActivateAbility call ever fires it. GAS addresses input by
      integer: UAbilitySystemComponent::AbilityLocalInputPressed(id) activates
      every granted spec whose InputID matches, and the Enhanced Input asset
      side (gameplay(create_input_action) plus gameplay(add_imc_mapping)) is
      what turns a key into that call in the game's own input component.
      Idempotent: re-binding the same id reports unchanged=true. Refused on a
      non-authoritative ASC, because an ability spec is replicated from the
      authority and a local write would be overwritten while looking like it
      worked. Reports sharedWith[] when another granted ability already uses
      that id, since sending the input then activates all of them. The rollback
      restores the exact previous id, which is not always -1. Pass actorLabel or
      actorPath. Params: actorLabel?, actorPath?, abilityClass, inputId, world?,
      pieInstance?
  gas.clear_ability_input:
    class_path: ue-mcp.builtin/gas.clear_ability_input
    group: gas
    description: >-
      Unbind a granted ability from its input id, setting InputID back to -1 so
      no input event can reach it. Idempotent: an already-unbound ability
      reports unchanged=true rather than failing, so replaying a rollback is
      safe. The rollback re-binds the id that was there. Pass actorLabel or
      actorPath. Params: actorLabel?, actorPath?, abilityClass, world?,
      pieInstance?
  gas.send_ability_input:
    class_path: ue-mcp.builtin/gas.send_ability_input
    group: gas
    description: >-
      Deliver an input event to a live ASC, which fires a bound ability the way
      the game fires it rather than through a direct activation call.
      inputEvent=pressed|released calls AbilityLocalInputPressed /
      AbilityLocalInputReleased for an inputId (or for the id abilityClass is
      bound to); inputEvent=confirm|cancel calls InputConfirm / InputCancel,
      which reach targeting actors and take no id. Returns the specs that
      matched the id with their pressed and active state before and after, so
      the result says what happened rather than what was asked for. An id
      nothing is bound to is reported as matchedSpecCount 0, not as an error.
      pressed and released are a genuine inverse pair and roll back to each
      other; confirm and cancel have no inverse and say so. Pass actorLabel or
      actorPath. Params: actorLabel?, actorPath?, inputEvent?, inputId?,
      abilityClass?, world?, pieInstance?
  gas.add_effect_cue:
    class_path: ue-mcp.builtin/gas.add_effect_cue
    group: gas
    description: >-
      Link a GameplayCue tag to a GameplayEffect, so applying the effect fires
      the cue. Refuses a tag the tag manager does not know (writing one would
      store an invalid tag and the cue would never fire; create it first with
      reflection(create_tag)) and a tag outside the GameplayCue root (the cue
      system routes nothing else). Reports whether any GameplayCueNotify
      actually answers the tag, matching a parent tag the way the cue system
      does, and warns when none does. Idempotent on the tag: re-adding reports
      existed, changing the level range reports updated. Params: effectPath (or
      effectClass), cueTag, minLevel?, maxLevel?, magnitudeAttribute?
  gas.remove_effect_cue:
    class_path: ue-mcp.builtin/gas.remove_effect_cue
    group: gas
    description: >-
      Unlink a GameplayCue tag from a GameplayEffect. Accepts a tag that is no
      longer registered, because cleaning up after a deleted tag is exactly what
      this has to be able to do. Drops a cue entry left with no tags rather than
      leaving a blank row. Idempotent: a tag that is not linked reports
      alreadyRemoved=true. Params: effectPath (or effectClass), cueTag
  gas.validate_cue_coverage:
    class_path: ue-mcp.builtin/gas.validate_cue_coverage
    group: gas
    description: >-
      Audit every GameplayEffect against every GameplayCueNotify in the project
      and report which cue links fire nothing. Resolves each cue tag the way the
      cue system does, falling back to a parent tag, so a notify on
      GameplayCue.Damage counts as covering GameplayCue.Damage.Fire and is
      reported as a parent match rather than a false positive. Problems it
      names: a cue tag with no notify on it or any parent, a cue entry with no
      tag at all, a cue tag outside the GameplayCue root (inert), a notify with
      no GameplayCueTag (unreachable), and duplicate tags across notifies. Also
      reports orphan notifies that no effect references, which is usually a
      rename done on one side only. Reads the asset registry rather than the cue
      manager index, so a cold index does not read as 'no cues exist'; the
      manager's own counts come back alongside. Params: directory?, effectPath?
      (or effectClass), maxEffects?
  gas.audit_attributes:
    class_path: ue-mcp.builtin/gas.audit_attributes
    group: gas
    description: >-
      Report what is provable about an AttributeSet: whether it can clamp at
      all, which attributes replicate and carry an OnRep, which have a paired
      Max attribute, and which look like meta attributes. There is deliberately
      no configure_attribute_clamping counterpart, because UE 5.8 has no
      data-driven clamp: PreAttributeChange and PreAttributeBaseChange are plain
      C++ virtuals rather than UFUNCTIONs, so a Blueprint AttributeSet can never
      clamp and this says so outright instead of pretending to configure one. On
      a native set, pass probeClamping=true with a live actor to MEASURE an
      existing clamp by driving PreAttributeChange with extreme values rather
      than guessing from the class; the probe runs the project's own code so it
      needs a registered live set, never a class default object. A strict read:
      unlike get_live_attribute_value it never registers the actor's own sets,
      so an actor whose ASC has none is told which call registers one.
      Everything about an attribute set that IS a property stays reachable
      through asset(set_property) on its Blueprint CDO. Pass attributeSet,
      actorLabel or actorPath. Params: attributeSet?, actorLabel?, actorPath?,
      probeClamping?, world?, pieInstance?
  gas.capture_gas_state:
    class_path: ue-mcp.builtin/gas.capture_gas_state
    group: gas
    description: >-
      Capture an actor's whole ability-system state as one snapshot: granted
      abilities with level, input id, active count and dynamic tags; every
      active effect with its stack count, level, duration, time remaining,
      inhibition and instigator; every attribute with BOTH its base and current
      value; owned gameplay tags with their counts; and the tags currently
      blocking activation. Stores it under snapshotId (generated when omitted)
      and also returns it, so a caller that needs it to outlive the editor
      session keeps the object; the store holds the 64 most recent and is
      emptied by a restart. Pass compareWith to diff this capture against an
      earlier snapshot id in the same call, which is the whole
      capture-act-compare loop in two calls. The diff lives here rather than on
      compare_gas_states because capturing registers the actor's attribute sets
      on its ASC where a world has not begun play, so it is gated as the
      mutation it is. Pass actorLabel or actorPath. Params: actorLabel?,
      actorPath?, snapshotId?, compareWith?, registerOwnerSets?, world?,
      pieInstance?
  gas.compare_gas_states:
    class_path: ue-mcp.builtin/gas.compare_gas_states
    group: gas
    description: >-
      Diff two GAS snapshots and name each change rather than handing back two
      blobs. Every entry in changes[] carries a kind (ability_granted,
      ability_revoked, ability_level_changed, ability_input_changed,
      ability_activated, ability_ended, effect_applied, effect_removed,
      effect_stack_changed, effect_level_changed, effect_inhibition_changed,
      attribute_changed, attribute_added, attribute_removed, tag_gained,
      tag_lost, tag_count_changed, ability_block_added, ability_block_removed,
      asc_initialized), the subject it happened to, the before and after rows,
      and a sentence saying what it means - an attribute whose current value
      moved while its base did not is reported as a modifier rather than as a
      failed write. Time is not counted as a change: effects present in both
      come back under stillActiveEffects with their remaining time on each side,
      and the gap is reported once as timeElapsedSeconds. Comparing two
      different actors is allowed and flagged. A pure read over snapshots you
      already have; to take the later reading and diff it in one call use
      capture_gas_state with compareWith. Pass beforeId or beforeSnapshot, and
      afterId or afterSnapshot. Params: beforeId?, beforeSnapshot?, afterId?,
      afterSnapshot?
  gas.list_gas_snapshots:
    class_path: ue-mcp.builtin/gas.list_gas_snapshots
    group: gas
    description: >-
      List the GAS snapshots this editor session holds, oldest first, with the
      actor, world, capture time and per-section counts. Pass actorPath to
      narrow to one actor, or includeSnapshots to get the full bodies back.
      Params: actorPath?, includeSnapshots?
  gas.delete_gas_snapshot:
    class_path: ue-mcp.builtin/gas.delete_gas_snapshot
    group: gas
    description: >-
      Drop one stored GAS snapshot, returning its contents first so nothing is
      lost: the returned object can be passed straight back to
      compare_gas_states as beforeSnapshot. Idempotent: an id that is not stored
      reports alreadyDeleted=true. Params: snapshotId
  gas.epic_add_cue_tag:
    class_path: ue-mcp.builtin/gas.epic_add_cue_tag
    group: gas
    description: >-
      [Epic GASToolsets.GameplayCueToolset] Adds a new gameplay cue tag to the
      project. This should ONLY be called after getting explicit direction or
      permission from the user. Params: cueTag, comment?
  gas.epic_create_cue_notify_asset:
    class_path: ue-mcp.builtin/gas.epic_create_cue_notify_asset
    group: gas
    description: >-
      [Epic GASToolsets.GameplayCueToolset] Creates a new GameplayCueNotify
      Blueprint asset at the specified content browser location. This should
      ONLY be called after getting explicit direction or permission from the
      user. Params: cueTag, packagePath, assetName, bIsActor
  gas.epic_execute_cue_on_selected_actor:
    class_path: ue-mcp.builtin/gas.epic_execute_cue_on_selected_actor
    group: gas
    description: >-
      [Epic GASToolsets.GameplayCueToolset] Executes a gameplay cue
      non-replicated on the currently selected actor in the editor. Useful for
      previewing cue effects without network replication. Requires a PIE session
      or a configured GameplayCueManager to produce visible results. Params:
      cueTag, normalizedMagnitude, location, normal
  gas.epic_find_attribute_set_classes:
    class_path: ue-mcp.builtin/gas.epic_find_attribute_set_classes
    group: gas
    description: >-
      [Epic GASToolsets.AttributeSetToolset] Returns all AttributeSet subclasses
      found in the project, including their attributes. Covers both native C++
      subclasses and Blueprint subclasses discovered via the asset registry.
      Params: none
  gas.epic_find_cue_notify_assets:
    class_path: ue-mcp.builtin/gas.epic_find_cue_notify_assets
    group: gas
    description: >-
      [Epic GASToolsets.GameplayCueToolset] Returns all GameplayCueNotify assets
      found in the project via the asset registry. Params: parentTag
  gas.epic_find_cue_tags_without_notifies:
    class_path: ue-mcp.builtin/gas.epic_find_cue_tags_without_notifies
    group: gas
    description: >-
      [Epic GASToolsets.GameplayCueToolset] Returns gameplay cue tags that have
      no corresponding GameplayCueNotify asset in the project. Tags without
      notifies produce no visible effect when triggered at runtime. Params: none
  gas.epic_get_active_effects:
    class_path: ue-mcp.builtin/gas.epic_get_active_effects
    group: gas
    description: >-
      [Epic GASToolsets.AbilitySystemInspectorToolset] Returns all gameplay
      effects currently active on the actor's AbilitySystemComponent. Params:
      actor
  gas.epic_get_active_tags:
    class_path: ue-mcp.builtin/gas.epic_get_active_tags
    group: gas
    description: >-
      [Epic GASToolsets.AbilitySystemInspectorToolset] Returns the gameplay tags
      currently owned by the actor's AbilitySystemComponent (includes loose
      tags, effect-granted tags, etc.). Params: actor
  gas.epic_get_attribute_values:
    class_path: ue-mcp.builtin/gas.epic_get_attribute_values
    group: gas
    description: >-
      [Epic GASToolsets.AbilitySystemInspectorToolset] Returns the current base
      and modified values of all gameplay attributes on the actor's
      AbilitySystemComponent. Params: actor
  gas.epic_get_cue_info:
    class_path: ue-mcp.builtin/gas.epic_get_cue_info
    group: gas
    description: >-
      [Epic GASToolsets.GameplayCueToolset] Returns information about a specific
      gameplay cue, including its notify asset. Params: cueTag
  gas.epic_get_granted_abilities:
    class_path: ue-mcp.builtin/gas.epic_get_granted_abilities
    group: gas
    description: >-
      [Epic GASToolsets.AbilitySystemInspectorToolset] Returns all abilities
      granted to the actor's AbilitySystemComponent. Params: actor
  gas.epic_list_attributes:
    class_path: ue-mcp.builtin/gas.epic_list_attributes
    group: gas
    description: >-
      [Epic GASToolsets.AttributeSetToolset] Returns the gameplay attributes
      defined on a specific AttributeSet class. Params: className
  gas.epic_list_cues:
    class_path: ue-mcp.builtin/gas.epic_list_cues
    group: gas
    description: >-
      [Epic GASToolsets.GameplayCueToolset] Returns gameplay cue tags registered
      in the project. Params: parentTag
  gas.epic_remove_cue_tag:
    class_path: ue-mcp.builtin/gas.epic_remove_cue_tag
    group: gas
    description: >-
      [Epic GASToolsets.GameplayCueToolset] Removes a gameplay cue tag from the
      project. This should ONLY be called after getting explicit direction or
      permission from the user. Params: cueTag
  networking.set_replicates:
    class_path: ue-mcp.builtin/networking.set_replicates
    group: networking
    description: >-
      Enable or disable actor replication on a Blueprint's CDO. Reports
      existed=true and unchanged=true when the class already had this value.
      Rolls back through this same action with the previous flag, with nothing
      lost. Params: blueprintPath, replicates?
  networking.set_property_replicated:
    class_path: ue-mcp.builtin/networking.set_property_replicated
    group: networking
    description: >-
      Mark a Blueprint variable as replicated. replicationType is 'None' |
      'Replicated' | 'RepNotify'; repNotify=true is shorthand for RepNotify and
      replicated=true for Replicated (#768). Reports existed=true and
      unchanged=true when the variable already had that type. Rolls back through
      this same action with the type it had; marked lossy when the variable
      carried a ReplicationCondition other than COND_None, because making a
      variable replicated resets that and this action has no parameter to
      restore one. Params: blueprintPath, variableName (or propertyName),
      replicationType?, replicated?, repNotify?
  networking.configure_net_frequency:
    class_path: ue-mcp.builtin/networking.configure_net_frequency
    group: networking
    description: >-
      Set update frequency. Reports unchanged=true when both frequencies already
      held these values, and otherwise rolls back to the pair that was there -
      the record carries both regardless of which one was asked for, so an
      inverse cannot leave the two inconsistent. Params: blueprintPath,
      netUpdateFrequency?, minNetUpdateFrequency?
  networking.set_dormancy:
    class_path: ue-mcp.builtin/networking.set_dormancy
    group: networking
    description: >-
      Set net dormancy on a Blueprint's CDO: DORM_Never | DORM_Awake |
      DORM_DormantAll | DORM_DormantPartial | DORM_Initial. An unrecognised
      spelling is REFUSED and the valid five are named, where it used to leave
      the value alone and still report success. Reports existed=true and
      unchanged=true when the class already had that dormancy. Rolls back
      through this same action with the previous one, with nothing lost. Params:
      blueprintPath, dormancy
  networking.set_net_load_on_client:
    class_path: ue-mcp.builtin/networking.set_net_load_on_client
    group: networking
    description: >-
      Control whether the actor is loaded on clients (bNetLoadOnClient). A class
      with no such property reports a warning and unchanged=true rather than the
      existed it used to claim for a write that never happened. Reports
      existed=true when the class already had this value, and otherwise rolls
      back through this same action with the previous flag. Params:
      blueprintPath, loadOnClient?
  networking.set_always_relevant:
    class_path: ue-mcp.builtin/networking.set_always_relevant
    group: networking
    description: >-
      Set bAlwaysRelevant on a Blueprint's CDO. Reports existed=true and
      unchanged=true when the class already had this value, and otherwise rolls
      back through this same action with the previous flag, with nothing lost.
      Params: blueprintPath, alwaysRelevant?
  networking.set_only_relevant_to_owner:
    class_path: ue-mcp.builtin/networking.set_only_relevant_to_owner
    group: networking
    description: >-
      Set bOnlyRelevantToOwner on a Blueprint's CDO. Reports existed=true and
      unchanged=true when the class already had this value, and otherwise rolls
      back through this same action with the previous flag, with nothing lost.
      Params: blueprintPath, onlyRelevantToOwner?
  networking.configure_cull_distance:
    class_path: ue-mcp.builtin/networking.configure_cull_distance
    group: networking
    description: >-
      Net cull distance. Reports unchanged=true when the value is already set,
      and otherwise rolls back to the previous NetCullDistanceSquared read off
      the CDO before the write. A class with no writable NetCullDistanceSquared
      reports a warning rather than a silent success. Params: blueprintPath,
      netCullDistanceSquared?
  networking.set_priority:
    class_path: ue-mcp.builtin/networking.set_priority
    group: networking
    description: >-
      Set NetPriority on a Blueprint's CDO. Reports existed=true and
      unchanged=true when the value is already nearly equal to the one asked
      for, and otherwise rolls back to the float the property held, with nothing
      lost. Params: blueprintPath, netPriority?
  networking.set_replicate_movement:
    class_path: ue-mcp.builtin/networking.set_replicate_movement
    group: networking
    description: >-
      Set replicated movement on a Blueprint's CDO. Reports existed=true and
      unchanged=true when the class already had this value, and otherwise rolls
      back through this same action with the previous flag, with nothing lost.
      Params: blueprintPath, replicateMovement?
  networking.get_info:
    class_path: ue-mcp.builtin/networking.get_info
    group: networking
    description: 'Get networking info. Params: blueprintPath'
  demo.step:
    class_path: ue-mcp.builtin/demo.step
    group: demo
    description: >-
      Execute demo step. Steps are NOT idempotent: each one spawns
      unconditionally, so a replay leaves a second set of Demo_ actors, and the
      result says created rather than a bare success. No inverse is emitted. No
      step records what it individually created, and demo(cleanup) is not a
      substitute: it removes the whole demo scene, and on the way it creates
      /Game/MCP_Home if missing and switches the editor to it, then deletes by
      label prefix in whatever level is then open. The response names it as
      guidance with rollbackPossible=false, so the flow runner never invokes it
      as an undo. Params: step? (or stepIndex)
  demo.get_steps:
    class_path: ue-mcp.builtin/demo.get_steps
    group: demo
    description: >-
      List every demo step up front: index, id and description, plus a count.
      Use this to see what the 19 steps build before running any of them.
      Params: none
  demo.cleanup:
    class_path: ue-mcp.builtin/demo.cleanup
    group: demo
    description: >-
      Remove demo assets and actors. Switches editor to /Game/MCP_Home before
      deleting so the editor is never left on an Untitled map, then collects
      garbage so the unloaded /Game/Demo/DemoLevel is deleted too and the next
      run starts from a new level; demoLevelRemoved reports it. unchanged=true
      only when nothing was deleted AND the home level already existed AND the
      editor was already in it, because anchoring to that level is itself a
      change this call makes. No inverse of its own - rebuilding means running
      step 1 through 19 again. Params: none
  demo.go_home:
    class_path: ue-mcp.builtin/demo.go_home
    group: demo
    description: >-
      Switch the editor to /Game/MCP_Home (creating it on first use). Use this
      before any operation that would leave the editor on an Untitled map.
      Reports alreadyOpen=true when the home level was already the open one, and
      otherwise rolls back by reopening the level that WAS open through
      level(load) - marked lossy when the home level had to be created, since
      that package stays on disk. A previously open map with no content path
      (unsaved or Untitled) has no inverse and the response says so. Params:
      none
  feedback.submit:
    class_path: ue-mcp.builtin/feedback.submit
    group: feedback
    description: >-
      Submit feedback about a tool gap (missing action, wrong behavior, crash,
      or a case you had to work around). Provide a specific title and a summary;
      pythonWorkaround and idealTool are optional enrichment, not prerequisites.
      Checks the plugin registry first and files against the owning plugin's
      repo when one matches, then blocks on an MCP elicitation prompt that asks
      the USER (not the agent) to approve or decline the exact payload - and to
      override the tracker - before anything is posted to GitHub. If the client
      cannot show that form (it never advertised elicitation, it throws, or it
      auto-answers in milliseconds without rendering anything), nothing is lost:
      the report is written to disk and the result carries a prefilled GitHub
      issue URL for the user to click. Params: title, summary,
      pythonWorkaround?, idealTool?, author?, repo?, confirmToken?
  feedback.route:
    class_path: ue-mcp.builtin/feedback.route
    group: feedback
    description: >-
      Dry run the tracker routing for a report without posting anything. Returns
      the repo the issue would be filed against, the matched plugin (if any),
      and why. Params: title, summary, idealTool?, repo?. Use it when you are
      unsure whether a gap belongs to ue-mcp core or to an installed/published
      plugin.
  statetree.read:
    class_path: ue-mcp.builtin/statetree.read
    group: statetree
    description: >-
      Full dump of a StateTree asset: state hierarchy (with description, tag,
      customTickRate, color), tasks, conditions, transitions, evaluators, global
      tasks, root params, bindings. Params: assetPath
  statetree.list_states:
    class_path: ue-mcp.builtin/statetree.list_states
    group: statetree
    description: >-
      List all states with IDs and paths, depth-first in the tree's authored
      order, cursor-paginated. Params: assetPath, cursor?, limit?
  statetree.add_state:
    class_path: ue-mcp.builtin/statetree.add_state
    group: statetree
    description: >-
      Add a child state under the parent named by stateId or statePath, or a
      root state when neither is given. Params: assetPath, stateId?, statePath?,
      name, stateType?, selectionBehavior?, insertIndex?, linkedSubtree?
  statetree.remove_state:
    class_path: ue-mcp.builtin/statetree.remove_state
    group: statetree
    description: 'Remove a state by ID. Params: assetPath, stateId?, statePath?'
  statetree.set_state_property:
    class_path: ue-mcp.builtin/statetree.set_state_property
    group: statetree
    description: >-
      Set a property on a state
      (name|type|selectionBehavior|bEnabled|weight|linkedAsset|description|tag|customTickRate|color).
      For tag: gameplay tag string or empty to clear. For customTickRate: number
      in seconds or empty to disable. For color: palette color display name,
      GUID, or empty to clear. Params: assetPath, stateId?, statePath?,
      propertyName, value
  statetree.clear_state_nodes:
    class_path: ue-mcp.builtin/statetree.clear_state_nodes
    group: statetree
    description: >-
      Remove all tasks/conditions/transitions from a state. Params: assetPath,
      stateId?, statePath?
  statetree.add_task:
    class_path: ue-mcp.builtin/statetree.add_task
    group: statetree
    description: >-
      Add a task to a state. structType is a C++ struct name, e.g.
      FMyStateTreeTask or an engine-shipped task like
      FStateTreeRunParallelStateTreesTask. Params: assetPath, stateId?,
      statePath?, structType, instanceProperties?
  statetree.add_enter_condition:
    class_path: ue-mcp.builtin/statetree.add_enter_condition
    group: statetree
    description: >-
      Add an enter condition to a state. Params: assetPath, stateId?,
      statePath?, structType, instanceProperties?, operand?
  statetree.remove_enter_condition:
    class_path: ue-mcp.builtin/statetree.remove_enter_condition
    group: statetree
    description: >-
      Remove an enter condition by index. Params: assetPath, stateId?,
      statePath?, conditionIndex
  statetree.remove_task:
    class_path: ue-mcp.builtin/statetree.remove_task
    group: statetree
    description: 'Remove a task by index. Params: assetPath, stateId?, statePath?, taskIndex'
  statetree.set_task_instance_property:
    class_path: ue-mcp.builtin/statetree.set_task_instance_property
    group: statetree
    description: >-
      Set a property on a task's instance data. Params: assetPath, stateId?,
      statePath?, taskIndex, propertyName, value
  statetree.set_task_property:
    class_path: ue-mcp.builtin/statetree.set_task_property
    group: statetree
    description: >-
      Set a property on the task's node struct (FStateTreeTaskBase-level:
      bConsideredForCompletion, bTaskEnabled, bShouldStateChangeOnReselect).
      Distinct from set_task_instance_property which targets instance data.
      value is string-encoded, e.g. 'true'/'false'. Params: assetPath, stateId?,
      statePath?, taskIndex, propertyName, value
  statetree.add_transition:
    class_path: ue-mcp.builtin/statetree.add_transition
    group: statetree
    description: >-
      Add a transition to a state. Params: assetPath, stateId?, statePath?,
      trigger, transitionType, eventTag?, targetStateId?, targetStatePath?,
      priority?, delayDuration?, bDelayTransition?
  statetree.add_transition_condition:
    class_path: ue-mcp.builtin/statetree.add_transition_condition
    group: statetree
    description: >-
      Add a condition to an existing transition. Params: assetPath, stateId?,
      statePath?, transitionIndex, structType, instanceProperties?, operand?
  statetree.remove_transition:
    class_path: ue-mcp.builtin/statetree.remove_transition
    group: statetree
    description: >-
      Remove a transition by index. Params: assetPath, stateId?, statePath?,
      transitionIndex
  statetree.add_binding:
    class_path: ue-mcp.builtin/statetree.add_binding
    group: statetree
    description: >-
      Add a property binding. Params: assetPath, sourceStructId, sourcePath,
      targetStructId, targetPath
  statetree.remove_binding:
    class_path: ue-mcp.builtin/statetree.remove_binding
    group: statetree
    description: 'Remove a property binding. Params: assetPath, targetStructId, targetPath'
  statetree.list_bindings:
    class_path: ue-mcp.builtin/statetree.list_bindings
    group: statetree
    description: >-
      List all property bindings, optionally filtered to one struct. Params:
      assetPath, structId?
  statetree.list_bindable_sources:
    class_path: ue-mcp.builtin/statetree.list_bindable_sources
    group: statetree
    description: >-
      Enumerate the context/bindable sources in a StateTree (context objects,
      parameters, evaluators, global tasks, per-state nodes) with their structId
      + struct type - what a property can bind FROM, sorted by structId,
      cursor-paginated (#681). Params: assetPath, cursor?, limit?
  statetree.add_evaluator:
    class_path: ue-mcp.builtin/statetree.add_evaluator
    group: statetree
    description: >-
      Add an evaluator to the StateTree (tree-level). Params: assetPath,
      structType, instanceProperties?
  statetree.remove_evaluator:
    class_path: ue-mcp.builtin/statetree.remove_evaluator
    group: statetree
    description: 'Remove an evaluator by node ID. Params: assetPath, nodeId'
  statetree.set_evaluator_instance_property:
    class_path: ue-mcp.builtin/statetree.set_evaluator_instance_property
    group: statetree
    description: >-
      Set a property on an evaluator's instance data. Params: assetPath, nodeId,
      propertyName, value
  statetree.set_evaluator_property:
    class_path: ue-mcp.builtin/statetree.set_evaluator_property
    group: statetree
    description: >-
      Set a property on the evaluator's node struct
      (FStateTreeEvaluatorBase-level). Params: assetPath, nodeId, propertyName,
      value
  statetree.add_global_task:
    class_path: ue-mcp.builtin/statetree.add_global_task
    group: statetree
    description: >-
      Add a global task to the StateTree (tree-level). Params: assetPath,
      structType, instanceProperties?
  statetree.remove_global_task:
    class_path: ue-mcp.builtin/statetree.remove_global_task
    group: statetree
    description: 'Remove a global task by node ID. Params: assetPath, nodeId'
  statetree.set_global_task_instance_property:
    class_path: ue-mcp.builtin/statetree.set_global_task_instance_property
    group: statetree
    description: >-
      Set a property on a global task's instance data. Params: assetPath,
      nodeId, propertyName, value
  statetree.set_global_task_property:
    class_path: ue-mcp.builtin/statetree.set_global_task_property
    group: statetree
    description: >-
      Set a property on a global task's node struct (FStateTreeTaskBase-level).
      Params: assetPath, nodeId, propertyName, value
  statetree.list_colors:
    class_path: ue-mcp.builtin/statetree.list_colors
    group: statetree
    description: >-
      List all color palette entries for a StateTree. Returns: colors[] with id,
      displayName, color. Params: assetPath
  statetree.add_color:
    class_path: ue-mcp.builtin/statetree.add_color
    group: statetree
    description: >-
      Add a new color to the StateTree palette. Params: assetPath, displayName,
      color?
  statetree.list_state_parameters:
    class_path: ue-mcp.builtin/statetree.list_state_parameters
    group: statetree
    description: >-
      List parameters defined on a state. Returns: parameters[] with name, id,
      type, value; also bFixedLayout. Params: assetPath, stateId?, statePath?
  statetree.add_state_parameter:
    class_path: ue-mcp.builtin/statetree.add_state_parameter
    group: statetree
    description: >-
      Add a parameter to a state's property bag. Rejects fixed-layout (linked)
      states. Params: assetPath, stateId?, statePath?, paramName, paramType
  statetree.remove_state_parameter:
    class_path: ue-mcp.builtin/statetree.remove_state_parameter
    group: statetree
    description: >-
      Remove a parameter from a state's property bag by name. Rejects
      fixed-layout (linked) states. Params: assetPath, stateId?, statePath?,
      paramName
  statetree.set_state_parameter:
    class_path: ue-mcp.builtin/statetree.set_state_parameter
    group: statetree
    description: >-
      Set the value of an existing state parameter. On fixed-layout states, also
      marks the parameter as overridden. Params: assetPath, stateId?,
      statePath?, paramName, value
  statetree.set_root_parameters:
    class_path: ue-mcp.builtin/statetree.set_root_parameters
    group: statetree
    description: 'Define root parameters (property bag). Params: assetPath, parameters'
  statetree.set_schema:
    class_path: ue-mcp.builtin/statetree.set_schema
    group: statetree
    description: >-
      Attach or replace the StateTree schema, then compile. The schema is what
      makes a tree compilable: without one the compiler logs "does not have a
      schema" and stops, and everything that loads the asset reports it as
      failed to link. Repairs a tree that has no editor data at all (what
      asset(create_asset_by_class) writes) by creating the editor data, the
      schema and a root state. Omit schema to take StateTreeComponentSchema,
      then StateTreeAIComponentSchema, then whatever concrete schema this editor
      has, and read schemaSource / schemaNote to see which was used (#833).
      Params: assetPath, schema?
  statetree.compile:
    class_path: ue-mcp.builtin/statetree.compile
    group: statetree
    description: >-
      Compile a StateTree asset. Returns success, errors[], warnings[]. Params:
      assetPath
  statetree.validate:
    class_path: ue-mcp.builtin/statetree.validate
    group: statetree
    description: 'Validate a StateTree asset without compiling. Params: assetPath'
  statetree.list_node_types:
    class_path: ue-mcp.builtin/statetree.list_node_types
    group: statetree
    description: >-
      Enumerate every task, condition, evaluator and utility consideration THIS
      tree's schema allows, with the exact structType string add_task /
      add_enter_condition / add_transition_condition / add_consideration /
      add_evaluator / add_global_task take, and the property names their
      instanceProperties map accepts. Every add_* action takes a C++ struct name
      and nothing listed them, so authoring meant guessing. Also reports the
      schema's own capability flags (allowEnterConditions,
      allowUtilityConsiderations, allowEvaluators, allowMultipleTasks,
      allowGlobalParameters), which is what decides whether an add would be
      refused, and the context data a binding can come from. Blueprint-authored
      nodes are listed separately with the wrapper struct and the two calls that
      author one, because a Blueprint node needs set_node_class after the
      wrapper is added. Params: assetPath, nodeType?, filter?,
      includeInstanceProperties?, schemaAllowedOnly?
  statetree.read_state:
    class_path: ue-mcp.builtin/statetree.read_state
    group: statetree
    description: >-
      Read ONE state whole, including everything the tree-wide read omits:
      utility considerations, the LinkedSubtree link, RequiredEventToEnter,
      TasksCompletion, Weight, and every transition's priority, enabled flag,
      delay variance and reactivation rule. Returns the state's objectPath,
      which is how the fields with no typed setter are written -
      editor(set_property) at that path reaches Transitions[0].Priority and the
      rest. problems[] names the faults a state cannot report about itself:
      utility selection with no scoring considerations anywhere below it,
      considerations whose parent never reads them, a Linked type pointing at
      nothing, and a transition targeting a deleted state. Pass stateId OR
      statePath. Params: assetPath, stateId?, statePath?
  statetree.add_consideration:
    class_path: ue-mcp.builtin/statetree.add_consideration
    group: statetree
    description: >-
      Add a utility consideration to a state, which is what produces the score a
      parent uses when its selectionBehavior is
      TrySelectChildrenWithHighestUtility or
      TrySelectChildrenAtRandomWeightedByUtility. Those behaviours were already
      settable and nothing could add the scoring half, so the setting could be
      written and never did anything. Refuses when the tree's schema does not
      allow considerations, and warns when the PARENT does not select by
      utility, because that is the silent failure. Pass stateId OR statePath.
      Params: assetPath, stateId?, statePath?, structType, instanceProperties?,
      operand?
  statetree.remove_consideration:
    class_path: ue-mcp.builtin/statetree.remove_consideration
    group: statetree
    description: >-
      Remove a utility consideration from a state by index. The rollback
      captures the struct type, operand and instance values, and says plainly
      that a replay appends at the end with a new nodeId rather than restoring
      its position or its bindings. Pass stateId OR statePath. Params:
      assetPath, stateId?, statePath?, considerationIndex
  statetree.remove_transition_condition:
    class_path: ue-mcp.builtin/statetree.remove_transition_condition
    group: statetree
    description: >-
      Remove one condition from a transition by index. add_transition_condition
      shipped without it, so a mistyped condition could only be undone by
      deleting the whole transition. Pass stateId OR statePath. Params:
      assetPath, stateId?, statePath?, transitionIndex, conditionIndex
  statetree.set_state_link:
    class_path: ue-mcp.builtin/statetree.set_state_link
    group: statetree
    description: >-
      Link a state to a Subtree state in THIS asset, or to another StateTree
      asset, or clear both. UStateTreeState carries two separate link fields and
      only the asset one had any route: add_state documented a linkedSubtree
      parameter and assigned LinkedAsset with it, so in-asset subtree reuse was
      impossible. Goes through SetLinkedState / SetLinkedStateAsset rather than
      assigning the field, which is what pulls the linked target's parameters
      into this state - without that a linked state has an empty fixed-layout
      parameter list and set_state_parameter has nothing to override. Pass
      stateId OR statePath; for linkType subtree pass targetStateId OR
      targetStatePath, for asset pass linkedAsset. Params: assetPath, stateId?,
      statePath?, linkType, targetStateId?, targetStatePath?, linkedAsset?
  statetree.move_state:
    class_path: ue-mcp.builtin/statetree.move_state
    group: statetree
    description: >-
      Reparent or reorder an existing state. add_state takes an insertIndex for
      a NEW state and nothing could move one afterwards, so wrong order meant
      delete and rebuild - and order is load-bearing, since
      TrySelectChildrenInOrder walks it and NextState and NextSelectableState
      transitions resolve through it. Refuses to move a state under its own
      descendant, which would detach the branch. insertIndex is the final
      position among siblings; omit it to append. Reports unchanged when the
      state is already there, and rolls back to its previous parent and index.
      Pass stateId OR statePath, and newParentStateId OR newParentStatePath OR
      toRoot. Params: assetPath, stateId?, statePath?, newParentStateId?,
      newParentStatePath?, toRoot?, insertIndex?
  statetree.set_node_class:
    class_path: ue-mcp.builtin/statetree.set_node_class
    group: statetree
    description: >-
      Point a Blueprint node wrapper at its Blueprint class AND reallocate its
      instance data. This is the step with no property-write equivalent: the
      wrapper reports the Blueprint class AS its instance data type, so a node
      added before the class is set has no instance data at all, and writing the
      class afterwards does not go back and allocate it. Works on any task,
      condition, transition condition, consideration, evaluator or global task,
      addressed by the nodeId every add_* action returns. Returns
      instanceObjectPath, where the Blueprint's own variables live for
      editor(set_property). Params: assetPath, nodeId, nodeClass
  statetree.read_runtime:
    class_path: ue-mcp.builtin/statetree.read_runtime
    group: statetree
    description: >-
      Read a RUNNING StateTree in depth: run status, last tick status, the state
      change count, the active states, the execution frames and the pending
      event queue. gameplay(get_state_tree_runtime) answers the same question
      with active state names only, which cannot tell you whether the tree
      succeeded, failed or stopped, nor whether an event you sent is still
      waiting to be consumed. Needs a game world, so run it in PIE. Pass
      actorLabel OR actorPath. Params: actorLabel?, actorPath?, componentName?,
      world?, pieInstance?, includeDebugStrings?
  statetree.send_event:
    class_path: ue-mcp.builtin/statetree.send_event
    group: statetree
    description: >-
      Send a gameplay event to a running StateTree, which is how an event-driven
      tree is meant to be driven from outside and had no route at all. The event
      is QUEUED and consumed on the tree's next tick, so the snapshot returned
      still shows the state before it is handled; read it again with
      read_runtime after a tick. Refuses an unregistered tag, since no
      transition could ever match one. Has no inverse: once queued it is
      consumed and whatever it triggered has run. Pass actorLabel OR actorPath.
      Params: actorLabel?, actorPath?, eventTag, componentName?, origin?,
      world?, pieInstance?
  statetree.request_transition:
    class_path: ue-mcp.builtin/statetree.request_transition
    group: statetree
    description: >-
      Force a running StateTree to transition to a named state, resolved through
      the COMPILED data - so a state added since the last compile is reported as
      missing rather than silently ignored. Queued like an event and resolved on
      the next tick against every other pending request by priority. Refuses
      when the tree is not Running, naming the status it is in. targetStateTag
      needs UE 5.8 or later; targetStateId works everywhere. Pass actorLabel OR
      actorPath, and targetStateId OR targetStateTag. Params: actorLabel?,
      actorPath?, targetStateId?, targetStateTag?, priority?, fallback?,
      componentName?, world?, pieInstance?
  statetree.epic_get_children:
    class_path: ue-mcp.builtin/statetree.epic_get_children
    group: statetree
    description: >-
      [Epic state_tree_toolset.toolsets.state_tree.StateTreeTools] Returns child
      states of a state. Params: state
  statetree.epic_get_editor_data:
    class_path: ue-mcp.builtin/statetree.epic_get_editor_data
    group: statetree
    description: >-
      [Epic state_tree_toolset.toolsets.state_tree.StateTreeTools] Returns the
      editor data for a StateTree asset. Params: state_tree
  statetree.epic_get_enter_conditions:
    class_path: ue-mcp.builtin/statetree.epic_get_enter_conditions
    group: statetree
    description: >-
      [Epic state_tree_toolset.toolsets.state_tree.StateTreeTools] Returns enter
      conditions on a state. Params: state
  statetree.epic_get_evaluators:
    class_path: ue-mcp.builtin/statetree.epic_get_evaluators
    group: statetree
    description: >-
      [Epic state_tree_toolset.toolsets.state_tree.StateTreeTools] Returns
      global evaluators. Params: state_tree
  statetree.epic_get_global_tasks:
    class_path: ue-mcp.builtin/statetree.epic_get_global_tasks
    group: statetree
    description: >-
      [Epic state_tree_toolset.toolsets.state_tree.StateTreeTools] Returns
      global tasks that run across all states. Params: state_tree
  statetree.epic_get_node_description:
    class_path: ue-mcp.builtin/statetree.epic_get_node_description
    group: statetree
    description: >-
      [Epic state_tree_toolset.toolsets.state_tree.StateTreeTools] Returns a
      human-readable description for a node. Params: state_tree, node
  statetree.epic_get_root_states:
    class_path: ue-mcp.builtin/statetree.epic_get_root_states
    group: statetree
    description: >-
      [Epic state_tree_toolset.toolsets.state_tree.StateTreeTools] Returns
      top-level states of a StateTree. Params: state_tree
  statetree.epic_get_tasks:
    class_path: ue-mcp.builtin/statetree.epic_get_tasks
    group: statetree
    description: >-
      [Epic state_tree_toolset.toolsets.state_tree.StateTreeTools] Returns tasks
      on a state. Params: state
  statetree.epic_get_transitions:
    class_path: ue-mcp.builtin/statetree.epic_get_transitions
    group: statetree
    description: >-
      [Epic state_tree_toolset.toolsets.state_tree.StateTreeTools] Returns
      transitions on a state. Params: state
  chooser.create:
    class_path: ue-mcp.builtin/chooser.create
    group: chooser
    description: >-
      Create an empty ChooserTable asset. Add input columns with add_column,
      then rows with add_row (#685). Params: name, packagePath?, onConflict?
  chooser.describe:
    class_path: ue-mcp.builtin/chooser.describe
    group: chooser
    description: >-
      Introspect a ChooserTable: row count, each input column (index, name,
      columnType, cellType) and the fallback result. Read this first to learn
      the cell text format each column expects (#685). Params: table (or
      assetPath)
  chooser.add_column:
    class_path: ue-mcp.builtin/chooser.add_column
    group: chooser
    description: >-
      Add an input column to a ChooserTable (so rows have a condition to fill).
      columnType is a Chooser column struct short name, e.g. EnumColumn,
      BoolColumn, FloatRangeColumn, GameplayTagColumn, ObjectColumn, or an
      Output* column. Optionally bind its input: inputStruct (parameter struct
      e.g. EnumContextProperty/BoolContextProperty), boundProperty (context
      property name to read), enumPath (for enum columns). Sizes the new
      column's cells to the current rows (#685). Params: table (or assetPath),
      columnType, inputStruct?, boundProperty?, enumPath?
  chooser.list_rows:
    class_path: ue-mcp.builtin/chooser.list_rows
    group: chooser
    description: >-
      List every row: index, disabled flag, output object (resultType +
      referenced asset path), and each column's cell value as round-trippable
      text (#685). Params: table (or assetPath)
  chooser.add_row:
    class_path: ue-mcp.builtin/chooser.add_row
    group: chooser
    description: >-
      Append a row. Set the output via `output` (asset path) + outputType
      ('asset' hard ref default | 'soft_asset' | 'evaluate' for a nested
      ChooserTable). Set input-column conditions via `cells` (array aligned to
      column order) and/or `inputs` (object keyed by column index or name). Cell
      values are struct text like '(Value=2)' - partial fields are allowed and
      unspecified ones keep defaults; a bare number/bool works for scalar
      columns (#685). Params: table (or assetPath), output?, outputType?,
      cells?, inputs?
  chooser.set_row:
    class_path: ue-mcp.builtin/chooser.set_row
    group: chooser
    description: >-
      Edit an existing row by index: optionally replace the output (output +
      outputType), toggle disabled, and/or update column cells (cells / inputs,
      same format as add_row) (#685). Params: table (or assetPath), index,
      output?, outputType?, disabled?, cells?, inputs?
  chooser.delete_row:
    class_path: ue-mcp.builtin/chooser.delete_row
    group: chooser
    description: >-
      Delete a row by index (removes its output plus the per-row cell from every
      column) (#685). Params: table (or assetPath), index
  chooser.list_object_references:
    class_path: ue-mcp.builtin/chooser.list_object_references
    group: chooser
    description: >-
      List every leaf object reference reachable from a chooser, descending
      through nested chooser tables. list_rows renders those as an opaque
      resultType:NestedChooser with an empty output, so the actual
      PoseSearchDatabase/asset paths were invisible. Each entry reports the
      owning table, the exact location (e.g. ResultsStructs[3].Asset), the
      struct type and the current object path. classFilter matches the
      referenced object's class, pathFilter is a substring on the path (#754).
      Params: assetPath (or path), classFilter?, pathFilter?
  chooser.remap_object_references:
    class_path: ue-mcp.builtin/chooser.remap_object_references
    group: chooser
    description: >-
      Repoint object references throughout a chooser's nested structure. Either
      an exact swap (from + to) or a folder rewrite (fromPrefix + toPrefix),
      which is the 'adopt vendor choosers into our namespace' case. DRY RUN BY
      DEFAULT - pass dryRun=false to apply. Object-typed targets are
      class-checked before assignment; the chooser is recompiled and left dirty
      rather than saved (#754). Params: assetPath (or path), from?, to?,
      fromPrefix?, toPrefix?, dryRun?, allowMissing?
  plugins.list:
    class_path: ue-mcp.builtin/plugins.list
    group: plugins
    description: >-
      Every plugin loaded from ue-mcp.yml: name, version, prefix, status, and
      injected actions. Params: none
  plugins.describe:
    class_path: ue-mcp.builtin/plugins.describe
    group: plugins
    description: >-
      Full detail for one plugin including knowledge files and flows. Params:
      name
  plugins.epic_add_plugin_dependency:
    class_path: ue-mcp.builtin/plugins.epic_add_plugin_dependency
    group: plugins
    description: >-
      [Epic PluginToolset.PluginToolset] Adds a dependency entry to a plugin's
      Plugins array in its .uplugin file. No-ops if a dependency with that name
      already exists with matching settings. The dependency plugin does not need
      to be currently discovered. Params: pluginName, dependencyName, bOptional,
      bEnabled
  plugins.epic_create_plugin:
    class_path: ue-mcp.builtin/plugins.epic_create_plugin
    group: plugins
    description: >-
      [Epic PluginToolset.PluginToolset] Creates a new plugin from a template
      and loads it into the editor. Use GetPluginTemplateDescriptions to obtain
      a valid TemplateInfo. Params: pluginName, relativePluginLocation,
      bPlaceInEngine, templateInfo, description
  plugins.epic_get_game_feature_state:
    class_path: ue-mcp.builtin/plugins.epic_get_game_feature_state
    group: plugins
    description: >-
      [Epic GameFeaturesToolset.GameFeaturesToolset] Gets the current state of a
      Game Feature Plugin. Params: pluginName
  plugins.epic_get_plugin_dependencies:
    class_path: ue-mcp.builtin/plugins.epic_get_plugin_dependencies
    group: plugins
    description: >-
      [Epic PluginToolset.PluginToolset] Returns the dependency entries from a
      plugin's Plugins array in its .uplugin file. Params: pluginName
  plugins.epic_get_plugin_dependents:
    class_path: ue-mcp.builtin/plugins.epic_get_plugin_dependents
    group: plugins
    description: >-
      [Epic PluginToolset.PluginToolset] Returns the names of all discovered
      plugins that declare a dependency on the given plugin. Params: pluginName
  plugins.epic_get_plugin_descriptor:
    class_path: ue-mcp.builtin/plugins.epic_get_plugin_descriptor
    group: plugins
    description: >-
      [Epic PluginToolset.PluginToolset] Gets the editable descriptor fields for
      a discovered plugin. Params: pluginName
  plugins.epic_get_plugin_for_asset:
    class_path: ue-mcp.builtin/plugins.epic_get_plugin_for_asset
    group: plugins
    description: >-
      [Epic PluginToolset.PluginToolset] Returns the name of the enabled plugin
      whose content mount point contains the given asset path. Accepts full
      asset paths or mount point prefixes (e.g. /PluginName/ or
      /Game/Path/To/Asset). Params: assetPath
  plugins.epic_get_plugin_info:
    class_path: ue-mcp.builtin/plugins.epic_get_plugin_info
    group: plugins
    description: >-
      [Epic PluginToolset.PluginToolset] Gets metadata for a discovered plugin,
      including description, version, base directory, content directory,
      descriptor path, and mounted asset path. Params: pluginName
  plugins.epic_get_plugin_template_descriptions:
    class_path: ue-mcp.builtin/plugins.epic_get_plugin_template_descriptions
    group: plugins
    description: >-
      [Epic PluginToolset.PluginToolset] Returns the list of available plugin
      templates. Pass one of the results to CreatePlugin to create a new plugin
      from that template. Params: none
  plugins.epic_is_enabled:
    class_path: ue-mcp.builtin/plugins.epic_is_enabled
    group: plugins
    description: >-
      [Epic PluginToolset.PluginToolset] Checks whether a discovered plugin is
      currently enabled. Params: pluginName
  plugins.epic_is_game_feature_active:
    class_path: ue-mcp.builtin/plugins.epic_is_game_feature_active
    group: plugins
    description: >-
      [Epic GameFeaturesToolset.GameFeaturesToolset] Checks whether a Game
      Feature Plugin is active. Raises an error if the subsystem is unavailable
      or the plugin is not found. Use GetGameFeatureState if you need the
      current state when the plugin is not active. Params: pluginName
  plugins.epic_is_game_feature_plugin:
    class_path: ue-mcp.builtin/plugins.epic_is_game_feature_plugin
    group: plugins
    description: >-
      [Epic GameFeaturesToolset.GameFeaturesToolset] Return whether or not a
      plugin is a Game Feature Plugin. Will error if no plugin of this name can
      be found by the Plugin Manager. Params: pluginName
  plugins.epic_is_plugin_creation_allowed:
    class_path: ue-mcp.builtin/plugins.epic_is_plugin_creation_allowed
    group: plugins
    description: >-
      [Epic PluginToolset.PluginToolset] Checks whether the editor settings
      permit plugin creation from the plugin browser. Params: none
  plugins.epic_is_plugin_modification_allowed:
    class_path: ue-mcp.builtin/plugins.epic_is_plugin_modification_allowed
    group: plugins
    description: >-
      [Epic PluginToolset.PluginToolset] Checks whether the editor settings
      permit modifying plugins from the plugin browser. Params: none
  plugins.epic_list_discovered_game_feature_plugins:
    class_path: ue-mcp.builtin/plugins.epic_list_discovered_game_feature_plugins
    group: plugins
    description: >-
      [Epic GameFeaturesToolset.GameFeaturesToolset] Lists all discovered Game
      Feature Plugins sorted by name. This includes enabled and disabled
      plugins. Only enabled plugins are known by the Game Features system beyond
      identifying if a plugin is a Game Feature Plugin. Use the Plugins toolset
      to do general plugin enable/disable tasks. Params: none
  plugins.epic_list_discovered_plugins:
    class_path: ue-mcp.builtin/plugins.epic_list_discovered_plugins
    group: plugins
    description: >-
      [Epic PluginToolset.PluginToolset] Lists the names of all discovered
      plugins (enabled and disabled), sorted alphabetically. Params: none
  plugins.epic_list_enabled_game_feature_plugins:
    class_path: ue-mcp.builtin/plugins.epic_list_enabled_game_feature_plugins
    group: plugins
    description: >-
      [Epic GameFeaturesToolset.GameFeaturesToolset] Lists all enabled Game
      Feature Plugins sorted by name. Enabled plugins are the only plugins known
      by the Game Features system beyond identifying if a plugin is a Game
      Feature Plugin. Use the Plugins toolset to do general plugin
      enable/disable tasks. Params: none
  plugins.epic_list_enabled_plugins:
    class_path: ue-mcp.builtin/plugins.epic_list_enabled_plugins
    group: plugins
    description: >-
      [Epic PluginToolset.PluginToolset] Lists the names of all enabled plugins,
      sorted alphabetically. Params: none
  plugins.epic_remove_plugin_dependency:
    class_path: ue-mcp.builtin/plugins.epic_remove_plugin_dependency
    group: plugins
    description: >-
      [Epic PluginToolset.PluginToolset] Removes a dependency entry from a
      plugin's Plugins array in its .uplugin file. Params: pluginName,
      dependencyName
  plugins.epic_request_activate_game_feature:
    class_path: ue-mcp.builtin/plugins.epic_request_activate_game_feature
    group: plugins
    description: >-
      [Epic GameFeaturesToolset.GameFeaturesToolset] Requests activation of a
      Game Feature Plugin. Returns true if the activation request was submitted
      successfully. The actual activation happens asynchronously -- poll
      GetGameFeatureState() or IsGameFeatureActive() to confirm completion.
      Raises an error if the subsystem is unavailable or the plugin is not
      found. Params: pluginName
  plugins.epic_request_deactivate_game_feature:
    class_path: ue-mcp.builtin/plugins.epic_request_deactivate_game_feature
    group: plugins
    description: >-
      [Epic GameFeaturesToolset.GameFeaturesToolset] Requests deactivation of a
      Game Feature Plugin. Returns true if the deactivation request was
      submitted successfully. The actual deactivation happens asynchronously --
      poll GetGameFeatureState() to confirm completion. Raises an error if the
      subsystem is unavailable or the plugin is not found. Params: pluginName
  plugins.epic_set_plugin_enabled:
    class_path: ue-mcp.builtin/plugins.epic_set_plugin_enabled
    group: plugins
    description: >-
      [Epic PluginToolset.PluginToolset] Enables or disables a plugin in the
      project config. The change takes effect on the next editor restart.
      Params: pluginName, bEnabled
  plugins.epic_update_plugin_descriptor:
    class_path: ue-mcp.builtin/plugins.epic_update_plugin_descriptor
    group: plugins
    description: >-
      [Epic PluginToolset.PluginToolset] Updates a plugin's descriptor fields
      and writes them to its .uplugin file. Checks out the file via source
      control if source control is enabled. No-ops if the serialized descriptor
      is unchanged (file is not touched). Params: pluginName, newDescriptor
  plugins.epic_validate_new_plugin_name_and_location:
    class_path: ue-mcp.builtin/plugins.epic_validate_new_plugin_name_and_location
    group: plugins
    description: >-
      [Epic PluginToolset.PluginToolset] Validates that PluginName and
      RelativePluginLocation are acceptable for a new plugin. Params:
      pluginName, relativePluginLocation, bPlaceInEngine, templateInfo
  epic.status:
    class_path: ue-mcp.builtin/epic.status
    group: epic
    description: >-
      Report whether Epic's ToolsetRegistry is available and how many toolsets
      are registered. Never errors (reports available=false with a reason when
      the plugin is absent). Params: none
  epic.list_toolsets:
    class_path: ue-mcp.builtin/epic.list_toolsets
    group: epic
    description: >-
      List registered toolsets: name, version, description, tool names + count.
      Strips the verbose per-tool input/output schemas to stay small - use
      describe_toolset for those (or includeSchemas). Params: nameFilter?,
      includeSchemas?
  epic.describe_toolset:
    class_path: ue-mcp.builtin/epic.describe_toolset
    group: epic
    description: >-
      Full schema for one toolset: every tool with its input/output JSON schema.
      Params: toolset
  epic.call_tool:
    class_path: ue-mcp.builtin/epic.call_tool
    group: epic
    description: >-
      Execute a registered Epic tool exactly as its MCP server would. tool takes
      the qualified name from describe_toolset, e.g.
      GASToolsets.AttributeSetToolset.ListAttributeSets; pass the arguments as
      input, or as inputJson to send raw JSON. Returns the tool's JSON result.
      Params: toolset, tool, input?, inputJson?
  epic.epic_create_skill:
    class_path: ue-mcp.builtin/epic.epic_create_skill
    group: epic
    description: >-
      [Epic ToolsetRegistry.AgentSkillToolset] Creates a new AgentSkill. This
      should ONLY be called after getting explicit direction or permission from
      the user. Params: folderPath, assetName, description, details
  epic.epic_execute_tool_script:
    class_path: ue-mcp.builtin/epic.epic_execute_tool_script
    group: epic
    description: >-
      [Epic editor_toolset.toolsets.programmatic.ProgrammaticToolset] Execute a
      Python script against the toolset APIs. Use this to batch multiple tool
      calls into a single script execution, reducing round-trips and context
      usage. IMPORTANT: Available modules and usage instructions are described
      by the value returned by `get_execution_environment`. You MUST call
      `get_execution_environment` once in the conversation before using this
      tool. Read the value in the `instructions` field in the returned
      environment info prior to calling this function, so that you understand
      what APIs are available and how to use them. Before writing a script that
      calls multiple tools, look up the output schemas (if available) for any
      tools you plan to use. This returns the JSON schema describing each tool's
      return value, so you know how to parse results and pass data between
      calls. Params: script
  epic.epic_get_execution_environment:
    class_path: ue-mcp.builtin/epic.epic_get_execution_environment
    group: epic
    description: >-
      [Epic editor_toolset.toolsets.programmatic.ProgrammaticToolset] Get
      details about execution environment. This includes instructions on how to
      write scripts, and constraints, such as what modules may be imported and
      the script entrypoint and function signature. Params: none
  epic.epic_get_skills:
    class_path: ue-mcp.builtin/epic.epic_get_skills
    group: epic
    description: >-
      [Epic ToolsetRegistry.AgentSkillToolset] Returns detailed information
      about a specific set of AgentSkills. Params: skillPaths
  epic.epic_list_skills:
    class_path: ue-mcp.builtin/epic.epic_list_skills
    group: epic
    description: >-
      [Epic ToolsetRegistry.AgentSkillToolset] Gets a summary of all AgentSkills
      in the project. Params: none
  epic.epic_update_skill:
    class_path: ue-mcp.builtin/epic.epic_update_skill
    group: epic
    description: >-
      [Epic ToolsetRegistry.AgentSkillToolset] Updates an existing AgentSkill.
      This should ONLY be called after getting explicit direction or permission
      from the user. Params: skillPath, description, details
  fab.status:
    class_path: ue-mcp.builtin/fab.status
    group: fab
    description: >-
      Report Fab plugin state: whether the module is loaded, whether the native
      import/cache API is linked in this build, whether the Fab window has been
      opened this session, and the download cache location/size. Call this
      first. Params: none
  fab.login:
    class_path: ue-mcp.builtin/fab.login
    group: fab
    description: >-
      Trigger the Fab login flow (EOS account portal). Asynchronous - returns
      once the flow is opened, not once authenticated. Complete any prompt, then
      call status. No inverse: it creates no state of its own, and logout would
      clear a session that may predate the call, so the response says
      rollbackPossible=false. It carries no unchanged/already* flag either, and
      says so with idempotencyObservable=false: the Fab module publishes no
      authentication state this build can read back, so a flag here would be a
      claim rather than a reading. Params: none
  fab.logout:
    class_path: ue-mcp.builtin/fab.logout
    group: fab
    description: >-
      Clear the persistent Fab authentication for this device. No inverse:
      logging back in needs a person at the EOS account portal, and no call
      restores cleared credentials. idempotencyObservable=false, because whether
      a session was there to clear is not readable from here. Params: none
  fab.sync_library:
    class_path: ue-mcp.builtin/fab.sync_library
    group: fab
    description: >-
      Load the user's owned Fab library ("My Folder") into the Content Browser
      via TEDS. Requires an active login; items appear asynchronously. No
      inverse: it populates an in-editor index of what the account already owns,
      nothing un-lists it, and nothing on disk or in the project changes.
      idempotencyObservable=false, because the sync lands after this call
      returns. Params: batchSize?
  fab.list_cached:
    class_path: ue-mcp.builtin/fab.list_cached
    group: fab
    description: >-
      List the entries currently in the local Fab download cache
      (already-downloaded owned assets). Params: none
  fab.cache_info:
    class_path: ue-mcp.builtin/fab.cache_info
    group: fab
    description: >-
      Report the Fab download cache location, total size, and entry count.
      Params: none
  fab.clear_cache:
    class_path: ue-mcp.builtin/fab.clear_cache
    group: fab
    description: >-
      Delete the local Fab download cache to reclaim disk. Does not affect
      assets already imported into the project. Reports unchanged=true when the
      cache was already empty (where the native Fab API is linked). No inverse:
      the downloads come back only by downloading them again. Params: none
  fab.import_file:
    class_path: ue-mcp.builtin/fab.import_file
    group: fab
    description: >-
      Import a source file into the project through the Fab Interchange import
      pipeline. Use for owned assets that are downloaded/cached locally, or any
      local source file (fbx, textures). Single files import synchronously and
      report the created asset paths; pack/quixel workflows may run
      asynchronously. A synchronous import rolls back by deleting exactly the
      assets it created, taken from the paths the importer reported (a force
      delete, because the imported set references itself). An ASYNCHRONOUS
      import emits no inverse: its paths are not known yet, and a record naming
      the destination folder would delete whatever else already lives there.
      Params: source (or sourceFile), destination (or destPath)
  dataflow.epic_add_comment_box:
    class_path: ue-mcp.builtin/dataflow.epic_add_comment_box
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Adds a comment box around the
      given nodes. Params: graph, nodes, comment?, color?
  dataflow.epic_add_node:
    class_path: ue-mcp.builtin/dataflow.epic_add_node
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Adds a node of the given type to
      the Dataflow graph. Params: graph, typeName, nodeName, jsonParams, x?, y?
  dataflow.epic_add_variable:
    class_path: ue-mcp.builtin/dataflow.epic_add_variable
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Adds a new variable to the
      Dataflow graph. Supported type strings: Primitives : "Bool", "Int32",
      "Int64", "Float", "Double", "Name", "String" Structs : UScriptStruct name
      with or without the "F" prefix e.g. "Vector", "FVector", "Transform",
      "FTransform", "Rotator", "LinearColor" Objects : "Object:<ClassName>"
      where ClassName is with or without the "U"/"A" prefix e.g.
      "Object:StaticMesh", "Object:USkeletalMesh" Params: graph, name, type
  dataflow.epic_assign_dataflow_template:
    class_path: ue-mcp.builtin/dataflow.epic_assign_dataflow_template
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Assigns a Dataflow template to
      an existing Dataflow-compatible asset by duplicating the template graph
      and embedding it. Replaces any existing embedded graph. Params: asset,
      templateId
  dataflow.epic_connect_node_pins:
    class_path: ue-mcp.builtin/dataflow.epic_connect_node_pins
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Connects an output pin of one
      node to an input pin of another. Params: fromNode, fromPin, toNode, toPin
  dataflow.epic_create_dataflow_compatible_asset:
    class_path: ue-mcp.builtin/dataflow.epic_create_dataflow_compatible_asset
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Creates a new
      Dataflow-compatible asset (e.g. ChaosClothAsset, GeometryCollection,
      FleshAsset, GroomAsset) with an empty embedded Dataflow graph. Params:
      className, name, path?
  dataflow.epic_create_dataflow_compatible_asset_from_template:
    class_path: >-
      ue-mcp.builtin/dataflow.epic_create_dataflow_compatible_asset_from_template
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Creates a new
      Dataflow-compatible asset and initialises its embedded Dataflow graph from
      a registered template in one step. Params: className, name, path,
      templateId
  dataflow.epic_create_graph:
    class_path: ue-mcp.builtin/dataflow.epic_create_graph
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Creates a new saved Dataflow
      graph asset. Params: name, path
  dataflow.epic_disconnect_node_pins:
    class_path: ue-mcp.builtin/dataflow.epic_disconnect_node_pins
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Removes the connection between
      two node pins. Params: fromNode, fromPin, toNode, toPin
  dataflow.epic_get_graph_structure:
    class_path: ue-mcp.builtin/dataflow.epic_get_graph_structure
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Returns the complete structure
      of a Dataflow graph including all nodes and connections. Params: graph
  dataflow.epic_get_node_info:
    class_path: ue-mcp.builtin/dataflow.epic_get_node_info
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Returns information about a node
      as a JSON object (name, type, position, pins). Params: node
  dataflow.epic_get_node_type_schema:
    class_path: ue-mcp.builtin/dataflow.epic_get_node_type_schema
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Returns the schema for a
      Dataflow node type including its input/output pins and editable UPROPERTY
      parameters. Params: typeName
  dataflow.epic_list_dataflow_compatible_asset_types:
    class_path: ue-mcp.builtin/dataflow.epic_list_dataflow_compatible_asset_types
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Returns a JSON list of every
      UClass that can host an embedded Dataflow graph (i.e. implements
      IDataflowInstanceInterface). Each entry has "className", "displayName",
      and "modulePath" fields. Use the "className" value as input to
      CreateDataflowCompatibleAsset or ListDataflowTemplatesForAssetClass.
      Params: none
  dataflow.epic_list_dataflow_templates_for_asset_class:
    class_path: ue-mcp.builtin/dataflow.epic_list_dataflow_templates_for_asset_class
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Returns a JSON list of Dataflow
      templates registered for the given asset class. Templates registered for
      parent classes are included (class hierarchy walk). Params: className,
      bIncludeBlank?
  dataflow.epic_list_node_types:
    class_path: ue-mcp.builtin/dataflow.epic_list_node_types
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Returns a JSON list of all
      registered Dataflow node types. Params: bCommonOnly?
  dataflow.epic_list_variables:
    class_path: ue-mcp.builtin/dataflow.epic_list_variables
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Returns all variables defined on
      the Dataflow graph as a JSON array. Each entry contains "name", "type",
      and "value" fields. Params: graph
  dataflow.epic_remove_comment_box:
    class_path: ue-mcp.builtin/dataflow.epic_remove_comment_box
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Removes a comment box node from
      the graph. Params: graph, commentId
  dataflow.epic_remove_node:
    class_path: ue-mcp.builtin/dataflow.epic_remove_node
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Removes a node and all its
      connections from the Dataflow graph. Params: graph, node
  dataflow.epic_remove_variable:
    class_path: ue-mcp.builtin/dataflow.epic_remove_variable
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Removes a variable from the
      Dataflow graph. Params: graph, name
  dataflow.epic_reposition_node:
    class_path: ue-mcp.builtin/dataflow.epic_reposition_node
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Moves a node to a new position
      in the graph editor. Params: node, x, y
  dataflow.epic_set_variable:
    class_path: ue-mcp.builtin/dataflow.epic_set_variable
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Sets the value of an existing
      variable using its serialized string representation. The format depends on
      the variable's type (e.g., "3.14" for float, "true" for bool, "42" for
      int, "MyName" for FName). Params: graph, name, value
  dataflow.epic_update_node:
    class_path: ue-mcp.builtin/dataflow.epic_update_node
    group: dataflow
    description: >-
      [Epic DataflowAgent.DataflowAgentToolset] Updates an existing node's
      editable properties via JSON. Params: node, jsonParams
  conversation.epic_get_all_nodes:
    class_path: ue-mcp.builtin/conversation.epic_get_all_nodes
    group: conversation
    description: >-
      [Epic conversation_toolset.toolsets.conversation.ConversationTools]
      Returns all reachable nodes in the conversation. Use ObjectTools.get_class
      and get_properties on each node to inspect type and properties. Each
      node's GUID is available via its compiled_node_guid attribute. Params:
      conversation
  conversation.epic_get_node_by_guid:
    class_path: ue-mcp.builtin/conversation.epic_get_node_by_guid
    group: conversation
    description: >-
      [Epic conversation_toolset.toolsets.conversation.ConversationTools]
      Returns a conversation node by its GUID. Params: conversation, guid
  conversation.epic_get_node_connections:
    class_path: ue-mcp.builtin/conversation.epic_get_node_connections
    group: conversation
    description: >-
      [Epic conversation_toolset.toolsets.conversation.ConversationTools]
      Returns output connection GUIDs for a conversation node. Params: node
  conversation.epic_get_node_guids:
    class_path: ue-mcp.builtin/conversation.epic_get_node_guids
    group: conversation
    description: >-
      [Epic conversation_toolset.toolsets.conversation.ConversationTools]
      Returns GUIDs of all reachable nodes, in map iteration order. Use with
      get_node_by_guid to look up specific nodes. Params: conversation
  conversation.epic_get_sub_nodes:
    class_path: ue-mcp.builtin/conversation.epic_get_sub_nodes
    group: conversation
    description: >-
      [Epic conversation_toolset.toolsets.conversation.ConversationTools]
      Returns sub-nodes (requirements, choices) attached to a task node. Params:
      node
  conversation.epic_list_entry_points:
    class_path: ue-mcp.builtin/conversation.epic_list_entry_points
    group: conversation
    description: >-
      [Epic conversation_toolset.toolsets.conversation.ConversationTools]
      Returns entry points (FConversationEntryList structs). Params:
      conversation
  conversation.epic_list_speakers:
    class_path: ue-mcp.builtin/conversation.epic_list_speakers
    group: conversation
    description: >-
      [Epic conversation_toolset.toolsets.conversation.ConversationTools]
      Returns speaker/participant information. Params: conversation
  shell:
    class_path: shell
    group: util
    description: 'Run a shell command. Params: command, cwd?, timeout?'
flows:
  niagara_fire:
    description: >-
      Build a fire Niagara system from scratch (spawn rate, upward velocity, HDR
      orange colour) and verify it emits. A 0-to-1 best-practice starting point,
      not a demo. Lands at /Game/VFX/Fire/NS_Fire; override name/packagePath via
      params.
    steps:
      1:
        task: niagara.create_emitter
        options:
          name: E_Flame
          packagePath: /Game/VFX/Fire
      2:
        task: niagara.create
        options:
          name: NS_Fire
          packagePath: /Game/VFX/Fire
      3:
        task: niagara.add_emitter
        options:
          systemPath: ${steps.2.path}
          emitterPath: ${steps.1.path}
      4:
        task: niagara.set_module_input
        options:
          systemPath: ${steps.2.path}
          moduleName: SpawnRate
          inputName: SpawnRate
          value: '60'
          stackContext: EmitterUpdate
      5:
        task: niagara.set_module_input
        options:
          systemPath: ${steps.2.path}
          moduleName: AddVelocity
          inputName: Velocity
          value: 0,0,160
          stackContext: ParticleSpawn
      6:
        task: niagara.set_module_input
        options:
          systemPath: ${steps.2.path}
          moduleName: Color
          inputName: Color
          value: 4.0,1.2,0.15,1.0
          stackContext: ParticleUpdate
      7:
        task: niagara.validate
        options:
          systemPath: ${steps.2.path}
  beacon:
    description: >-
      Demo - build a shrine scene from scratch: floor, pedestal, orb, five
      pillars, four materials (dark stone, brushed metal, warm stone,
