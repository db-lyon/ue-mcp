<svg xmlns="http://www.w3.org/2000/svg" width="1354" height="586" viewBox="0 0 1354 586">
  <!-- Template for docs/assets/ue-mcp-overview.png. Rendered by
       scripts/render-overview-image.ts, which fills every double-braced field. -->
  <rect x="0.5" y="0.5" width="1353" height="585" rx="10" fill="#0f1217" stroke="#2b3038"/>

  <circle cx="268" cy="298" r="216" fill="#e8720c" fill-opacity="0.07" stroke="#e8720c" stroke-width="2"/>
  <circle cx="{{epicCx}}" cy="298" r="{{epicR}}" fill="#60a5fa" fill-opacity="0.12" stroke="#60a5fa" stroke-width="2"/>

  <text x="{{epicCx}}" y="283" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="15" fill="#60a5fa">Epic's MCP</text>
  <text x="{{epicCx}}" y="323" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="800" font-size="27" fill="#f5f5f4">{{epicActions}} actions</text>

  <text x="{{ownCx}}" y="268" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="15" fill="#e8720c">ue-mcp</text>
  <text x="{{ownCx}}" y="311" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="800" font-size="{{ownSize}}" fill="#f5f5f4">+{{ownActions}}</text>
  <text x="{{ownCx}}" y="338" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="400" font-size="15" fill="#a1a1aa">actions, and…</text>

  {{checklist}}

  <text x="576" y="431" font-family="JetBrains Mono" font-weight="400" font-size="15" fill="#8b8b8b">Supports UE {{engineMin}} to {{engineMax}}.</text>
</svg>
