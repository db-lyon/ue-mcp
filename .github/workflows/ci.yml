name: CI

# Each commit is built and tested once, on its pull request. Main only takes a
# pull request that is up to date with it, so the merged tree is the tree that
# was tested, and a push to main or a release branch publishes without
# building or testing it again.
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

# Prevent two concurrent publish/docs runs from racing on the same main.
# Do not cancel in-progress publishes - canceling mid-npm-publish leaves
# a half-published version.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

# Default to least-privilege. Individual jobs escalate only what they need.
permissions:
  contents: read

# Prose rules run here over the tracked tree and again in .husky/pre-commit and
# .husky/commit-msg, which reject a bad character before the commit exists.
jobs:
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The release gates compare this branch against what it will merge
          # into. A bare checkout on a pull request fetches only the merge ref
          # and creates no origin/main, so every gate reported "no base to
          # compare against" and exited 0.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        # Exact lockfile versions with integrity checks. Re-resolving here would
        # pull whatever was published minutes ago, which is how npm worms spread.
        run: npm ci --include=optional

      - name: Repo audits
        # npm run audit: docs and param drift, TS/C++ handler parity, prose
        # rules, tracked config, flows, unity-build collisions and direct param
        # reads. Prose is also in the husky hooks, and repeated here on purpose:
        # hooks can be skipped with --no-verify and are not installed in every
        # clone. dist/ is checked separately in the publish job.
        run: npm run audit

      - name: Release gates
        # Patch-only bumps, stamped counts that match the surface, and a docs
        # change beside any surface change. Each of these used to be a rule
        # somebody had to remember before bumping, and each was broken at
        # least once by somebody who had read it.
        run: node scripts/check-release-gates.mjs all

      - name: Type-check tests and scripts
        # tsconfig.json covers src/ only and vitest strips types without
        # checking them, so a test could build a fixture src/ no longer accepts
        # and still pass. Kept out of the pre-commit hook because it is slow.
        run: npm run typecheck:tests

      - name: Multi-editor tests
        # Two bridges on two loopback sockets, driven from one test process
        # (#817, plan item 7.1). This gates merges on the routing property that
        # multi-editor exists for: a call addressed to one editor arrives at
        # that editor and at no other.
        #
        # The engine-dependent half of plan item 7.2 (the golden diff and the
        # lifecycle matrix against a live editor) is NOT here and will not be:
        # these runners are ubuntu-latest with no Unreal install, so there is
        # no editor to start and no second one to address. Everything above the
        # handler is real; only the engine behind it is stubbed.
        #
        # #871 settled that deliberately. The engine-dependent suite is
        # LOCAL-ONLY by decision, not by omission awaiting a runner. It is
        # `npm run test:smoke` plus `npm run test:live` against tests/ue_mcp,
        # run on a machine that has an engine, before a release is cut. A
        # hosted Unreal runner was priced against what it would buy and was
        # not worth it: in-engine builds and live runs already happen locally,
        # and CI cannot compile the plugin either, so the runner would gate on
        # a build it could not itself produce.
        #
        # If that calculus changes, the suite to add is the existing live
        # harness pointed at tests/ue_mcp only, and nothing here needs to move.
        run: npm run test:multi-editor

      - name: Audit (high+ only, production deps)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: false


  # The build publish ships. The publish job downloads this artifact when the
  # tree it is publishing is the tree built here, so npm gets the files that
  # were type-checked, generated and load-tested on the pull request rather
  # than a second compile. Keyed by git tree, not commit: the merge commit on
  # main is a different commit, but main only takes a pull request that is up
  # to date with it, so it has this tree. scripts/tested-build.mjs finds it.
  package:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci --include=optional

      - name: Type-check and build
        run: npx tsc

      - name: Generate what prepublishOnly adds to dist/
        # The surface/counts description is computed here too, from the same
        # tree, so the publish job needs no install to post it.
        run: |
          npx tsx scripts/generate-default-config.ts
          npx tsx scripts/generate-tool-metadata.ts
          npx tsx scripts/surface-counts.mts > surface-counts.txt
          # The generators also stamp tracked files. Any change here would
          # ship a package.json or descriptor that differs from the commit.
          git diff --exit-code

      - name: Verify build output
        run: |
          # Fail loud if any entry point is missing or empty: a broken publish
          # is very hard to retract.
          test -s dist/index.js || (echo "dist/index.js missing or empty" && exit 1)
          test -s dist/init.js || (echo "dist/init.js missing or empty" && exit 1)
          test -s dist/update.js || (echo "dist/update.js missing or empty" && exit 1)
          test -s dist/ue-mcp.default.yml || (echo "dist/ue-mcp.default.yml missing or empty" && exit 1)
          test -s dist/tool-counts.json || (echo "dist/tool-counts.json missing or empty" && exit 1)
          test -s surface-counts.txt || (echo "surface-counts.txt missing or empty" && exit 1)
          # Non-empty is not loadable. The unit suite runs from source, so a
          # module that only fails once emitted reaches npm otherwise.
          node -e "import('./dist/tools.js').then(()=>console.log('dist loads')).catch(e=>{console.error(e.message);process.exit(1)})"

      - name: Key by tree
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: tested-build-${{ steps.tree.outputs.tree }}
          path: |
            dist/
            surface-counts.txt
          if-no-files-found: error
          retention-days: 30

  # The unit and integration suites run as shards, packed by measured duration
  # (tests/setup/weighted-shards.ts, weights in tests/timing/vitest-weights.json),
  # so the wall time is the slowest shard rather than the sum.
  unit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: unit (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v4
        with:
          # The release gates compare this branch against what it will merge
          # into. A bare checkout on a pull request fetches only the merge ref
          # and creates no origin/main, so every gate reported "no base to
          # compare against" and exited 0.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        # Exact lockfile versions with integrity checks. Re-resolving here would
        # pull whatever was published minutes ago, which is how npm worms spread.
        run: npm ci --include=optional

      - name: Unit tests
        run: npm run test:unit -- --shard=${{ matrix.shard }}/3

  integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: integration (${{ matrix.shard }}/6)
    steps:
      - uses: actions/checkout@v4
        with:
          # The release gates compare this branch against what it will merge
          # into. A bare checkout on a pull request fetches only the merge ref
          # and creates no origin/main, so every gate reported "no base to
          # compare against" and exited 0.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        # Exact lockfile versions with integrity checks. Re-resolving here would
        # pull whatever was published minutes ago, which is how npm worms spread.
        run: npm ci --include=optional

      - name: Integration tests
        # The real CLI, server and daemon, spawned in hermetic sandboxes with
        # local fakes for the bridge, the registry and the feedback service.
        # Every surface they cover is listed in tests/coverage/integration-surfaces.json,
        # which the unit suite gates. Live-editor cases are in tests/live.
        run: npm run test:integration -- --shard=${{ matrix.shard }}/6

  # The one required check: green only when every job above is, every shard
  # included: a matrix job's result is success only when all of its legs are.
  build:
    if: github.event_name == 'pull_request' && always()
    needs: [checks, package, unit, integration]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.checks.result }}" = success ] && [ "${{ needs.package.result }}" = success ] && [ "${{ needs.unit.result }}" = success ] && [ "${{ needs.integration.result }}" = success ]

  publish:
    runs-on: ubuntu-latest
    # A release/X.Y.Z branch publishes a stable cut from a beta's commit while main moves on.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    permissions:
      contents: write   # for git tag push and gh-release
      id-token: write   # for npm provenance
      statuses: write   # for posting landing/headline from the Promote step
      actions: read     # for the pull request run's tested build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for tag push

      - uses: actions/setup-node@v4
        with:
          # Node 24 LTS ships npm 11.x natively. Trusted publishing (OIDC)
          # requires npm >= 11.5.1. Bumping the node version here is the
          # cleanest path - corepack on Node 22 downloads npm 11.x but its
          # shim is shadowed by setup-node's pinned binary, so `npm` keeps
          # resolving to 10.x and OIDC never engages.
          node-version: "24"

      - name: Verify npm >= 11.5.1
        run: |
          npm --version
          node -e "const v=require('child_process').execSync('npm --version').toString().trim();const [maj,min,pat]=v.split('.').map(Number);if (maj < 11 || (maj===11 && min<5) || (maj===11 && min===5 && pat<1)) { console.error('npm '+v+' is below the 11.5.1 minimum for trusted publishing'); process.exit(1); }"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Find the tested build of this tree
        # The package job of the pull request that brought this tree to main
        # built dist/ from it, and every other job of that run tested it.
        id: tested
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TREE=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
          node scripts/tested-build.mjs --repo "$REPO" --tree "$TREE" | tee -a "$GITHUB_OUTPUT"

      - name: Download the tested build
        if: steps.tested.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf dist surface-counts.txt
          gh run download "${{ steps.tested.outputs.run_id }}" --repo "$REPO" \
            --name "tested-build-${{ steps.tested.outputs.tree }}" --dir .
          test -s dist/index.js && test -s surface-counts.txt

      - name: Build here (no pull request run built this tree)
        # A push that no pull request tested as this tree, such as a
        # release/X.Y.Z bump or a build whose artifact expired. Lockfile
        # install: this job holds id-token: write, so no freshly resolved
        # dependency may run install scripts here.
        if: steps.tested.outputs.found != 'true'
        run: |
          set -euo pipefail
          npm ci --include=optional
          npx tsc
          npx tsx scripts/generate-default-config.ts
          npx tsx scripts/generate-tool-metadata.ts
          npx tsx scripts/surface-counts.mts > surface-counts.txt
          node -e "import('./dist/tools.js').then(()=>console.log('dist loads')).catch(e=>{console.error(e.message);process.exit(1)})"

      - name: Post surface/counts commit status
        # Derived from the source of truth (TS schema + C++ RegisterHandler)
        # so the status stays accurate without hand-edited counts.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          DESC=$(cat surface-counts.txt)
          gh api -X POST "repos/$REPO/statuses/$SHA"             -f state=success             -f context=surface/counts             -f description="$DESC"             -f target_url="https://github.com/$REPO/blob/$SHA/scripts/surface-counts.mts"
          echo "Posted surface/counts: $DESC"

      - name: Check whether this version is already published
        id: version
        run: |
          set -euo pipefail
          LOCAL=$(node -p "require('./package.json').version")
          echo "local=$LOCAL" >> "$GITHUB_OUTPUT"

          # Ask whether THIS EXACT version exists on the registry, not whether
          # it differs from the `latest` dist-tag. `npm view ue-mcp version`
          # reports only `latest`, so once a prerelease publishes under its own
          # tag `latest` stops tracking the repo: every later push would see a
          # difference, retry the publish, and fail on npm refusing to replace
          # an existing version. That failure never clears on its own.
          #
          # Retried a few times because a registry blip here would otherwise
          # decide the release.
          VERSIONS=""
          for attempt in 1 2 3; do
            if VERSIONS=$(npm view ue-mcp versions --json 2>/dev/null); then break; fi
            VERSIONS=""
            echo "npm view attempt $attempt failed; retrying in 5s"
            sleep 5
          done

          # An empty payload fails the step by design. Reading an unreachable
          # registry as "not published yet" would publish blind.
          ALREADY=$(node scripts/release-version.mjs --version "$LOCAL" --published-in "$VERSIONS" \
            | sed -n 's/^published=//p')
          echo "already_published=$ALREADY" >> "$GITHUB_OUTPUT"

          if [ "$ALREADY" = "true" ]; then
            # Clean skip, not a failure: re-running main after a release is
            # normal and every publish step below is gated on this output.
            echo "ue-mcp@$LOCAL is already on the registry. Nothing to publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "ue-mcp@$LOCAL is not on the registry. Publishing."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve release channel
        # Derives the npm dist-tag and the prerelease flag from the version
        # itself. A plain X.Y.Z owns `latest`; a prerelease owns the tag named
        # by its first prerelease identifier (1.2.0-beta and 1.2.0-beta.2 to
        # `beta`, 1.3.0-rc.1 to `rc`).
        #
        # The rules live in scripts/release-version.mjs, under unit test in
        # tests/unit/release-version.test.ts, because YAML cannot be tested and
        # the failure mode here is silent: a prerelease published without a tag
        # becomes the default install for everyone running `npx ue-mcp`.
        #
        # Outputs:
        #   dist_tag   - the npm tag to publish under
        #   prerelease - true/false, consumed by the Promote step
        if: steps.version.outputs.should_publish == 'true'
        id: channel
        run: |
          set -euo pipefail
          node scripts/release-version.mjs --version "${{ steps.version.outputs.local }}" \
            | tee -a "$GITHUB_OUTPUT"

      - name: Validate release inputs
        # Single required pre-publish input: a draft release tagged vX.Y.Z
        # whose body begins with YAML frontmatter containing a `headline:`
        # array. The script enforces format (1-6 items, each 3-30 chars,
        # restricted character set, no sentence punctuation) and fails
        # publish before npm if anything is off.
        #
        # Polled for up to ~60s to absorb the small race between 'git push'
        # and 'gh release create --draft'.
        #
        # Outputs:
        #   HEADLINE  - the joined ` · ` string posted as the landing/headline status
        #   BODY_PATH - path to a temp file containing the frontmatter-stripped body,
        #               used by the Promote step to update the published release body
        if: steps.version.outputs.should_publish == 'true'
        id: release_inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.local }}
        run: |
          set -euo pipefail

          DRAFT_BODY=""
          for i in $(seq 1 30); do
            DRAFT_BODY=$(gh release view "v$VERSION" --json body,isDraft \
              --jq 'select(.isDraft==true) | .body' 2>/dev/null || true)
            if [ -n "$DRAFT_BODY" ]; then break; fi
            sleep 2
          done
          if [ -z "$DRAFT_BODY" ]; then
            echo "::error::No draft release v$VERSION with non-empty body found."
            echo "Create it with:"
            echo "  gh release create v$VERSION --draft --notes-file <path/to/notes.md>"
            echo "The notes file must start with frontmatter:"
            echo "  ---"
            echo "  headline:"
            echo "    - First feature"
            echo "    - Second feature"
            echo "  ---"
            exit 1
          fi
          echo "Draft release v$VERSION present (${#DRAFT_BODY} chars of body)."

          # The body is about to become a public release page, so it goes
          # through the same prose rules as everything else that ships. Checked
          # here rather than at publish time, where the only way to fix it is
          # to edit a page people have already seen.
          printf '%s' "$DRAFT_BODY" > /tmp/release-body.md
          node scripts/lint-prose.mjs --release-body /tmp/release-body.md

          # Parse + validate the headline frontmatter; step outputs go to
          # $GITHUB_OUTPUT in the standard key=value form.
          printf '%s' "$DRAFT_BODY" | node scripts/release-headline.mjs >> "$GITHUB_OUTPUT"

          # The draft must carry the prebuilt bridge for every promised engine
          # and its SHA-256 manifest; without them every binary install's update
          # fails. Rules and message in scripts/release-binaries.mjs, under unit
          # test in tests/unit/release-binaries.test.ts.
          gh release view "v$VERSION" --json assets --jq '.assets[].name' \
            | node scripts/release-binaries.mjs --version "$VERSION"

      - name: Prose rules, against what will be published
        if: steps.version.outputs.should_publish == 'true'
        # The generated output, not the source it came from. A banned string
        # was taken out of src/ once and shipped anyway in a .d.ts, because
        # every check until now ran against a tree with no dist/ in it.
        #
        # dist/ already holds the generators' files, from the package job or
        # the build step above, so this lints everything that ships.
        run: |
          mapfile -t built < <(find dist -type f \( -name '*.js' -o -name '*.d.ts' -o -name '*.md' -o -name '*.yml' -o -name '*.json' \))
          if [ ${#built[@]} -eq 0 ]; then
            echo "dist/ has no files to check, which means the build did not run" >&2
            exit 1
          fi
          echo "linting ${#built[@]} published files"
          node scripts/lint-prose.mjs --files "${built[@]}"

      - name: Verify build output
        if: steps.version.outputs.should_publish == 'true'
        run: |
          # Fail loud if prepublishOnly's output is missing or empty - a
          # broken publish is very hard to retract, so we stop here.
          test -s dist/index.js || (echo "dist/index.js missing or empty" && exit 1)
          test -s dist/init.js || (echo "dist/init.js missing or empty" && exit 1)
          test -s dist/update.js || (echo "dist/update.js missing or empty" && exit 1)
          test -s dist/ue-mcp.default.yml || (echo "dist/ue-mcp.default.yml missing or empty" && exit 1)
          test -s dist/tool-counts.json || (echo "dist/tool-counts.json missing or empty" && exit 1)
          # Loading dist/tools.js needs node_modules, which this job does not
          # install when it has the tested build: the package job loaded these
          # same files, and the fallback build step loaded its own.

      - name: Tag release (before publish)
        if: steps.version.outputs.should_publish == 'true'
        run: |
          # Create and push the tag BEFORE publishing to npm. If the tag push
          # fails (network / permissions), we have not yet stranded a live
          # npm version without a corresponding tag.
          TAG="v${{ steps.version.outputs.local }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally; skipping creation"
          else
            git tag "$TAG"
          fi
          git push origin "$TAG"

      - name: Publish to npm
        # Trusted publishing: no NPM_TOKEN secret. The npm CLI claims the
        # GitHub Actions OIDC token from the runner and exchanges it with
        # npmjs.org under the trusted-publisher config bound to this repo
        # and workflow. `id-token: write` on the job is required (set above).
        #
        # --tag is always passed explicitly. npm defaults to `latest`, so
        # omitting it would point every `npx ue-mcp` at a prerelease the moment
        # one is published.
        if: steps.version.outputs.should_publish == 'true'
        env:
          DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
        #
        # --ignore-scripts: the steps above already built and generated dist/
        # and checked it. prepublishOnly would delete and rebuild it, so what
        # shipped would not be what was checked.
        run: npm publish --access public --provenance --tag "$DIST_TAG" --ignore-scripts

      - name: Package tarball
        if: steps.version.outputs.should_publish == 'true'
        # No package-lock.json: the install step replaces the committed one with
        # a Linux-generated lockfile, so it would not be the one in the repo.
        run: tar czf ue-mcp.tar.gz dist/ plugin/ package.json README.md LICENSE

      - name: Promote draft release
        # The draft was authored before the bump push and validated by the
        # 'Validate release inputs' step. Here we:
        #   1. Attach the tarball.
        #   2. Replace the body with the frontmatter-stripped version so the
        #      published release page renders clean markdown.
        #   3. Flip draft=false to publish, marking it prerelease or latest to
        #      match the channel the npm publish used.
        #   4. Post the landing/headline commit status using the validated,
        #      ` · `-joined string from the step output. CI authors the
        #      status itself - releasers no longer post it manually.
        if: steps.version.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.local }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
          HEADLINE: ${{ steps.release_inputs.outputs.HEADLINE }}
          BODY_PATH: ${{ steps.release_inputs.outputs.BODY_PATH }}
        run: |
          set -euo pipefail
          gh release upload "v$VERSION" ue-mcp.tar.gz --clobber

          # Both flags are set explicitly in both directions. Leaving them off
          # hands the repo's "Latest" badge to whatever was promoted last, so a
          # beta would present itself as the current stable release on the
          # releases page and in the GitHub API's /releases/latest.
          if [ "$PRERELEASE" = "true" ]; then
            CHANNEL_FLAGS=(--prerelease --latest=false)
          else
            CHANNEL_FLAGS=(--prerelease=false --latest)
          fi

          gh release edit "v$VERSION" \
            --notes-file "$BODY_PATH" \
            --draft=false \
            --tag "v$VERSION" \
            "${CHANNEL_FLAGS[@]}"
          gh api -X POST "repos/$REPO/statuses/$SHA" \
            -f state=success \
            -f context=landing/headline \
            -f description="$HEADLINE" \
            -f target_url="https://github.com/$REPO/releases/tag/v$VERSION"
          echo "Posted landing/headline: $HEADLINE"

  # The MkDocs -> gh-pages deploy used to live here. The published docs are
  # built by the landing site from docs/**, synced by push-docs.yml, so this
  # job was maintaining a second, always-slightly-stale copy of the same
  # pages at db-lyon.github.io/ue-mcp. gh-pages now serves only a redirect.
  #
  # mkdocs.yml is still required: the landing converter parses its nav block
  # to build the sidebar. Do not delete it.
