ue-mcp:
  version: 1

# Fixtures and repo flows for the live tests (npm run test:live).
# tests/ue_mcp is the one project that suite is allowed to drive, so they
# live here.
#
# live_tier_leak_probe is read-only: the suite attaches to an editor somebody
# else started and has to leave it exactly as it found it.
#
# The `editor:` key inside each step's options is deliberate, and is the point
# of the fixture. It addresses a session and must be consumed by the client; a
# step that carried it through to the editor would be a routing key leaking
# into a bridge call, which no assertion on a response can see. The three steps
# below cover the three task classes a step can resolve to (the per-action
# bridge task, a handler-backed action, and the generic class_path task), and
# the suite reads the editor's own record of what it was handed to prove none of
# them forwarded it (#817, plan items 3.2 and 3.3).
tasks:
  live_tier_generic_bridge:
    class_path: ue-mcp.bridge
    group: util
    description: Generic bridge task, addressed by method name. Live tests fixture.

  # Repo automation, run by `npm run specs:record` and `npm run epic:record`
  # through scripts/repo-flow.ts. The reads are the generic bridge task; the
  # writes are repo tasks under scripts/tasks/, whose class paths resolve from
  # the repository root.
  handler_specs_read:
    class_path: ue-mcp.bridge
    group: repo
    description: The running plugin's capabilities, handler specs included (#1057).
    options:
      method: get_bridge_capabilities
  handler_specs_write:
    class_path: scripts.tasks.write-handler-specs
    group: repo
    description: Write the published handler specs to tests/golden/handler-specs.json, sorted.
  epic_catalog_read:
    class_path: ue-mcp.bridge
    group: repo
    description: Unreal's AI Toolset Registry catalog, with every tool's input schema.
    options:
      method: epic_list_toolsets
      includeSchemas: true
  epic_catalog_write:
    class_path: scripts.tasks.write-epic-catalog
    group: repo
    description: Write the catalog to tests/golden/epic-catalog.json, sorted and keyed by engine.

flows:
  live_tier_leak_probe:
    description: Read-only probe the live tests runs to prove no routing key reaches the editor.
    steps:
      "1":
        task: asset.list_textures
        options:
          directory: /Game
          recursive: false
          editor: ue_mcp
      "2":
        task: project.get_status
        options:
          editor: ue_mcp
      "3":
        task: live_tier_generic_bridge
        options:
          method: list_textures
          directory: /Game
          recursive: false
          editor: ue_mcp

  # Recordings the TS surface is generated from. Read-only in the editor.
  specs_record:
    description: Record the handler specs the running plugin publishes. Then run npm run specs:generate.
    steps:
      "1":
        task: handler_specs_read
      "2":
        task: handler_specs_write
        options:
          specs: ${steps.1.handlerSpecs}

  epic_record:
    description: Record Unreal's AI Toolset Registry catalog, keyed by engine version.
    steps:
      "1":
        task: epic_catalog_read
      "2":
        task: epic_catalog_write
        options:
          toolsets: ${steps.1.toolsets}

  # The smoke harness's scratch-level routine, as flows (plan 3.9). The live
  # gate for the universal flows runs both. scripts/smoke-test.js keeps its own
  # copy because it talks to the bridge with no server in between.
  smoke_scene_prepare:
    description: Anchor on /Game/MCP_Home, then park the editor on a blank /Game/MCP_SmokeScratch.
    steps:
      "1":
        task: demo.go_home
      "2":
        task: asset.delete
        options:
          assetPath: /Game/MCP_SmokeScratch
          force: true
        ignore_failure: true
      "3":
        task: level.create
        options:
          levelPath: /Game/MCP_SmokeScratch

  smoke_scene_teardown:
    description: Leave the editor on a fresh, saved /Game/MCP_Home and delete /Game/MCP_SmokeScratch.
    steps:
      "1":
        task: asset.delete
        options:
          assetPath: /Game/MCP_Home
          force: true
        ignore_failure: true
      "2":
        task: level.create
        options:
          levelPath: /Game/MCP_Home
      "3":
        task: level.save
      "4":
        task: asset.delete
        options:
          assetPath: /Game/MCP_SmokeScratch
          force: true
        ignore_failure: true
