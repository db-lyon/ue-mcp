ue-mcp:
  version: 1
  # Test editors open no IDE, whatever a case or a dialog answer asks for. start_editor
  # and restart_editor pass these; the lifecycle cases and the rebuild flow go through them.
  editor:
    launchArgs:
      - "-ini:EditorSettings:[/Script/SourceCodeAccess.SourceCodeAccessSettings]:PreferredAccessor=NullSourceCodeAccessor"
      - "-ini:EditorSettings:[/Script/UnrealEd.EditorPerformanceSettings]:bThrottleCPUWhenNotForeground=False"

# Fixture for the live tests (npm run test:live), which is the only thing
# that runs this flow. tests/ue_mcp is the one project that suite is allowed to
# drive, so its fixtures live here.
#
# Every step of the leak probe is a read: the suite attaches to an editor somebody else started
# and has to leave it exactly as it found it.
#
# The `editor:` key inside each step's options is deliberate, and is the point
# of the fixture. It addresses a session and must be consumed by the client; a
# step that carried it through to the editor would be a routing key leaking
# into a bridge call, which no assertion on a response can see. The three steps
# below cover the three task classes a step can resolve to (the per-action
# bridge task, a handler-backed action, and the generic class_path task), and
# the suite reads the editor's own record of what it was handed to prove none of
# them forwarded it (#817, plan items 3.2 and 3.3).
tasks:
  live_tier_generic_bridge:
    class_path: ue-mcp.bridge
    group: util
    description: Generic bridge task, addressed by method name. Live tests fixture.

flows:
  live_tier_leak_probe:
    description: Read-only probe the live tests runs to prove no routing key reaches the editor.
    steps:
      "1":
        task: asset.list_textures
        options:
          directory: /Game
          editor: ue_mcp
      "2":
        task: project.get_status
        options:
          editor: ue_mcp
      "3":
        task: live_tier_generic_bridge
        options:
          method: list_textures
          directory: /Game
          editor: ue_mcp

  # Run only by the opt-in lifecycle cases (npm run test:live -- --lifecycle),
  # which are allowed to stop and start this project's editor (#1223).
  live_lifecycle_rebuild:
    description: Save, then stop, build and relaunch the tests/ue_mcp editor. Live lifecycle fixture.
    on_editor_loss: resume
    steps:
      "1":
        task: editor.save_dirty
        options:
          includeMaps: true
      "2":
        task: editor.rebuild
